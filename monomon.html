'use strict';
/* ================= 基本 ================= */
const SW=160,SH=144,TAU=Math.PI*2;
// キャンバスは3倍解像度。フィールドも3倍で、本家と同じ10x9マス表示

const rnd=(a,b)=>a+Math.random()*(b-a),irnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,pick=a=>a[Math.floor(Math.random()*a.length)];
const SPD=()=>window.__speed||1;
const wait=ms=>new Promise(r=>setTimeout(r,ms/SPD()));
function resize(){const aw=Math.min(innerWidth-20,500),ah=innerHeight-46-250;let w=Math.min(aw,ah*SW/SH);w=Math.max(240,w);const u=w/SW;cv.style.width=w+'px';cv.style.height=SH*u+'px';$('scr').style.width=w+'px';$('scr').style.height=SH*u+'px';UI.style.setProperty('--u',u+'px');}

/* ================= 音（ゲームボーイ風） ================= */
let AC=null,MG=null,NB=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.7;MG.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function sndOn(){try{return localStorage.getItem('tg_sound')!=='0';}catch(e){return true;}}
function nbuf(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);let v=0;for(let i=0;i<d.length;i++){if(i%8===0)v=Math.random()*2-1;d[i]=v;}}return NB;}
function tone(f,dur,type,vol,f2,delay,at){const t=(at||AC.currentTime)+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.setValueAtTime(vol,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol,freq,delay,at){const t=(at||AC.currentTime)+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf();f.type='lowpass';f.frequency.value=freq||3000;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}
const SFX={
 sel(){tone(1320,.04,'square',.05);},
 ok(){tone(988,.05,'square',.05);tone(1319,.07,'square',.05,0,.05);},

function nf(s){if(!s||s==='.'||s==='-')return 0;const m=s.match(/^([A-G]#?)(\d)$/);return 440*Math.pow(2,(NT[m[1]]+(+m[2]+1)*12-69)/12);}
function seq(str){return str.trim().split(/\s+/);}

  b:'C3 G2 C3 G2 A2 E3 A2 E3 F2 C3 G2 D3 C3 G2 C3 G2 F2 C3 F2 C3 G2 D3 A2 E3 G2 D3 G2 D3 C3 G2 C3 C3'},

  b:'G2 D3 G2 D3 D2 A2 D2 A2 G2 D3 E2 B2 D2 A2 D2 A2 C3 G2 G2 D3 D2 A2 C3 D3 G2 D3 D2 A2 G2 D3 G2 G2',d:1},
 cave:{bpm:92,m:'A4 - - E5 - - D5 C5 B4 - - - G#4 - - - A4 - - C5 - - E5 - D5 - - - - - . . F5 - - E5 - - D5 C5 B4 - - D5 - - C5 B4 A4 - - - G#4 - B4 - A4 - - - - - . .',
  b:'A2 . E2 . E2 . B1 . A2 . E2 . D2 . A1 . F2 . C2 . G2 . D2 . E2 . E2 . A1 . A1 .'},
 battle:{bpm:168,m:'A4 C5 E5 A5 G5 E5 C5 E5 F5 A5 C6 A5 G5 F5 E5 D5 E5 - E5 F5 G5 - A5 - B5 - G#5 - E5 - . . A5 G5 F5 E5 F5 E5 D5 C5 D5 E5 F5 G5 A5 - F5 - E5 D5 C5 B4 C5 D5 E5 G#5 A5 - - - A4 . . .',

  b:'E2 E3 E2 E3 D2 D3 D2 D3 C2 C3 C2 C3 B1 B2 B1 B2 E2 E3 G2 G3 A1 A2 D2 D3 C2 C3 B1 B2 E2 E3 E2 E2',d:2},
 gym:{bpm:184,m:'D5 D5 F5 D5 A5 - G5 F5 E5 E5 G5 E5 A#5 - A5 G5 F5 F5 A5 F5 C6 - A#5 A5 G5 - A5 - C#6 - - - D6 - A5 - F5 - D5 - A#5 - G5 - E5 - C#5 - D5 E5 F5 G5 A5 G5 F5 E5 D5 - - - D4 . . .',
  b:'D2 D3 D2 D3 C2 C3 C2 C3 A#1 A#2 A#1 A#2 A1 A2 A1 A2 D2 D3 D2 D3 G1 G2 A1 A2 A#1 A#2 A1 A2 D2 D3 D2 D2',d:2},
 center:{bpm:104,m:'E5 - G5 - C6 - B5 - A5 - G5 - E5 - - - F5 - A5 - G5 - E5 - D5 - - - - - . . E5 - G5 - C6 - D6 - E6 - D6 - C6 - A5 - G5 - A5 - B5 - D6 - C6 - - - - - . .',
  b:'C3 . G3 . A2 . E3 . F2 . C3 . G2 . D3 . C3 . G3 . A2 . F3 . G2 . G2 . C3 . C3 .'},
 win:{bpm:132,m:'C5 E5 G5 C6 - - G5 - A5 - F5 - G5 - - - E5 G5 C6 E6 - - D6 - C6 - - - - - . .',b:'C3 G3 C3 G3 F2 C3 G2 D3 C3 G3 A2 E3 F2 G2 C3 C3',d:1},
 league:{bpm:150,m:'C5 - D#5 - G5 - F5 D#5 D5 - C5 - G4 - - - G#4 - C5 - D#5 - D5 C5 B4 - G4 - - - . . C5 D#5 G5 C6 - - A#5 G#5 G5 - F5 - D#5 - D5 - G#5 - G5 - F5 - D5 - C5 - - - C4 . . .',
  b:'C2 C3 C2 C3 G#1 G#2 G#1 G#2 F1 F2 F1 F2 G1 G2 G1 G2 C2 C3 C2 C3 D#2 D#3 F2 F3 G#1 G#2 G1 G2 C2 C3 C2 C2',d:2},

for(const k in BGMS){BGMS[k].m=seq(BGMS[k].m);BGMS[k].b=seq(BGMS[k].b);}
const BGM={mode:'none',next:0,step:0};
function setBgm(m){if(BGM.mode!==m){BGM.mode=m;BGM.step=0;BGM.next=0;}}
// 8分音符ずつ 先読みで 鳴らす。'-' は のばす、'.' は 休み。d:1 は 軽い リズム、d:2 は 戦闘用の 強い リズム
setInterval(()=>{if(!AC||!sndOn()||!BGMS[BGM.mode])return;const S_=BGMS[BGM.mode],sp=60/S_.bpm/2,now=AC.currentTime;if(BGM.next<now)BGM.next=now+.05;let n=0;
 while(BGM.next<now+.25&&n<8){const i=BGM.step,L=S_.m.length;const s=S_.m[i%L];const mf=nf(s);
  if(mf){let k=1;while(k<8&&S_.m[(i+k)%L]==='-')k++;tone(mf,sp*k*.92,'square',.034,0,0,BGM.next);tone(mf*2,sp*Math.min(k,2)*.5,'square',.006,0,0,BGM.next);}
  if(i%2===0){const bf=nf(S_.b[(i>>1)%S_.b.length]);if(bf)tone(bf,sp*1.8,'triangle',.075,0,0,BGM.next);}
  if(S_.d){const st=i%8;if(st===0)tone(110,.08,'triangle',.08,.35,0,BGM.next);if(S_.d>1&&st===4)noise(.08,.07,2200,0,BGM.next);else if(S_.d>1&&st===6)tone(110,.06,'triangle',.06,.35,0,BGM.next);if(st%2===1)noise(.025,S_.d>1?.035:.02,7000,0,BGM.next);}
  BGM.next+=sp;BGM.step++;n++;}},60);
addEventListener('keydown',()=>{if(sndOn())ac();},{capture:true});

/* ================= 入力（共通コントローラー） ================= */
TGPad.mount('#pad',{labels:{A:'決定',B:'戻る/走る',START:'',SELECT:''}});
const IN={dir:-1,dirT:0,rep:0,ev:[],held:{}};
// dir: 0上 1右 2下 3左
function stickDir(){const s=TGPad.stick;const ax=Math.abs(s.x),ay=Math.abs(s.y);if(Math.max(ax,ay)<.42)return -1;return ax>ay?(s.x>0?1:3):(s.y>0?2:0);}
for(const b of ['A','B','START','SELECT'])TGPad.on(b,d=>{IN.held[b]=d;if(d)IN.ev.push(b);});
function inputTick(dt){const d=stickDir();if(d!==IN.dir){IN.dir=d;IN.dirT=0;IN.rep=0;if(d>=0)IN.ev.push('D'+d);}else if(d>=0){IN.dirT+=dt;if(IN.dirT>.32){IN.rep+=dt;if(IN.rep>.09){IN.rep=0;IN.ev.push('D'+d);}}}}
function takeEv(){const e=IN.ev.slice();IN.ev.length=0;return e;}

function typeMul(at,defTypes){let m=1;for(const d of defTypes){const v=CHART[at]&&CHART[at][d];if(v!=null)m*=v;}return m;}

function walkT(t){return WALKT.has(t)||(t==='~'&&has('board'))||t==='i'||ARROW[t]!=null||t==='x'||t==='h';}
const DXY=[[0,-1],[1,0],[0,1],[-1,0]];
let busy=false;let mode='title';   // title / world / battle

function nkey(mid,i){return mid+':'+i;}
function npcState(mid,i){const k=nkey(mid,i);if(!NRT[k]){const n=MAPS[mid].npcs[i];NRT[k]={x:n.x,y:n.y,dir:n.dir};}return NRT[k];}
function npcVisible(n){if(n.show&&!G.flags[n.show])return false;if(n.hide&&G.flags[n.hide])return false;if(n.kind==='sleeper'||n.kind==='story'&&n.once)return !G.flags[n.id];if(n.kind==='item'||n.kind==='legend'||n.kind==='gift'&&false)return !G.flags[n.id];if(n.kind==='guard')return !G.flags[n.req];if(n.kind==='block_prof')return G.starter==null;return true;}
function visNpcs(mid){const m=MAPS[mid||G.map];const out=[];m.npcs.forEach((n,i)=>{if(npcVisible(n)){const s=npcState(mid||G.map,i);out.push({n,i,s});}});return out;}
function npcAt(x,y,mid){return visNpcs(mid).find(o=>o.s.x===x&&o.s.y===y);}
function tileAt(m,x,y){if(x<0||y<0||x>=m.w||y>=m.h)return null;if(G&&G.mod){const v=G.mod[m.id+':'+x+','+y];if(v)return v;}return m.rows[y][x];}
function warpAt(m,x,y){return m.warps.find(w=>w.x===x&&w.y===y);}
function canWalk(mid,x,y,ignoreNpc){const m=MAPS[mid];const t=tileAt(m,x,y);if(t==null||!walkT(t))return false;
 const w=warpAt(m,x,y);if(w&&w.req&&!G.flags[w.req])return false;
 if(!ignoreNpc&&npcAt(x,y,mid))return false;return true;}
// 端を越えた先
function across(mid,x,y){const m=MAPS[mid];if(x>=0&&y>=0&&x<m.w&&y<m.h)return {mid,x,y};
 const side=x<0?'w':x>=m.w?'e':y<0?'n':'s';const c=m.conns[side];if(!c)return null;const t=MAPS[c.to];
 if(side==='n')return {mid:c.to,x:x+c.off,y:t.h-1};if(side==='s')return {mid:c.to,x:x+c.off,y:0};
 if(side==='w')return {mid:c.to,x:t.w-1,y:y+c.off};return {mid:c.to,x:0,y:y+c.off};}
function setBgmFor(m){setBgm(m.bgm||'route');}
function showBanner(t){if(banner)banner.remove();banner=el('box',{left:U(4),top:U(4)},t);bannerT=1.8;}
async function warpTo(mid,x,y,dir){busy=true;if(G.starter==null&&mid!=='lab')RIVALNPC=null;sfx('door');fade=1;await wait(180);const prevName=curMap().name;G.map=mid;G.x=x;G.y=y;if(dir!=null)G.dir=dir;P.moving=false;syncP();setBgmFor(curMap());
 if(curMap().theme!=='indoor'&&curMap().name!==prevName)showBanner(curMap().name);await wait(120);fade=0;busy=false;
 if(mid==='lab'&&G.starter==null){if(!G.flags.rival_meet)runEvent(rivalMeet);else RIVALNPC={x:7,y:3,dir:2};}}
function syncP(){P.px=G.x*16;P.py=G.y*16;}
function enterMap(){syncP();setBgmFor(curMap());}

/* ---- 入力と移動 ---- */
function worldStep(dt){P.fr+=dt;if(curMap().fly&&!G.visited[G.map])G.visited[G.map]=1;bannerT-=dt;if(banner&&bannerT<=0){banner.remove();banner=null;}
 if(emote){emote.t-=dt;if(emote.t<=0)emote=null;}
 if(busy||STACK.length)return;
 const evs=takeEv();
 if(P.moving){P.t+=dt*P.spd;if(P.t>=1){P.moving=false;G.x=P.tx;G.y=P.ty;if(P.tmid&&P.tmid!==G.map){const prev=curMap().name;G.map=P.tmid;setBgmFor(curMap());if(curMap().name!==prev)showBanner(curMap().name);}syncP();arrive();return;}
  const [dx,dy]=DXY[G.dir];P.px=(P.fx+dx*P.t)*16;P.py=(P.fy+dy*P.t)*16;return;}
 for(const e of evs){if(e==='START'){runEvent(startMenu);return;}if(e==='A'){interact();return;}}
 if(P.force>=0){const f=P.force;P.force=-1;tryMove(f,true);return;}
 const d=window.tgAuto?BOT.moveDir():IN.dir;
 if(d>=0){if(d!==G.dir&&!window.tgAuto){G.dir=d;P.turnT=.09;return;}G.dir=d;if(P.turnT>0){P.turnT-=dt;return;}tryMove(d);}else P.turnT=0;}
function tryMove(d,forced){const [dx,dy]=DXY[d];const t=across(G.map,G.x+dx,G.y+dy);
 if(t&&!canWalk(t.mid,t.x,t.y)&&!forced&&bumpSpecial(t))return;
 if(!t||!canWalk(t.mid,t.x,t.y)){if(forced)return;P.bumpT-=1/60;if(P.bumpT<=0){sfx('bump');P.bumpT=.35;}if(window.tgAuto)BOT.blocked();return;}
 P.moving=true;P.t=0;P.fx=G.x;P.fy=G.y;P.tx=G.x+dx;P.ty=G.y+dy;P.tmid=null;
 if(t.mid!==G.map){P.tmid=t.mid;P.tx=t.x;P.ty=t.y;}
 P.spd=forced?11:(IN.held.B||window.tgAuto)?11:6.5;}
// 木を切る・岩をくだく・鍵のかかった扉
function bumpSpecial(t){const tt=tileAt(MAPS[t.mid],t.x,t.y);const w=warpAt(MAPS[t.mid],t.x,t.y);
 if(tt==='c'||tt==='k'){const tool=tt==='c'?'nata':'glove';
  if(has(tool)){runEvent(async()=>{sfx('hit');await say(tt==='c'?'ナタで 細い 木を 切り倒した！':'ちからのてぶくろで 岩を 砕いた！',{auto:window.tgAuto?1:600});G.mod[t.mid+':'+t.x+','+t.y]=tt==='c'?'.':(['route','town','forest','snow'].includes(MAPS[t.mid].theme)?'.':':');});return true;}
  if(!P.msgT||P.msgT<Date.now()){P.msgT=Date.now()+1500;runEvent(()=>say(tt==='c'?'細い 木が じゃまを している。切れる 道具が あれば……':'ひびの 入った 岩だ。砕ける 力が あれば……'));return true;}}
 if(tt==='~'&&!has('board')){if(!P.msgT||P.msgT<Date.now()){P.msgT=Date.now()+1500;runEvent(()=>say('水が 広がっている。渡る 道具が あれば……'));return true;}}
 if(w&&w.req&&!G.flags[w.req]&&w.msg){if(!P.msgT||P.msgT<Date.now()){P.msgT=Date.now()+1500;runEvent(()=>say(w.msg));return true;}}
 return false;}
function runEvent(fn){busy=true;Promise.resolve().then(fn).catch(e=>console.error(e)).finally(()=>{busy=false;});}
function blockZone(mid,x,y){if(G.starter!=null)return null;return visNpcs(mid).find(o=>o.n.kind==='block_prof'&&o.s.y===y&&Math.abs(o.s.x-x)<=1);}
function arrive(){G.steps++;if(G.repel>0){G.repel--;if(G.repel===0)runEvent(()=>say('むしよけスプレーの 効果が 切れた！'));}
 const m=curMap();const w=warpAt(m,G.x,G.y);
 if(w){if(w.req&&!G.flags[w.req])return;runEvent(()=>warpTo(w.to,w.tx,w.ty,w.dir));return;}
 for(const tr of m.trig||[]){if(G.x>=tr.x&&G.x<tr.x+tr.w&&G.y>=tr.y&&G.y<tr.y+tr.h&&!G.flags[tr.ev]&&G.starter!=null&&(!tr.req||G.flags[tr.req])){runEvent(()=>STORY[tr.ev]?STORY[tr.ev](tr):rivalEvent(tr.ev));return;}}
 const st=tileAt(m,G.x,G.y);
 if(st==='i'||ARROW[st]!=null){const fd=ARROW[st]!=null?ARROW[st]:G.dir;const [fx,fy]=DXY[fd];const nt=across(G.map,G.x+fx,G.y+fy);if(nt&&canWalk(nt.mid,nt.x,nt.y)){G.dir=fd;P.force=fd;return;}}
 const bz=blockZone(G.map,G.x,G.y);if(bz){runEvent(async()=>{emote={x:bz.s.x,y:bz.s.y,t:.6};await say(bz.n.text);G.dir=2;if(canWalk(G.map,G.x,G.y+1)){G.y++;syncP();}});return;}
 const sp=spotCheck();if(sp){runEvent(()=>trainerSpot(sp));return;}
 const t=tileAt(m,G.x,G.y);
 const encT=t==='~'?m.encW:m.enc;
 if(encT&&(t==='"'||t==='~'||(m.encAll&&walkT(t)&&t!=='U')||(m.theme==='cave'&&t===':'))){const rate=t==='"'?.11:t==='~'?.06:.07;if(Math.random()<rate){const w2=wildPick(encT);const lead=partyAlive()[0];if(G.repel>0&&lead&&w2.lv<lead.lv)return;runEvent(()=>wildBattle(w2,{ghost:m.ghost&&!has('mirror')}));}}}
function wildPick(enc){const tot=enc.reduce((a,e)=>a+e[3],0);let r=Math.random()*tot;for(const e of enc){r-=e[3];if(r<=0)return {sp:DXI[e[0]],lv:irnd(e[1],e[2])};}const e=enc[0];return {sp:DXI[e[0]],lv:e[1]};}
function spotCheck(){for(const o of visNpcs()){const n=o.n;if(n.kind!=='trainer'||G.flags[n.id])continue;const [dx,dy]=DXY[o.s.dir];
  for(let k=1;k<=(n.sight||4);k++){const x=o.s.x+dx*k,y=o.s.y+dy*k;if(x===G.x&&y===G.y)return o;if(!canWalk(G.map,x,y))break;}}return null;}

 const [dx,dy]=DXY[o.s.dir];while(Math.abs(o.s.x-G.x)+Math.abs(o.s.y-G.y)>1){o.s.x+=dx;o.s.y+=dy;await wait(140);}

 busy=true;while(o.s.x!==o.n.x||o.s.y!==o.n.y){o.s.dir=(o.s.dir===o.n.dir?(o.n.dir+2)%4:o.s.dir);o.s.x+=Math.sign(o.n.x-o.s.x);o.s.y+=Math.sign(o.n.y-o.s.y);await wait(110);}o.s.dir=o.n.dir;}

 if(t==='K'){x+=dx;y+=dy;}

async function talkNpc(o){const n=o.n;faceTo(o);
 switch(n.kind){

    await say(['博士「……なんと！ 図鑑が ついに 完成したのか！',`全${DEX.length}種の モノモン、ひとつ残らず 捕まえたのじゃな。`,'わしが 長年 夢見てきた ことを、君が やりとげて くれた。','これは わしからの 気持ちじゃ。受け取って くれ！']);
    G.flags.cert=1;addItem('cert',1);sfx('caught');await say(`${G.name}は 博士から 表彰状を もらった！`);await certScreen();
    await say(['博士「モノモンたちとの 旅は、これからも 続く。','色が なくても、君たちの 思い出は きっと 輝いておる。ありがとう！」']);}
   else if(G.flags.cert){await say(['博士「おお、図鑑を 完成させた 君か！','あの 表彰状は わしの 自慢でも あるのじゃ。」']);}
   else{const c=Object.keys(G.caught).length;await say([`博士「図鑑の 調子は どうかね？ 今 ${c}匹 捕まえておるな。`,c<10?'もっと いろいろな モノモンを 見つけるのじゃ！':c<30?'なかなか やるのう！ その 調子じゃ！':'素晴らしい！ 君こそ 本物の トレーナーじゃ！']);}break;
  case 'item':G.flags[n.id]=1;addItem(n.item,n.n||1);sfx('item');await say(`${G.name}は ${ITM[n.item].n}を 拾った！`);break;
  case 'gift':if(n.req&&!G.flags[n.req]){await say(n.pre||n.text||['……']);break;}
   if(G.flags[n.id]||!n.item){await say(n.after||(n.item?'大切に 使ってね。':(n.text||['……'])));}else{await say(n.text);G.flags[n.id]=1;addItem(n.item,n.n||(n.item==='ultra'?5:n.item==='candy'?3:1));sfx('item');await say(`${G.name}は ${ITM[n.item].n}を もらった！`);if(ITM[n.item].hint)await say(ITM[n.item].hint);if(n.flag)G.flags[n.flag]=1;}break;

   sfx('caught');await say([`${G.name}は ${DEX[want].n}と ${DEX[give].n}を 交換した！`,n.thanks||'ありがとう！ 大切に 育ててね！']);

let B=null;
const STAGE_MUL=s=>s>=0?(2+s)/2:2/(2-s);
const ACC_MUL=s=>s>=0?(3+s)/3:3/(3-s);
function mkSide(){return {st:{atk:0,def:0,spa:0,sdf:0,spd:0,acc:0,eva:0},conf:0,flinch:false,recharge:false,leech:false,tox:0,slp:0,lastMove:null};}
function bStat(m,side,k){let v=m.st[k]*STAGE_MUL(side.st[k]);if(k==='spd'&&m.status==='par')v*=.25;if(k==='atk'&&m.status==='brn')v*=.5;return Math.max(1,v);}
function eff(mv,name){return mv.eff.find(e=>e[0]===name);}

async function doMove(side,mvId,slot){const sd=B.sides[side],od=B.sides[1-side];const atk=side===0?B.ally():B.foe(),def=side===0?B.foe():B.ally();
 if(mvId===-1||sd.recharge){sd.recharge=false;await say(`${pre(side)}${mname(atk)}は 反動で 動けない！`);return;}
 // 状態異常のチェック
 if(atk.status==='slp'){sd.slp--;if(sd.slp<=0){atk.status=null;await say(`${pre(side)}${mname(atk)}は 目を 覚ました！`);}else{await say(`${pre(side)}${mname(atk)}は ぐうぐう 眠っている。`);return;}}
 if(atk.status==='frz'){if(Math.random()<.2){atk.status=null;await say(`${pre(side)}${mname(atk)}の 氷が 溶けた！`);}else{await say(`${pre(side)}${mname(atk)}は 凍って しまって 動けない！`);return;}}
 if(sd.flinch){sd.flinch=false;await say(`${pre(side)}${mname(atk)}は ひるんで 動けない！`);return;}
 if(sd.conf>0){sd.conf--;if(sd.conf<=0){await say(`${pre(side)}${mname(atk)}の 混乱が 解けた！`);}else{await say(`${pre(side)}${mname(atk)}は 混乱 している！`);if(Math.random()<.33){const d=calcDmg(atk,atk,sd,sd,{p:40,t:'?',cat:'phys',eff:[]},true).d;atk.hp=Math.max(0,atk.hp-d);sfx('hit');await shake(side);await settle();await say('わけも わからず 自分を 攻撃した！');return;}}}
 if(atk.status==='par'&&Math.random()<.25){await say(`${pre(side)}${mname(atk)}は 体が しびれて 動けない！`);return;}
 const mv=MOVES[mvId];
 if(side===0&&slot!=null&&atk.moves[slot])atk.moves[slot].pp=Math.max(0,atk.moves[slot].pp-1);
 else if(side===1){const s2=atk.moves.find(x=>x.id===mvId);if(s2)s2.pp=Math.max(0,s2.pp-1);}
 await say(`${pre(side)}${mname(atk)}の ${mv.n}！`,{auto:window.tgAuto?1:650});
 // 命中
 const selfOnly=mv.cat==='status'&&mv.eff.every(e=>e[0]==='s'||e[0]==='heal');
 if(!selfOnly){const accS=sd.st.acc-od.st.eva;const hit=Math.random()*100<mv.acc*ACC_MUL(accS);
  if(!hit){await say(`しかし ${pre(side)}${mname(atk)}の 攻撃は 外れた！`);return;}}
 if(mv.cat!=='status'){

async function secondary(e,side,atk,def,sd,od,primary){const k=e[0];const ch=primary?100:(+e[e.length-1]||100);

 if(k==='par'||k==='brn'||k==='psn'||k==='slp'||k==='frz'||k==='tox'){const chance=k==='tox'?100:+e[1];if(!primary&&Math.random()*100>=chance)return;
  if(def.status){if(primary)await say(`しかし ${mname(def)}には 効かなかった！`);return;}
  const dt=DEX[def.sp].t;if((k==='brn'&&dt.includes('F'))||(k==='frz'&&dt.includes('I'))||((k==='psn'||k==='tox')&&dt.includes('P'))||(k==='par'&&dt.includes('E'))){if(primary)await say(`しかし ${mname(def)}には 効かなかった！`);return;}
  const tside=1-side;def.status=k;if(k==='slp')B.sides[tside].slp=irnd(1,3);if(k==='tox')B.sides[tside].tox=0;sfx('status');

 if(k==='conf'){if(e[1]==='30self'){if(Math.random()<.3&&!sd.conf){sd.conf=irnd(2,4);await say(`${mname(atk)}は 疲れ果てて 混乱 した！`);}return;}
  if(!primary&&Math.random()*100>=+e[1])return;if(od.conf){if(primary)await say(`${mname(def)}は すでに 混乱 している！`);return;}od.conf=irnd(2,5);sfx('status');await say(`${pre(1-side)}${mname(def)}は 混乱した！`);return;}
 if(k==='flinch'){if(Math.random()*100<+e[1])od.flinch=true;return;}
 if(k==='leech'){if(DEX[def.sp].t.includes('G')){await say(`${mname(def)}には 効かなかった！`);return;}if(od.leech){await say('しかし うまく 決まらなかった！');return;}od.leech=true;await say(`${mname(def)}に タネを 植え付けた！`);return;}
 if(k==='heal'){if(atk.hp>=atk.st.hp){await say('しかし 体力は 満タンだ！');return;}atk.hp=Math.min(atk.st.hp,atk.hp+Math.floor(atk.st.hp*(+e[1])/100));sfx('heal');await settle();await say(`${pre(side)}${mname(atk)}は 体力を 回復した！`);return;}
 if(k==='t'||k==='s'){const tgt=k==='t'?od:sd,m=k==='t'?def:atk;const st=e[1],n=+e[2];const c=e[3]!=null?+e[3]:100;if(!primary&&Math.random()*100>=c)return;if(primary&&k==='t'&&Math.random()*100>=c)return;
  const before=tgt.st[st];tgt.st[st]=clamp(before+n,-6,6);if(tgt.st[st]===before){if(primary)await say(`${mname(m)}の ${stName[st]}は もう ${n>0?'上がらない':'下がらない'}！`);return;}
  sfx(n>0?'stat':'statd');await say(`${pre(k==='t'?1-side:side)}${mname(m)}の ${stName[st]}が ${Math.abs(n)>=2?'ぐーんと ':''}${n>0?'上がった':'下がった'}！`);return;}}
function calcDmg(atk,def,sa,sd,mv,confusion){
 const fixed=mv.eff.find(e=>e[0]==='fixed');if(fixed)return {d:+fixed[1],mul:typeMul(mv.t,DEX[def.sp].t)===0?0:1};
 if(mv.eff.find(e=>e[0]==='level'))return {d:atk.lv,mul:typeMul(mv.t,DEX[def.sp].t)===0?0:1};
 const phys=mv.cat==='phys';const A=bStat(atk,sa,phys?'atk':'spa'),D=bStat(def,sd,phys?'def':'sdf');
 let d=Math.floor(Math.floor(Math.floor(2*atk.lv/5+2)*mv.p*A/D)/50)+2;
 if(confusion)return {d:Math.max(1,d),mul:1};
 const highCrit=mv.eff.some(e=>e[0]==='crit');const crit=Math.random()<(highCrit?1/8:1/16);if(crit)d=Math.floor(d*1.5);
 if(DEX[atk.sp].t.includes(mv.t))d=Math.floor(d*1.5);
 const mul=typeMul(mv.t,DEX[def.sp].t);d=Math.floor(d*mul*rnd(.85,1));if(mul>0)d=Math.max(1,d);

 if(G.starter==null)return {k:'prof',goals:[{m:'lab',x:5,y:4,face:0}],act:true};
 if(needHeal())return {k:'heal',goals:nurseGoals(),act:true};
 const hc=healKeys().reduce((a,k)=>a+G.bag[k],0);
 if(hc<4&&G.money>=300){const sg=shopGoals();if(sg.length)return {k:'shop',goals:sg,act:true};}
 if(G.flags.champ)return {k:'done',goals:[]};
 let si=STORYLINE.findIndex(st=>!G.flags[st[st.length-1]]);if(si<0)return {k:'done',goals:[]};
 const step=STORYLINE[si];const o=findNpc(step[0]);
 if(!o){G.flags[step[step.length-1]]=G.flags[step[step.length-1]]||0;return {k:'wait'+si,goals:[]};}
 const tm=teamMax(o.n);if(tm)REQ_KEEP=Math.max(REQ_KEEP,tm);
 const req=REQ_KEEP-1+(si>=24?2:0)+Math.min(4,BOT.loss[si]||0);BOT.li=si;
 if(topLv()<req){
  const tl=topLv();const ck=si+':'+Math.floor(tl/3);
  if(BOT.gck!==ck){BOT.gck=ck;BOT.gsel=null;let best=null,bl=-1;
   for(const id in MAPS){const m=MAPS[id];if(!m.enc||(m.ghost&&!has('mirror')))continue;const mn=Math.min(...m.enc.map(e=>e[1])),mx=Math.max(...m.enc.map(e=>e[2]));if(mn>tl+2||mx<bl)continue;
    if(mx>bl&&(G.map===id||bfs(s=>s.m===id&&grassT(s.m,s.x,s.y)))){best=id;bl=mx;}}
   BOT.gsel=best||'r1';}
  return {k:'grind:'+BOT.gsel,grind:BOT.gsel};}
 return {k:'st'+si,goals:npcGoals(o),act:true};}
function fieldCare(){if(!window.tgAuto)return false;const hk=healKeys();
 for(const m of G.party){if(m.hp<=0)continue;
  if(m.status&&G.bag.fullheal){runEvent(async()=>{useBag('fullheal');m.status=null;sfx('heal');await say(`${mname(m)}は 元気に なった！`);});return true;}
  const hk2=hk.filter(k=>ITM[k].heal>=m.st.hp*.3||ITM[k].heal>=m.st.hp-m.hp);if(m.hp<m.st.hp*.5&&hk2.length){const k=hk2.find(k=>ITM[k].heal>=m.st.hp-m.hp)||hk2[hk2.length-1];runEvent(async()=>{useBag(k);const h=Math.min(ITM[k].heal,m.st.hp-m.hp);m.hp+=h;sfx('heal');await say(`${ITM[k].n}を 使った！ ${mname(m)}の HPが ${h} 回復！`);});return true;}}
 if(G.bag.revive&&G.party.some(m=>m.hp<=0)&&!needHeal()){const m=G.party.find(m=>m.hp<=0);runEvent(async()=>{useBag('revive');m.hp=Math.floor(m.st.hp/2);sfx('heal');await say(`${mname(m)}は 元気を 取り戻した！`);});return true;}
 return false;}
BOT.moveDir=function(){if(!G||busy)return -1;if(!P.moving&&fieldCare())return -1;const goal=currentGoal();
 if(goal.k!==BOT.goalKey||BOT.lastMap!==G.map&&!BOT.path){BOT.goalKey=goal.k;BOT.path=null;BOT.order(goal);}
 BOT.lastMap=G.map;
 if(goal.k==='done')return -1;
 if(goal.grind){if(G.map===goal.grind&&grassT(G.map,G.x,G.y)){// 草むらで往復
   const ds=[0,1,2,3].filter(d=>{const n=stepState({m:G.map,x:G.x,y:G.y},d);return n&&n.m===G.map&&grassT(n.m,n.x,n.y);});if(ds.length)return pick(ds);}
  if(!BOT.path||!BOT.path.length){BOT.path=bfs(s=>s.m===goal.grind&&grassT(s.m,s.x,s.y))||[];}
  return BOT.path.length?BOT.path.shift():pick([0,1,2,3]);}
 const atGoal=goal.goals.find(g=>g.m===G.map&&g.x===G.x&&g.y===G.y);
 if(atGoal){if(G.dir!==atGoal.face){G.dir=atGoal.face;return -1;}BOT.idle++;if(BOT.idle%6===1)IN.ev.push('A');return -1;}
 BOT.idle=0;
 if(!BOT.path||!BOT.path.length){const gs=goal.goals;BOT.path=bfs(s=>gs.some(g=>g.m===s.m&&g.x===s.x&&g.y===s.y))||[];if(!BOT.path.length)return pick([0,1,2,3]);}
 return BOT.path.shift();};
BOT.blocked=function(){BOT.blockN++;BOT.path=null;if(BOT.blockN>40){BOT.blockN=0;}};
BOT.order=function(goal){if(!G.party.length)return;const alive=G.party.filter(m=>m.hp>0),dead=G.party.filter(m=>m.hp<=0);
 alive.sort((a,b)=>b.lv-a.lv);
 if(goal.grind&&alive.length>1){const mx=Math.max(...MAPS[goal.grind].enc.map(e=>e[2]));if(alive[0].lv>=mx+2){const lead=alive[alive.length-1];alive.splice(alive.length-1,1);alive.unshift(lead);}}
 G.party=alive.concat(dead);};
function bestMoveIdx(a,e){let bi=0,bv=-1;a.moves.forEach((m,i)=>{if(m.pp<=0)return;const mv=MOVES[m.id];let v;
  if(mv.cat==='status'){v=5;if(mv.eff.some(x=>x[0]==='heal')&&a.hp<a.st.hp*.4)v=40;}
  else{const fx=eff(mv,'fixed');v=fx?+fx[1]:eff(mv,'level')?a.lv:(mv.p*(DEX[a.sp].t.includes(mv.t)?1.5:1)*typeMul(mv.t,DEX[e.sp].t)*(mv.acc/100)*(mv.cat==='phys'?a.st.atk/Math.max(1,e.st.def):a.st.spa/Math.max(1,e.st.sdf)));if(eff(mv,'recharge'))v*=.6;}
  if(v>bv){bv=v;bi=i;}});return bi;}
function healKeys(){const mx=Math.max(1,...G.party.map(m=>m.st.hp));return ['potion','superpot','hyperpot','maxpot'].filter(k=>G.bag[k]>0&&(ITM[k].heal>=mx*.25||k==='maxpot'));}
function ballKeys(){return ['ultra','great','ball'].filter(k=>G.bag[k]>0);}
BOT.choose=function(tag,opts,o){
 if(tag==='bcmd'){const a=B.ally(),e=B.foe();BOT.intent=null;if(B.ghost)return 3;
  if(B.kind==='wild'){const want=!G.caught[e.sp]&&ballKeys().length&&G.party.length+G.box.length<30;
   if(want&&(e.hp<e.st.hp*.55||DEX[e.sp].cr>=150&&e.hp<e.st.hp*.9)){BOT.intent='ball';return 1;}
   if(a.hp<a.st.hp*.25&&!BOT.goalKey.startsWith('grind'))return 3;}
  if(a.hp<a.st.hp*.3&&healKeys().length&&B.kind!=='wild'){BOT.intent='heal';return 1;}
  // 弱いのを先頭に出して、強いのに交代（経験値を分ける）
  if(B.kind==='wild'&&a.lv<e.lv+2){const strong=G.party.find(m=>m.hp>m.st.hp*.3&&m.lv>=e.lv+2);if(strong&&strong!==a){BOT.intent='switch';return 2;}}
  // 不利なら交代
  return 0;}
 if(tag==='bmove')return bestMoveIdx(B.ally(),B.foe());
 if(tag==='bag_battle'){const keys=Object.keys(G.bag).filter(k=>G.bag[k]>0&&!ITM[k].escape&&!ITM[k].repel&&!ITM[k].key);
  const want=BOT.intent==='ball'?ballKeys()[0]:healKeys().slice(-1)[0];const i=keys.indexOf(want);return i>=0?i:keys.length;}
 if(tag.startsWith('bitem_'))return B?B.ai_:0;
 if(tag==='bswitch'&&BOT.intent==='switch'){let bi=-1,bv=-1;G.party.forEach((m,i)=>{if(m.hp<=m.st.hp*.3||m===B.ally())return;if(m.lv>bv){bv=m.lv;bi=i;}});return bi;}
 if(tag==='bnext'||tag==='bswitch'){let bi=-1,bv=-1;G.party.forEach((m,i)=>{if(m.hp<=0||(B&&m===B.ally()&&tag==='bswitch'))return;const v=m.lv*10+m.hp/m.st.hp*5;if(v>bv){bv=v;bi=i;}});return bi;}
 if(tag==='starter')return 0;
 if(tag==='starter_ok'||tag==='yesno')return 0;
 if(tag.startsWith('learn:')){const id=+tag.split(':')[1];const mv=MOVES[id];const m=o&&o.ctx;return mv.cat==='status'?1:0;}
 if(tag.startsWith('forget:')){const id=+tag.split(':')[1];const m=o.ctx;let wi=0,wv=1e9;m.moves.forEach((x,i)=>{const mv=MOVES[x.id];const v=mv.cat==='status'?10:mv.p*(DEX[m.sp].t.includes(mv.t)?1.5:1);if(v<wv){wv=v;wi=i;}});const nv=MOVES[id].p*(DEX[m.sp].t.includes(MOVES[id].t)?1.5:1);return nv>wv?wi:4;}
 if(tag==='forget_ok')return 0;
 if(tag==='save')return 1;
 if(tag==='start')return opts.length-1;
 if(tag==='shop_top'){BOT.buy=shopBuy(BOT.inv||[]);return BOT.buy?0:2;}
 if(tag==='shop_buy'){BOT.buy=shopBuy(BOT.inv||[]);return BOT.buy?BOT.inv.indexOf(BOT.buy[0]):opts.length-1;}
 if(tag==='shop_n')return BOT.buy?BOT.buy[1]:0;
 if(tag.startsWith('shop'))return -1;
 if(tag.startsWith('item_target'))return 0;
 if(tag==='giftmon')return 0;
 return 0;};

function drawTitle(g,t){g.fillStyle=C0;g.fillRect(0,0,SW,SH);
 // ロゴ：斜めに白黒が分かれ、文字は境目で反転する
 const Y0=9,Y1=49;
 g.fillStyle=C3;g.beginPath();g.moveTo(0,Y0);g.lineTo(SW*0.60,Y0);g.lineTo(SW*0.40,Y1);g.lineTo(0,Y1);g.closePath();g.fill();
 // 細い罫線（上下、斜めの切れ目に合わせて すき間）
 g.fillStyle=C3;g.fillRect(0,Y0-3,SW*0.60-2,1);g.fillRect(SW*0.60+3,Y0-3,SW*0.40-3,1);g.fillRect(0,Y1+2,SW*0.40-3,1);g.fillRect(SW*0.40+2,Y1+2,SW*0.60-2,1);
 g.save();g.globalCompositeOperation='difference';g.fillStyle='#ffffff';g.textBaseline='middle';
 g.font='bold 16px "DotGothic16",monospace';g.textAlign='left';g.fillText('モノクロ',17,20);g.textAlign='right';g.fillText('モンスター',SW-16,38);g.restore();
 // 斜めの切れ目に そう 細い線
 g.strokeStyle=C1;g.lineWidth=1;g.beginPath();g.moveTo(SW*0.60+2,Y0);g.lineTo(SW*0.40+2,Y1);g.stroke();
 g.textAlign='center';g.textBaseline='middle';
 g.save();g.font='5px "DotGothic16",monospace';g.fillStyle=C2;try{g.letterSpacing='2px';}catch(e){}g.fillText('MONOCHROME  MONSTERS',SW/2+1,58);g.restore();
 const ids=[STARTERS[0],STARTERS[1],STARTERS[2],DXI.m150];const k=Math.floor(t/2.4)%ids.length;
 const bob=Math.round(Math.sin(t*3)*1.5);g.drawImage(monImg(DEX[ids[k]].art,false),SW/2-26,62+bob,52,52);
 g.fillStyle=C1;g.fillRect(SW/2-24,116,48,3);
 if(!STACK.length&&Math.floor(t*2)%2===0){g.fillStyle=C3;g.font='8px "DotGothic16",monospace';g.fillText('PUSH  A',SW/2,130);}g.textAlign='left';g.textBaseline='alphabetic';}

 await new Promise(r=>{const o={onEv:e=>{if(e==='A'||e==='START'||e==='TAP'){uiPop(o);r();}}};uiPush(o);

 sfx('ok');

 const opts=has?['続きから','始めから']:['始めから'];
 const v=await choose(opts,{pos:{left:20,right:20,top:96},tag:'title',cancel:false});

 const box=fullBox('');box.style.background='#f8f8f8';
 await say(['……100年前。','この 世界から、突然 色が 消えた。','人々は それを「退色」と 呼んだ。','色を 失った 世界でも、モノモンたちは 生きている。','人は モノモンと 共に 暮らし、共に 戦う。','そして 今、色を 全て 消そうとする 者たちが 動き出した……','ようこそ！ モノクロの 世界へ！']);
 // 立ち絵（名前を 決めるときに 表示）
 const pc=document.createElement('canvas');pc.width=40;pc.height=72;pc.style.cssText=`position:absolute;right:${U(18)};top:${U(6)};width:${U(50)};height:${U(90)};image-rendering:pixelated`;box.appendChild(pc);
 const showP=k=>{const g=pc.getContext('2d');g.clearRect(0,0,40,72);const im=portraitImg(k);if(im)g.drawImage(im,0,0);sfx('sel');};
 showP('hero');await say('……さて、君の 名前を 教えて くれるかな？');
 const NAMES=['ホワイト','レッド','サトシ','ハル','ソラ'];const ni=await choose(NAMES,{pos:{left:4,top:4},tag:'name',cancel:false});
 const RIV=['ブラック','グリーン','シゲル','ロク','ジン'];
 await say(`${NAMES[ni]}くん だね！`);
 showP('rival');await say('そして こちらは 君の 幼なじみ。名前は 何だったかな？');
 const ri=await choose(RIV,{pos:{left:4,top:4},tag:'rname',cancel:false});
 newGame(NAMES[ni]);G.rival=RIV[ri];
await say(`そうだ、${G.rival}だ！`);showP('hero');await say([`${G.name}！ 君の 冒険が 今 始まる！`,'夢と 冒険の モノクロの 世界へ……　レッツ ゴー！']);
 box.remove();mode='world';enterMap();showBanner(curMap().name);}

function frame(now){const dt=clamp((now-last)/1000,0,.05);last=now;TT+=dt;
 try{inputTick(dt);
  if(STACK.length){for(const e of takeEv())uiEv(e);}
  if(mode==='world'&&G){if(!STACK.length)G.time+=dt;worldStep(dt*Math.min(4,SPD()));ctx.setTransform(WZ,0,0,WZ,0,0);drawWorld(ctx,TT);}

<script>
/* ---------- 共通の効果音（Web Audioで合成） ---------- */
window.tgSound = (function(){
  var AC = null, noiseBuf = null, on = true, last = {};
  try { on = localStorage.getItem('tg_sound') !== '0'; } catch (e) {}
  function ctx(){
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, dur, type, vol, slide, delay){
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, vol, freq, delay, kind){
    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = 1;
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + .03);
  }
  function arp(fs, step, type, vol, dur){ fs.forEach(function(f, i){ tone(f, dur || .22, type, vol, 0, i * step); }); }
  var LIB = {
    click:  function(){ tone(900, .05, 'square', .03); },
    pick:   function(){ tone(660, .06, 'triangle', .07); tone(990, .08, 'triangle', .06, 0, .05); },
    unpick: function(){ tone(520, .08, 'triangle', .06, .7); },
    tick:   function(){ tone(1500 + Math.random() * 300, .025, 'square', .025); },
    land:   function(){ tone(784, .09, 'square', .05); tone(1175, .18, 'square', .05, 0, .07); },
    start:  function(){ arp([392, 523, 659], .09, 'square', .05, .18); },
    shot:   function(){ tone(1200, .07, 'square', .025, .45); },
    shotFoe:function(){ tone(700, .08, 'square', .02, .5); },
    slash:  function(){ noise(.12, .12, 2600, 0, 'highpass'); tone(500, .1, 'sawtooth', .03, .5); },
    dash:   function(){ noise(.2, .1, 800, 0, 'bandpass'); tone(200, .2, 'sine', .06, 2.2); },
    charge: function(){ tone(200, .7, 'sawtooth', .05, 4); },
    beam:   function(){ noise(.5, .2, 500, 0, 'lowpass'); tone(90, .5, 'sawtooth', .08, .5); },
    hit:    function(){ noise(.09, .14, 900, 0, 'lowpass'); tone(160, .08, 'square', .04, .6); },
    big:    function(){ noise(.3, .22, 400, 0, 'lowpass'); tone(110, .3, 'sawtooth', .07, .5); },
    heal:   function(){ arp([784, 988, 1319], .06, 'sine', .06, .2); },
    miss:   function(){ noise(.15, .06, 3000, 0, 'highpass'); },
    good:   function(){ arp([659, 784, 1047], .08, 'triangle', .07, .25); },
    bad:    function(){ tone(330, .25, 'triangle', .07, .75); tone(247, .35, 'triangle', .06, .8, .18); },
    win:    function(){ arp([523, 659, 784, 1047, 1319], .1, 'square', .045, .28); },
    lose:   function(){ arp([392, 330, 262, 196], .22, 'triangle', .08, .4); },
    splash: function(){ noise(.35, .18, 700, 0, 'lowpass'); noise(.2, .08, 2400, .05, 'bandpass'); },
    bubble: function(){ tone(250 + Math.random() * 250, .07, 'sine', .04, 1.8); },
    slurp:  function(){ noise(.5, .12, 1400, 0, 'bandpass'); noise(.3, .08, 900, .55, 'bandpass'); },
    coin:   function(){ tone(988, .06, 'square', .04); tone(1319, .14, 'square', .04, 0, .06); },
    summon: function(){ tone(130, 1, 'sawtooth', .05, 3); arp([523, 784, 1047, 1568], .12, 'sine', .07, .5); },
    evolve: function(){ arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], .07, 'triangle', .06, .3); },
    fuse:   function(){ tone(110, 1.1, 'sawtooth', .06, 2.5); noise(.9, .1, 300, .2, 'lowpass'); arp([659, 880, 1319], .12, 'sine', .07, .4); }
  };
  function play(name){
    if (!on || !LIB[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < 55) return;
    last[name] = now;
    if (!ctx()) return;
    try { LIB[name](); } catch (e) {}
  }
  var btn = document.querySelector('.tg-snd');
  function sync(){ if (btn) { btn.textContent = on ? '音：ON' : '音：OFF'; btn.setAttribute('aria-pressed', String(on)); } }
  if (btn) {
    ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ btn.addEventListener(t, function(e){ e.stopPropagation(); }); });
    btn.addEventListener('click', function(e){
      e.stopPropagation(); on = !on; sync(); btn.blur();
      try { localStorage.setItem('tg_sound', on ? '1' : '0'); } catch (err) {}
      if (on) { ctx(); play('pick'); }
    });
  }
  sync();
  // ブラウザは最初の操作まで音を出せないので、最初のタップで準備する
  window.addEventListener('pointerdown', function(){ if (on) ctx(); }, { once: true, capture: true });
  return { play: play };
})();
</script>

<!-- tg-swipe-guard: スワイプでの更新・戻るを防ぐ -->
<style>html,body{overscroll-behavior:none}</style>
<script>
(function(){
  var GAME=!!document.querySelector('.tg-auto');
  var sx=0,sy=0;
  function scroller(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){var s=getComputedStyle(el).overflowY;if((s==='auto'||s==='scroll')&&el.scrollHeight>el.clientHeight)return el;}return null;}
  document.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;
    // 画面端からのスワイプ（戻る・進む）を止める
    if(sx<14||sx>innerWidth-14){e.preventDefault();}},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
})();
</script>
