function koProb(d){return clamp(Math.pow(Math.max(0,d-40)/60,1.5)*.9,0,.9);}

  const gg=g.createLinearGradient(0,240,0,SCN);gg.addColorStop(0,'#7cc060');gg.addColorStop(1,'#4a9038');g.fillStyle=gg;g.fillRect(0,250,W,SCN-250);
  g.fillStyle='#2f7ad0';g.beginPath();g.moveTo(14,262);g.lineTo(346,258);g.lineTo(360,340);g.lineTo(0,340);g.closePath();g.fill();

 }else{
  const sk=g.createLinearGradient(0,0,0,SCN);sk.addColorStop(0,'#060a24');sk.addColorStop(.6,'#1a2050');sk.addColorStop(1,'#2a2a50');g.fillStyle=sk;g.fillRect(0,0,W,SCN);
  for(let i=0;i<90;i++){g.fillStyle=`rgba(255,255,240,${.3+R()*.6})`;g.fillRect(R()*W,R()*200,R()<.9?1:2,R()<.9?1:2);}

  g.fillStyle='rgba(180,150,80,.25)';for(const [dx,dy,r] of [[-14,-8,9],[10,10,12],[16,-16,6],[-8,18,5]]){g.beginPath();g.arc(mx+dx,my+dy,r,0,TAU);g.fill();}
  g.fillStyle='rgba(150,120,60,.35)';g.beginPath();g.ellipse(mx+4,my+4,10,8,0,0,TAU);g.fill();
  g.fillStyle='rgba(30,30,60,.7)';for(const [x,y,w] of [[40,120,90],[180,140,120],[300,150,80]]){g.beginPath();g.ellipse(x,y,w,9,0,0,TAU);g.fill();}
  g.fillStyle='#0e1028';g.beginPath();g.moveTo(0,215);for(let x=0;x<=W;x+=24)g.lineTo(x,200+Math.sin(x*.03)*12+Math.sin(x*.11)*5);g.lineTo(W,260);g.lineTo(0,260);g.fill();
  g.fillStyle='#14143a';g.fillRect(0,236,W,30);

  g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=1;for(let y=266;y<SCN;y+=14){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  for(let i=0;i<14;i++){g.strokeStyle='rgba(255,220,160,.08)';g.beginPath();g.moveTo(R()*W,258+R()*80);g.lineTo(R()*W,258+R()*80);g.stroke();}
  g.fillStyle='#2a1608';g.fillRect(0,252,W,7);g.fillStyle='rgba(255,230,180,.12)';g.fillRect(0,252,W,2);

  g.fillStyle='#c8a060';g.fillRect(162,286,38,6);g.fillStyle='#a07a40';g.fillRect(168,292,26,14);g.fillStyle='#d8b070';g.fillRect(158,282,46,5);
  const dg=(x,y)=>{const gr=g.createRadialGradient(x-1.5,y-1.5,.5,x,y,5);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#e8e0cc');g.fillStyle=gr;g.beginPath();g.arc(x,y,5,0,TAU);g.fill();};
  for(let i=0;i<4;i++)dg(166+i*10,277);for(let i=0;i<3;i++)dg(171+i*10,269);for(let i=0;i<2;i++)dg(176+i*10,261);dg(181,253);
 }
 // 仮設トイレ
 const bx=300,by=132;g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(bx+22,by+94,30,6,0,0,TAU);g.fill();
 const bg2=g.createLinearGradient(bx,0,bx+44,0);bg2.addColorStop(0,'#2a7a4a');bg2.addColorStop(1,'#1a5a32');g.fillStyle=bg2;g.fillRect(bx,by+10,44,82);
 g.fillStyle='#e8e8e0';g.beginPath();g.moveTo(bx-3,by+12);g.quadraticCurveTo(bx+22,by-6,bx+47,by+12);g.closePath();g.fill();
 g.fillStyle='#1e6a3e';g.fillRect(bx+6,by+20,32,68);g.fillStyle='#fff';g.font='bold 9px sans-serif';g.textAlign='center';g.fillText('WC',bx+22,by+32);
 g.fillStyle='#ffd75e';g.beginPath();g.arc(bx+33,by+56,2,0,TAU);g.fill();
 g.textAlign='left';
 BG[stage]=c;return c;}

/* ================= 人物 ================= */
function drawDrinker(g,P,x,y,s,t,idx){
 if(P.toilet>0){g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x,y-4,36*s,9*s,0,0,TAU);g.fill();g.fillStyle=idx?'#9a3a5a':'#3a5aa0';g.beginPath();g.ellipse(x,y-8,30*s,9*s,0,0,TAU);g.fill();

 g.fillStyle=body2;g.beginPath();g.ellipse(0,-8,38,12,0,0,TAU);g.fill();
 g.rotate(sway);
 const tg=g.createLinearGradient(-22,0,22,0);tg.addColorStop(0,body2);tg.addColorStop(.5,body);tg.addColorStop(1,body2);g.fillStyle=tg;g.beginPath();g.moveTo(-26,-10);g.quadraticCurveTo(-28,-50,-16,-62);g.lineTo(16,-62);g.quadraticCurveTo(28,-50,26,-10);g.closePath();g.fill();

const ov=$('ov');function showOv(h){ov.className='';ov.innerHTML=h;}function hideOv(){ov.className='hidden';ov.innerHTML='';}

function queueAhead(P,other){return G.queue+(other.toilet>0?1:0);}
function aiChoose(P,O,smart){const q=queueAhead(P,O),nd=P.drunk+P.dBase;
 if(P.pee>=88)return 'wc';
 if(P.pee>=(smart?55:62)&&q<=(smart?1:2))return 'wc';
 if(P.pee>=72&&q<=3&&Math.random()<.5)return 'wc';
 if(nd>=97)return 'rest';
 const lead=O.cups-P.cups,risk=P.risk*(smart?.9:1);
 if(P.cups>=GOAL-1&&nd<100)return 'drink';
 if(koProb(nd)>.42*risk&&lead<5)return 'rest';
 if(P.drunk>=(smart?62:70)&&Math.random()<.65)return 'rest';
 return 'drink';}
function choose(){return new Promise(res=>{const P=G.p[0],O=G.p[1];
 if(P.toilet>0||P.ko){const why=P.toilet>0?(P.wait>0?`トイレの列に並んでいる（前に${P.wait}人）`:'用を足している'):'酔い潰れて動けない…';acts([{t:'次のターンへ<small>'+why+'</small>',c:'bNext',f:()=>res(P.toilet>0?'busy':'ko')}]);if(window.tgAuto)setTimeout(()=>res(P.toilet>0?'busy':'ko'),500/(window.__speed||1));return;}
 if(window.tgAuto){setTimeout(()=>res(aiChoose(P,O,true)),550/(window.__speed||1));acts([]);return;}
 const q=queueAhead(P,O);
 acts([{t:'飲む<small>1杯あおる</small>',c:'bDrink',f:()=>res('drink'),dis:P.forced},{t:'休憩<small>酔いをさます</small>',c:'bRest',f:()=>res('rest'),dis:P.forced},{t:`トイレ<small>待ち${q}人・${q+1}ターン</small>`,c:'bWc',f:()=>res('wc')}]);});}

async function turn(){const [A,B]=G.p;
 // ターン開始：酔い潰れ判定・限界

 for(let i=0;i<2;i++){const P=both[i];
  if(P.act==='drink'){drinkUp(P);say(P,['ゴクッ！','ぷはぁ〜！','もう1杯！','うまい！'][Math.floor(Math.random()*4)]);G.fx.push({txt:'+1杯',x:i?252:108,y:220,t:0,d:1.2,col:'#ffe066'});}
  else if(P.act==='rest'){P.drunk-=15;say(P,['ふぅ…','水ください','ちょっと休憩'][Math.floor(Math.random()*3)]);G.fx.push({txt:'酔い−15',x:i?252:108,y:220,t:0,d:1.2,col:'#8ad0ff'});}
  else if(P.act==='wc'){P.wait=G.queue+wcOrder+(busy0[1-i]?1:0);wcOrder++;P.toilet=P.wait+1;say(P,P.forced?'もう限界！':'ちょっとトイレ');snd('pick');G.fx.push({txt:`トイレへ（${P.toilet}ターン）`,x:i?252:108,y:220,t:0,d:1.4,col:'#9aff8a',size:14});}
  else if(P.act==='ko'){P.drunk-=8;}}

 const win=G.p.map(P=>P.cups>=GOAL),down=G.p.map(P=>P.drunk>=100);
 // 時間経過（トイレの列は1人1ターン、自分の用足しも1ターン）
 for(const P of G.p){if(P.toilet>0){P.drunk-=8;if(P.wait>0){P.wait--;P.toilet--;P.pee=clamp(P.pee+3,0,100);if(P.pee>=100)say(P,'は、早く…！');}else{P.toilet=0;P.pee=0;say(P,'すっきり！');snd('splash');}}

  let w=null,why='';

  display:inline-block;margin:0;padding:6px 12px;border-radius:999px;background:rgba(12,14,24,.72);color:#fff;cursor:pointer;
  font:700 13px/1.2 "Hiragino Sans","Yu Gothic",sans-serif;letter-spacing:0;border:1px solid rgba(255,255,255,.35);box-shadow:none;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-tap-highlight-color:transparent;transform:none}
.tg-snd[aria-pressed="false"]{color:rgba(255,255,255,.6)}
.tg-snd:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
<script>
/* ---------- 共通の効果音（Web Audioで合成） ---------- */
window.tgSound = (function(){
  var AC = null, noiseBuf = null, on = true, last = {};
  try { on = localStorage.getItem('tg_sound') !== '0'; } catch (e) {}
  function ctx(){
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, dur, type, vol, slide, delay){
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, vol, freq, delay, kind){
    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = 1;
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + .03);
  }
  function arp(fs, step, type, vol, dur){ fs.forEach(function(f, i){ tone(f, dur || .22, type, vol, 0, i * step); }); }
  var LIB = {
    click:  function(){ tone(900, .05, 'square', .03); },
    pick:   function(){ tone(660, .06, 'triangle', .07); tone(990, .08, 'triangle', .06, 0, .05); },
    unpick: function(){ tone(520, .08, 'triangle', .06, .7); },
    tick:   function(){ tone(1500 + Math.random() * 300, .025, 'square', .025); },
    land:   function(){ tone(784, .09, 'square', .05); tone(1175, .18, 'square', .05, 0, .07); },
    start:  function(){ arp([392, 523, 659], .09, 'square', .05, .18); },
    shot:   function(){ tone(1200, .07, 'square', .025, .45); },
    shotFoe:function(){ tone(700, .08, 'square', .02, .5); },
    slash:  function(){ noise(.12, .12, 2600, 0, 'highpass'); tone(500, .1, 'sawtooth', .03, .5); },
    dash:   function(){ noise(.2, .1, 800, 0, 'bandpass'); tone(200, .2, 'sine', .06, 2.2); },
    charge: function(){ tone(200, .7, 'sawtooth', .05, 4); },
    beam:   function(){ noise(.5, .2, 500, 0, 'lowpass'); tone(90, .5, 'sawtooth', .08, .5); },
    hit:    function(){ noise(.09, .14, 900, 0, 'lowpass'); tone(160, .08, 'square', .04, .6); },
    big:    function(){ noise(.3, .22, 400, 0, 'lowpass'); tone(110, .3, 'sawtooth', .07, .5); },
    heal:   function(){ arp([784, 988, 1319], .06, 'sine', .06, .2); },
    miss:   function(){ noise(.15, .06, 3000, 0, 'highpass'); },
    good:   function(){ arp([659, 784, 1047], .08, 'triangle', .07, .25); },
    bad:    function(){ tone(330, .25, 'triangle', .07, .75); tone(247, .35, 'triangle', .06, .8, .18); },
    win:    function(){ arp([523, 659, 784, 1047, 1319], .1, 'square', .045, .28); },
    lose:   function(){ arp([392, 330, 262, 196], .22, 'triangle', .08, .4); },
    splash: function(){ noise(.35, .18, 700, 0, 'lowpass'); noise(.2, .08, 2400, .05, 'bandpass'); },
    bubble: function(){ tone(250 + Math.random() * 250, .07, 'sine', .04, 1.8); },
    slurp:  function(){ noise(.5, .12, 1400, 0, 'bandpass'); noise(.3, .08, 900, .55, 'bandpass'); },
    coin:   function(){ tone(988, .06, 'square', .04); tone(1319, .14, 'square', .04, 0, .06); },
    summon: function(){ tone(130, 1, 'sawtooth', .05, 3); arp([523, 784, 1047, 1568], .12, 'sine', .07, .5); },
    evolve: function(){ arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], .07, 'triangle', .06, .3); },
    fuse:   function(){ tone(110, 1.1, 'sawtooth', .06, 2.5); noise(.9, .1, 300, .2, 'lowpass'); arp([659, 880, 1319], .12, 'sine', .07, .4); }
  };
  function play(name){
    if (!on || !LIB[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < 55) return;
    last[name] = now;
    if (!ctx()) return;
    try { LIB[name](); } catch (e) {}
  }
  var btn = document.querySelector('.tg-snd');
  function sync(){ if (btn) { btn.textContent = on ? '音：ON' : '音：OFF'; btn.setAttribute('aria-pressed', String(on)); } }
  if (btn) {
    ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ btn.addEventListener(t, function(e){ e.stopPropagation(); }); });
    btn.addEventListener('click', function(e){
      e.stopPropagation(); on = !on; sync(); btn.blur();
      try { localStorage.setItem('tg_sound', on ? '1' : '0'); } catch (err) {}
      if (on) { ctx(); play('pick'); }
    });
  }
  sync();
  // ブラウザは最初の操作まで音を出せないので、最初のタップで準備する
  window.addEventListener('pointerdown', function(){ if (on) ctx(); }, { once: true, capture: true });
  return { play: play };
})();
</script>
<style>
.tg-bar{position:fixed;z-index:2147483647;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;pointer-events:none}
.tg-bar>*{position:static!important;pointer-events:auto}
</style>
<script>
(function(){
  var bar=document.createElement('div'); bar.className='tg-bar'; document.body.appendChild(bar);
  document.querySelectorAll('.tg-back:not(.tg-inline),.tg-auto:not(.tg-inline),.tg-snd').forEach(function(el){ bar.appendChild(el); });
})();
</script>
<!-- tg-swipe-guard: スワイプでの更新・戻るを防ぐ -->
<style>html,body{overscroll-behavior:none}</style>
<script>
(function(){
  var GAME=!!document.querySelector('.tg-auto');
  var sx=0,sy=0;
  function scroller(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){var s=getComputedStyle(el).overflowY;if((s==='auto'||s==='scroll')&&el.scrollHeight>el.clientHeight)return el;}return null;}
  document.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;
    // 画面端からのスワイプ（戻る・進む）を止める
    if(sx<14||sx>innerWidth-14){e.preventDefault();}},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
})();
</script>
