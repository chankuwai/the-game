<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101218">
<title>共通コントローラー サンプル</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#101218;color:#e8ecf8;overflow:hidden;touch-action:none;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:calc(env(safe-area-inset-top) + 46px)}
h1{margin:0 0 6px;font-size:15px;letter-spacing:.1em;color:#9ab0ff}
#cv{display:block;border-radius:12px;box-shadow:0 0 0 2px #2a3050,0 8px 20px rgba(0,0,0,.6);background:#1a1e2e}
#info{width:calc(100% - 24px);max-width:460px;margin-top:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;font-size:11px;font-weight:bold}
#info div{background:#1c2030;border-radius:8px;padding:5px 2px;text-align:center;color:#7a86a8}
#info div.on{background:#3a4a8a;color:#fff}
#info b{display:block;font-size:13px;color:#fff}
#pad{flex:1;width:100%;max-width:520px;position:relative;margin-top:6px}
.back{position:fixed;z-index:9;top:calc(8px + env(safe-area-inset-top));left:8px;padding:6px 12px;border-radius:999px;background:rgba(12,14,24,.72);color:#fff;font:700 13px sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.35)}
</style>
</head>
<body>
<a class="back" href="index.html">← 一覧</a>
<div id="app">
 <h1>共通コントローラー サンプル</h1>
 <canvas id="cv"></canvas>
 <div id="info">
  <div id="iS">スティック<b>0, 0</b></div><div data-b="A">A<b>ジャンプ</b></div><div data-b="B">B<b>ダッシュ</b></div><div data-b="X">X<b>ショット</b></div>
  <div data-b="Y">Y<b>シールド</b></div><div data-b="L">L<b>色←</b></div><div data-b="R">R<b>色→</b></div><div id="iD">方向<b>-</b></div><div data-b="SELECT">SELECT<b>リセット</b></div><div data-b="START">START<b>ポーズ</b></div>
 </div>
 <div id="pad"></div>
</div>
<script src="tg-pad.js"></script>
<script>
const W=360,H=220;const cv=document.getElementById('cv'),g=cv.getContext('2d');const DPR=Math.min(devicePixelRatio||1,2.5);
function resize(){const w=Math.min(innerWidth-24,460);const s=w/W;cv.style.width=w+'px';cv.style.height=H*s+'px';cv.width=W*s*DPR;cv.height=H*s*DPR;g.setTransform(s*DPR,0,0,s*DPR,0,0);}
addEventListener('resize',resize);resize();
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
TGPad.mount('#pad',{labels:{A:'ジャンプ',B:'ダッシュ',X:'ショット',Y:'シールド',L:'色←',R:'色→'}});
let paused=false;
TGPad.on('START',d=>{if(d){paused=!paused;beep(paused?440:880,.12);}});
TGPad.on('SELECT',d=>{if(d){P.x=W/2;P.y=H/2;P.col=0;shots.length=0;beep(330,.12);}});
const COLS=['#ff6a5a','#ffc53a','#5ae07a','#4aa8ff','#c87aff'];
const P={x:W/2,y:H/2,z:0,vz:0,dir:0,col:0,dash:0,shield:false};const shots=[],fx=[];
let AC=null;function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gg=AC.createGain();o.type='square';o.frequency.value=f;gg.gain.setValueAtTime(.05,AC.currentTime);gg.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(gg);gg.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
TGPad.on('L',d=>{if(d){P.col=(P.col+COLS.length-1)%COLS.length;beep(660,.08);}});
TGPad.on('R',d=>{if(d){P.col=(P.col+1)%COLS.length;beep(880,.08);}});
let last=performance.now();
function frame(now){const dt=paused?0:Math.min(.05,(now-last)/1000);last=now;const s=TGPad.stick;if(paused)['A','B','X'].forEach(b=>TGPad.pressed(b));
 if(TGPad.pressed('A')&&P.z<=0){P.vz=260;beep(520,.1);}
 if(TGPad.pressed('B')&&P.dash<=0){P.dash=.25;beep(300,.12);for(let i=0;i<8;i++)fx.push({x:P.x,y:P.y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,l:.4,c:'#fff'});}
 if(TGPad.pressed('X')){shots.push({x:P.x+Math.cos(P.dir)*14,y:P.y+Math.sin(P.dir)*14,vx:Math.cos(P.dir)*320,vy:Math.sin(P.dir)*320,l:1.2});beep(1200,.05);}
 P.shield=TGPad.down('Y');
 const m=Math.hypot(s.x,s.y);if(m>.05)P.dir=Math.atan2(s.y,s.x);
 const sp=(P.dash>0?380:130)*(P.shield?.4:1);const mx=P.dash>0?Math.cos(P.dir):s.x,my=P.dash>0?Math.sin(P.dir):s.y;
 P.x=Math.max(14,Math.min(W-14,P.x+mx*sp*dt));P.y=Math.max(14,Math.min(H-14,P.y+my*sp*dt));P.dash-=dt;
 P.vz-=900*dt;P.z=Math.max(0,P.z+P.vz*dt);if(P.z<=0)P.vz=0;
 for(const b of shots){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(b.x<0||b.x>W||b.y<0||b.y>H){b.l=0;for(let i=0;i<6;i++)fx.push({x:b.x,y:b.y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,l:.3,c:COLS[P.col]});}}
 for(let i=shots.length-1;i>=0;i--)if(shots[i].l<=0)shots.splice(i,1);
 for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt;}for(let i=fx.length-1;i>=0;i--)if(fx[i].l<=0)fx.splice(i,1);
 // 描画
 g.fillStyle='#1a1e2e';g.fillRect(0,0,W,H);g.strokeStyle='rgba(120,140,220,.12)';g.lineWidth=1;for(let x=0;x<W;x+=20){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}for(let y=0;y<H;y+=20){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
 for(const b of shots){g.fillStyle=COLS[P.col];g.beginPath();g.arc(b.x,b.y,4,0,Math.PI*2);g.fill();}
 for(const f of fx){g.globalAlpha=Math.max(0,f.l*3);g.fillStyle=f.c;g.fillRect(f.x-1.5,f.y-1.5,3,3);}g.globalAlpha=1;
 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(P.x,P.y+10,12-P.z*.04,5,0,0,Math.PI*2);g.fill();
 const y=P.y-P.z*.12;const c=COLS[P.col];
 if(P.dash>0){g.globalAlpha=.3;g.fillStyle=c;g.beginPath();g.arc(P.x-Math.cos(P.dir)*14,y-Math.sin(P.dir)*14,12,0,Math.PI*2);g.fill();g.globalAlpha=1;}
 g.fillStyle=c;g.strokeStyle='#0c0e16';g.lineWidth=2.5;g.beginPath();g.arc(P.x,y,13,0,Math.PI*2);g.fill();g.stroke();
 g.fillStyle='#fff';const ex=Math.cos(P.dir)*5,ey=Math.sin(P.dir)*5;g.beginPath();g.arc(P.x+ex-3,y+ey-2,3.4,0,Math.PI*2);g.arc(P.x+ex+4,y+ey-2,3.4,0,Math.PI*2);g.fill();
 g.fillStyle='#111';g.beginPath();g.arc(P.x+ex*1.3-3,y+ey*1.3-2,1.6,0,Math.PI*2);g.arc(P.x+ex*1.3+4,y+ey*1.3-2,1.6,0,Math.PI*2);g.fill();
 if(P.shield){g.strokeStyle='rgba(90,224,122,.9)';g.lineWidth=3;g.beginPath();g.arc(P.x,y,20+Math.sin(now/80)*1.5,0,Math.PI*2);g.stroke();}
 if(paused){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.font='bold 24px sans-serif';g.textAlign='center';g.fillText('PAUSE',W/2,H/2+8);g.textAlign='left';}
 // 情報
 document.querySelector('#iS b').textContent=`${s.x.toFixed(1)}, ${s.y.toFixed(1)}`;
 const d=TGPad.dir8();document.querySelector('#iD b').textContent=d<0?'-':['→','↘','↓','↙','←','↖','↑','↗'][d];
 document.querySelectorAll('#info [data-b]').forEach(el=>el.classList.toggle('on',TGPad.down(el.dataset.b)));
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
