 addEventListener('tgauto',function(){if(window.tgAuto)window.__tgAutoEver=true;});

<script>
'use strict';
/* ================= 基本 ================= */
const W=360,H=470,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');const DPR=Math.min(window.devicePixelRatio||1,3);let SC=1;
function resize(){const aw=Math.min(innerWidth,480)-12,ah=innerHeight-46-130;SC=Math.max(.6,Math.min(aw/W,ah/H));cv.style.width=Math.round(W*SC)+'px';cv.style.height=Math.round(H*SC)+'px';cv.width=Math.round(W*SC*DPR);cv.height=Math.round(H*SC*DPR);}
addEventListener('resize',resize);resize();
const sleep=ms=>new Promise(r=>setTimeout(r,ms/(window.__speed||1)));
const snd=n=>{try{window.tgSound&&window.tgSound.play(n);}catch(e){}};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ================= 牌 ================= */
// 0-8 萬子, 9-17 筒子, 18-26 索子, 27-30 東南西北, 31 白 32 發 33 中
const KAN=['一','二','三','四','五','六','七','八','九'];
const HONOR=['東','南','西','北','白','發','中'];
const tname=t=>t<9?KAN[t]+'萬':t<18?(t-8)+'筒':t<27?(t-17)+'索':HONOR[t-27];
const isHonor=t=>t>=27,isTerm=t=>t<27&&(t%9===0||t%9===8),isYao=t=>isHonor(t)||isTerm(t);
const doraOf=i=>i<27?(i%9===8?i-8:i+1):i<31?(i===30?27:i+1):(i===33?31:i+1);
const TILE={};// キャッシュ
function tileImg(t,back){const k=back?'b':t;if(TILE[k])return TILE[k];const S=4,w=24,h=33;const c=document.createElement('canvas');c.width=w*S;c.height=h*S;const g=c.getContext('2d');g.scale(S,S);
 const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();};
 if(back){rr(0,0,w,h,3);const bg=g.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#e88a2a');bg.addColorStop(1,'#a8501a');g.fillStyle=bg;g.fill();g.strokeStyle='rgba(255,230,180,.5)';g.lineWidth=.6;rr(2.5,2.5,w-5,h-5,2);g.stroke();g.fillStyle='rgba(255,240,200,.25)';g.fillRect(3,3,w-6,3);TILE[k]=c;return c;}
 rr(0,0,w,h,3);g.fillStyle='#2f7a4a';g.fill();rr(0,0,w,h-2.5,3);const fg=g.createLinearGradient(0,0,0,h);fg.addColorStop(0,'#fffdf4');fg.addColorStop(1,'#e8dfc6');g.fillStyle=fg;g.fill();
 g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=.5;rr(.4,.4,w-.8,h-3,3);g.stroke();
 const cx=w/2,cy=(h-2.5)/2,FW=w-4,FH=h-6.5,ox=2,oy=2;
 const circ=(x,y,r,col)=>{g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.fillStyle='#fffdf4';g.beginPath();g.arc(x,y,r*.55,0,TAU);g.fill();g.fillStyle=col;g.beginPath();g.arc(x,y,r*.3,0,TAU);g.fill();};
 const stick=(x,y,col)=>{g.fillStyle=col;g.beginPath();g.ellipse(x,y,1.25,3.1,0,0,TAU);g.fill();g.fillStyle='rgba(255,255,255,.55)';g.fillRect(x-.3,y-2.4,.6,4.8);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x-1.2,y-.2,2.4,.45);};
 const L={1:[[.5,.5]],2:[[.5,.25],[.5,.75]],3:[[.22,.2],[.5,.5],[.78,.8]],4:[[.28,.25],[.72,.25],[.28,.75],[.72,.75]],5:[[.26,.22],[.74,.22],[.5,.5],[.26,.78],[.74,.78]],6:[[.3,.2],[.7,.2],[.3,.5],[.7,.5],[.3,.8],[.7,.8]],7:[[.2,.13],[.5,.23],[.8,.33],[.3,.58],[.7,.58],[.3,.84],[.7,.84]],8:[[.3,.14],[.7,.14],[.3,.38],[.7,.38],[.3,.62],[.7,.62],[.3,.86],[.7,.86]],9:[[.2,.18],[.5,.18],[.8,.18],[.2,.5],[.5,.5],[.8,.5],[.2,.82],[.5,.82],[.8,.82]]};
 if(t<9){g.textAlign='center';g.fillStyle='#1a1a1a';g.font='bold 10px "Hiragino Mincho ProN","Yu Mincho",serif';g.fillText(KAN[t],cx,13);g.fillStyle='#c81e1e';g.font='bold 11px "Hiragino Mincho ProN","Yu Mincho",serif';g.fillText('萬',cx,26);}
 else if(t<18){const n=t-8;if(n===1){circ(cx,cy,8.5,'#1a5ab0');g.fillStyle='#c81e1e';g.beginPath();g.arc(cx,cy,3,0,TAU);g.fill();}
  else{const cols=['#1a5ab0','#1a8a3a','#c81e1e'];L[n].forEach(([px,py],i)=>circ(ox+px*FW,oy+py*FH,n>=8?2.5:n>=5?3:3.6,n===5&&i===2?'#c81e1e':cols[(i+n)%3]));}}
 else if(t<27){const n=t-17;if(n===1){g.fillStyle='#1a8a3a';g.beginPath();g.ellipse(cx,cy+2,5,6.5,0,0,TAU);g.fill();g.fillStyle='#c81e1e';g.beginPath();g.arc(cx+1,cy-6,2.6,0,TAU);g.fill();g.fillStyle='#1a5ab0';g.beginPath();g.moveTo(cx-4,cy+6);g.lineTo(cx-9,cy+12);g.lineTo(cx-1,cy+9);g.fill();g.fillStyle='#ffd75e';g.beginPath();g.arc(cx+2,cy-6.5,.8,0,TAU);g.fill();}
  else L[n].forEach(([px,py],i)=>stick(ox+px*FW,oy+py*FH,(n===5&&i===2)||(n===7&&i===1)||(n===9&&i===4)?'#c81e1e':'#1a8a3a'));}
 else{g.textAlign='center';const h2=t-27;const col=h2<4?'#1a1a1a':h2===5?'#1a8a3a':h2===6?'#c81e1e':'#1a5ab0';
  if(h2===4){g.strokeStyle='#1a5ab0';g.lineWidth=1.2;rr(5,6,w-10,h-14.5,1.5);g.stroke();}
  else{g.fillStyle=col;g.font='bold 17px "Hiragino Mincho ProN","Yu Mincho",serif';g.fillText(HONOR[h2],cx,cy+6);}}
 TILE[k]=c;return c;}

/* ================= シャンテン・和了判定 ================= */
const SHC=new Map();
function counts(arr){const c=new Array(34).fill(0);for(const t of arr)c[t]++;return c;}
function shantenStd(c){let best=8;
 (function rec(i,m,t,p){if(best<=-1)return;while(i<34&&c[i]===0)i++;
  if(i>=34){const s=8-2*m-Math.min(t,4-m)-p;if(s<best)best=s;return;}
  if(c[i]>=3){c[i]-=3;rec(i,m+1,t,p);c[i]+=3;}
  if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;rec(i,m+1,t,p);c[i]++;c[i+1]++;c[i+2]++;}
  if(!p&&c[i]>=2){c[i]-=2;rec(i,m,t,1);c[i]+=2;}
  if(m+t<4){if(c[i]>=2){c[i]-=2;rec(i,m,t+1,p);c[i]+=2;}
   if(i<27&&i%9<=7&&c[i+1]){c[i]--;c[i+1]--;rec(i,m,t+1,p);c[i]++;c[i+1]++;}
   if(i<27&&i%9<=6&&c[i+2]){c[i]--;c[i+2]--;rec(i,m,t+1,p);c[i]++;c[i+2]++;}}
  const k=c[i];c[i]=0;rec(i+1,m,t,p);c[i]=k;})(0,0,0,0);
 return best;}
function shanten(c){const key=c.join('');let v=SHC.get(key);if(v!==undefined)return v;
 let pairs=0,kinds=0,yk=0,yp=0;for(let i=0;i<34;i++){if(c[i]){kinds++;if(c[i]>=2)pairs++;}if(isYao(i)&&c[i]){yk++;if(c[i]>=2)yp=1;}}
 const n=c.reduce((a,b)=>a+b,0);let s=shantenStd(c);
 if(n>=13){s=Math.min(s,6-pairs+Math.max(0,7-kinds),13-yk-yp);}
 if(SHC.size>60000)SHC.clear();SHC.set(key,s);return s;}
function decomps(c){const res=[];for(let p=0;p<34;p++){if(c[p]<2)continue;c[p]-=2;const ms=[];
  (function mrec(i){while(i<34&&!c[i])i++;if(i>=34){res.push({pair:p,ms:ms.slice()});return;}
   if(c[i]>=3){c[i]-=3;ms.push({k:'k',t:i});mrec(i);ms.pop();c[i]+=3;}
   if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;ms.push({k:'s',t:i});mrec(i);ms.pop();c[i]++;c[i+1]++;c[i+2]++;}})(0);
  c[p]+=2;}return res;}
/* 役判定（鳴きなし・門前のみ） ctx:{tsumo,riichi,seat,win,dora[],ura[]} */
function evalHand(c,ctx){
 const kinds=c.filter(x=>x).length;
 if(kinds===13&&[0,8,9,17,18,26,27,28,29,30,31,32,33].every(i=>c[i]))return {han:13,yaku:[['国士無双','役満']],yakuman:true};
 const cands=[];const base=[];if(ctx.riichi)base.push(['立直',1]);if(ctx.tsumo)base.push(['門前清自摸和',1]);
 const all=[];for(let i=0;i<34;i++)for(let k=0;k<c[i];k++)all.push(i);
 const tanyao=all.every(t=>!isYao(t));
 const suits=new Set(all.filter(t=>t<27).map(t=>Math.floor(t/9))),hasH=all.some(isHonor);
 const color=suits.size===1?(hasH?['混一色',3]:['清一色',6]):null;
 const yakuhai=t=>t>=31||t===ctx.seat||t===27;
 for(const d of decomps(c)){const y=base.slice();let yakuman=null;
  const kou=d.ms.filter(m=>m.k==='k'),shun=d.ms.filter(m=>m.k==='s');
  if(tanyao)y.push(['断幺九',1]);
  for(const m of kou){if(m.t>=31)y.push([HONOR[m.t-27]+'（役牌）',1]);if(m.t===27)y.push(['場風 東',1]);if(m.t===ctx.seat)y.push(['自風 '+HONOR[m.t-27],1]);}
  if(shun.length===4&&!yakuhai(d.pair)&&shun.some(s=>(ctx.win===s.t&&s.t%9<=5)||(ctx.win===s.t+2&&s.t%9>=1)))y.push(['平和',1]);
  const st=shun.map(s=>s.t).sort((a,b)=>a-b);let pe=0;for(let i=0;i<st.length-1;i++)if(st[i]===st[i+1]){pe++;i++;}
  if(pe===1)y.push(['一盃口',1]);if(pe===2)y.push(['二盃口',3]);
  for(let s=0;s<3;s++)if([0,3,6].every(o=>st.includes(s*9+o))){y.push(['一気通貫',2]);break;}
  for(let n=0;n<7;n++)if([0,9,18].every(o=>st.includes(n+o))){y.push(['三色同順',2]);break;}
  if(kou.length===4){y.push(['対々和',2]);if(ctx.tsumo||ctx.win===d.pair)yakuman=['四暗刻','役満'];}
  else if(kou.length===3)y.push(['三暗刻',2]);
  if([31,32,33].every(t=>kou.some(m=>m.t===t)))yakuman=['大三元','役満'];
  if(color)y.push(color);
  if(yakuman)cands.push({han:13,yaku:[yakuman],yakuman:true});else cands.push({han:y.reduce((a,b)=>a+b[1],0),yaku:y});}
 if(kinds===7&&c.every(x=>x===0||x===2)){const y=base.slice();y.push(['七対子',2]);if(tanyao)y.push(['断幺九',1]);if(color)y.push(color);cands.push({han:y.reduce((a,b)=>a+b[1],0),yaku:y});}
 if(!cands.length)return null;cands.sort((a,b)=>b.han-a.han);const r=cands[0];
 if(!r.yaku.length)return {han:0,yaku:[]};
 if(!r.yakuman){let d=0;for(const di of ctx.dora)d+=c[doraOf(di)];if(ctx.riichi)for(const ui of ctx.ura)d+=c[doraOf(ui)];if(d){r.yaku.push(['ドラ',d]);r.han+=d;}}
 return r;}
const PT=[0,1000,2000,3900,7700,8000,12000,12000,16000,16000,16000,24000,24000,32000],PTD=[0,1500,2900,5800,11600,12000,18000,18000,24000,24000,24000,36000,36000,48000];
const pointOf=(han,dealer)=>(dealer?PTD:PT)[Math.min(13,han)];
const limitName=h=>h>=13?'役満':h>=11?'三倍満':h>=8?'倍満':h>=6?'跳満':h>=5?'満貫':'';
const up100=v=>Math.ceil(v/100)*100;

/* ================= 卓の状態 ================= */
const NAMES=['あなた','竜二','マダム麗子','教授'];
const FACE=[null,{skin:'#e8b48a',hair:'#1a1a1a',style:'spike'},{skin:'#f2cda8',hair:'#7a2a4a',style:'curl'},{skin:'#e8c8a0',hair:'#9a9a9a',style:'bald'}];
let S=null;
function newGame(){S={pts:[25000,25000,25000,25000],hand:0,sticks:0,sus:0,caught:0,cheats:0,over:false};}
const seatWind=s=>27+((s-S.dealer+4)%4);
function unseen(t,s){let v=4;const H=S.hands[s];for(const x of H)if(x===t)v--;for(const r of S.river)for(const d of r)if(d.t===t)v--;if(S.doraInd===t)v--;return Math.max(0,v);}

/* ================= 描画 ================= */
let selIdx=-1,canTiles=null,bubbles=[],lastT=0;
function bubble(s,text){bubbles.push({s,text,life:2.6});}
function drawTile(g,t,x,y,w,h,rot,back,dim){g.save();g.translate(x+w/2,y+h/2);let tw=w,th=h;if(rot){g.rotate(rot);tw=h;th=w;}
 g.fillStyle='rgba(0,0,0,.35)';g.fillRect(-tw/2+1,-th/2+2,tw,th);g.drawImage(tileImg(t,back),-tw/2,-th/2,tw,th);if(dim){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(-tw/2,-th/2,tw,th);}g.restore();}
function drawFace(g,s,x,y,r){const f=FACE[s],sus=S?S.sus:0;g.save();g.translate(x,y);
 g.fillStyle=f.skin;g.beginPath();g.arc(0,0,r,0,TAU);g.fill();
 g.fillStyle=f.hair;if(f.style==='spike'){for(let i=-3;i<=3;i++){g.beginPath();g.moveTo(i*r*.3-3,-r*.6);g.lineTo(i*r*.3,-r*1.35);g.lineTo(i*r*.3+3,-r*.6);g.fill();}g.beginPath();g.arc(0,-r*.35,r*.95,Math.PI*1.05,-.05);g.fill();}
 else if(f.style==='curl'){for(let i=0;i<7;i++){const a=Math.PI+i/6*Math.PI;g.beginPath();g.arc(Math.cos(a)*r*.9,Math.sin(a)*r*.9,r*.38,0,TAU);g.fill();}}
 else{g.beginPath();g.arc(-r*.85,-r*.1,r*.3,0,TAU);g.arc(r*.85,-r*.1,r*.3,0,TAU);g.fill();g.strokeStyle='#333';g.lineWidth=1;g.beginPath();g.arc(-r*.35,0,r*.25,0,TAU);g.moveTo(r*.6,0);g.arc(r*.35,0,r*.25,0,TAU);g.stroke();}
 const k=sus/100;g.strokeStyle='#1a1a1a';g.lineWidth=1.3;
 for(const sd of [-1,1]){g.beginPath();g.moveTo(sd*r*.55,-r*.32-k*2);g.lineTo(sd*r*.15,-r*.25+k*3);g.stroke();
  g.fillStyle='#1a1a1a';g.beginPath();g.ellipse(sd*r*.35,0,r*.12,r*.16*(1-k*.7)+.4,0,0,TAU);g.fill();}
 g.beginPath();if(k>.6){g.moveTo(-r*.3,r*.5);g.lineTo(r*.3,r*.45);}else g.arc(0,r*.25,r*.3,.2,Math.PI-.2);g.stroke();
 if(k>.85){g.fillStyle='rgba(255,60,60,.5)';g.beginPath();g.arc(r*.7,-r*.8,r*.35,0,TAU);g.fill();}

 if(from!==null){pay[from]=tot;}else{if(dealer){for(let s=0;s<4;s++)if(s!==w)pay[s]=up100(tot/3);}else{for(let s=0;s<4;s++)if(s!==w)pay[s]=s===S.dealer?up100(tot/2):up100(tot/4);}}
 let gain=S.sticks*1000;for(const s in pay){S.pts[s]-=pay[s];gain+=pay[s];}S.pts[w]+=gain;S.sticks=0;
 if(w===0&&!S.cheatedHand)S.sus=Math.max(0,S.sus-8);
 const nm=w?NAMES[w]:'あなた';const lim=limitName(ev.han);
 bubble(w,from===null?'ツモ！':'ロン！');await sleep(600);
 await new Promise(res=>{showOv(`<div class="box"><h2>${nm}の${from===null?'ツモ':'ロン'}和了り</h2>${from!==null?`<p>放銃：${from?NAMES[from]:'あなた'}</p>`:''}<div class="tiles" id="ah"></div><div class="yaku">${ev.yaku.map(y=>`${y[0]}　${typeof y[1]==='number'?y[1]+'翻':y[1]}`).join('<br>')}</div><div class="big">${ev.yakuman?'役満 ':''+ev.han+'翻 '}${lim&&!ev.yakuman?lim+' ':''}${tot}点</div>${pointsTable()}<button class="bb" id="nx">次へ</button></div>`);
  handTilesHtml(w).forEach(t=>$('ah').appendChild(tileCanvas(t,22)));$('nx').onclick=()=>{hideOv();res();};if(window.tgAuto)setTimeout(()=>{if($('nx'))$('nx').click();},1800/(window.__speed||1));});
 return 'end';}
function pointsTable(){return [0,1,2,3].map(s=>`<div class="row"><span>${s?NAMES[s]:'あなた'}</span><span>${S.pts[s]}</span></div>`).join('');}
async function ryukyoku(){S.handOver=true;if(!S.cheatedHand)S.sus=Math.max(0,S.sus-8);snd('lose');
 await new Promise(res=>{showOv(`<div class="box"><h2>流局</h2><p>山がなくなった。</p>${pointsTable()}<button class="bb" id="nx">次へ</button></div>`);$('nx').onclick=()=>{hideOv();res();};if(window.tgAuto)setTimeout(()=>{if($('nx'))$('nx').click();},1500/(window.__speed||1));});return 'end';}

/* ================= ゲーム全体 ================= */
async function runGame(){newGame();
 for(S.hand=0;S.hand<4;S.hand++){const r=await playHand();if(r==='caught'||S.pts.some(p=>p<0))break;}
 S.over=true;const order=[0,1,2,3].sort((a,b)=>S.pts[b]-S.pts[a]);const rank=order.indexOf(0)+1;
 const bust=S.pts[0]<0;snd(rank===1&&!bust?'win':'lose');if(rank===1&&!bust&&window.tgClear)tgClear('mahjong');
 const title=bust?(S.caught?'出入り禁止…':'飛んでしまった…'):rank===1?'トップ！ 大勝ちよ':rank===2?'2着。悪くないわ':rank===3?'3着…':'ラス…';
 showOv(`<div class="box"><h2>${title}</h2><p>最終結果</p>${order.map((s,i)=>`<div class="row"><span>${i+1}位　${s?NAMES[s]:'あなた'}</span><span>${S.pts[s]}</span></div>`).join('')}<p style="margin-top:10px">イカサマ ${S.cheats}回 ／ バレた回数 ${S.caught}回<br>${S.cheats===0?'一度もイカサマしなかった。真剣勝負ね。':S.caught===0?'一度もバレずにやり遂げた。悪い人ね。':'バレても懲りないのね…'}</p><button class="bb" id="again">もう一局</button><button class="bb" id="home">一覧へ</button></div>`);
 $('again').onclick=()=>{hideOv();runGame();};$('home').onclick=()=>{location.href='index.html';};}
function title(){S=null;msg('');acts([]);
 showOv(`<div class="box" style="text-align:center"><div class="ttl">イカサマ雀荘</div><p style="margin-top:8px">4人打ち・東風戦（鳴きなし）</p><p>イカサマで勝ちを拾え。<br>ただし使うほど相手の<b style="color:#ff9ad0">怪しみゲージ</b>が溜まり、<br>100%でバレて罰符。真剣に打てば少しずつ下がる。</p><button class="bb" id="go" style="font-size:18px">卓につく</button></div>`);
 $('go').onclick=()=>{snd('start');hideOv();runGame();};if(window.tgAuto)setTimeout(()=>{if($('go'))$('go').click();},800);}
window.addEventListener('tgauto',()=>{if(window.tgAuto&&$('go'))$('go').click();if(window.tgAuto&&tapResolve){const f=tapResolve;tapResolve=null;acts([]);canTiles=null;f(S.riichi[0]?S.hands[0].length-1:bestDiscard(0).i);}});
title();
</script>

<script>
/* ---------- 共通の効果音（Web Audioで合成） ---------- */
window.tgSound = (function(){
  var AC = null, noiseBuf = null, on = true, last = {};
  try { on = localStorage.getItem('tg_sound') !== '0'; } catch (e) {}
  function ctx(){
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, dur, type, vol, slide, delay){
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, vol, freq, delay, kind){
    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = 1;
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + .03);
  }
  function arp(fs, step, type, vol, dur){ fs.forEach(function(f, i){ tone(f, dur || .22, type, vol, 0, i * step); }); }
  var LIB = {
    click:  function(){ tone(900, .05, 'square', .03); },
    pick:   function(){ tone(660, .06, 'triangle', .07); tone(990, .08, 'triangle', .06, 0, .05); },
    unpick: function(){ tone(520, .08, 'triangle', .06, .7); },
    tick:   function(){ tone(1500 + Math.random() * 300, .025, 'square', .025); },
    land:   function(){ tone(784, .09, 'square', .05); tone(1175, .18, 'square', .05, 0, .07); },
    start:  function(){ arp([392, 523, 659], .09, 'square', .05, .18); },
    shot:   function(){ tone(1200, .07, 'square', .025, .45); },
    shotFoe:function(){ tone(700, .08, 'square', .02, .5); },
    slash:  function(){ noise(.12, .12, 2600, 0, 'highpass'); tone(500, .1, 'sawtooth', .03, .5); },
    dash:   function(){ noise(.2, .1, 800, 0, 'bandpass'); tone(200, .2, 'sine', .06, 2.2); },
    charge: function(){ tone(200, .7, 'sawtooth', .05, 4); },
    beam:   function(){ noise(.5, .2, 500, 0, 'lowpass'); tone(90, .5, 'sawtooth', .08, .5); },
    hit:    function(){ noise(.09, .14, 900, 0, 'lowpass'); tone(160, .08, 'square', .04, .6); },
    big:    function(){ noise(.3, .22, 400, 0, 'lowpass'); tone(110, .3, 'sawtooth', .07, .5); },
    heal:   function(){ arp([784, 988, 1319], .06, 'sine', .06, .2); },
    miss:   function(){ noise(.15, .06, 3000, 0, 'highpass'); },
    good:   function(){ arp([659, 784, 1047], .08, 'triangle', .07, .25); },
    bad:    function(){ tone(330, .25, 'triangle', .07, .75); tone(247, .35, 'triangle', .06, .8, .18); },
    win:    function(){ arp([523, 659, 784, 1047, 1319], .1, 'square', .045, .28); },
    lose:   function(){ arp([392, 330, 262, 196], .22, 'triangle', .08, .4); },
    splash: function(){ noise(.35, .18, 700, 0, 'lowpass'); noise(.2, .08, 2400, .05, 'bandpass'); },
    bubble: function(){ tone(250 + Math.random() * 250, .07, 'sine', .04, 1.8); },
    slurp:  function(){ noise(.5, .12, 1400, 0, 'bandpass'); noise(.3, .08, 900, .55, 'bandpass'); },
    coin:   function(){ tone(988, .06, 'square', .04); tone(1319, .14, 'square', .04, 0, .06); },
    summon: function(){ tone(130, 1, 'sawtooth', .05, 3); arp([523, 784, 1047, 1568], .12, 'sine', .07, .5); },
    evolve: function(){ arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], .07, 'triangle', .06, .3); },
    fuse:   function(){ tone(110, 1.1, 'sawtooth', .06, 2.5); noise(.9, .1, 300, .2, 'lowpass'); arp([659, 880, 1319], .12, 'sine', .07, .4); }
  };
  function play(name){
    if (!on || !LIB[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < 55) return;
    last[name] = now;
    if (!ctx()) return;
    try { LIB[name](); } catch (e) {}
  }
  var btn = document.querySelector('.tg-snd');
  function sync(){ if (btn) { btn.textContent = on ? '音：ON' : '音：OFF'; btn.setAttribute('aria-pressed', String(on)); } }
  if (btn) {
    ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ btn.addEventListener(t, function(e){ e.stopPropagation(); }); });
    btn.addEventListener('click', function(e){
      e.stopPropagation(); on = !on; sync(); btn.blur();
      try { localStorage.setItem('tg_sound', on ? '1' : '0'); } catch (err) {}
      if (on) { ctx(); play('pick'); }
    });
  }
  sync();
  // ブラウザは最初の操作まで音を出せないので、最初のタップで準備する
  window.addEventListener('pointerdown', function(){ if (on) ctx(); }, { once: true, capture: true });
  return { play: play };
})();
</script>

<style>html,body{overscroll-behavior:none}</style>
<script>
(function(){
  var GAME=!!document.querySelector('.tg-auto');
  var sx=0,sy=0;
  function scroller(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){var s=getComputedStyle(el).overflowY;if((s==='auto'||s==='scroll')&&el.scrollHeight>el.clientHeight)return el;}return null;}
  document.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;
    // 画面端からのスワイプ（戻る・進む）を止める
    if(sx<14||sx>innerWidth-14){e.preventDefault();}},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
})();
</script>
