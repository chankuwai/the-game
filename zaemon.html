<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>てやんでえ！ザエモン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 夜の江戸を横に駆けるキャンバス1枚＋下に指で押す操作ボタン */
:root{
  --night:#0c0b17; --ink:#f1e9d8; --shu:#d7322a; --kin:#e8b73a; --ai:#27315a; --muted:#8e88a6; --line:#2e2946;
  --disp:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;flex-direction:column;gap:12px}
canvas{display:block;width:min(100%, calc((100dvh - 170px) * 16 / 9));max-width:100%;aspect-ratio:16/9;margin-inline:auto;border-radius:6px;background:#000;outline:1px solid var(--line);touch-action:none}
.pad{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;max-width:560px;margin-inline:auto}
.grp{display:flex;gap:10px}
.pad button{width:60px;height:60px;border-radius:50%;border:2px solid #3a3456;background:#1a1730;color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pad button.on{background:var(--ai);border-color:var(--kin)}
.pad #bThrow{background:#3a1515;border-color:var(--shu)}
.pad #bThrow.on{background:var(--shu);border-color:var(--kin)}
.pad #bMelee{background:#3a2c0e;border-color:var(--kin)}
.pad #bMelee.on{background:#8a6414}
.pad button:focus-visible{outline:2px solid var(--kin);outline-offset:3px}
.hint{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.04em}
@media (hover:hover) and (pointer:fine){ .pad{display:none} }
</style>
<style>*{box-sizing:border-box}body{margin:0}</style>
<script>/* tg-common: クリア記録・最近遊んだゲーム */
(function(){var id=(location.pathname.split('/').pop()||'').replace(/\.html$/,'');window.__tgAutoEver=false;
 addEventListener('tgauto',function(){if(window.tgAuto)window.__tgAutoEver=true;});
 window.tgClear=function(gid,info){try{if(window.tgAuto||window.tgAutoUsed||window.__tgAutoEver)return;gid=gid||id;var o=JSON.parse(localStorage.getItem('tg_clear')||'{}');var r=o[gid]||{n:0};r.n=(r.n||0)+1;r.t=Date.now();if(info)r.info=info;o[gid]=r;localStorage.setItem('tg_clear',JSON.stringify(o));}catch(e){}};
 try{var a=JSON.parse(localStorage.getItem('tg_recent')||'[]').filter(function(x){return x.id!==id;});a.unshift({id:id,t:Date.now()});localStorage.setItem('tg_recent',JSON.stringify(a.slice(0,10)));}catch(e){}})();
</script>
</head>
<body>


<div id="wrap">
  <canvas id="cv" width="960" height="540" aria-label="てやんでえ！ザエモン ゲーム画面"></canvas>
  <div class="pad">
    <div class="grp">
      <button id="bL" data-k="left" aria-label="左へ">◀</button>
      <button id="bR" data-k="right" aria-label="右へ">▶</button>
    </div>
    <div class="grp">
      <button id="bJump" data-k="jump" aria-label="ジャンプ">跳ぶ</button>
      <button id="bThrow" data-k="throw" aria-label="小判を投げる">投げ</button>
      <button id="bMelee" data-k="melee" aria-label="煙管で叩く">叩く</button>
    </div>
  </div>
  <p class="hint">キーボード：← → 移動 ／ X・スペース ジャンプ ／ Z 小判投げ ／ C 煙管で叩く ／ Enter 開始</p>
</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=480,H=270,GY=232,END=5300;
const DISP='"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif';
const BODY='"Zen Kaku Gothic New","Hiragino Sans",sans-serif';
try{document.fonts.load('20px "Dela Gothic One"');document.fonts.load('700 12px "Zen Kaku Gothic New"');}catch(e){}

/* ---------- 入力 ---------- */
const keys={left:false,right:false,jump:false,throw:false,melee:false};
let jumpBuf=0, meleeBuf=0, anyPress=false;
function press(k,v){ if(v&&!keys[k]){ if(k==='jump') jumpBuf=8; if(k==='melee') meleeBuf=6; anyPress=true; initAudio(); } keys[k]=v; }
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyX:'jump',KeyZ:'throw',KeyJ:'throw',KeyC:'melee',KeyK:'melee',Enter:'start'};
addEventListener('keydown',e=>{const k=KM[e.code]; if(!k) return; e.preventDefault();
  if(k==='start'){anyPress=true;initAudio();return;}
  if(!e.repeat) press(k,true); else keys[k]=true;});
addEventListener('keyup',e=>{const k=KM[e.code]; if(k&&k!=='start') press(k,false);});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault(); try{b.setPointerCapture(e.pointerId);}catch(_){} b.classList.add('on'); press(k,true);});
  const off=()=>{b.classList.remove('on'); press(k,false);};
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
cv.addEventListener('pointerdown',()=>{anyPress=true;initAudio();});
addEventListener('blur',()=>{for(const k in keys) keys[k]=false;});

/* ---------- 音 ---------- */
let ac=null;
function initAudio(){ if(ac) return; try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
function tone(f,d,type='square',v=0.06,slide=0,delay=0){
  if(!ac) return; try{
  const t=ac.currentTime+delay, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.03);}catch(e){}
}
let coinSfxT=0;
const SFX={
  throw:()=>tone(1400,0.07,'square',0.03,-700),
  swing:()=>{tone(700,0.1,'sawtooth',0.025,-450); tone(180,0.08,'triangle',0.05,-60,0.04);},
  coin:()=>{ if(S&&S.t-coinSfxT<4) return; coinSfxT=S?S.t:0; tone(988,0.05,'square',0.035); tone(1319,0.1,'square',0.035,0,0.05); },
  jump:()=>tone(300,0.14,'triangle',0.08,420),
  hit:()=>tone(200,0.18,'sawtooth',0.06,-120),
  tick:()=>tone(620,0.05,'square',0.03),
  hurt:()=>tone(230,0.35,'sawtooth',0.08,-170),
  boss:()=>{tone(110,0.5,'sawtooth',0.09,-50); tone(82,0.6,'sawtooth',0.07,-30,0.15);},
  clear:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.26,'square',0.05,0,i*0.11)),
  over:()=>[392,330,262,196].forEach((f,i)=>tone(f,0.35,'triangle',0.08,0,i*0.24))
};

/* ---------- ステージ ---------- */
const PLAT=[[380,185,110],[560,155,90],[900,182,140],[1150,152,100],[1310,122,90],[1650,185,120],[1850,158,120],[2100,128,100],[2450,182,160],[2700,152,100],[2920,182,120],[3250,160,140],[3500,130,100],[3720,172,120],[4020,185,140],[4270,152,100]];
const ENE=[['o',520],['o',780],['o',1020],['t',1240],['o',1420],['o',1720],['t',1960],['o',2040],['o',2320],['o',2600],['t',2820],['o',3050],['o',3320],['t',3460],['o',3640],['o',3900],['t',4120],['o',4380],['b',4840]];
let S=null;
function mkEnemy(k,x){
  const b=k==='b', h=b?46:28, w=b?26:16, hp=k==='o'?1:k==='t'?2:12;
  return {k,x,y:GY-h,w,h,hp,max:hp,face:-1,t:(Math.random()*90)|0,flash:0,dead:false,intro:false,walk:0,vy:0,rot:0};
}
function reset(){
  S={t:0,camX:0,shake:0,msg:'いざ、千両箱へ！',msgT:150,score:0,
    p:{x:60,y:GY-32,w:16,h:32,vx:0,vy:0,face:1,on:true,inv:0,life:3,ammo:20,cd:0,thr:0,walk:0,mel:0,mcd:0,swing:0},
    plats:PLAT.map(a=>({x:a[0],y:a[1],w:a[2]})),
    enemies:ENE.map(([k,x])=>mkEnemy(k,x)),
    coins:[],shots:[],foes:[],parts:[],chest:null};
  S.plats.forEach(pl=>{for(let cx=pl.x+14;cx<pl.x+pl.w-8;cx+=22) S.coins.push({x:cx,y:pl.y-16,fixed:true});});
  for(let x=250;x<4600;x+=190) S.coins.push({x,y:GY-42,fixed:true});
}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function spark(x,y,c,n){for(let i=0;i<n;i++)S.parts.push({x,y,vx:(Math.random()-0.5)*4,vy:-Math.random()*3,life:24,c});}
function popText(x,y,txt){S.parts.push({x,y,vx:0,vy:-0.6,life:50,txt});}

function hurtEnemy(e,dmg=1){
  e.hp-=dmg; e.flash=8; spark(e.x+e.w/2,e.y+e.h/3,'#f5d36b',5);
  if(e.hp>0){SFX.tick();return;}
  e.dead=true; e.vy=-4; SFX.hit();
  const pts=e.k==='b'?1000:e.k==='t'?200:100; S.score+=pts; popText(e.x+e.w/2,e.y-4,'+'+pts);
  const n=e.k==='b'?8:2;
  for(let i=0;i<n;i++) S.coins.push({x:e.x+e.w/2,y:e.y+8,vx:(Math.random()-0.5)*3.2,vy:-3-Math.random()*2.5,fixed:false});
  if(e.k==='b'){ S.shake=22; S.chest={x:5040,y:-40,w:30,h:22,vy:0,land:false}; S.msg='千両箱が降ってきた！'; S.msgT=160; SFX.boss(); }
}
function hurtPlayer(){
  const p=S.p; if(p.inv>0) return;
  p.life--; p.inv=100; S.shake=10; p.vy=-4; SFX.hurt();
  if(p.life<=0){ state='over'; stT=0; SFX.over(); }
}
function throwJitte(e,dx,vy){
  const sp=Math.min(3.6,Math.abs(dx)/45+1.3);
  S.foes.push({x:e.x+e.w/2,y:e.y+10,vx:Math.sign(dx||1)*sp,vy,life:170,rot:0});
}

function update(){
  S.t++; const p=S.p;
  if(S.shake>0)S.shake--; if(S.msgT>0)S.msgT--;
  const ax=(keys.right?1:0)-(keys.left?1:0);
  p.vx=ax*2.5; if(ax) p.face=ax;
  if(jumpBuf>0) jumpBuf--;
  if(jumpBuf>0&&p.on){p.vy=-8.6;p.on=false;jumpBuf=0;SFX.jump();}
  p.vy=Math.min(p.vy+0.42,9);
  p.x=Math.max(0,Math.min(END-p.w,p.x+p.vx));
  const pb=p.y+p.h; p.y+=p.vy; p.on=false;
  if(p.y+p.h>=GY){p.y=GY-p.h;p.vy=0;p.on=true;}
  else if(p.vy>=0){
    for(const pl of S.plats){ if(p.x+p.w>pl.x+2&&p.x<pl.x+pl.w-2&&pb<=pl.y+0.5&&p.y+p.h>=pl.y){p.y=pl.y-p.h;p.vy=0;p.on=true;break;} }
  }
  if(ax&&p.on) p.walk+=0.3;
  if(p.inv>0)p.inv--; if(p.cd>0)p.cd--; if(p.thr>0)p.thr--;
  if(keys.throw&&p.cd===0){
    if(p.ammo>0){ p.ammo--; p.cd=13; p.thr=10;
      S.shots.push({x:p.x+p.w/2+p.face*10,y:p.y+14,vx:p.face*6.2+p.vx*0.3,vy:-1.4,life:75,spin:0}); SFX.throw(); }
    else { p.cd=40; S.msg='小判切れだ！拾え！'; S.msgT=70; }
  }
  // 煙管で叩く
  if(meleeBuf>0) meleeBuf--;
  if(p.mcd>0) p.mcd--;
  if(meleeBuf>0&&p.mel===0&&p.mcd===0){ p.mel=16; p.mcd=22; p.swing++; meleeBuf=0; SFX.swing(); }
  if(p.mel>0){
    p.mel--; const k=1-p.mel/16;
    if(k>0.25&&k<0.8){
      const hb={x:p.face>0?p.x+p.w/2:p.x+p.w/2-30,y:p.y-2,w:30,h:32};
      for(const e of S.enemies){ if(!e.dead&&e.hitSwing!==p.swing&&overlap(hb,e)){ e.hitSwing=p.swing; hurtEnemy(e,2); if(e.k!=='b') e.x+=p.face*8; S.shake=Math.max(S.shake,4); } }
      for(const f of S.foes){ if(f.life>0&&f.x>hb.x&&f.x<hb.x+hb.w&&f.y>hb.y&&f.y<hb.y+hb.h){ f.life=0; spark(f.x,f.y,'#cfd3dc',6); S.score+=20; popText(f.x,f.y-6,'+20'); SFX.tick(); } }
    }
  }
  const tx=Math.max(0,Math.min(END-W,p.x-W*0.36));
  S.camX+=(tx-S.camX)*0.15;

  // 小判（投げたもの）
  for(const s of S.shots){
    s.x+=s.vx; s.y+=s.vy; s.vy+=0.06; s.life--; s.spin+=0.45;
    for(const e of S.enemies){ if(e.dead) continue;
      if(s.x>e.x-3&&s.x<e.x+e.w+3&&s.y>e.y-2&&s.y<e.y+e.h){ s.life=0; hurtEnemy(e); break; } }
    for(const f of S.foes){ if(f.life>0&&Math.abs(f.x-s.x)<8&&Math.abs(f.y-s.y)<8){ f.life=0; s.life=0; spark(s.x,s.y,'#cfd3dc',4); SFX.tick(); } }
    if(s.y>GY) s.life=0;
  }
  S.shots=S.shots.filter(s=>s.life>0);

  // 敵
  for(const e of S.enemies){
    if(e.dead){ if(e.y<H+60){ e.y+=e.vy; e.vy+=0.35; e.x-=e.face*1.4; e.rot+=0.22; } continue; }
    if(e.x<S.camX-120||e.x>S.camX+W+160) continue;
    e.t++; if(e.flash>0)e.flash--;
    const dx=(p.x+p.w/2)-(e.x+e.w/2); e.face=dx<0?-1:1;
    if(e.k==='o'){ if(Math.abs(dx)<300){ e.x+=e.face*0.75; e.walk+=0.22; } }
    else if(e.k==='t'){ if(Math.abs(dx)<290&&e.t%105===0) throwJitte(e,dx,-3); }
    else if(Math.abs(dx)<380){
      if(!e.intro){ e.intro=true; S.msg='与力 見参！'; S.msgT=120; S.shake=12; SFX.boss(); }
      e.x+=Math.sin(e.t*0.025)*1.4; e.x=Math.max(4660,Math.min(4990,e.x)); e.walk+=0.16;
      const rate=e.hp<6?55:80;
      if(e.t%rate===0){ throwJitte(e,dx,-3.2); if(e.hp<6) throwJitte(e,dx,-5.2); }
    }
    if(overlap(p,e)){
      if(p.vy>0&&(p.y+p.h-p.vy)<=e.y+8){ p.vy=-6.5; hurtEnemy(e); }
      else hurtPlayer();
    }
  }
  // 敵の十手
  for(const f of S.foes){
    f.x+=f.vx; f.y+=f.vy; f.vy+=0.12; f.rot+=0.3; f.life--;
    if(f.x>p.x-2&&f.x<p.x+p.w+2&&f.y>p.y&&f.y<p.y+p.h){ f.life=0; hurtPlayer(); }
    if(f.y>GY) f.life=0;
  }
  S.foes=S.foes.filter(f=>f.life>0);

  // 小判（拾うもの）
  for(const c of S.coins){
    if(!c.fixed){
      c.vy+=0.3; c.x+=c.vx; c.y+=c.vy; c.vx*=0.97;
      if(c.y>=GY-8){c.y=GY-8;c.vy=0;c.vx=0;c.fixed=true;}
    }
    if(c.x>p.x-4&&c.x<p.x+p.w+4&&c.y>p.y-6&&c.y<p.y+p.h+4&&(c.fixed||c.vy>0)){
      c.got=true; p.ammo=Math.min(99,p.ammo+1); S.score+=10; SFX.coin();
    }
  }
  S.coins=S.coins.filter(c=>!c.got);

  // 千両箱
  const ch=S.chest;
  if(ch){
    if(!ch.land){ ch.vy+=0.4; ch.y+=ch.vy; if(ch.y+ch.h>=GY){ ch.y=GY-ch.h; ch.land=true; S.shake=8; SFX.hit(); } }
    else if(overlap(p,ch)){ S.score+=1000; state='clear'; stT=0; SFX.clear();if(window.tgClear)tgClear('zaemon'); }
  }

  for(const q of S.parts){ q.x+=q.vx; q.y+=q.vy; if(!q.txt) q.vy+=0.15; q.life--; }
  S.parts=S.parts.filter(q=>q.life>0);
}

/* ---------- 描画ヘルパ ---------- */
function hash(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);}
const STARS=Array.from({length:70},(_,i)=>({x:hash(i*7.3)*W,y:hash(i*3.7+1)*150,r:hash(i*1.3+2)*1.1+0.3,tw:hash(i*9.1)*6}));
function otext(s,x,y,font,fill,stroke,lw=4,align='center'){
  ctx.font=font; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.lineJoin='round';
  if(stroke){ctx.lineWidth=lw; ctx.strokeStyle=stroke; ctx.strokeText(s,x,y);}
  ctx.fillStyle=fill; ctx.fillText(s,x,y);
}
function drawKoban(x,y,sx){
  ctx.save(); ctx.translate(x,y); ctx.scale(Math.max(0.18,sx),1);
  ctx.beginPath(); ctx.ellipse(0,0,4.2,5.6,0,0,Math.PI*2);
  ctx.fillStyle='#e8b73a'; ctx.fill(); ctx.lineWidth=1; ctx.strokeStyle='#7d4f0c'; ctx.stroke();
  ctx.strokeStyle='#b5821c'; ctx.beginPath(); ctx.moveTo(-1.5,-3.5); ctx.lineTo(-1.5,3.5); ctx.moveTo(1.5,-3.5); ctx.lineTo(1.5,3.5); ctx.stroke();
  ctx.fillStyle='#fff4b8'; ctx.fillRect(-3,-3.5,1,2);
  ctx.restore();
}
function drawKiseru(x1,y1,a,len){
  const c=Math.cos(a), s=Math.sin(a), x2=x1+c*len, y2=y1+s*len;
  ctx.lineCap='round';
  ctx.strokeStyle='#5a2f16'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.strokeStyle='#f0c64a'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(x1-c*1,y1-s*1); ctx.lineTo(x1+c*3,y1+s*3); ctx.moveTo(x2-c*4,y2-s*4); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.fillStyle='#f0c64a'; ctx.beginPath(); ctx.arc(x2+c*0.5,y2+s*0.5,1.8,0,Math.PI*2); ctx.fill();
  ctx.lineCap='butt';
}
function manePath(sw){
  ctx.beginPath(); ctx.moveTo(3,-3);
  ctx.quadraticCurveTo(-8,-8,-15,6+sw*0.5);
  ctx.quadraticCurveTo(-18,14,-20,23+sw);
  ctx.lineTo(-15,18+sw*0.7); ctx.lineTo(-16,28+sw); ctx.lineTo(-11,20+sw*0.5);
  ctx.lineTo(-10,26+sw*0.6); ctx.lineTo(-6,16); ctx.lineTo(-4,7); ctx.lineTo(2,2); ctx.closePath();
}
function drawZaemon(x,y,face,walk,thr,mel,t,big=1,blink=false){
  if(blink) return;
  ctx.save(); ctx.translate(x,y); ctx.scale(face*big,big);
  const sw=Math.sin(t*0.12)*2, lg=Math.sin(walk)*3;
  // 帯の房
  ctx.strokeStyle='#d7322a'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-6,20); ctx.quadraticCurveTo(-10,23,-9+sw*0.6,29); ctx.stroke();
  ctx.fillStyle='#e8b73a'; ctx.fillRect(-10+sw*0.6,28,2,2);
  // 赤い連獅子のたてがみ（三層）
  ctx.save(); ctx.translate(-1.5,1); ctx.scale(1.1,1.06); manePath(sw); ctx.fillStyle='#6e0d12'; ctx.fill(); ctx.restore();
  manePath(sw); ctx.fillStyle='#d7322a'; ctx.fill();
  ctx.strokeStyle='rgba(255,190,160,.7)'; ctx.lineWidth=0.6; ctx.beginPath();
  ctx.moveTo(-3,-2); ctx.quadraticCurveTo(-12,2,-15,18+sw*0.8); ctx.moveTo(-1,1); ctx.quadraticCurveTo(-8,8,-9,20+sw*0.6); ctx.stroke();
  // 大振袖（奥）
  ctx.fillStyle='#241a3a'; ctx.beginPath(); ctx.moveTo(-6,11); ctx.lineTo(-13,14+sw*0.3); ctx.lineTo(-12,24+sw*0.5); ctx.lineTo(-5,21); ctx.closePath(); ctx.fill();

  const g=ctx.createLinearGradient(0,95,0,145); g.addColorStop(0,'#fff0a8'); g.addColorStop(0.5,'#e8b73a'); g.addColorStop(1,'#a8661a');
  ctx.font='50px '+DISP; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  ctx.lineWidth=10; ctx.strokeStyle='#3b0e0a'; ctx.strokeText('ザエモン',318,122);
  ctx.lineWidth=4; ctx.strokeStyle='#d7322a'; ctx.strokeText('ザエモン',318,122);
  ctx.fillStyle=g; ctx.fillText('ザエモン',318,122);
  otext('── 小判を投げて 千両箱をいただけ ──',318,160,'700 10px '+BODY,'#cfc6e6',null);
  if(Math.floor(stT/30)%2===0) otext('▶ タップで 開幕',318,205,'15px '+DISP,'#fbf2dc','#6b1410',4);
}
function drawEnd(clear){
  ctx.fillStyle='rgba(6,5,14,.72)'; ctx.fillRect(0,0,W,H);
  if(clear){
    drawChest(W/2-15,74+Math.sin(stT*0.1)*3,true,stT);
    otext('てやんでえ！',W/2,40,'28px '+DISP,'#fbf2dc','#6b1410',6);
    otext('千両箱、いただき！',W/2,122,'18px '+DISP,'#e8b73a','#3b0e0a',5);
  } else {
    otext('お縄ちょうだい…',W/2,70,'28px '+DISP,'#fbf2dc','#1d2448',6);
    otext('御用だ 御用だ',W/2,108,'700 12px '+BODY,'#9aa3c9',null);
  }
  otext('稼ぎ  '+S.score.toLocaleString()+' 両',W/2,158,'20px '+DISP,'#f1e9d8',null);
  if(stT>50&&Math.floor(stT/30)%2===0) otext('タップで タイトルへ',W/2,210,'700 12px '+BODY,'#cfc6e6',null);
}

/* ---------- ループ ---------- */
let state='logo', stT=0, titleCam=0;
/* ---------- オートプレイ ---------- */
let autoHeld=false;
function autoPilot(){
  if(!window.tgAuto){ if(autoHeld){ keys.left=keys.right=keys.throw=false; autoHeld=false; } return; }
  autoHeld=true;
  if(state!=='play'){ keys.left=keys.right=keys.throw=false; if(stT%60===55) anyPress=true; return; }
  const p=S.p, cx=p.x+p.w/2;
  let dir=1, fire=false;
  // 一番近い生きている敵
  let near=null, nd=1e9;
  for(const e of S.enemies){ if(e.dead) continue; const d=(e.x+e.w/2)-cx; if(Math.abs(d)<Math.abs(nd)){nd=d;near=e;} }
  if(near&&near.k!=='b'&&nd<-14&&nd>-70&&Math.abs(near.y+near.h-(p.y+p.h))<12) dir=-1; // 同じ高さで背後から迫る敵には振り向く
  if(near&&near.k==='b'&&Math.abs(nd)<150) dir=nd>0?(Math.abs(nd)<110?0:1):-1;
  if(S.chest) dir=(S.chest.x+15)>cx?1:-1;
  if(near&&Math.sign(nd)===(dir||p.face)&&Math.abs(nd)<230&&Math.abs(near.y-p.y)<60){
    fire=p.ammo>0&&(Math.abs(nd)<170||near.k==='b');
    if(Math.abs(nd)<34) press('melee',true), press('melee',false);
  }
  if(dir===0){ keys.left=keys.right=false; p.face=nd>0?1:-1; }
  else { keys.right=dir>0; keys.left=dir<0; }
  keys.throw=fire&&S.t%14<7;
  // 飛んでくる十手はかわす
  for(const f of S.foes){ const d=f.x-cx; if(Math.abs(d)<70&&Math.sign(f.vx)===-Math.sign(d||1)){ if(p.on) press('jump',true),press('jump',false); else press('melee',true),press('melee',false); break; } }
  // 小判切れのときや、たまに足場へ跳ぶ
  if(p.on&&(S.t%95===0||(p.ammo===0&&S.t%40===0))) press('jump',true),press('jump',false);
  if(near&&near.k==='o'&&Math.abs(nd)<46&&p.ammo===0&&p.on) press('jump',true),press('jump',false);
}
function step(){
  stT++;
  autoPilot();
  if(state==='logo'){ if(stT>150||(anyPress&&stT>8)){state='title';stT=0;} }
  else if(state==='title'){ titleCam+=0.6; if(anyPress&&stT>10){ reset(); state='play'; stT=0; } }
  else if(state==='play'){ update(); }
  else { if(anyPress&&stT>50){ state='title'; stT=0; } }
  anyPress=false;
}
function draw(){
  ctx.setTransform(2,0,0,2,0,0);
  if(state==='logo') return drawLogo();
  if(state==='title'){ drawBG(titleCam); return drawTitle(); }
  const sh=state==='play'?S.shake:0;
  drawBG(S.camX);
  ctx.save(); ctx.translate(-Math.round(S.camX)+(Math.random()-0.5)*sh*0.6,(Math.random()-0.5)*sh*0.6);
  drawWorld(); ctx.restore();
  drawHUD();
  if(state==='clear') drawEnd(true);
  if(state==='over') drawEnd(false);
}
let last=performance.now(), acc=0;
function frame(now){
  acc+=Math.min(100,now-last); last=now;
  while(acc>=1000/60){ step(); acc-=1000/60; }
  draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

<style>html,body{overscroll-behavior:none}</style>
<script>
(function(){
  var GAME=!!document.querySelector('.tg-auto');
  var sx=0,sy=0;
  function scroller(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){var s=getComputedStyle(el).overflowY;if((s==='auto'||s==='scroll')&&el.scrollHeight>el.clientHeight)return el;}return null;}
  document.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;
    // 画面端からのスワイプ（戻る・進む）を止める
    if(sx<14||sx>innerWidth-14){e.preventDefault();}},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
})();
</script>
