 for(let i=8;i>=0;i--){flash=i/8;await wait(25);}mode='play';const rm=curRoom();if(rm.dun&&rm.id===rid(G.map,0,1)&&!G.flags['seen'+rm.dun]){G.flags['seen'+rm.dun]=1;await say(`――${rm.name}――`);}
 if(G.map==='ow'&&G.flags['seen_after_'+w[0]]===undefined){}}
/* ---------------- 毎フレームの 更新 ---------------- */
function update(dt){if(mode!=='play'||busy||STACK.length||trans)return;G.time+=dt;
 const evs=IN.ev.splice(0);const bev=window.tgAuto?BOT.act(dt):null;
 let mv=window.tgAuto?bev.mv:stickDir();const btn=window.tgAuto?bev.btn:evs;
 if(window.tgAuto&&bev.face!=null&&P.atk<=0&&P.dash<=0)G.dir=bev.face;
 if(btn.includes('A'))attack();if(btn.includes('B'))shoot();if(btn.includes('X'))dash();
 if(btn.includes('START'))runEv(statusScreen);
 P.atk=Math.max(0,P.atk-dt);P.inv=Math.max(0,P.inv-dt);P.dcd=Math.max(0,P.dcd-dt);P.bcd=Math.max(0,P.bcd-dt);
 // 移動
 let sp=62,dx=mv.x,dy=mv.y;if(dx||dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l;if(P.atk<=0&&P.dash<=0&&!(window.tgAuto&&bev.face!=null)){if(Math.abs(dx)>Math.abs(dy))G.dir=dx>0?1:3;else G.dir=dy>0?2:0;}P.anim+=dt;}
 if(P.dash>0){P.dash-=dt;dx=DX[G.dir];dy=DY[G.dir];sp=190;
  // ひび割れた 壁を 突き破る
  const [tx,ty]=playerTile();const fx=Math.floor((G.x+DX[G.dir]*10)/16),fy=Math.floor((G.y-2+DY[G.dir]*9)/16);const rm=curRoom();
  for(const [qx,qy] of [[fx,fy],[tx+DX[G.dir],ty+DY[G.dir]]])if(tileAt(rm,qx,qy)==='C'){G.flags['b'+rm.id+'@'+qx+','+qy]=1;SFX.break();shake=.2;puff(qx*16+8,qy*16+8);
   // 2マス つづきの ひびは まとめて
   for(const [ax,ay] of [[qx+1,qy],[qx-1,qy],[qx,qy+1],[qx,qy-1]])if(rm.rows[ay]&&rm.rows[ay][ax]==='C')G.flags['b'+rm.id+'@'+ax+','+ay]=1;}}
 if(P.atk>0)sp*=.4;
 if(P.kb.t>0){P.kb.t-=dt;moveBox(G,P.kb.x*dt,0,PH,PV);moveBox(G,0,P.kb.y*dt,PH,PV);}
 else{const r=moveBox(G,dx*sp*dt,dy*sp*dt,PH,PV);
  // 角で ひっかからないよう 少し すべらせる
  if(r.hitX&&!dy){for(const s of [-1,1])if(boxFree(G.x+dx*2,G.y+s*5,PH,PV)){G.y+=s*sp*dt*.8;break;}}
  if(r.hitY&&!dx){for(const s of [-1,1])if(boxFree(G.x+s*5,G.y+dy*2,PH,PV)){G.x+=s*sp*dt*.8;break;}}}
 // 画面の はし → となりの 部屋
 const rm=curRoom();
 if(G.x<=PH+1&&dx<0&&edgeGo(3))return;if(G.x>=RW*16-PH-1&&dx>0&&edgeGo(1))return;if(G.y<=PV+1&&dy<0&&edgeGo(0))return;if(G.y>=RH*16-PV-1&&dy>0&&edgeGo(2))return;
 G.x=clamp(G.x,PH,RW*16-PH);G.y=clamp(G.y,PV,RH*16-PV);
 // 出入口
 const [tx,ty]=playerTile();const w=rm.warp&&rm.warp[tx+','+ty];
 if(w&&tileAt(rm,tx,ty)==='E'){if(w[0]==='d4'&&PARTS.slice(0,3).some(p=>!G.parts[p])){G.y+=6;runEv(()=>say(['焼却炉の 扉は 固く 閉ざされている。','「部品を 3つ そろえた 者だけが 入れる」と 書いてある……']));}
  else if(rm.dun&&G.parts[ROOMS[rid(rm.dun,0,0)].part]===undefined&&!G.flags['ch'+'part_'+ROOMS[rid(rm.dun,0,0)].part]&&false){}
  else{runEv(()=>warpTo(w));return;}}
 // 攻撃が 当たる
 if(P.atk>0&&P.atk<.2){const hb=hitBox();for(const e of RT.ene)if(e.inv<=0&&Math.hypot(e.x-hb.x,e.y-hb.y)<hb.r+e.r)hitEnemy(e,2,G.x,G.y);}
 updEnemies(dt);updShots(dt);updDrops(dt);
 for(const f of RT.fx){f.t+=dt;if(f.k==='puff'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=80*dt;}}RT.fx=RT.fx.filter(f=>f.t<(f.k==='hold'?1.2:f.k==='boom'?.6:.5));
 if(!RT.cleared&&!RT.ene.length){RT.cleared=true;if(rm.dun){G.flags['clr'+rm.id]=1;}if(rm.rows.some(r=>r.includes('S'))||(rm.chest||[]).some(c=>c.cond==='clear'))SFX.door();}}
function hitEnemy(e,d,sx,sy){if(e.inv>0)return;if(e.t==='king'&&e.guard>0){SFX.hit();e.inv=.15;return;}e.hp-=d;e.inv=.35;SFX.hit();const a=Math.atan2(e.y-sy,e.x-sx);if(!ENE[e.t].boss)e.kb={x:Math.cos(a)*140,y:Math.sin(a)*140,t:.14};
 if(e.hp<=0)killEnemy(e);}
function killEnemy(e){RT.ene.splice(RT.ene.indexOf(e),1);SFX.die();puff(e.x,e.y);RT.fx.push({k:'boom',x:e.x,y:e.y,t:0});
 if(e.isBoss){const rm=curRoom();G.flags['boss'+rm.id]=1;RT.ene.length=0;RT.shots.length=0;shake=.6;setBgm('dun');runEv(async()=>{await wait(500);await say([`${ENE[e.t].name}を たおした！`,'宝箱が あらわれた！']);});return;}
 const r=Math.random();if(r<.12)drop('heart',e.x,e.y);else if(r<.22)drop('bolt5',e.x,e.y);else if(r<.62)drop('bolt',e.x,e.y);}
function updDrops(dt){for(const d of RT.drops){d.t+=dt;if(Math.hypot(d.x-G.x,d.y-(G.y-4))<10){d.got=1;if(d.k==='heart'){G.hp=Math.min(G.max,G.hp+2);SFX.heart();}else{G.money=Math.min(999,G.money+d.v);SFX.coin();}}}
 RT.drops=RT.drops.filter(d=>!d.got&&d.t<9);}
function updShots(dt){const rm=curRoom();for(const s of RT.shots){s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;const tx=Math.floor(s.x/16),ty=Math.floor(s.y/16);const c=tileAt(rm,tx,ty);
  if(s.mine&&c==='X'){G.flags['sw'+rm.id]=1;SFX.door();s.dead=1;shake=.15;runEv(()=>say('カチッ！　どこかで 門が 開く 音が した。'));continue;}
  if(c==null||(SOLID.has(c)&&c!=='~')){s.dead=1;continue;}
  if(s.mine){for(const e of RT.ene)if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+3){hitEnemy(e,s.dmg,s.x-s.vx,s.y-s.vy);s.dead=1;break;}}
  else if(Math.hypot(G.x-s.x,G.y-4-s.y)<7){hurtPlayer(s.dmg||1,s.x,s.y);s.dead=1;}}
 RT.shots=RT.shots.filter(s=>!s.dead&&s.t<3);}
function eshot(x,y,a,sp,k){RT.shots.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,k:k||'can',dmg:1});}
/* ---------------- 敵の うごき ---------------- */
function updEnemies(dt){for(const e of RT.ene.slice()){e.timer-=dt;e.inv=Math.max(0,e.inv-dt);e.ph+=dt;const D=ENE[e.t];const ax=G.x-e.x,ay=G.y-4-e.y,dist=Math.hypot(ax,ay);
  if(e.kb.t>0){e.kb.t-=dt;moveBox(e,e.kb.x*dt,e.kb.y*dt,e.r-1,e.r-1,D.fly);continue;}
  switch(e.t){
   case 'rat':if(e.timer<=0){e.timer=rnd(.6,1.4);const a=dist<50&&Math.random()<.6?Math.atan2(ay,ax):Math.floor(Math.random()*4)*Math.PI/2;e.vx=Math.cos(a)*D.spd;e.vy=Math.sin(a)*D.spd;}
    {const r=moveBox(e,e.vx*dt,e.vy*dt,4,4);if(r.hitX)e.vx*=-1;if(r.hitY)e.vy*=-1;}break;
   case 'crow':if(e.st===0){e.x+=Math.cos(e.ph*1.3)*20*dt;e.y+=Math.sin(e.ph*2)*12*dt;if(e.timer<=0&&dist<90){e.st=1;e.timer=1;const a=Math.atan2(ay,ax);e.vx=Math.cos(a)*90;e.vy=Math.sin(a)*90;}}
    else{moveBox(e,e.vx*dt,e.vy*dt,4,4,1);if(e.timer<=0){e.st=0;e.timer=rnd(1.4,2.4);}}e.x=clamp(e.x,8,RW*16-8);e.y=clamp(e.y,8,RH*16-8);break;
   case 'robo':if(!e.vx&&!e.vy){const d=Math.floor(Math.random()*4);e.vx=DX[d]*D.spd;e.vy=DY[d]*D.spd;}{const r=moveBox(e,e.vx*dt,e.vy*dt,5,5);if(r.hitX||r.hitY||e.timer<=0){e.timer=rnd(1.5,3);
    const d=Math.abs(ax)>Math.abs(ay)?(ax>0?1:3):(ay>0?2:0);const dd=Math.random()<.5?d:Math.floor(Math.random()*4);e.vx=DX[dd]*D.spd;e.vy=DY[dd]*D.spd;}}break;
   case 'golem':if(dist>40){moveBox(e,ax/dist*D.spd*dt,ay/dist*D.spd*dt,5,5);}if(e.timer<=0){e.timer=rnd(1.8,2.6);eshot(e.x,e.y-4,Math.atan2(ay,ax),70);}break;
   case 'sludge':case 'mini':if(dist>2)moveBox(e,ax/dist*D.spd*dt,ay/dist*D.spd*dt,4,4);break;
   case 'oven':{// 左右に 動き、火の玉を 3つ
    e.x+=Math.sin(e.ph*.9)*55*dt;e.x=clamp(e.x,28,RW*16-28);e.y=36+Math.sin(e.ph*1.7)*6;
    if(e.timer<=0){e.timer=e.hp<5?1.0:1.5;for(const o of [-.35,0,.35])eshot(e.x,e.y+8,Math.atan2(ay,ax)+o,75,'fire');SFX.shoot();}break;}
   case 'snake':{const s=D.spd*(e.hp<6?1.45:1);const l=Math.hypot(e.vx,e.vy)||1;e.vx=e.vx/l*s;e.vy=e.vy/l*s;
    if(e.timer<=0){e.timer=rnd(1.2,2);const a=Math.atan2(ay,ax)+rnd(-.6,.6);e.vx=Math.cos(a)*s;e.vy=Math.sin(a)*s;}
    const r=moveBox(e,e.vx*dt,e.vy*dt,7,7);if(r.hitX)e.vx*=-1;if(r.hitY)e.vy*=-1;
    e.seg.unshift({x:e.x,y:e.y});if(e.seg.length>60)e.seg.pop();break;}
   case 'sludgeking':{if(dist>4)moveBox(e,ax/dist*D.spd*(e.hp<7?1.6:1)*dt,ay/dist*D.spd*(e.hp<7?1.6:1)*dt,10,9);
    if(e.timer<=0){e.timer=3;if(RT.ene.filter(x=>x.t==='mini').length<3){spawn('mini',e.x+rnd(-12,12),e.y+12);}}break;}
   case 'king':{e.guard=Math.max(0,(e.guard||0)-dt);
    if(e.st===0){if(dist>30)moveBox(e,ax/dist*D.spd*dt,ay/dist*D.spd*dt,12,12);if(e.timer<=0){e.timer=e.hp<10?1.6:2.4;
      if(e.hp<10&&Math.random()<.5){e.st=1;e.timer=.9;const a=Math.atan2(ay,ax);e.vx=Math.cos(a)*120;e.vy=Math.sin(a)*120;SFX.dash();}
      else{for(let k=0;k<8;k++)eshot(e.x,e.y,k*Math.PI/4+e.ph,65,'trash');SFX.shoot();}}}
    else{const r=moveBox(e,e.vx*dt,e.vy*dt,12,12);if(r.hitX||r.hitY||e.timer<=0){e.st=0;e.timer=1.2;if(r.hitX||r.hitY){shake=.3;SFX.break();e.guard=0;}}}break;}}
  // ぶつかると ダメージ
  if(dist<e.r+5&&e.t!=='crow'||e.t==='crow'&&e.st===1&&dist<e.r+5)hurtPlayer(D.dmg,e.x,e.y);}}

/* ---------------- 描画 ---------------- */
function R(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);}
function drawRoom(g,rm,ox,oy,t){const fr=Math.floor(t*2)%2;
 for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){const c=tileAt(rm,x,y);g.drawImage(tileCanvas(c,rm.th,x,y,fr),ox+x*16,oy+y*16);}
 // トラック（町）：集めた 部品が 付いていく
 if(rm.id===rid('ow',1,2))drawTruck(g,ox+7*16,oy+2*16,t);
 for(const n of rm.npc||[])drawGen(g,ox+n.x*16+8,oy+n.y*16+14,t);}

 if(p.handle){R(g,x+22,y+3,4,1,'#222');}R(g,x+2,y+6,14,1,'#5a2a1a');
 const wheel=(wx)=>{if(p.tire){g.fillStyle='#1a1a1a';g.beginPath();g.arc(x+wx,y+13,3.2,0,TAU);g.fill();R(g,x+wx-1,y+12,2,2,'#888');}else{R(g,x+wx-2,y+12,4,3,'#555');}};wheel(7);wheel(24);
 if(p.engine){R(g,x+4,y+1,7,3,'#888');if(Math.floor(t*6)%2)R(g,x+5,y,1,1,'#ccc');}

 if(d===2){R(g,x-2,y-14,1,2,'#222');R(g,x+1,y-14,1,2,'#222');R(g,x-5,y-17,1,4,'#3a2a20');R(g,x+4,y-17,1,4,'#3a2a20');}

function chestAt(x,y){return visChests().some(c=>c.x===x&&c.y===y);}
function roomNeighbors(id){const rm=ROOMS[id];const [map,xy]=id.split(':');const [rx,ry]=xy.split(',').map(Number);const out=[];
 for(let d=0;d<4;d++){const nid=rid(map,rx+DX[d],ry+DY[d]);const nb=ROOMS[nid];if(!nb)continue;let ok=false;
  for(let i=0;i<(d%2?RH:RW);i++){const [ax,ay]=d===0?[i,0]:d===2?[i,RH-1]:d===1?[RW-1,i]:[0,i];const [bx,by]=d===0?[i,RH-1]:d===2?[i,0]:d===1?[0,i]:[RW-1,i];

function roomPath(from,to){if(from===to)return [];const prev={[from]:null},q=[from];while(q.length){const c=q.shift();if(c===to)break;for(const n of roomNeighbors(c)){if(n.id in prev)continue;prev[n.id]={from:c,step:n};q.push(n.id);}}
 if(!(to in prev))return null;const steps=[];let c=to;while(prev[c]){steps.unshift(prev[c].step);c=prev[c].from;}return steps;}
function tilePath(sx,sy,goals){const rm=curRoom();const key=(x,y)=>x+','+y;const G_=new Set(goals.map(([x,y])=>key(x,y)));const prev={[key(sx,sy)]:null},q=[[sx,sy]];let end=null;
 while(q.length){const [x,y]=q.shift();if(G_.has(key(x,y))){end=[x,y];break;}for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d],k=key(nx,ny);if(k in prev)continue;if(!walkable(rm,nx,ny))continue;if(rm.warp&&rm.warp[k]&&!G_.has(k))continue;/* 出入口は ゴールの ときだけ ふむ */prev[k]=[x,y];q.push([nx,ny]);}}
 if(!end)return null;const p=[];let c=end;while(c){p.unshift(c);c=prev[key(c[0],c[1])];}return p;}

  if(dr&&!goal.btn){const p=tilePath(tx,ty,[[Math.floor(dr.x/16),Math.floor(dr.y/16)]]);if(p&&p.length>1){const [nx,ny]=p[1];out.mv=norm(nx*16+8-G.x,ny*16+8-G.y);}else out.mv=norm(dr.x-G.x,dr.y-G.y);return out;}

 await wait(window.tgAuto?3000:7500);await say(['ゴミ山から 脱出した！',`クリア時間 ${Math.floor(G.time/60)}分　たおれた回数 ${G.deaths}回`,'――遊んでくれて ありがとう！']);

 ac();const has=load()&&!G.cleared;let v=has?await choose(['つづきから','はじめから'],'title'):1;
 if(v!==0){newGame();mode='intro';setBgm(null);await say(STORY.intro);}

let dirPrev=-1,dirT=0;

 if(STACK.length){const e=IN.ev.splice(0);for(const x of e)STACK[STACK.length-1].ev(x);}}
/* ---------------- メインループ ---------------- */
let last=performance.now(),TT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;TT+=dt;
 try{uiInput(dt);if(trans){trans.t+=dt/.4;if(trans.t>=1)trans=null;}shake=Math.max(0,shake-dt);
  if(mode==='play'){const n=window.tgAuto?3:1;for(let i=0;i<n;i++)update(dt);}else if(!STACK.length)IN.ev.length=0;
  render(TT);}catch(e){console.error(e);}
 requestAnimationFrame(frame);}

<script>
/* ---------- 共通の効果音（Web Audioで合成） ---------- */
window.tgSound = (function(){
  var AC = null, noiseBuf = null, on = true, last = {};
  try { on = localStorage.getItem('tg_sound') !== '0'; } catch (e) {}
  function ctx(){
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, dur, type, vol, slide, delay){
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, vol, freq, delay, kind){
    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = 1;
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + .03);
  }
  function arp(fs, step, type, vol, dur){ fs.forEach(function(f, i){ tone(f, dur || .22, type, vol, 0, i * step); }); }
  var LIB = {
    click:  function(){ tone(900, .05, 'square', .03); },
    pick:   function(){ tone(660, .06, 'triangle', .07); tone(990, .08, 'triangle', .06, 0, .05); },
    unpick: function(){ tone(520, .08, 'triangle', .06, .7); },
    tick:   function(){ tone(1500 + Math.random() * 300, .025, 'square', .025); },
    land:   function(){ tone(784, .09, 'square', .05); tone(1175, .18, 'square', .05, 0, .07); },
    start:  function(){ arp([392, 523, 659], .09, 'square', .05, .18); },
    shot:   function(){ tone(1200, .07, 'square', .025, .45); },
    shotFoe:function(){ tone(700, .08, 'square', .02, .5); },
    slash:  function(){ noise(.12, .12, 2600, 0, 'highpass'); tone(500, .1, 'sawtooth', .03, .5); },
    dash:   function(){ noise(.2, .1, 800, 0, 'bandpass'); tone(200, .2, 'sine', .06, 2.2); },
    charge: function(){ tone(200, .7, 'sawtooth', .05, 4); },
    beam:   function(){ noise(.5, .2, 500, 0, 'lowpass'); tone(90, .5, 'sawtooth', .08, .5); },
    hit:    function(){ noise(.09, .14, 900, 0, 'lowpass'); tone(160, .08, 'square', .04, .6); },
    big:    function(){ noise(.3, .22, 400, 0, 'lowpass'); tone(110, .3, 'sawtooth', .07, .5); },
    heal:   function(){ arp([784, 988, 1319], .06, 'sine', .06, .2); },
    miss:   function(){ noise(.15, .06, 3000, 0, 'highpass'); },
    good:   function(){ arp([659, 784, 1047], .08, 'triangle', .07, .25); },
    bad:    function(){ tone(330, .25, 'triangle', .07, .75); tone(247, .35, 'triangle', .06, .8, .18); },
    win:    function(){ arp([523, 659, 784, 1047, 1319], .1, 'square', .045, .28); },
    lose:   function(){ arp([392, 330, 262, 196], .22, 'triangle', .08, .4); },
    splash: function(){ noise(.35, .18, 700, 0, 'lowpass'); noise(.2, .08, 2400, .05, 'bandpass'); },
    bubble: function(){ tone(250 + Math.random() * 250, .07, 'sine', .04, 1.8); },
    slurp:  function(){ noise(.5, .12, 1400, 0, 'bandpass'); noise(.3, .08, 900, .55, 'bandpass'); },
    coin:   function(){ tone(988, .06, 'square', .04); tone(1319, .14, 'square', .04, 0, .06); },
    summon: function(){ tone(130, 1, 'sawtooth', .05, 3); arp([523, 784, 1047, 1568], .12, 'sine', .07, .5); },
    evolve: function(){ arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], .07, 'triangle', .06, .3); },
    fuse:   function(){ tone(110, 1.1, 'sawtooth', .06, 2.5); noise(.9, .1, 300, .2, 'lowpass'); arp([659, 880, 1319], .12, 'sine', .07, .4); }
  };
  function play(name){
    if (!on || !LIB[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < 55) return;
    last[name] = now;
    if (!ctx()) return;
    try { LIB[name](); } catch (e) {}
  }
  var btn = document.querySelector('.tg-snd');
  function sync(){ if (btn) { btn.textContent = on ? '音：ON' : '音：OFF'; btn.setAttribute('aria-pressed', String(on)); } }
  if (btn) {
    ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ btn.addEventListener(t, function(e){ e.stopPropagation(); }); });
    btn.addEventListener('click', function(e){
      e.stopPropagation(); on = !on; sync(); btn.blur();
      try { localStorage.setItem('tg_sound', on ? '1' : '0'); } catch (err) {}
      if (on) { ctx(); play('pick'); }
    });
  }
  sync();
  // ブラウザは最初の操作まで音を出せないので、最初のタップで準備する
  window.addEventListener('pointerdown', function(){ if (on) ctx(); }, { once: true, capture: true });
  return { play: play };
})();
</script>

<script>
(function(){

  function scroller(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){var s=getComputedStyle(el).overflowY;if((s==='auto'||s==='scroll')&&el.scrollHeight>el.clientHeight)return el;}return null;}

  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
