<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>俺のラーメン道</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: 夜の屋台のカウンター。上の大きな絵が店の様子（客・丼・寸胴）、下に今やることのボタンだけ */
:root{
  --bg:#1c120c; --panel:#2a1c13; --panel2:#36251a; --ink:#f6ead8; --muted:#b39c83; --line:#4a3424;
  --red:#c8342a; --gold:#f0b83a; --cream:#fff4e0;
  --disp:"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:640px;margin:0 auto;padding:52px 14px 28px;display:grid;gap:12px}
#stage{display:block;width:100%;aspect-ratio:4/3;border-radius:16px;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.bar{display:flex;align-items:center;gap:10px;font-weight:900}
.bar .who{font-family:var(--disp);font-size:18px}
.bar .pips{margin-left:auto;display:flex;gap:5px}
.bar .pips i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.bar .pips i.done{background:var(--gold)} .bar .pips i.now{background:var(--red)}
.bar .sc{font-variant-numeric:tabular-nums;color:var(--gold)}
.order{background:var(--cream);color:#2a1a10;border-radius:16px;padding:12px 16px;font-weight:900;line-height:1.7;position:relative}
.order::before{content:"";position:absolute;left:28px;top:-10px;border:10px solid transparent;border-bottom-color:var(--cream);border-top:0}
.order small{display:block;color:#8a6a4a;font-weight:700;font-size:12px}
.step{font-weight:900;font-size:13px;color:var(--muted);letter-spacing:.1em}
.step b{color:var(--ink);font-size:16px;letter-spacing:0;margin-left:6px}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.picks.three{grid-template-columns:repeat(3,1fr)}
.pick{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 4px 10px;display:grid;gap:4px;justify-items:center;font-weight:900;font-size:14px}
.pick canvas{width:100%;aspect-ratio:1;border-radius:10px}
.pick small{font-size:11px;color:var(--muted);font-weight:700}
.pick[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 1px var(--gold)}
.pick:disabled{opacity:.35}
.go{width:100%;border:none;border-radius:16px;padding:16px 0;font-family:var(--disp);font-size:22px;background:var(--red);color:#fff;box-shadow:0 4px 0 #7a1c14}
.go:active{transform:translateY(3px);box-shadow:none}
.go:disabled{opacity:.4;box-shadow:none}
.go.gold{background:var(--gold);color:#2a1a04;box-shadow:0 4px 0 #8a6a14}
.sub{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:9px 18px;font-weight:900}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.hint{margin:0;font-size:12px;color:var(--muted);text-align:center}
.title{text-align:center;display:grid;gap:14px;justify-items:center}
.title h1{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(46px,14vw,80px);line-height:1;letter-spacing:.04em;text-shadow:0 4px 0 #000}
.title h1 span{color:var(--red)}
.title p{margin:0;line-height:1.8;color:#e6d6c0;text-wrap:balance}
.title .best{font-size:13px;color:var(--muted);font-weight:700}
.verdict{text-align:center;display:grid;gap:6px}
.verdict .cm{background:var(--cream);color:#2a1a10;border-radius:14px;padding:10px 14px;font-weight:900;line-height:1.7}
.verdict .parts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:700}
.verdict .parts b{color:var(--ink)}
.final{text-align:center;display:grid;gap:10px}
.final h2{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(34px,10vw,52px);color:var(--gold)}
.final .list{display:grid;gap:6px;text-align:left}
.final .list div{display:flex;justify-content:space-between;background:var(--panel);border-radius:10px;padding:8px 12px;font-weight:700}
.final .list b{color:var(--gold);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app">
  <canvas id="stage" width="1280" height="960" aria-label="屋台の様子"></canvas>
  <div id="ui"></div>
</div>
<script>
'use strict';
/* ================= データ ================= */
const SOUPS = {
  shoyu:    { n: '醤油', d: '澄んだ琥珀色', c1: '#c27a32', c2: '#7a3e14', clear: true },
  shio:     { n: '塩',   d: '黄金の清湯',   c1: '#f2d68a', c2: '#c8a050', clear: true },
  miso:     { n: '味噌', d: '濃厚な赤味噌', c1: '#c9772e', c2: '#8a4a1c' },
  tonkotsu: { n: '豚骨', d: '白濁こってり', c1: '#f6ead2', c2: '#d8c09a' },
};
const NOODLES = {
  hoso: { n: '細麺',   d: 'パツっと歯切れ', w: 3,  t: 3.5, c: '#f3dc96' },
  chu:  { n: '中太麺', d: 'もちもち万能',   w: 6,  t: 5.0, c: '#f0cf78' },
  futo: { n: '極太麺', d: 'ずっしり存在感', w: 10, t: 7.0, c: '#e8c060' },
};
const TOPS = {
  chashu: { n: 'チャーシュー' }, ajitama: { n: '味玉' }, menma: { n: 'メンマ' }, negi: { n: 'ネギ' },
  nori:   { n: '海苔' },         naruto:  { n: 'なると' }, corn: { n: 'コーン' }, moyashi: { n: 'もやし' },
};
const TOP_ORDER = ['nori', 'moyashi', 'chashu', 'menma', 'ajitama', 'naruto', 'corn', 'negi'];
const MAX_TOPS = 5;
const CUSTOMERS = [
  { id: 'goda', n: '剛田 大蔵', t: '家系一筋の親方', say: 'ガツンと濃いのを頼む。麺は太く、肉と海苔は欠かすなよ。',
    soup: { tonkotsu: 1, miso: .55, shoyu: .3, shio: .1 }, noodle: { futo: 1, chu: .55, hoso: .1 }, like: ['chashu', 'nori', 'ajitama'], dis: ['naruto', 'corn'],
    look: { skin: '#e2b088', hair: '#e8e8e8', band: '#1a1a1a', brow: 1, shirt: '#2a3a5a' } },
  { id: 'shira', n: '白鳥 麗華', t: '淡麗系の女王', say: '澄んだ一杯をいただけるかしら。細い麺で、具は上品に控えめにね。',
    soup: { shio: 1, shoyu: .7, miso: .15, tonkotsu: .05 }, noodle: { hoso: 1, chu: .5, futo: .05 }, like: ['negi', 'menma', 'ajitama'], dis: ['moyashi', 'corn', 'chashu'],
    look: { skin: '#f5d2b8', hair: '#3a1a2a', bun: true, pearl: true, shirt: '#e8d0e0' } },
  { id: 'kitano', n: '北野 雪男', t: '札幌から来た旅人', say: '寒い日はやっぱり味噌だべさ。中太の麺に、コーンともやしをどっさり！',
    soup: { miso: 1, tonkotsu: .5, shoyu: .3, shio: .2 }, noodle: { chu: 1, futo: .6, hoso: .2 }, like: ['corn', 'moyashi', 'chashu'], dis: ['naruto'],
    look: { skin: '#f0c9a0', hair: '#3a2a1a', cap: '#c8342a', shirt: '#4a6a4a' } },
  { id: 'tomi', n: 'トミばあちゃん', t: '昭和から通う常連', say: '昔ながらの醤油ラーメンを。なるとが乗ってると嬉しいねえ。',
    soup: { shoyu: 1, shio: .55, miso: .3, tonkotsu: .2 }, noodle: { chu: 1, hoso: .7, futo: .2 }, like: ['naruto', 'menma', 'nori', 'negi'], dis: ['moyashi'],
    look: { skin: '#eac2a0', hair: '#bdbdbd', bun: true, glasses: true, shirt: '#8a5a7a' } },
  { id: 'kenta', n: 'たけし君', t: '食べ盛りの小学生', say: 'おなかペコペコ！たまごとお肉とコーンがいっぱいのやつ！ネギはいらない！',
    soup: { tonkotsu: .9, shoyu: .9, miso: .7, shio: .4 }, noodle: { chu: 1, hoso: .8, futo: .6 }, like: ['ajitama', 'chashu', 'corn', 'naruto'], dis: ['negi', 'menma'],
    look: { skin: '#f6d0a8', hair: '#1a1a1a', kid: true, shirt: '#e8a020' } },
];
const DAY_LEN = 5, BEST_KEY = 'ramen2_best';
const RANKS = [[430, '伝説の屋台', '行列が夜明けまで途切れない。'], [360, '名店の主', 'どの客も笑顔で帰っていった。'], [280, '人気の屋台', '常連がつきはじめた。'], [180, '見習い店主', '味の方向性は見えてきた。'], [0, '修行中', '客の言葉をよく聞くのが近道。']];

/* ================= 状態 ================= */
let G = null;    // 一日の営業
let B = null;    // いま作っている一杯
let scene = 'title', sceneT = 0;
let best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }
const snd = n => { if (window.tgSound) window.tgSound.play(n); };
const rnd = (a, b) => a + Math.random() * (b - a);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startDay() {
  G = { i: 0, queue: shuffle(CUSTOMERS), scores: [], total: 0 };
  nextCustomer();
}
function nextCustomer() {
  B = { soup: null, noodle: null, tops: [], drop: {}, boil: null, pour: 0, noodleT: 0, result: null };
  scene = 'order'; sceneT = 0; snd('click'); renderUI();
}
const cust = () => G.queue[G.i];

/* ================= 採点 ================= */
function judge() {
  const c = cust();
  const soup = (c.soup[B.soup] || 0) * 40;
  const noodle = (c.noodle[B.noodle] || 0) * 20;
  const diff = Math.abs(B.boil - NOODLES[B.noodle].t);
  const boil = Math.max(0, 1 - diff / 2.5) * 25;
  let tops = 0;
  for (const k of B.tops) { if (c.like.includes(k)) tops += 5; if (c.dis.includes(k)) tops -= 7; }
  if (B.tops.length >= 3) tops += 3;
  if (!B.tops.length) tops -= 5;
  tops = Math.max(-15, Math.min(15, tops));
  const total = Math.max(0, Math.min(100, Math.round(soup + noodle + boil + tops)));
  const boilWord = diff < .4 ? 'ぴったり' : B.boil < NOODLES[B.noodle].t ? (diff < 1.2 ? '少し硬め' : '芯が残る') : (diff < 1.2 ? '少し柔らかめ' : 'のびのび');
  const liked = B.tops.filter(k => c.like.includes(k)), disl = B.tops.filter(k => c.dis.includes(k));
  let cm;
  if (total >= 90) cm = pick(['……うまい。言葉がいらん。', '完璧。毎日でも通いたい。', 'これだよ、これが食べたかったんだ！']);
  else if (total >= 70) cm = pick(['うん、うまい。また来るよ。', 'いい一杯だ。満足だよ。', 'おいしい！ごちそうさま！']);
  else if (total >= 45) cm = pick(['悪くはないが……注文と少し違うな。', 'うーん、まあまあかな。', '食べられなくはないけどね。']);
  else cm = pick(['……これを頼んだ覚えはないぞ。', 'ちょっと、注文聞いてた？', '箸が止まってしまった。']);
  if (disl.length) cm += `（${disl.map(k => TOPS[k].n).join('・')}は苦手だった）`;
  else if (liked.length >= 2) cm += `（${liked.map(k => TOPS[k].n).join('・')}が嬉しい）`;
  B.result = { total, soup: Math.round(soup), noodle: Math.round(noodle), boil: Math.round(boil), tops, boilWord, cm };
  G.scores.push({ c, total }); G.total += total;
}
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function rankOf(v) { return RANKS.find(r => v >= r[0]); }

/* ================= 進行 ================= */
function chooseSoup(k) { if (scene !== 'soup') return; B.soup = k; B.pour = 0; snd('splash'); renderUI(); }
function chooseNoodle(k) { if (scene !== 'noodle') return; B.noodle = k; snd('pick'); renderUI(); }
function toggleTop(k) {
  if (scene !== 'tops') return;
  const i = B.tops.indexOf(k);
  if (i >= 0) { B.tops.splice(i, 1); snd('unpick'); }
  else if (B.tops.length < MAX_TOPS) { B.tops.push(k); B.drop[k] = 0; snd('pick'); }
  renderUI();
}
function toScene(s) { scene = s; sceneT = 0; renderUI(); }
function dropNoodle() { if (scene !== 'boil' || B.boilStart) return; B.boilStart = sceneT; snd('splash'); renderUI(); }
function liftNoodle() {
  if (scene !== 'boil' || !B.boilStart || B.lifted) return;
  B.boil = sceneT - B.boilStart; B.lifted = true; B.liftT = sceneT; snd('splash');
  renderUI();
  setTimeout(() => { if (scene === 'boil') { B.noodleT = 0; toScene('tops'); } }, 900);
}
function serve() { if (scene !== 'tops') return; judge(); scene = 'eat'; sceneT = 0; snd('slurp'); renderUI(); setTimeout(() => { if (scene === 'eat') { scene = 'verdict'; sceneT = 0; snd(B.result.total >= 70 ? 'good' : 'bad'); renderUI(); } }, 2200); }
function afterVerdict() {
  G.i++;
  if (G.i >= DAY_LEN) {
    scene = 'final'; sceneT = 0;
    G.isBest = !window.tgAuto && G.total > best;
    if (G.isBest) { best = G.total; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
    snd('win'); renderUI(); return;
  }
  nextCustomer();
}

/* ================= 画面下のボタン ================= */
const ui = document.getElementById('ui');
function pips() { return `<div class="pips" aria-label="${G.i + 1}人目／${DAY_LEN}人">${Array.from({ length: DAY_LEN }, (_, k) => `<i class="${k < G.i ? 'done' : k === G.i ? 'now' : ''}"></i>`).join('')}</div>`; }
function head() { const c = cust(); return `<div class="bar"><span class="who">${c.n}</span><span class="small" style="color:var(--muted);font-size:12px">${c.t}</span>${pips()}<span class="sc">${G.total}点</span></div>`; }
function renderUI() {
  let h = '';
  if (scene === 'title') {
    h = `<section class="title"><h1>俺の<span>ラーメン</span>道</h1>
<p>夜の屋台に、今夜も腹をすかせた客がやってくる。注文をよく聞いて、スープ・麺・茹で加減・具を決め、五人の客を満足させろ。</p>
${best ? `<p class="best">これまでの最高 ${best}点</p>` : ''}
<button class="go" data-a="start">暖簾を出す</button></section>`;
  } else if (scene === 'order') {
    const c = cust();
    h = head() + `<div class="order">「${c.say}」<small>${c.t}</small></div><button class="go" data-a="toSoup">注文を受ける</button>`;
  } else if (scene === 'soup') {
    h = head() + `<p class="step">1／4<b>スープを選ぶ</b></p><div class="picks">${Object.entries(SOUPS).map(([k, s]) => `<button class="pick" data-a="soup:${k}" aria-pressed="${B.soup === k}"><canvas data-soup="${k}" width="200" height="200" aria-hidden="true"></canvas>${s.n}<small>${s.d}</small></button>`).join('')}</div>
<button class="go" data-a="toNoodle" ${B.soup ? '' : 'disabled'}>次へ：麺</button>`;
  } else if (scene === 'noodle') {
    h = head() + `<p class="step">2／4<b>麺を選ぶ</b></p><div class="picks three">${Object.entries(NOODLES).map(([k, n]) => `<button class="pick" data-a="noodle:${k}" aria-pressed="${B.noodle === k}"><canvas data-noodle="${k}" width="200" height="200" aria-hidden="true"></canvas>${n.n}<small>${n.d}・目安${n.t}秒</small></button>`).join('')}</div>
<button class="go" data-a="toBoil" ${B.noodle ? '' : 'disabled'}>次へ：茹でる</button>`;
  } else if (scene === 'boil') {
    h = head() + `<p class="step">3／4<b>麺を茹でる</b></p><p class="hint">${NOODLES[B.noodle].n}の目安は約${NOODLES[B.noodle].t}秒。数字は途中で湯気に隠れる。感覚で上げろ。</p>
${!B.boilStart ? '<button class="go" data-a="drop">麺を入れる</button>' : `<button class="go gold" data-a="lift" ${B.lifted ? 'disabled' : ''}>${B.lifted ? '湯切り！' : '上げる'}</button>`}`;
  } else if (scene === 'tops') {
    h = head() + `<p class="step">4／4<b>具をのせる</b>（${B.tops.length}/${MAX_TOPS}）</p><div class="picks">${TOP_ORDER.map(k => `<button class="pick" data-a="top:${k}" aria-pressed="${B.tops.includes(k)}" ${!B.tops.includes(k) && B.tops.length >= MAX_TOPS ? 'disabled' : ''}><canvas data-top="${k}" width="200" height="200" aria-hidden="true"></canvas>${TOPS[k].n}</button>`).join('')}</div>
<button class="go" data-a="serve">へい、お待ち！</button>`;
  } else if (scene === 'eat') {
    h = head() + `<p class="hint">${cust().n}が食べている……</p>`;
  } else if (scene === 'verdict') {
    const r = B.result;
    h = head() + `<section class="verdict"><div class="cm">「${r.cm}」</div>
<div class="parts"><span>スープ <b>${r.soup}</b>/40</span><span>麺 <b>${r.noodle}</b>/20</span><span>茹で ${r.boilWord} <b>${r.boil}</b>/25</span><span>具 <b>${r.tops >= 0 ? '+' : ''}${r.tops}</b></span></div>
<button class="go" data-a="next">${G.i + 1 >= DAY_LEN ? '店じまい' : '次のお客さん'}</button></section>`;
  } else if (scene === 'final') {
    const [_, rank, msg] = rankOf(G.total);
    h = `<section class="final"><p class="step">今夜の売り上げ</p><h2>${rank}</h2><p style="margin:0;color:#e6d6c0">${msg}</p>
<p style="margin:0;font-family:var(--disp);font-size:36px">${G.total}<span style="font-size:16px">／500点</span></p>${G.isBest ? '<p style="margin:0;color:var(--gold);font-weight:900">これまでで最高</p>' : ''}
<div class="list">${G.scores.map(s => `<div><span>${s.c.n}</span><b>${s.total}点</b></div>`).join('')}</div>
<div class="row" style="justify-content:center"><button class="go" data-a="start" style="max-width:280px">もう一晩</button></div></section>`;
  }
  ui.innerHTML = h;
  paintPicks(0);
}
function act(a) {
  const [k, x] = a.split(':');
  if (k === 'start') { snd('start'); startDay(); }
  else if (k === 'toSoup') { toScene('soup'); snd('click'); }
  else if (k === 'soup') chooseSoup(x);
  else if (k === 'toNoodle') { toScene('noodle'); snd('click'); }
  else if (k === 'noodle') chooseNoodle(x);
  else if (k === 'toBoil') { B.boilStart = 0; B.lifted = false; toScene('boil'); snd('click'); }
  else if (k === 'drop') dropNoodle();
  else if (k === 'lift') liftNoodle();
  else if (k === 'top') toggleTop(x);
  else if (k === 'serve') serve();
  else if (k === 'next') afterVerdict();
}
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el && !el.disabled) act(el.dataset.a); });

/* ================= 絵 ================= */
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
ctx.setTransform(2, 0, 0, 2, 0, 0);
const CW = 640, CH = 480;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function lerpCol(a, b, t) { const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)], A = p(a), B2 = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B2[i] - v) * t)).join(',')})`; }

/* 屋台の背景：暖簾、提灯、木のカウンター */
function drawShop(x, t) {
  const g = x.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, '#120a08'); g.addColorStop(.55, '#2a1810'); g.addColorStop(1, '#140c08');
  x.fillStyle = g; x.fillRect(0, 0, CW, CH);
  // 奥の灯り
  const glow = x.createRadialGradient(CW / 2, 120, 10, CW / 2, 120, 380);
  glow.addColorStop(0, 'rgba(255,170,90,.28)'); glow.addColorStop(1, 'rgba(255,170,90,0)');

    x.strokeStyle = '#f0cf78'; x.lineWidth = 4;
    for (let i = -1; i <= 1; i++) { x.beginPath(); x.moveTo(i * 4, -16); x.quadraticCurveTo(i * 8 + Math.sin(t * 20 + i) * 4, 40, i * 6, 120); x.stroke(); }
    x.strokeStyle = '#8a5a2a'; x.lineWidth = 5; x.beginPath(); x.moveTo(30, -6); x.lineTo(80, 80); x.moveTo(40, -10); x.lineTo(92, 74); x.stroke();
  }
  x.restore();
}

/* 寸胴とてぼ */
function drawPot(x, t) {
  const cx = CW / 2, cy = 300;
  // 火
  for (let i = 0; i < 9; i++) { const fx = cx - 120 + i * 30, fh = 26 + Math.sin(t * 12 + i * 2) * 10; const fg = x.createLinearGradient(0, 470, 0, 470 - fh); fg.addColorStop(0, '#2a6aff'); fg.addColorStop(.6, '#7ab0ff'); fg.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = fg; x.beginPath(); x.moveTo(fx - 10, 470); x.quadraticCurveTo(fx, 470 - fh * 1.4, fx + 10, 470); x.fill(); }
  // 胴
  const g = x.createLinearGradient(cx - 190, 0, cx + 190, 0);
  g.addColorStop(0, '#3a3e44'); g.addColorStop(.3, '#c8ccd2'); g.addColorStop(.45, '#f2f4f6'); g.addColorStop(.7, '#8a9098'); g.addColorStop(1, '#2a2e34');
  x.fillStyle = g; x.fillRect(cx - 190, cy - 110, 380, 230);
  x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(cx - 190, cy + 110, 380, 10);
  // 湯
  x.fillStyle = '#9aa2aa'; x.beginPath(); x.ellipse(cx, cy - 110, 190, 46, 0, 0, Math.PI * 2); x.fill();
  const wg = x.createRadialGradient(cx, cy - 116, 10, cx, cy - 110, 180); wg.addColorStop(0, '#f4f0e0'); wg.addColorStop(1, '#c8c0a8');
  x.fillStyle = wg; x.beginPath(); x.ellipse(cx, cy - 108, 178, 40, 0, 0, Math.PI * 2); x.fill();
  const boiling = B && B.boilStart;
  const r = mulberry(5 + Math.floor(t * 8));
  for (let i = 0; i < (boiling ? 40 : 16); i++) { const a = r() * Math.PI * 2, d = Math.sqrt(r()); x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 1.5; x.beginPath(); x.ellipse(cx + Math.cos(a) * 160 * d, cy - 108 + Math.sin(a) * 34 * d, 3 + r() * 6, 2 + r() * 3, 0, 0, Math.PI * 2); x.stroke(); }
  // てぼ（麺かご）
  if (B && B.noodle) {
    const lifted = B.lifted ? Math.min(1, (sceneT - B.liftT) / .3) : 0;
    const shake = B.lifted ? Math.sin((sceneT - B.liftT) * 40) * 10 * (1 - Math.min(1, (sceneT - B.liftT) / .8)) : 0;
    const inWater = B.boilStart ? 1 : 0;
    const ty = cy - 130 - (1 - inWater) * 60 - lifted * 110 + shake * .4;
    x.save(); x.translate(cx + 20 + shake, ty);
    x.strokeStyle = '#5a5e64'; x.lineWidth = 8; x.beginPath(); x.moveTo(50, -10); x.lineTo(210, -80); x.stroke();
    x.fillStyle = '#2a1a10'; x.fillRect(190, -92, 60, 20);
    x.fillStyle = 'rgba(160,166,172,.9)'; x.beginPath(); x.moveTo(-50, -10); x.lineTo(50, -10); x.lineTo(36, 70); x.lineTo(-36, 70); x.closePath(); x.fill();
    x.strokeStyle = 'rgba(60,64,70,.6)'; x.lineWidth = 1; for (let i = -46; i < 50; i += 7) { x.beginPath(); x.moveTo(i, -10); x.lineTo(i * .72, 70); x.stroke(); } for (let j = 0; j < 80; j += 8) { x.beginPath(); x.moveTo(-50 + j * .17, -10 + j); x.lineTo(50 - j * .17, -10 + j); x.stroke(); }
    x.save(); x.beginPath(); x.moveTo(-46, -6); x.lineTo(46, -6); x.lineTo(34, 66); x.lineTo(-34, 66); x.closePath(); x.clip();
    drawNoodles(x, 0, 30, .5, NOODLES[B.noodle], t, 9);
    x.restore();
    x.restore();
    if (B.lifted && sceneT - B.liftT < .9) { x.fillStyle = 'rgba(220,235,255,.8)'; const rr = mulberry(Math.floor(sceneT * 30)); for (let i = 0; i < 24; i++) { x.beginPath(); x.arc(cx + 20 + (rr() - .5) * 140, ty + 60 + rr() * 120, 2 + rr() * 3, 0, Math.PI * 2); x.fill(); } }
  }
  drawSteam(x, cx, cy - 120, 1.2, t);
  // 時間（途中で隠れる）
  if (B && B.boilStart) {
    const el = (B.lifted ? B.liftT : sceneT) - B.boilStart;
    const shown = el < 2.5 ? el.toFixed(1) : '?.?';
    x.fillStyle = 'rgba(0,0,0,.55)'; x.beginPath(); x.roundRect ? x.roundRect(cx - 80, 40, 160, 64, 14) : x.rect(cx - 80, 40, 160, 64); x.fill();
    x.fillStyle = el < 2.5 ? '#fff' : 'rgba(255,255,255,.55)'; x.font = '44px "Dela Gothic One",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(shown + '秒', cx, 74);
  }
}

/* 判定のはんこ */
function drawStamp(x, cx, cy, total, p) {
  const k = Math.min(1, p / .25), sc = 2.2 - 1.2 * (1 - Math.pow(1 - k, 3));
  const word = total >= 90 ? '絶品' : total >= 70 ? '美味' : total >= 45 ? '普通' : '不味';
  x.save(); x.translate(cx, cy); x.rotate(-.18); x.scale(sc, sc); x.globalAlpha = Math.min(1, k * 1.5);
  x.strokeStyle = '#d8241c'; x.fillStyle = 'rgba(216,36,28,.12)'; x.lineWidth = 6;
  x.beginPath(); x.arc(0, 0, 62, 0, Math.PI * 2); x.fill(); x.stroke();
  x.lineWidth = 2; x.beginPath(); x.arc(0, 0, 52, 0, Math.PI * 2); x.stroke();
  x.fillStyle = '#d8241c'; x.font = '34px "Dela Gothic One",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(word, 0, -8); x.font = '900 18px "Zen Kaku Gothic New",sans-serif'; x.fillText(total + '点', 0, 26);
  x.restore();
}

/* 一枚の絵として描く */
function drawStage(t) {
  const x = ctx;
  x.clearRect(0, 0, CW, CH);
  drawShop(x, t);
  if (scene === 'title') {
    drawCounter(x);
    const demo = B; B = TITLE_B;
    drawRamen(x, CW / 2, 330, 1, t);
    B = demo;
    return;
  }
  const c = G && cust();
  if (scene === 'order' || scene === 'verdict' || scene === 'eat') {
    const mood = scene === 'verdict' ? (B.result.total >= 70 ? 1 : B.result.total < 45 ? -1 : 0) : 0;
    drawCustomer(x, c, CW / 2, 250, 1.15, t, mood, scene === 'eat');
    drawCounter(x);
    if (scene !== 'order') drawRamen(x, CW / 2, 360, .78, t);
    if (scene === 'eat') { x.fillStyle = '#fff'; x.font = '40px "Dela Gothic One",sans-serif'; x.textAlign = 'center'; x.globalAlpha = .6 + .4 * Math.sin(t * 10); x.fillText('ズズッ', CW / 2 + 170, 150); x.globalAlpha = 1; }
    if (scene === 'verdict') drawStamp(x, CW - 120, 130, B.result.total, sceneT);
    return;
  }
  if (scene === 'boil') { drawCounter(x); drawPot(x, t); return; }
  if (scene === 'final') {
    drawCounter(x);
    const demo = B; B = TITLE_B; drawRamen(x, CW / 2, 330, 1, t); B = demo;
    return;
  }
  // スープ・麺・具：丼を大きく
  drawCounter(x);
  B.pour = Math.min(1, B.pour + .02);
  drawRamen(x, CW / 2, 300, 1.15, t, { fill: B.soup ? B.pour : 0, noodles: scene !== 'soup', rise: scene === 'noodle' ? 1 : 1 });
}
const TITLE_B = { soup: 'shoyu', noodle: 'chu', tops: ['nori', 'chashu', 'menma', 'ajitama', 'naruto', 'negi'], drop: { nori: 1, chashu: 1, menma: 1, ajitama: 1, naruto: 1, negi: 1 } };

/* 選択ボタンの小さな絵 */
function paintPicks(t) {
  document.querySelectorAll('canvas[data-soup]').forEach(c => {
    const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, 200, 200);
    x.fillStyle = '#2a1c13'; x.fillRect(0, 0, 200, 200);
    const keep = B; B = { soup: c.dataset.soup, tops: [], drop: {} };
    drawBowl(x, 100, 96, .38, c.dataset.soup, t); B = keep;
  });
  document.querySelectorAll('canvas[data-noodle]').forEach(c => {
    const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, 200, 200);
    x.fillStyle = '#2a1c13'; x.fillRect(0, 0, 200, 200);
    drawNoodles(x, 100, 100, .8, NOODLES[c.dataset.noodle], t, 4);
  });
  document.querySelectorAll('canvas[data-top]').forEach(c => {
    const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, 200, 200);
    x.fillStyle = '#2a1c13'; x.fillRect(0, 0, 200, 200);
    const k = c.dataset.top;
    drawTop(x, k, 100, k === 'nori' ? 130 : 104, k === 'nori' ? 1.4 : 1.7, t, k.length * 7);
  });
}

/* ================= オート ================= */
const AI = { next: 0, target: 0 };
function autoStep(dt) {
  if (scene === 'title' || scene === 'final') { AI.next -= dt; if (AI.next <= 0) { AI.next = scene === 'final' ? 6 : 1; if (scene === 'final' && AI.wait) { AI.wait = false; act('start'); } else if (scene === 'final') AI.wait = true; else act('start'); } return; }
  if (scene === 'boil') {
    if (!B.boilStart) { AI.next -= dt; if (AI.next <= 0) { dropNoodle(); AI.target = NOODLES[B.noodle].t + rnd(-.6, .6); } return; }
    if (!B.lifted && sceneT - B.boilStart >= AI.target) liftNoodle();
    return;
  }
  if (scene === 'eat') return;
  AI.next -= dt; if (AI.next > 0) return; AI.next = .9;
  const c = cust();
  const best = o => Object.entries(o).sort((a, b) => b[1] - a[1])[0][0];
  if (scene === 'order') act('toSoup');
  else if (scene === 'soup') { if (!B.soup) chooseSoup(Math.random() < .85 ? best(c.soup) : pick(Object.keys(SOUPS))); else act('toNoodle'); }
  else if (scene === 'noodle') { if (!B.noodle) chooseNoodle(Math.random() < .85 ? best(c.noodle) : pick(Object.keys(NOODLES))); else act('toBoil'); }
  else if (scene === 'tops') {
    const want = c.like.filter(k => !B.tops.includes(k));
    if (want.length && B.tops.length < MAX_TOPS) toggleTop(want[0]);
    else if (B.tops.length < 3) { const ok = TOP_ORDER.filter(k => !c.dis.includes(k) && !B.tops.includes(k)); if (ok.length) toggleTop(pick(ok)); else serve(); }
    else serve();
  }
  else if (scene === 'verdict') { AI.next = 2.2; act('next'); }
}

/* ================= ループ ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  sceneT += dt;
  if (B) for (const k in B.drop) B.drop[k] += dt;
  if (window.tgAuto) autoStep(dt);
  drawStage(now / 1000);
  if (scene === 'soup' || scene === 'noodle' || scene === 'tops') paintPicksThrottled(now / 1000);
  requestAnimationFrame(frame);
}
let lastPick = 0;
function paintPicksThrottled(t) { if (t - lastPick < .1) return; lastPick = t; paintPicks(t); }
renderUI();
requestAnimationFrame(frame);
</script>

<script>
/* ---------- 共通の効果音（Web Audioで合成） ---------- */
window.tgSound = (function(){
  var AC = null, noiseBuf = null, on = true, last = {};
  try { on = localStorage.getItem('tg_sound') !== '0'; } catch (e) {}
  function ctx(){
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();

  }
  function tone(f, dur, type, vol, slide, delay){
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, vol, freq, delay, kind){
    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = 1;
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + .03);
  }
  function arp(fs, step, type, vol, dur){ fs.forEach(function(f, i){ tone(f, dur || .22, type, vol, 0, i * step); }); }
  var LIB = {
    click:  function(){ tone(900, .05, 'square', .03); },
    pick:   function(){ tone(660, .06, 'triangle', .07); tone(990, .08, 'triangle', .06, 0, .05); },
    unpick: function(){ tone(520, .08, 'triangle', .06, .7); },
    tick:   function(){ tone(1500 + Math.random() * 300, .025, 'square', .025); },
    land:   function(){ tone(784, .09, 'square', .05); tone(1175, .18, 'square', .05, 0, .07); },
    start:  function(){ arp([392, 523, 659], .09, 'square', .05, .18); },
    shot:   function(){ tone(1200, .07, 'square', .025, .45); },
    shotFoe:function(){ tone(700, .08, 'square', .02, .5); },
    slash:  function(){ noise(.12, .12, 2600, 0, 'highpass'); tone(500, .1, 'sawtooth', .03, .5); },
    dash:   function(){ noise(.2, .1, 800, 0, 'bandpass'); tone(200, .2, 'sine', .06, 2.2); },
    charge: function(){ tone(200, .7, 'sawtooth', .05, 4); },
    beam:   function(){ noise(.5, .2, 500, 0, 'lowpass'); tone(90, .5, 'sawtooth', .08, .5); },
    hit:    function(){ noise(.09, .14, 900, 0, 'lowpass'); tone(160, .08, 'square', .04, .6); },
    big:    function(){ noise(.3, .22, 400, 0, 'lowpass'); tone(110, .3, 'sawtooth', .07, .5); },
    heal:   function(){ arp([784, 988, 1319], .06, 'sine', .06, .2); },
    miss:   function(){ noise(.15, .06, 3000, 0, 'highpass'); },
    good:   function(){ arp([659, 784, 1047], .08, 'triangle', .07, .25); },
    bad:    function(){ tone(330, .25, 'triangle', .07, .75); tone(247, .35, 'triangle', .06, .8, .18); },
    win:    function(){ arp([523, 659, 784, 1047, 1319], .1, 'square', .045, .28); },
    lose:   function(){ arp([392, 330, 262, 196], .22, 'triangle', .08, .4); },
    splash: function(){ noise(.35, .18, 700, 0, 'lowpass'); noise(.2, .08, 2400, .05, 'bandpass'); },
    bubble: function(){ tone(250 + Math.random() * 250, .07, 'sine', .04, 1.8); },
    slurp:  function(){ noise(.5, .12, 1400, 0, 'bandpass'); noise(.3, .08, 900, .55, 'bandpass'); },
    coin:   function(){ tone(988, .06, 'square', .04); tone(1319, .14, 'square', .04, 0, .06); },
    summon: function(){ tone(130, 1, 'sawtooth', .05, 3); arp([523, 784, 1047, 1568], .12, 'sine', .07, .5); },
    evolve: function(){ arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], .07, 'triangle', .06, .3); },
    fuse:   function(){ tone(110, 1.1, 'sawtooth', .06, 2.5); noise(.9, .1, 300, .2, 'lowpass'); arp([659, 880, 1319], .12, 'sine', .07, .4); }
  };
  function play(name){
    if (!on || !LIB[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < 55) return;
    last[name] = now;
    if (!ctx()) return;
    try { LIB[name](); } catch (e) {}
  }
  var btn = document.querySelector('.tg-snd');
  function sync(){ if (btn) { btn.textContent = on ? '音：ON' : '音：OFF'; btn.setAttribute('aria-pressed', String(on)); } }
  if (btn) {
    ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ btn.addEventListener(t, function(e){ e.stopPropagation(); }); });
    btn.addEventListener('click', function(e){
      e.stopPropagation(); on = !on; sync(); btn.blur();
      try { localStorage.setItem('tg_sound', on ? '1' : '0'); } catch (err) {}
      if (on) { ctx(); play('pick'); }
    });
  }
  sync();
  // ブラウザは最初の操作まで音を出せないので、最初のタップで準備する
  window.addEventListener('pointerdown', function(){ if (on) ctx(); }, { once: true, capture: true });
  return { play: play };
})();
</script>

  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
})();
</script>
