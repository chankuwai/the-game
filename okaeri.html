<title>おかえりさま</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Shippori+Mincho:wght@400;600;800&family=Yuji+Syuku&display=swap">
<style>
/* 紙のゲームブックの一頁を闇に置く：番号札・本文・行き先付きの選択肢。周囲はノイズと周辺減光。単一の夜の配色で統一 */
:root{
  --ink:#0b0d12;
  --night:#141821;
  --paper:#d9d3c5;
  --ash:#8b8679;
  --hozuki:#d4772f;
  --rust:#a3322a;
  --line:#2a2f3b;
  --f-title:"Yuji Syuku","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-dot:"DotGothic16","Osaka-Mono","MS Gothic",monospace;
  --dread:0;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:17px;line-height:1.95;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--hozuki);outline-offset:3px}

/* 雰囲気レイヤー */
#noise{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;z-index:5;opacity:calc(.045 + var(--dread) * .11);mix-blend-mode:screen}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
  background:
   radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,0,0,calc(.5 + var(--dread) * .4)) 100%),
   radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(110,18,12,calc(var(--dread) * .28)) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:6;background:var(--rust);opacity:0}
#flash.on{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
#whispers{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.whisper{position:absolute;font-family:var(--f-title);color:var(--rust);opacity:0;animation:whisper 4.5s ease-in-out forwards;white-space:nowrap}
@keyframes whisper{0%{opacity:0;filter:blur(4px)}40%{opacity:.55;filter:blur(0)}100%{opacity:0;filter:blur(6px)}}

.wrap{position:relative;z-index:2;max-width:660px;margin:0 auto;padding-inline:16px;padding-block:28px 72px}

/* タイトル */
#title-screen{display:flex;flex-direction:row-reverse;gap:24px;align-items:flex-start}
.title-col{position:relative;flex:none}
.title-col::before{content:"";position:absolute;left:50%;top:18%;width:220px;height:220px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle, rgba(212,119,47,.28), transparent 65%);animation:lantern 5s ease-in-out infinite;pointer-events:none}
@keyframes lantern{0%,100%{opacity:.8}45%{opacity:1}50%{opacity:.55}55%{opacity:.95}}
h1{position:relative;writing-mode:vertical-rl;font-family:var(--f-title);font-weight:400;font-size:clamp(64px,17vw,104px);line-height:1;margin:0;letter-spacing:.06em;color:var(--paper);text-shadow:0 0 24px rgba(212,119,47,.25)}
.title-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px;padding-top:6px}
.eyebrow{font-family:var(--f-dot);color:var(--hozuki);letter-spacing:.25em;font-size:13px;margin:0}
.lede{font-size:18px;line-height:2;margin:0;text-wrap:pretty}
.rules{font-family:var(--f-dot);font-size:13.5px;line-height:1.9;color:var(--ash);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:12px;margin:0;display:grid;gap:4px}
.rules b{color:var(--paper);font-weight:400}
.field{display:grid;gap:6px}
.field label{font-family:var(--f-dot);font-size:13px;color:var(--ash);letter-spacing:.12em}
.field input{background:var(--night);border:1px solid var(--line);color:var(--paper);font-family:var(--f-body);font-size:18px;padding:10px 12px;width:100%;max-width:240px;box-sizing:border-box}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);background:var(--night);padding:10px 12px;display:grid;gap:2px}
.stat span{font-family:var(--f-dot);font-size:12px;color:var(--ash);letter-spacing:.12em}
.stat strong{font-family:var(--f-dot);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.2}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:transparent;border:1px solid var(--hozuki);color:var(--hozuki);font-family:var(--f-dot);font-size:15px;letter-spacing:.12em;padding:11px 20px;transition:background .2s,color .2s}
.btn:hover{background:var(--hozuki);color:var(--ink)}
.btn.ghost{border-color:var(--line);color:var(--ash)}
.btn.ghost:hover{background:var(--line);color:var(--paper)}
.btn.big{font-size:18px;padding:14px 28px}
.note{font-family:var(--f-dot);font-size:12.5px;color:var(--ash);margin:0}
.record{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.record h2{font-family:var(--f-dot);font-weight:400;font-size:13px;letter-spacing:.15em;color:var(--ash);margin:0}
.record ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.record li{font-family:var(--f-dot);font-size:12.5px;border:1px solid var(--line);padding:3px 9px;color:var(--ash)}
.record li.got{color:var(--paper);border-color:var(--ash)}
.record li.got.t-TRUE{color:var(--hozuki);border-color:var(--hozuki)}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:rgba(11,13,18,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:26px;display:grid;gap:8px}
.hud-stats{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:14px;align-items:end}
.hs{display:grid;gap:3px;min-width:0}
.hs span{font-family:var(--f-dot);font-size:11.5px;color:var(--ash);letter-spacing:.1em;display:flex;justify-content:space-between;gap:6px}
.hs span em{font-style:normal;color:var(--paper);font-variant-numeric:tabular-nums}
.hs strong{font-family:var(--f-dot);font-weight:400;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--paper);transition:width .6s ease}
.bar.san i{background:var(--rust)}
#snd{border:1px solid var(--line);background:transparent;font-family:var(--f-dot);font-size:12px;color:var(--ash);padding:6px 9px;white-space:nowrap}
.items{display:flex;flex-wrap:wrap;gap:6px;min-height:22px;align-items:center}
.items .lbl{font-family:var(--f-dot);font-size:11.5px;color:var(--ash);letter-spacing:.1em}
.chip{font-family:var(--f-dot);font-size:12px;border:1px solid var(--hozuki);color:var(--hozuki);padding:1px 8px}
.items .none{font-family:var(--f-dot);font-size:12px;color:var(--line)}

/* 頁 */
.page{display:grid;gap:18px}
.page.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,2px)}}
.pno{justify-self:start;font-family:var(--f-dot);font-size:26px;line-height:1;color:var(--hozuki);border:1px solid var(--hozuki);padding:8px 14px 6px;font-variant-numeric:tabular-nums;animation:pin .5s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#text{cursor:default;min-height:6em}
#text p{margin:0 0 .75em;text-wrap:pretty}
#text p:empty{display:none}
.skip{font-family:var(--f-dot);font-size:12px;color:var(--ash);margin:0}
#sys{display:grid;gap:2px}
#sys p{margin:0;font-family:var(--f-dot);font-size:14px;color:var(--rust)}
#sys p.gain{color:var(--hozuki)}
#choices{display:grid;gap:10px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;background:var(--night);border:1px solid var(--line);padding:14px 16px;font-family:var(--f-body);font-size:16.5px;line-height:1.6;transition:border-color .2s, transform .2s;animation:rise .4s ease-out both}
.choice:hover:not(:disabled){border-color:var(--hozuki);transform:translateX(3px)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice .lab{min-width:0}
.choice .to{flex:none;font-family:var(--f-dot);font-size:14px;color:var(--hozuki);white-space:nowrap}
.choice .need{display:block;font-family:var(--f-dot);font-size:12px;color:var(--ash)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lie{font-family:var(--f-dot);font-size:13px;color:var(--rust);margin:0}

/* 判定 */
.check{border:1px solid var(--line);background:var(--night);padding:16px;display:grid;gap:14px;animation:rise .35s ease-out}
.check h3{margin:0;font-family:var(--f-dot);font-weight:400;font-size:14px;letter-spacing:.12em;color:var(--hozuki)}
.check .rule{margin:0;font-family:var(--f-dot);font-size:13px;color:var(--ash)}
.dice{display:flex;gap:12px;align-items:center}
.die{width:52px;height:52px;background:var(--paper);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;box-sizing:border-box;gap:2px}
.die i{border-radius:50%;background:transparent;margin:2px}
.die i.p{background:var(--ink)}
.die.red i.p{background:var(--rust)}
.sum{font-family:var(--f-dot);font-size:26px;font-variant-numeric:tabular-nums;margin-left:4px}
.verdict{margin:0;font-family:var(--f-dot);font-size:16px;letter-spacing:.2em}
.verdict.ok{color:var(--hozuki)}
.verdict.ng{color:var(--rust)}
.check .res{margin:0;text-wrap:pretty}
.tally{display:flex;gap:6px;font-family:var(--f-dot);font-size:13px;color:var(--ash);align-items:center}
.tally b{width:14px;height:14px;border:1px solid var(--hozuki);display:inline-block}
.tally b.on{background:var(--hozuki)}
.log{display:grid;gap:4px}
.log p{margin:0;font-size:15.5px}
.log p.ng{color:var(--rust)}

/* 結末 */
.end{border-top:1px solid var(--line);padding-top:22px;display:grid;gap:14px;animation:rise .8s ease-out}
.end .kind{font-family:var(--f-dot);letter-spacing:.35em;font-size:14px;color:var(--rust)}
.end.k-NORMAL .kind{color:var(--ash)}
.end.k-TRUE .kind{color:var(--hozuki)}
.end strong{font-family:var(--f-title);font-weight:400;font-size:clamp(34px,9vw,48px);line-height:1.2}

@media (max-width:420px){
  .hud-stats{grid-template-columns:auto 1fr 1fr;row-gap:8px}
  #snd{grid-column:1 / -1;justify-self:end;grid-row:1}
  .hud-stats{grid-template-areas:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before{animation:none!important;transition:none!important}
}
</style>

<canvas id="noise" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>
<div id="whispers" aria-hidden="true"></div>

<main class="wrap">
  <section id="title-screen">
    <div class="title-col"><h1>おかえりさま</h1></div>
    <div class="title-body">
      <p class="eyebrow">HORROR GAMEBOOK</p>
      <p class="lede">山奥の村に、ほおずき灯籠がともる夜。<br>名前を呼ばれても、けっして振り返ってはいけない。</p>
      <div class="rules">
        <div>本文を読み、選んだ<b>番号の項</b>へ進む。</div>
        <div>判定は<b>サイコロ2個の合計が能力値以下</b>なら成功。</div>
        <div>正気度が減るほど判定は難しくなり、文字も、選択肢も、信用できなくなる。</div>
        <div>正気度か体力が <b>0</b> になったら、そこで終わり。</div>
      </div>
      <div class="field">
        <label for="pname">あなたの名前</label>
        <input id="pname" maxlength="8" placeholder="ユウキ" autocomplete="off">
      </div>
      <div class="sheet" aria-live="polite">
        <div class="stat"><span>技量</span><strong id="t-skill">–</strong></div>
        <div class="stat"><span>体力</span><strong id="t-hp">–</strong></div>
        <div class="stat"><span>正気度</span><strong id="t-san">–</strong></div>
      </div>
      <div class="row">
        <button class="btn ghost" id="reroll">能力値を振りなおす</button>
      </div>
      <div class="row">
        <button class="btn big" id="start">はじめる</button>
      </div>
      <p class="note">音が鳴ります。暗い部屋で、ヘッドホン推奨。</p>
      <div class="record">
        <h2 id="rec-h">記録した結末</h2>
        <ul id="rec"></ul>
      </div>
    </div>
  </section>

  <section id="game" hidden>
    <header class="hud">
      <div class="hud-stats">
        <div class="hs"><span>技量</span><strong id="h-skill">0</strong></div>
        <div class="hs"><span>体力 <em id="h-hp">0/0</em></span><div class="bar"><i id="b-hp"></i></div></div>
        <div class="hs"><span>正気度 <em id="h-san">0/0</em></span><div class="bar san"><i id="b-san"></i></div></div>
        <button id="snd" aria-pressed="true">音 あり</button>
      </div>
      <div class="items" id="items"></div>
    </header>
    <article class="page" id="page">
      <div class="pno" id="pno">1</div>
      <div id="text" aria-live="polite"></div>
      <p class="skip" id="skip" hidden>タップで全文を表示</p>
      <div id="sys"></div>
      <div id="choices"></div>
    </article>
  </section>
</main>

<script>
(function(){
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const d6=()=>1+Math.floor(Math.random()*6);
const pick=a=>a[Math.floor(Math.random()*a.length)];

let S=null, deltas=[], base=null, typing=null;

/* ---------- 状態操作 ---------- */
const has=i=>S.items.includes(i);
function add(i){ if(!has(i)){ S.items.push(i); deltas.push({t:'「'+i+'」を手に入れた',g:1}); } }
function del(i){ S.items=S.items.filter(x=>x!==i); deltas.push({t:'「'+i+'」を失った'}); }
function san(n){ S.san=Math.max(0,Math.min(S.maxSan,S.san+n)); deltas.push({t:'正気度 '+(n>0?'+':'−')+Math.abs(n),g:n>0}); }
function hp(n){ S.hp=Math.max(0,Math.min(S.maxHp,S.hp+n)); deltas.push({t:'体力 '+(n>0?'+':'−')+Math.abs(n),g:n>0}); }

/* ---------- 物語 ---------- */
const ENDS=[[13,'BAD','おかえりなさい'],[199,'BAD','名を返す'],[44,'BAD','井戸の底'],[206,'BAD','つかまった'],[150,'BAD','身代わり'],[9,'BAD','踊りの輪'],[96,'NORMAL','夜明けの道'],[97,'NORMAL','おかえりの声'],[250,'TRUE','送り火']];

const N={
1:{sfx:'low',text:`午前一時を回った山道で、車のエンジンが咳きこむように止まった。
ヘッドライトが二度またたいて、消える。スマートフォンは圏外。
来た道の先には、口を開けたままの古いトンネル。
反対側の谷底には、ぽつぽつと橙色の灯りが揺れている。ほおずきの形をした灯籠だ。
こんな時間に、祭りでもやっているのだろうか。`,
choices:[{label:'谷底の村へ下りる',to:8},{label:'トンネルを歩いて戻る',to:47}]},

47:{sfx:'whisper',text:`トンネルの中は、外よりずっと冷たい。
自分の足音が壁に跳ね返って、戻ってくる。
コツ、コツ、コツ。……コツ。
ひとつ多い。
立ち止まると、音も止まる。歩き出すと、また数がずれる。
やがて、すぐ背後で誰かが息を吸う音がした。
「{name}」
懐かしい声だった。`,
choices:[{label:'振り返る',to:112},{label:'前だけを見て走る',check:{stat:'san',ok:48,ng:48,okText:'歯を食いしばり、声を振り切って走った。',ngText:'声は、出口までずっと耳元についてきた。何度も、何度も名前を呼びながら。',ngFx:()=>san(-2)}}]},

112:{sfx:'stinger',shake:1,on:()=>{san(-3);S.flags.hand=1;},text:`振り返った。
誰もいない。
ただ、トンネルの壁一面に、白いものがびっしりと貼りついていた。
手形だ。子どもの、大人の、年寄りの。数えきれないほど。
そのうちのひとつが、まだ濡れている。
あなたの手と、同じ大きさだった。
気がつくと、あなたは村へ続く坂道を下っていた。どうやってここまで来たのか、覚えていない。`,
choices:[{label:'村の入口へ',to:8}]},

48:{text:`出口の光に飛びこむと、そこは……さっき車を停めた場所だった。
車は、ない。
代わりに、谷底の灯りがさっきより近くに見える。
トンネルは、どこにも繋がっていなかった。`,
choices:[{label:'村へ下りるしかない',to:8}]},

8:{sfx:'bell',text:`村の入口には、朽ちかけた鳥居が立っていた。
柱には、白い紙の短冊がびっしりと結ばれている。どれにも人の名前が書いてある。
鳥居の脇の立て札には、墨で大きく一言。
『おかえりなさい』
ちりん、と鈴の音。
灯籠を提げた小柄な老婆が、闇の中からこちらを見ていた。
「ああ、おかえり。遅かったねえ、{name}」
名乗った覚えは、ない。`,
choices:[{label:'老婆についていく',to:63},{label:'相手にせず、ひとりで村を調べる',to:29}]},

63:{on:()=>add('お守り'),text:`老婆の家は、線香と湿った畳の匂いがした。
出された茶は、ぬるい。
床の間に古い写真が飾ってある。村人たちの集合写真だ。
その真ん中で笑っているのは、どう見てもあなただった。
写真の隅には『昭和四十九年　おかえりさま』とある。
「今夜はね、おかえりさまの晩なんだよ」と老婆は言った。
「約束はみっつだけ。名前を呼ばれても返事をしないこと。振り返らないこと。お面の人から、ものをもらって食べないこと」
老婆は赤い紐のついたお守りを、あなたの手に握らせた。
「朝まで、もてばいいねえ」`,
choices:[{label:'奥の部屋で朝まで休む',to:154},{label:'外の鈴の音が気になる。外へ出る',to:91}]},

154:{sfx:'whisper',text:`布団に入ると、すぐに意識が沈んだ。
夢の中で、誰かが数を数えている。
ひとつ、ふたつ、みっつ。……ひとつ、たりない。
目を開けた。
襖が細く開いている。その隙間から、老婆の顔がこちらを覗いていた。
逆さまに。
天井に張りついたまま、首だけをこちらに向けて。`,

const AU={ctx:null,master:null,drone:null,lp:null,on:true,hb:null};

function env(g,t,a,peak,dec){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+dec); }

    const w=document.createElement('span'); w.className='whisper';
    w.textContent=Math.random()<.3?S.name:pick(WHISPERS);
    w.style.left=(5+Math.random()*70)+'%'; w.style.top=(10+Math.random()*80)+'%';
    w.style.fontSize=(18+Math.random()*26+(5-S.san)*4)+'px';
    $('#whispers').append(w); setTimeout(()=>w.remove(),4700);
    if(Math.random()<.35) sfx('whisper');
  }
  setTimeout(whisperLoop, S&&S.san<=5?(2200+S.san*900+Math.random()*2500):3000);
}
setTimeout(whisperLoop,3000);

/* ---------- 文字の乱れ ---------- */
const GL='■□目呼帰返おかえりアヰヱ〓';
function glitch(str){
  if(S.san>6) return str;
  const p=(7-S.san)*.03; let out='';
  for(const ch of str) out+=(ch!=='\n'&&ch!=='「'&&ch!=='」'&&Math.random()<p)?pick(GL):ch;
  if(S.san<=3){ const L=out.split('\n'); L.splice(1+Math.floor(Math.random()*(L.length-1)),0,'うしろにいる。うしろにいる。うしろにいる。'); out=L.join('\n'); }
  return out;
}

/* ---------- 記録 ---------- */
function loadRec(){ try{ return JSON.parse(localStorage.getItem('okaerisama-ends')||'[]'); }catch(e){ return []; } }
function saveRec(id){ if(window.tgAuto) return; try{ const r=loadRec(); if(!r.includes(id)){ r.push(id); localStorage.setItem('okaerisama-ends',JSON.stringify(r)); } }catch(e){} }
function renderRec(){
  const r=loadRec(), ul=$('#rec'); ul.innerHTML='';
  ENDS.forEach(([id,k,t])=>{ const li=document.createElement('li'); const got=r.includes(id); li.className=got?('got t-'+k):''; li.textContent=got?(k+'｜'+t):'？？？'; ul.append(li); });
  $('#rec-h').textContent='記録した結末　'+r.filter(id=>ENDS.some(e=>e[0]===id)).length+' / '+ENDS.length;
}

/* ---------- HUD ---------- */
function hud(){
  $('#h-skill').textContent=S.skill;
  $('#h-hp').textContent=S.hp+'/'+S.maxHp; $('#b-hp').style.width=(S.hp/S.maxHp*100)+'%';
  $('#h-san').textContent=S.san+'/'+S.maxSan; $('#b-san').style.width=(S.san/S.maxSan*100)+'%';
  const it=$('#items'); it.innerHTML='<span class="lbl">持ち物</span>';
  if(!S.items.length){ const n=document.createElement('span'); n.className='none'; n.textContent='なし'; it.append(n); }
  S.items.forEach(i=>{ const c=document.createElement('span'); c.className='chip'; c.textContent=i; it.append(c); });
  document.documentElement.style.setProperty('--dread',dread().toFixed(3));
  dreadAudio();
}
function showDeltas(){
  const box=$('#sys'); box.innerHTML='';
  deltas.forEach(d=>{ const p=document.createElement('p'); if(d.g) p.className='gain'; p.textContent='［'+d.t+'］'; box.append(p); });
}

/* ---------- 進行 ---------- */
function tpl(s){ return s.replace(/\{name\}/g,S.name); }
function goTo(id){
  const n=N[id]; S.node=id; deltas=[];
  if(n.on) n.on(S);
  if(!n.end){ if(S.san<=0) return goTo(9); if(S.hp<=0) return goTo(206); }
  render(n,id);
}
function render(n,id){
  const pn=$('#pno'); pn.textContent=id; pn.style.animation='none'; void pn.offsetWidth; pn.style.animation='';
  $('#choices').innerHTML=''; $('#sys').innerHTML='';
  if(n.sfx) sfx(n.sfx);
  if(n.shake){ shake(); if(n.sfx==='stinger') flash(); }
  hud();
  let str=tpl(typeof n.text==='function'?n.text(S):n.text);
  if(!n.end) str=glitch(str);
  window.scrollTo({top:0,behavior:RM?'auto':'smooth'});
  typeText(str,()=>{
    showDeltas();
    if(n.end) return showEnd(n,id);
    if(n.chase) return showChase();
    showChoices(n);
  });
}
function typeText(str,done){
  clearInterval(typing);
  const box=$('#text'), skip=$('#skip'); box.innerHTML='';
  const L=str.split('\n'); const ps=L.map(()=>{ const p=document.createElement('p'); box.append(p); return p; });
  let finished=false;
  const finish=()=>{ if(finished) return; finished=true; clearInterval(typing); ps.forEach((p,i)=>p.textContent=L[i]); box.onclick=null; skip.hidden=true; done(); };
  if(RM) return finish();
  skip.hidden=false; let li=0,ci=0;
  typing=setInterval(()=>{
    for(let k=0;k<2;k++){
      if(li>=L.length) return finish();
      if(ci<L[li].length) ps[li].textContent+=L[li][ci++]; else { li++; ci=0; }
    }
  },30);
  box.onclick=finish; skip.onclick=finish;
}
function choiceTag(c){ return c.to?('→ '+c.to):c.check?(c.check.stat==='skill'?'技量判定':'正気度判定'):'→ ？'; }
function showChoices(n){
  const box=$('#choices'); box.innerHTML='';
  const list=n.choices.filter(c=>!c.cond||c.cond(S));
  let disp=list.map(c=>({label:c.label,tag:choiceTag(c)}));
  let lied=false;
  if(S.san<=3&&list.length>1&&Math.random()<.6){ disp.push(disp.shift()); lied=true; }
  if(lied||S.san<=3){ const p=document.createElement('p'); p.className='lie'; p.textContent='文字がにじむ。どれが本当の選択肢なのか、わからない。'; box.append(p); }
  list.forEach((c,i)=>{
    const b=document.createElement('button'); b.className='choice'; b.style.animationDelay=(i*.08)+'s';
    const lab=document.createElement('span'); lab.className='lab'; lab.textContent=disp[i].label;
    const locked=c.need&&!has(c.need);
    if(c.need){ const nd=document.createElement('span'); nd.className='need'; nd.textContent=locked?('「'+c.need+'」が必要'):('「'+c.need+'」を使う'); lab.append(nd); }
    const to=document.createElement('span'); to.className='to'; to.textContent=disp[i].tag;
    b.append(lab,to); b.disabled=!!locked;
    b.onclick=()=>choose(c); box.append(b);
  });
}
function choose(c){
  audioInit();
  if(c.check) return showCheck(c.check);
  if(c.go) return goTo(c.go(S));
  goTo(c.to);
}

/* ---------- サイコロ ---------- */
const FACES={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieEl(){ const d=document.createElement('div'); d.className='die'; for(let i=0;i<9;i++) d.append(document.createElement('i')); return d; }
function setDie(d,v){ [...d.children].forEach((c,i)=>c.className=FACES[v].includes(i)?'p':''); d.classList.toggle('red',v===1); }
function rollAnim(dice,cb){
  sfx('dice');
  const a=d6(), b=d6();
  if(RM){ setDie(dice[0],a); setDie(dice[1],b); return cb(a,b); }
  let k=0; const iv=setInterval(()=>{ setDie(dice[0],d6()); setDie(dice[1],d6()); if(++k>9){ clearInterval(iv); setDie(dice[0],a); setDie(dice[1],b); cb(a,b); } },65);
}
function diceRow(){ const row=document.createElement('div'); row.className='dice'; const d1=dieEl(), d2=dieEl(), sm=document.createElement('span'); sm.className='sum'; sm.textContent='?'; setDie(d1,6); setDie(d2,6); row.append(d1,d2,sm); return {row,dice:[d1,d2],sum:sm}; }
function showCheck(ch){
  const box=$('#choices'); box.innerHTML='';
  const isSkill=ch.stat==='skill', target=isSkill?S.skill:S.san;
  const p=document.createElement('div'); p.className='check';
  p.innerHTML='<h3>'+(isSkill?'技量判定':'正気度判定')+'</h3>';
  const rule=document.createElement('p'); rule.className='rule'; rule.textContent='サイコロ2個の合計が '+target+' 以下なら成功'; p.append(rule);
  const dr=diceRow(); p.append(dr.row);
  const btn=document.createElement('button'); btn.className='btn'; btn.textContent='サイコロを振る'; p.append(btn);
  box.append(p); btn.focus({preventScroll:true});
  btn.onclick=()=>{
    btn.remove();
    rollAnim(dr.dice,(a,b)=>{
      const sum=a+b, ok=sum<=target; dr.sum.textContent='= '+sum;
      const v=document.createElement('p'); v.className='verdict '+(ok?'ok':'ng'); v.textContent=ok?'成功':'失敗';
      const r=document.createElement('p'); r.className='res'; r.textContent=tpl(ok?ch.okText:ch.ngText);
      p.append(v,r);
      deltas=[];
      if(ok&&ch.okFx) ch.okFx(S);
      if(!ok&&ch.ngFx){ ch.ngFx(S); sfx('thump'); shake(); }
      hud(); showDeltas();
      const nx=ok?ch.ok:ch.ng;
      const go=document.createElement('button'); go.className='btn'; go.textContent='→ '+nx+' へ進む';
      go.onclick=()=>goTo(nx); p.append(go); go.focus({preventScroll:true});
    });
  };
}
function showChase(){
  const box=$('#choices'); box.innerHTML='';
  let succ=0;
  const p=document.createElement('div'); p.className='check';
  p.innerHTML='<h3>逃走判定</h3>';
  const rule=document.createElement('p'); rule.className='rule'; rule.textContent='技量 '+S.skill+' 以下を2回出せば逃げ切れる。失敗するたびに体力 −3'; p.append(rule);
  const tally=document.createElement('div'); tally.className='tally'; tally.innerHTML='逃げ切りまで <b></b><b></b>'; p.append(tally);
  const dr=diceRow(); p.append(dr.row);
  const log=document.createElement('div'); log.className='log'; p.append(log);
  const btn=document.createElement('button'); btn.className='btn'; btn.textContent='逃げる'; p.append(btn);
  box.append(p); btn.focus({preventScroll:true});
  btn.onclick=()=>{
    btn.disabled=true;
    rollAnim(dr.dice,(a,b)=>{
      const sum=a+b, ok=sum<=S.skill; dr.sum.textContent='= '+sum;
      const line=document.createElement('p');
      deltas=[];
      if(ok){ succ++; line.textContent=pick(CHASE_OK); tally.querySelectorAll('b')[succ-1].classList.add('on'); }
      else { line.className='ng'; line.textContent=pick(CHASE_NG); hp(-3); sfx('thump'); shake(); flash(); }
      log.append(line); hud(); showDeltas();
      if(S.hp<=0){ btn.remove(); const g=document.createElement('button'); g.className='btn'; g.textContent='→ 206'; g.onclick=()=>goTo(206); p.append(g); g.focus({preventScroll:true}); return; }
      if(succ>=2){ btn.remove(); const g=document.createElement('button'); g.className='btn'; g.textContent='→ 77 石段を駆け下りる'; g.onclick=()=>goTo(77); p.append(g); g.focus({preventScroll:true}); return; }
      btn.disabled=false; btn.textContent='まだ追ってくる。逃げる';
    });
  };
}

/* ---------- 結末 ---------- */
function showEnd(n,id){
  saveRec(id);
  const [kind,title]=n.end;if(kind!=='BAD'&&window.tgClear)tgClear('okaeri',kind);
  const box=$('#choices'); box.innerHTML='';
  const e=document.createElement('div'); e.className='end k-'+kind;
  const k=document.createElement('span'); k.className='kind'; k.textContent=kind+' END';
  const t=document.createElement('strong'); t.textContent=title;
  const row=document.createElement('div'); row.className='row';
  const again=document.createElement('button'); again.className='btn'; again.textContent='同じ名前で、もう一度';
  again.onclick=()=>{ rollBase(); startGame(); };
  const back=document.createElement('button'); back.className='btn ghost'; back.textContent='タイトルへ';
  back.onclick=toTitle;
  row.append(again,back); e.append(k,t,row); box.append(e);
}

/* ---------- タイトル ---------- */
function rollBase(){
  base={skill:d6()+6,hp:d6()+9,san:d6()+6};
  $('#t-skill').textContent=base.skill; $('#t-hp').textContent=base.hp; $('#t-san').textContent=base.san;
}
function startGame(){
  audioInit();
  const nm=($('#pname').value||'').trim()||'ユウキ';
  S={name:nm,skill:base.skill,hp:base.hp,maxHp:base.hp,san:base.san,maxSan:base.san,items:[],flags:{},node:1};
  $('#title-screen').hidden=true; $('#game').hidden=false;
  goTo(1);
}
function toTitle(){
  clearInterval(typing); S=null;
  document.documentElement.style.setProperty('--dread','0');
  $('#game').hidden=true; $('#title-screen').hidden=false; renderRec(); rollBase();
  window.scrollTo(0,0);
}
$('#reroll').onclick=rollBase;
$('#start').onclick=startGame;
$('#snd').onclick=()=>setSound(!AU.on);

function boot(data){
  rollBase(); renderRec();
  if(data&&data.S&&N[data.S.node]){ S=data.S; $('#title-screen').hidden=true; $('#game').hidden=false; goTo(S.node); }
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

<script>
/* ---------- 全体オート：本文を読み終えたら選択肢やサイコロを自動で選ぶ ---------- */
(function(){
  const q=sel=>document.querySelector(sel);
  let pause=0;
  setInterval(function(){
    if(!window.tgAuto) return;
    if(pause>0){ pause--; return; }
    const title=q('#title-screen');
    if(title&&!title.hidden){ q('#start').click(); pause=1; return; }
    const skip=q('#skip');
    if(skip&&!skip.hidden) return;                      // 本文を表示し終えるまで待つ
    const box=q('#choices'); if(!box) return;
    if(box.querySelector('.end')){ const b=box.querySelector('.end .btn:not(.ghost)'); if(b){ pause=3; b.click(); } return; }
    const cs=[...box.querySelectorAll('.choice')].filter(b=>!b.disabled&&!b.classList.contains('locked'));
    let b=cs.length?cs[Math.floor(Math.random()*cs.length)]:[...box.querySelectorAll('.btn')].find(x=>!x.disabled);
    if(!b) return;
    b.scrollIntoView({block:'center',behavior:'smooth'});
    b.click(); pause=1;
  },1400);
})();
</script>

<!-- tg-swipe-guard: スワイプでの更新・戻るを防ぐ -->
<style>html,body{overscroll-behavior:none}</style>
<script>
(function(){
  var GAME=!!document.querySelector('.tg-auto');
  var sx=0,sy=0;
  function scroller(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){var s=getComputedStyle(el).overflowY;if((s==='auto'||s==='scroll')&&el.scrollHeight>el.clientHeight)return el;}return null;}
  document.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;
    // 画面端からのスワイプ（戻る・進む）を止める
    if(sx<14||sx>innerWidth-14){e.preventDefault();}},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
})();
</script>
