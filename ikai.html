<title>異界契約録</title>
<meta name="description" content="妖怪・悪魔・幻獣と契約し、育て、戦わせ、合体させるクリーチャー収集RPGのプロトタイプ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 漆の地に金の罫を引いた一列の携帯型ゲーム盤。クリーチャーは属性色の「札（ふだ）」として並ぶ。単一の夜の世界観で固定する */
:root{
  --lacquer:#0e1613; --lacquer-2:#15201c; --lacquer-3:#1d2a25; --rule:#2d3d36;
  --paper:#ebe4d0; --paper-dim:#a3a797; --gold:#caa55d; --gold-dim:#7f6c42;
  --danger:#d4583f; --ok:#79b388; --mp:#6a97cc;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --r:6px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--lacquer);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;
  background-image:radial-gradient(circle at 50% 100%, transparent 58%, var(--gold) 59%, transparent 62%, transparent 70%, var(--gold) 71%, transparent 74%);
  background-size:44px 22px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--lacquer) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.top .brand{font-family:var(--f-display);font-weight:800;letter-spacing:.12em;font-size:17px;color:var(--gold)}
.top .cur{margin-left:auto;display:flex;gap:12px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--paper-dim)}
.top .cur b{color:var(--paper);font-weight:700}
.tod{font-size:12px;padding:1px 8px;border:1px solid var(--rule);border-radius:99px;color:var(--paper-dim)}
main{flex:1;padding-inline:16px;padding-block:16px 96px;display:flex;flex-direction:column;gap:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--lacquer-2);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;font-size:11px;color:var(--paper-dim);gap:1px}
.tab i{font-style:normal;font-family:var(--f-display);font-size:19px;font-weight:800;line-height:1.1}
.tab[aria-current="true"]{color:var(--gold)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:.04em}
h2{font-size:20px}
h3{font-size:16px}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.muted{color:var(--paper-dim)}
.small{font-size:13px}
p{margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.panel{background:var(--lacquer-2);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border:1px solid var(--gold-dim);border-radius:var(--r);color:var(--gold);font-weight:700;letter-spacing:.04em}
.btn:hover{border-color:var(--gold)}
.btn.solid{background:var(--gold);color:#1a150a;border-color:var(--gold)}
.btn.ghost{border-color:var(--rule);color:var(--paper)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.el{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 5px;border-radius:3px;font-size:12px;font-weight:700;color:#10160f;background:var(--c)}
.rar{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:0 5px;border:1px solid var(--c);color:var(--c);border-radius:3px;line-height:18px}
.rar.MYTHIC{border-image:linear-gradient(90deg,#e36fae,#caa55d,#6fd0c8) 1;color:#f0c9e0}
.sigil{display:block;flex:none}
.bar{height:6px;background:var(--lacquer-3);border-radius:3px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--c,var(--ok));transition:width .35s}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.cc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;background:var(--lacquer-2);border:1px solid var(--rule);border-radius:var(--r);text-align:center;position:relative;min-width:0}
.cc:hover{border-color:var(--gold-dim)}
.cc.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cc-name{font-weight:700;font-size:13px;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-meta{font-size:11px;color:var(--paper-dim);display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center}
.badge{position:absolute;top:6px;left:6px;font-size:10px;color:#1a150a;background:var(--gold);border-radius:3px;padding:0 4px;font-weight:700}
.hero{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.hero h1{font-size:34px;color:var(--gold);letter-spacing:.14em}
.party-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.kv .bar{height:5px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--lacquer-2);border:1px solid var(--rule);border-radius:var(--r);text-align:left;width:100%}
.li .grow{flex:1;min-width:0}
.li.on{border-color:var(--gold)}
.li.off{opacity:.55}
.note{font-size:13px;color:var(--paper-dim);border-left:2px solid var(--gold-dim);padding-left:10px}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.dex-cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:1px solid var(--rule);border-radius:var(--r);background:var(--lacquer-2);font-size:11px;min-width:0}
.dex-cell .no{color:var(--paper-dim);font-variant-numeric:tabular-nums;font-size:10px}
.dex-cell .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.detail-head{display:flex;gap:14px;align-items:center}
.detail-head .grow{min-width:0;display:flex;flex-direction:column;gap:4px}
.lore{font-family:var(--f-display);font-size:15px;line-height:1.9}
textarea{width:100%;min-height:90px;background:var(--lacquer);color:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:8px;font:12px/1.5 ui-monospace,monospace;box-sizing:border-box}
.altar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.slot{min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px dashed var(--gold-dim);border-radius:var(--r);padding:8px;text-align:center;font-size:12px;color:var(--paper-dim)}
.slot.filled{border-style:solid;color:var(--paper);background:var(--lacquer-2)}
.plus{font-family:var(--f-display);font-size:26px;color:var(--gold)}
.oracle{text-align:center;padding:14px;border:1px solid var(--rule);border-radius:var(--r);background:radial-gradient(circle at 50% 0%, color-mix(in srgb,var(--gold) 14%,transparent), transparent 70%)}
.oracle strong{display:block;font-family:var(--f-display);font-size:22px;letter-spacing:.1em;color:var(--gold)}
.start{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding-top:8px}
.vtitle{writing-mode:vertical-rl;font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:.3em;color:var(--gold);line-height:1}
/* battle */
.bt{display:flex;flex-direction:column;gap:10px;padding-block:10px 20px;padding-inline:12px;min-height:100%}
.bt-top{display:flex;align-items:center;gap:8px;font-size:13px}
.bt-top .grow{flex:1}
.toggle{font-size:12px;padding:3px 10px;border:1px solid var(--rule);border-radius:99px;color:var(--paper-dim)}
.toggle[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.side{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.uc{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px 7px;background:var(--lacquer-2);border:1px solid var(--rule);border-radius:var(--r);min-width:0;text-align:center}
.uc.act{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.uc.ko{opacity:.32;filter:grayscale(1)}
.uc.tgt{border-color:var(--danger);animation:pulse 1s infinite}
.uc.tgt.ally{border-color:var(--ok)}
.uc .nm{font-size:12px;font-weight:700;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.uc .lv{font-size:10px;color:var(--paper-dim);font-variant-numeric:tabular-nums}
.uc .bars{width:100%;display:flex;flex-direction:column;gap:2px}
.uc .bar{height:5px}
.uc .hpn{font-size:10px;font-variant-numeric:tabular-nums;color:var(--paper-dim)}
.sts{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:14px}
.st{font-size:9px;line-height:14px;padding:0 3px;border-radius:2px;background:var(--lacquer-3);color:var(--paper)}
.gauge>span{background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
.gauge.full>span{animation:glow 1s infinite alternate}
.logbox{background:var(--lacquer);border:1px solid var(--rule);border-radius:var(--r);padding:8px 10px;font-size:13px;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}
.logbox div:last-child{color:var(--paper)}
.logbox div{color:var(--paper-dim)}
.cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmd .btn{min-height:46px;padding:0 6px}
.skl{display:flex;flex-direction:column;gap:6px}
.skl .li{padding:8px 10px}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--paper);text-shadow:0 2px 0 #000,0 0 8px #000;pointer-events:none;animation:floatUp .9s ease-out forwards;white-space:nowrap}
.float.crit{color:var(--gold);font-size:28px}
.float.heal{color:var(--ok)}
.float.miss{color:var(--paper-dim);font-size:16px}
.float .eff{display:block;font-size:10px;font-family:var(--f-body)}
.shake{animation:shake .3s}
#cutin{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(5,8,7,.78);overflow:hidden}
.ci-flash{position:absolute;inset:0;background:var(--c);opacity:0}
.ci-band{position:relative;width:140%;padding:22px 0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 70%,#000) 20%,color-mix(in srgb,var(--c) 70%,#000) 80%,transparent);transform:skewY(-6deg);display:flex;align-items:center;justify-content:center;gap:20px}
.ci-glyph{font-family:var(--f-display);font-weight:800;font-size:96px;line-height:1;color:var(--paper);text-shadow:0 0 24px var(--c)}
.ci-txt{display:flex;flex-direction:column;transform:skewY(6deg)}
.ci-txt span{font-size:13px;letter-spacing:.2em;color:var(--paper)}
.ci-txt strong{font-family:var(--f-display);font-size:30px;letter-spacing:.12em;color:#fff}
#cutin.run .ci-flash{animation:flash .5s ease-out}
#cutin.run .ci-band{animation:band 1.4s cubic-bezier(.2,.8,.2,1)}
#cutin.run .ci-glyph{animation:glyph 1.4s ease-out}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,7,.82);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal-in{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--lacquer-2);border:1px solid var(--gold-dim);border-radius:10px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.reveal{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.reveal .sigil{animation:rise .8s ease-out}
.swirl{animation:spin 1.6s linear infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px color-mix(in srgb,var(--danger) 50%,transparent)}}
@keyframes glow{to{filter:brightness(1.5)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px)}}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
@keyframes band{0%{transform:skewY(-6deg) translateX(-100%)}18%{transform:skewY(-6deg) translateX(0)}82%{transform:skewY(-6deg) translateX(0)}100%{transform:skewY(-6deg) translateX(100%)}}
@keyframes glyph{0%{transform:scale(3);filter:blur(8px);opacity:0}25%{transform:scale(1);filter:blur(0);opacity:1}}
@keyframes rise{0%{transform:scale(.4) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media (min-width:600px){.hero h1{font-size:42px}}
</style>

<script id="engine">
/* ===== ロジック層：DOMに触れない ===== */
const R = () => Math.random();
const pick = a => a[Math.floor(R()*a.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const randInt = (a,b) => a + Math.floor(R()*(b-a+1));
const wpick = pool => { const t = pool.reduce((s,[,w])=>s+w,0); let r = R()*t; for (const [id,w] of pool){ if((r-=w)<0) return id; } return pool[0][0]; };

const Engine = (() => {
  const SK = ['atk','def','mag','mdf','spd'];
  const rIdx = id => RARITY[SPECIES[id].rar].i;

  function statsOf(inst){
    const sp = SPECIES[inst.sp], nat = NATURES[inst.nature] || {};
    const rm = RARITY[sp.rar].m * (1 + 0.04*(inst.gen||0)) * (inst.variant?1.18:1);
    const lv = inst.lv, s = {};
    s.hp = Math.floor(sp.b.hp*(2+lv*0.45)*rm*inst.iv.hp*(nat.hp||1));
    SK.forEach(k => s[k] = Math.floor(sp.b[k]*(0.6+lv*0.12)*rm*inst.iv[k]*(nat[k]||1)));
    s.crit = sp.b.crit + (inst.variant?5:0);
    s.res = sp.b.res;
    s.mp = Math.floor(20 + sp.b.mag*0.35 + lv*3);
    return s;
  }
  const learnedUpTo = (id,lv) => SPECIES[id].learn.filter(([l])=>l<=lv).map(([,s])=>s);
  function makeInst(id, lv){
    const iv = {}; ['hp',...SK].forEach(k => iv[k] = +(0.9+R()*0.2).toFixed(3));
    const learned = learnedUpTo(id, lv);
    const sp = SPECIES[id];
    return {sp:id, lv, exp:0, iv, nature:pick(Object.keys(NATURES)), learned, equip:learned.slice(-4),
      abil:[sp.abil, ...(sp.extra||[])], gen:0, variant:false};
  }
  function ivGrade(inst){
    const v = Object.values(inst.iv), a = v.reduce((s,x)=>s+x,0)/v.length;
    return a>=1.06?'S':a>=1.02?'A':a>=0.98?'B':'C';
  }
  const expNeed = lv => Math.floor(16*Math.pow(lv,1.55));
  const levelCap = inst => RARITY[SPECIES[inst.sp].rar].cap + 5*(inst.gen||0);
  function gainExp(inst, amt){
    const out = {ups:0, learned:[]}, cap = levelCap(inst);
    if (inst.lv >= cap) return out;
    inst.exp += amt;
    while (inst.lv < cap && inst.exp >= expNeed(inst.lv)){
      inst.exp -= expNeed(inst.lv); inst.lv++; out.ups++;
      SPECIES[inst.sp].learn.forEach(([l,id]) => {
        if (l <= inst.lv && !inst.learned.includes(id)){ inst.learned.push(id); out.learned.push(id); if (inst.equip.length<4) inst.equip.push(id); }
      });
    }
    if (inst.lv >= cap) inst.exp = 0;
    return out;
  }
  const evoOptions = inst => (SPECIES[inst.sp].evo||[]).filter(e => inst.lv >= e.lv);
  function evolve(inst, to){
    inst.sp = to; inst.abil[0] = SPECIES[to].abil;
    (SPECIES[to].extra||[]).forEach(a => inst.abil.push(a));
    inst.abil = [...new Set(inst.abil)].slice(0,3);
    learnedUpTo(to, inst.lv).forEach(id => { if(!inst.learned.includes(id)){ inst.learned.push(id); if(inst.equip.length<4) inst.equip.push(id); } });
  }

  /* ---- 合体 ---- */
  const recipeKey = ids => ids.slice().sort().join('+');
  RECIPES.forEach(r => r.keys = r.sets.map(recipeKey));
  const findRecipe = ids => RECIPES.find(r => r.keys.includes(recipeKey(ids)));
  const FALLBACK = Object.keys(SPECIES).filter(id => !SPECIES[id].fusionOnly);
  const producers = out => RECIPES.filter(r=>r.out===out);

  function preview(ids, itemOn, found){
    const r = findRecipe(ids);
    if (r){
      if (r.item && !itemOn) return {kind:'need-item'};
      if (found[recipeKey(ids)]) return {kind:'known', out:r.out};
      return {kind: rIdx(r.out)>=3 ? 'legend' : 'unknown'};
    }
    if (ids.length === 3) return {kind:'none3'};
    return {kind:'random'};
  }
  function fuse(insts, itemOn){
    const ids = insts.map(i=>i.sp), r = findRecipe(ids);
    let out, recipe = false;
    if (r && (!r.item || itemOn)){ out = r.out; recipe = true; }
    else {
      if (ids.length === 3) return null;
      const maxR = Math.max(...ids.map(rIdx));
      const els = new Set(ids.flatMap(id=>SPECIES[id].el));
      let pool = FALLBACK.filter(id => !ids.includes(id) && rIdx(id)>=maxR && rIdx(id)<=maxR+1 && SPECIES[id].el.some(e=>els.has(e)));
      if (!pool.length) pool = FALLBACK.filter(id => !ids.includes(id) && rIdx(id)>=maxR);
      if (!pool.length) pool = FALLBACK.filter(id => !ids.includes(id));
      out = pick(pool);
    }
    const avgLv = insts.reduce((s,i)=>s+i.lv,0)/insts.length;
    const child = makeInst(out, Math.max(1, Math.floor(avgLv*0.6)));
    child.gen = Math.max(...insts.map(i=>i.gen||0)) + 1;
    Object.keys(child.iv).forEach(k => {
      const pa = insts.reduce((s,i)=>s+i.iv[k],0)/insts.length;
      child.iv[k] = +clamp((pa + child.iv[k])/2 * (0.99 + R()*0.06), 0.88, 1.15).toFixed(3);
    });
    child.nature = R()<0.6 ? pick(insts).nature : child.nature;
    const abnormal = R() < 0.05 + avgLv*0.003;
    child.variant = abnormal;
    const pAbil = [...new Set(insts.flatMap(i=>i.abil))].filter(a => !child.abil.includes(a));
    if (pAbil.length) child.abil.push(pick(pAbil));
    child.abil = child.abil.slice(0,3);
    const pSk = [...new Set(insts.flatMap(i=>i.learned))].filter(s => !child.learned.includes(s));
    const inherited = [];
    for (let n=0; n<2 && pSk.length; n++){ const s = pSk.splice(Math.floor(R()*pSk.length),1)[0]; inherited.push(s); child.learned.push(s); }
    child.equip = child.learned.filter(s=>!inherited.includes(s)).slice(-3).concat(inherited.slice(0,1));
    return {child, recipe, key:recipeKey(ids), abnormal, inherited};
  }

  /* ---- 属性 ---- */
  function elemMult(el, defEls){
    if (!el) return 1;
    if (el === '混沌') return 1.25;
    let m = 1;
    defEls.forEach(d => { if (ELEMENTS[el].eff.includes(d)) m *= 1.5; if (ELEMENTS[el].res.includes(d)) m *= 0.67; });
    return m;
  }
  const weaknesses = els => Object.keys(ELEMENTS).filter(a => a!=='混沌' && elemMult(a, els) > 1);

  /* ---- 戦闘 ---- */
  class Battle {
    constructor(allies, enemies, opts={}){
      this.night = !!opts.night;
      this.units = [];
      allies.forEach((inst,i) => this.units.push(this.mk(inst,'a',i)));
      enemies.forEach((inst,i) => this.units.push(this.mk(inst,'e',i)));
      this.queue = []; this.round = 0;
    }
    mk(inst, side, i){
      const sp = SPECIES[inst.sp], st = statsOf(inst);
      return {id:side+i, side, inst, sp, name:(inst.variant?'異形・':'')+sp.name, lv:inst.lv, max:st, hp:st.hp, mp:st.mp, gauge:0,
        sts:{}, mods:[], abil:inst.abil.slice(), skills:inst.equip.slice(), ult:sp.ult, def:false, flags:{}, ai:inst.aiOverride||sp.ai, el:sp.el};
    }
    unit(id){ return this.units.find(u=>u.id===id); }
    alive(side){ return this.units.filter(u=>u.side===side && u.hp>0); }
    foes(u){ return this.alive(u.side==='a'?'e':'a'); }
    friends(u){ return this.alive(u.side); }
    has(u,a){ return u.abil.includes(a); }
    snap(){ const o={}; this.units.forEach(u => o[u.id]={hp:u.hp, mp:u.mp, g:Math.floor(u.gauge), sts:Object.keys(u.sts), buf:u.mods.length}); return o; }
    eff(u,k){
      let v = u.max[k], m = 1;
      u.mods.forEach(x => { if (x.s===k) m *= x.m; });
      v *= clamp(m, 0.3, 3);
      if (k==='atk' && this.has(u,'rage') && u.hp < u.max.hp*0.4) v *= 1.5;
      if ((k==='def'||k==='mdf') && this.has(u,'shellWater') && u.hp > u.max.hp*0.5) v *= 1.3;
      if (k==='atk' && u.sts.fear) v *= 0.7;
      if (k==='atk' && u.sts.burn) v *= 0.85;
      if (k==='spd' && u.sts.para) v *= 0.6;
      return Math.max(1, v);
    }
    result(){ if (!this.alive('e').length) return 'win'; if (!this.alive('a').length) return 'lose'; return null; }
    next(){
      if (!this.queue.length){
        this.round++;
        this.queue = this.units.filter(u=>u.hp>0).map(u=>({u, s:this.eff(u,'spd')*(0.9+R()*0.2)})).sort((a,b)=>b.s-a.s).map(x=>x.u);
      }
      const u = this.queue.shift();
      return (u && u.hp>0) ? u : null;
    }
    addGauge(u, v){ if (u.sts.curse || u.hp<=0) return; u.gauge = Math.min(100, u.gauge + v*(this.has(u,'rage')?1.5:1)); }
    startTurn(u){
      const ev = [], L = (m,t='log',x={}) => ev.push({t, m, id:u.id, ...x, snap:this.snap()});
      u.def = false;
      u.mp = Math.min(u.max.mp, u.mp + 3);
      if (this.has(u,'twinKings') && u.hp < u.max.hp){ const h = Math.ceil(u.max.hp*0.05); u.hp = Math.min(u.max.hp, u.hp+h); L(null,'heal',{v:h}); }
      u.mods.forEach(x=>x.t--); u.mods = u.mods.filter(x=>x.t>0);
      const dot = {poison:.08, burn:.06, bleed:.05, curse:.05};
      for (const s of Object.keys(dot)){
        if (!u.sts[s]) continue;
        const d = Math.max(1, Math.floor(u.max.hp*dot[s])); u.hp = Math.max(0, u.hp-d);
        L(`${u.name}は${STATUS[s].n}で${d}のダメージ`,'hit',{v:d});
        if (--u.sts[s].t <= 0) delete u.sts[s];
        if (u.hp<=0){ L(`${u.name}は倒れた`,'ko'); return {ev, canAct:false}; }
      }
      let canAct = true;
      if (u.sts.freeze){ delete u.sts.freeze; L(`${u.name}は凍りついて動けない`); canAct = false; }
      else if (u.sts.sleep){ if (--u.sts.sleep.t<=0){ delete u.sts.sleep; L(`${u.name}は目を覚ました`); } else { L(`${u.name}は眠っている`); canAct = false; } }
      else if (u.sts.para){ if (R()<0.3){ L(`${u.name}は痺れて動けない`); canAct = false; } if (--u.sts.para.t<=0) delete u.sts.para; }
      ['fear','confuse'].forEach(s => { if (u.sts[s] && --u.sts[s].t<0) delete u.sts[s]; });
      return {ev, canAct};
    }
    applySts(t, s, ch, ev){
      if (!s || t.hp<=0 || t.sts[s] || this.has(t,'magatsu')) return;
      if (R() < ch*(1 - t.max.res/250)){
        t.sts[s] = {t:STATUS[s].t};
        ev.push({t:'log', m:`${t.name}は${STATUS[s].n}になった`, id:t.id, snap:this.snap()});
      }
    }
    calc(u, t, sk, forceCrit){
      const phys = sk.k==='phys';
      const A = this.eff(u, phys?'atk':'mag'), D = this.eff(t, phys?'def':'mdf');
      let v = sk.p * clamp(A/D, 0.3, 3) * (0.45 + u.lv*0.11) * 1.25 * (0.9 + R()*0.2);
      const em = elemMult(sk.el, t.el); v *= em;
      if (sk.el && (u.el.includes(sk.el) || (this.has(u,'twinKings') && (sk.el==='光'||sk.el==='闇')))) v *= 1.2;
      const crit = forceCrit || R() < u.max.crit/100 + (sk.crit||0);
      if (crit) v *= 1.5;
      if (this.night && (u.el.includes('霊')||u.el.includes('闇'))) v *= 1.15;
      if (this.has(u,'venomHunter') && t.sts.poison) v *= 1.6;
      if (this.has(u,'torrent') && sk.el==='水'){ v *= 1.3; if (u.hp < u.max.hp*0.5) v *= 1.2; }
      if (this.has(u,'hellfire') && sk.el==='炎') v *= 1.3;
      if (this.has(u,'moonFuneral') && t.sts.freeze) v *= 1.5;
      if (this.has(u,'magatsu')) v *= 1.25;
      if (sk.lowHp) v *= 1 + (1 - u.hp/u.max.hp);
      if (t.def) v *= 0.5;
      if (phys && this.has(t,'ironShell')) v *= 0.75;
      return {v:Math.max(1, Math.round(v)), crit, em};
    }
    act(u, a){
      const ev = [], L = (m, x={}) => ev.push({t:'log', m, id:u.id, ...x, snap:this.snap()});
      if (u.hp<=0) return ev;
      if (u.sts.bleed && a.kind!=='defend'){ const d = Math.max(1,Math.floor(u.max.hp*0.04)); u.hp = Math.max(1,u.hp-d); ev.push({t:'hit',id:u.id,v:d,m:`${u.name}の傷口が開いた`,snap:this.snap()}); }
      if (a.kind==='defend'){ u.def = true; this.addGauge(u, 12); L(`${u.name}は身構えた`); return this.after(u, ev); }
      if (a.kind==='item'){
        const t = a.target, it = ITEMS[a.item];
        if (a.item==='fuda'){ const h = Math.floor(t.max.hp*0.4); t.hp = Math.min(t.max.hp, t.hp+h); ev.push({t:'heal',id:t.id,v:h,m:`${it.n}で${t.name}のHPが${h}回復`,snap:this.snap()}); }
        if (a.item==='reisui'){ t.mp = Math.min(t.max.mp, t.mp+30); L(`${it.n}で${t.name}のMPが回復`); }
        if (a.item==='hangon' && t.hp<=0){ t.hp = Math.floor(t.max.hp*0.3); t.sts = {}; t.gauge = 0; ev.push({t:'heal',id:t.id,v:t.hp,m:`${t.name}が蘇った`,snap:this.snap()}); }
        return this.after(u, ev);
      }
      let sk = a.kind==='attack' ? SKILLS.atk : a.kind==='ult' ? SKILLS[u.ult] : SKILLS[a.skill];
      if (a.kind==='ult'){ if (u.gauge<100) sk = SKILLS.atk; else { u.gauge = 0; ev.push({t:'ult', id:u.id, sk:u.ult, m:`${u.name}の必殺技「${sk.n}」`, snap:this.snap()}); } }
      else if (a.kind==='skill'){ if (u.mp < sk.mp) sk = SKILLS.atk; else u.mp -= sk.mp; }
      let foes = this.foes(u), friends = this.friends(u);
      let targets;
      if (u.sts.confuse && R()<0.35){
        L(`${u.name}は混乱している`);
        sk = SKILLS.atk; targets = [pick(this.units.filter(x=>x.hp>0 && x!==u))];
      } else {
        const alive = x => x && x.hp>0 && this.units.includes(x);
        switch (sk.tg){
          case 'enemy': targets = [alive(a.target) && a.target.side!==u.side ? a.target : pick(foes)]; break;
          case 'allE': targets = foes; break;
          case 'ally': targets = [alive(a.target) && a.target.side===u.side ? a.target : friends.slice().sort((x,y)=>x.hp/x.max.hp-y.hp/y.max.hp)[0]]; break;
          case 'allA': targets = friends; break;
          default: targets = [u];
        }
        if (a.kind!=='ult') L(sk===SKILLS.atk ? `${u.name}の攻撃` : `${u.name}の${sk.n}`);
      }
      targets = targets.filter(Boolean);
      const firstCrit = this.has(u,'thunderFirst') && !u.flags.acted;
      for (const t of targets){
        if (t.hp<=0) continue;
        if (sk.p){
          let acc = (sk.acc||100) - (this.has(t,'flutter')?15:0);
          if (!sk.ult && R()*100 > acc){ ev.push({t:'miss', id:t.id, m:`${t.name}には当たらなかった`, snap:this.snap()}); continue; }
          const r = this.calc(u, t, sk, firstCrit);
          let v = r.v;
          if (t.hp - v <= 0 && this.has(t,'undying') && !t.flags.undying){ t.flags.undying = 1; v = t.hp - 1; }
          t.hp = Math.max(0, t.hp - v);
          if (t.sts.sleep) delete t.sts.sleep;
          this.addGauge(u, 10); this.addGauge(t, v/t.max.hp*50);
          ev.push({t:'hit', id:t.id, v, crit:r.crit, em:r.em, m:`${t.name}に${v}のダメージ${r.crit?'（会心）':''}${r.em>1.01?' 効果は抜群':r.em<0.99?' いまひとつ':''}`, snap:this.snap()});
          if (t.flags.undying===1 && t.hp===1){ t.flags.undying = 2; L(`${t.name}は骨を鳴らして踏みとどまった`); }
          const drain = (sk.drain||0) + (this.has(u,'abyss')?0.25:0);
          if (drain && u.hp>0){ const h = Math.ceil(v*drain); u.hp = Math.min(u.max.hp, u.hp+h); ev.push({t:'heal', id:u.id, v:h, snap:this.snap()}); }
          if (t.hp>0){
            if (sk.st) this.applySts(t, sk.st[0], sk.st[1], ev);
            if (sk.rand) this.applySts(t, pick(Object.keys(STATUS)), sk.rand, ev);
            if (this.has(u,'ignite')) this.applySts(t,'burn',.2,ev);
            if (this.has(u,'mischief')) this.applySts(t, R()<.5?'fear':'curse', .25, ev);
            if (this.has(u,'nue')) this.applySts(t,'para',.2,ev);
            if (this.has(u,'moonFuneral')) this.applySts(t,'freeze',.15,ev);
            if (this.has(u,'magatsu')) this.applySts(t, pick(Object.keys(STATUS)), .3, ev);
            if (this.has(u,'jorogumo')){ this.applySts(t,'poison',.25,ev); t.mods.push({s:'spd',m:.85,t:2}); }
            if (this.has(u,'frostBreath')) t.mods.push({s:'spd',m:.8,t:2});
            if (sk.mods && sk.k!=='buff') sk.mods.forEach(([s,m,tt]) => t.mods.push({s,m,t:tt}));
            if (sk.k==='phys' && this.has(t,'counter') && u.hp>0 && R()<0.25){
              const c = this.calc(t, u, SKILLS.atk, false); const cv = Math.round(c.v*0.8); u.hp = Math.max(0, u.hp-cv);
              ev.push({t:'hit', id:u.id, v:cv, m:`${t.name}の返し甲羅。${u.name}に${cv}のダメージ`, snap:this.snap()});
              if (u.hp<=0) ev.push({t:'ko', id:u.id, m:`${u.name}は倒れた`, snap:this.snap()});
            }
          } else {
            ev.push({t:'ko', id:t.id, m:`${t.name}は倒れた`, snap:this.snap()});
            if (this.has(u,'hellfire')) this.addGauge(u, 40);
          }
        } else if (sk.k==='debuff'){
          if (R()*100 > (sk.acc||100)){ ev.push({t:'miss', id:t.id, m:`${t.name}には効かなかった`, snap:this.snap()}); continue; }
          if (sk.mods) sk.mods.forEach(([s,m,tt]) => t.mods.push({s,m,t:tt}));
          if (sk.mods) L(`${t.name}の${sk.mods.map(x=>STAT_LABEL[x[0]]).join('・')}が下がった`);
          if (sk.st) this.applySts(t, sk.st[0], sk.st[1], ev);
        }
        if (sk.heal && t.hp>0){ const h = Math.floor(t.max.hp*sk.heal); t.hp = Math.min(t.max.hp, t.hp+h); ev.push({t:'heal', id:t.id, v:h, m:`${t.name}のHPが${h}回復`, snap:this.snap()}); }
        if (sk.cleanse && t.hp>0) t.sts = {};
        if (sk.k==='buff' && sk.mods && t.hp>0){ sk.mods.forEach(([s,m,tt]) => t.mods.push({s,m,t:tt+1})); L(`${t.name}の${sk.mods.map(x=>STAT_LABEL[x[0]]).join('・')}が上がった`); }
      }
      if (sk.amods) friends.forEach(f => sk.amods.forEach(([s,m,tt]) => f.mods.push({s,m,t:tt+1})));
      if (sk.gauge) this.addGauge(u, sk.gauge);
      if (sk.amods) L(`味方全体の素早さが上がった`);
      u.flags.acted = true;
      return this.after(u, ev);
    }
    after(u, ev){
      if (u.hp>0 && this.has(u,'purr')){
        const f = this.friends(u).filter(x=>x.hp<x.max.hp).sort((x,y)=>x.hp/x.max.hp-y.hp/y.max.hp)[0];
        if (f){ const h = Math.ceil(f.max.hp*0.06); f.hp = Math.min(f.max.hp, f.hp+h); ev.push({t:'heal', id:f.id, v:h, snap:this.snap()}); }
      }
      return ev;
    }
    /* 敵AI（オート戦闘でも共用） */
    ai(u){
      const foes = this.foes(u), friends = this.friends(u);
      const low = arr => arr.slice().sort((x,y)=>x.hp/x.max.hp-y.hp/y.max.hp)[0];
      const usable = u.skills.filter(id => SKILLS[id] && SKILLS[id].mp <= u.mp);
      const best = (filter) => {
        let bestA = {kind:'attack', target:low(foes)}, bestS = 35;
        for (const id of usable){
          const s = SKILLS[id]; if (!s.p || (filter && !filter(s))) continue;
          const tgt = s.tg==='allE' ? null : foes.slice().sort((x,y)=>elemMult(s.el,y.el)-elemMult(s.el,x.el) || x.hp-y.hp)[0];
          const score = s.p * (s.tg==='allE' ? foes.reduce((a,f)=>a+elemMult(s.el,f.el),0)*0.8 : elemMult(s.el, tgt.el)) * (u.el.includes(s.el)?1.2:1);
          if (score > bestS){ bestS = score; bestA = {kind:'skill', skill:id, target:tgt}; }
        }
        return bestA;
      };
      if (u.gauge >= 100){
        const us = SKILLS[u.ult];
        if (us.heal ? friends.some(f=>f.hp<f.max.hp*0.6) : true) return {kind:'ult', target: us.tg==='ally'?low(friends):low(foes)};
      }
      const heal = usable.find(id => SKILLS[id].k==='heal');
      if (heal && friends.some(f=>f.hp < f.max.hp*0.45) && (u.ai==='guard' || R()<0.5)) return {kind:'skill', skill:heal, target:low(friends)};
      switch (u.ai){
        case 'guard': {
          const buff = usable.find(id => SKILLS[id].k==='buff');
          if (buff && !u.mods.some(m=>m.m>1) && R()<0.35) return {kind:'skill', skill:buff, target:u};
          if (R()<0.12) return {kind:'defend'};
          return best();
        }
        case 'trick': {
          const st = usable.filter(id => { const s = SKILLS[id]; return (s.k==='debuff') || (s.st && s.st[1]>=0.4); });
          const cands = foes.filter(f => !Object.keys(f.sts).length);
          if (st.length && cands.length && R()<0.6) return {kind:'skill', skill:pick(st), target:pick(cands)};
          return best();
        }
        case 'mage': return best(s => s.k==='mag') ;
        case 'boss': {
          if (u.hp < u.max.hp*0.5 && !u.flags.enraged){ u.flags.enraged = 1; const b = usable.find(id=>SKILLS[id].k==='buff'); if (b) return {kind:'skill', skill:b, target:u}; }
          return best();
        }
        default: {
          const buff = usable.find(id => SKILLS[id].k==='buff' && SKILLS[id].tg==='self');
          if (buff && !u.mods.some(m=>m.s==='atk') && R()<0.25) return {kind:'skill', skill:buff, target:u};
          return best();
        }
      }
    }
  }

  return {statsOf, makeInst, ivGrade, expNeed, levelCap, gainExp, evoOptions, evolve, preview, fuse, findRecipe, recipeKey, producers, elemMult, weaknesses, Battle, rIdx};
})();
</script>

function sigil(spId, size, o={}){
  const sp = SPECIES[spId], ri = RARITY[sp.rar].i, rc = RARITY[sp.rar].c;
  const shadow = o.mode==='shadow', unknown = o.mode==='unknown';
  const e1 = ELEMENTS[sp.el[0]].c, e2 = ELEMENTS[sp.el[1]||sp.el[0]].c, id = 'sg'+(++SIG);
  const shape = SHAPES[sp.shape] || SHAPES.round;
  if (unknown) return `<svg class="sigil" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true"><path d="${SHAPES.round}" fill="none" stroke="#2d3d36" stroke-dasharray="4 4"/><text x="50" y="52" text-anchor="middle" dominant-baseline="central" font-size="34" fill="#4a5a52" font-family="serif">？</text></svg>`;
  let motifs = '';
  const n = 6 + ri, seed = parseInt(spId.slice(3))*23;
  for (let i=0;i<n;i++){
    const el = sp.el[i % sp.el.length], [d, stroke] = MOTIF[el], c = shadow ? '#26332e' : ELEMENTS[el].c;
    motifs += `<path d="${d}" transform="translate(50 50) rotate(${(i*360/n+seed)%360}) translate(0 -35) scale(${ri>=3?1.1:0.95})" ${stroke?`fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round"`:`fill="${c}"`} opacity="${shadow?1:.85}"/>`;
  }
  const horns = sp.shape==='mask' ? `<path d="M30,16 L20,0 L40,11Z M70,16 L80,0 L60,11Z" fill="${shadow?'#26332e':rc}"/>` : '';
  const variant = o.variant ? `<circle cx="50" cy="50" r="47" fill="none" stroke="#e2615a" stroke-width="1.5" stroke-dasharray="3 5"/>` : '';
  const stroke = shadow ? '#2d3d36' : (sp.rar==='MYTHIC' ? `url(#${id}m)` : rc);
  return `<svg class="sigil" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true">
<defs><radialGradient id="${id}" cx="50%" cy="42%" r="62%"><stop offset="0" stop-color="${e1}" stop-opacity=".6"/><stop offset=".62" stop-color="${e2}" stop-opacity=".2"/><stop offset="1" stop-color="#0e1613" stop-opacity="0"/></radialGradient>
<linearGradient id="${id}m" x1="0" x2="1"><stop offset="0" stop-color="#e36fae"/><stop offset=".5" stop-color="#caa55d"/><stop offset="1" stop-color="#6fd0c8"/></linearGradient></defs>
${horns}<path d="${shape}" fill="#131c19" stroke="${stroke}" stroke-width="${ri>=3?2.6:1.5}"/>
${shadow?'':`<path d="${shape}" fill="url(#${id})"/>`}${motifs}${variant}
${shadow?'':`<text x="50" y="52" text-anchor="middle" dominant-baseline="central" font-size="${sp.glyph.length>1?30:40}" font-weight="800" font-family="'Shippori Mincho B1',serif" fill="#ebe4d0" stroke="#0e1613" stroke-width="3" paint-order="stroke">${sp.glyph}</text>`}
</svg>`;
}
const elChips = els => els.map(e => `<span class="el" style="--c:${ELEMENTS[e].c}">${e}</span>`).join('');
const rarChip = r => `<span class="rar ${r}" style="--c:${RARITY[r].c}">${r}</span>`;

function newGame(starter){
  S = {v:1, gold:600, fu:5, items:{fuda:3,reisui:2,hangon:1,kinki:0}, roster:[], party:[], dex:{seen:{},own:{}}, recipes:{}, wins:0, boss:0, claimed:{}, uidN:1, fusions:0};

function viewParty(){

  const list = S.roster.slice().sort((a,b)=>Engine.rIdx(b.sp)-Engine.rIdx(a.sp) || b.lv-a.lv);

}

function statRows(st, extra){
  const keys = ['hp','atk','def','mag','mdf','spd'], mx = Math.max(...keys.filter(k=>k!=='hp').map(k=>st[k]))*1.15;
  return `<div class="kv">${keys.map(k=>`<span class="muted">${STAT_LABEL[k]}</span><div class="bar" style="--c:${k==='hp'?'var(--ok)':'var(--gold)'}"><span style="width:${k==='hp'?100:st[k]/mx*100}%"></span></div><b>${st[k]}</b>`).join('')}
<span class="muted">会心率</span><span></span><b>${st.crit}%</b><span class="muted">状態耐性</span><span></span><b>${st.res}</b>${extra||''}</div>`;
}
function skillLine(id, o={}){
  const s = SKILLS[id], kind = {phys:'物理',mag:'魔法',heal:'回復',buff:'強化',debuff:'弱体'}[s.k];
  const tg = {enemy:'単体',allE:'敵全体',ally:'味方単体',allA:'味方全体',self:'自分'}[s.tg];
  const fx = [s.p?`威力${s.p}`:'', s.st?`${STATUS[s.st[0]].n}${Math.round(s.st[1]*100)}%`:'', s.mods?s.mods.map(m=>`${STAT_LABEL[m[0]]}${m[1]>1?'↑':'↓'}`).join(' '):'', s.heal?`HP${Math.round(s.heal*100)}%回復`:'', s.drain?'吸収':'', s.crit?'会心↑':'', s.lowHp?'瀕死ほど強い':'', s.rand?'ランダム状態異常':''].filter(Boolean).join('・');
  return `<div class="grow"><div class="row" style="gap:6px"><b>${s.n}</b>${s.el?elChips([s.el]):''}<span class="small muted">${kind}・${tg}${s.ult?'':` ・MP${s.mp}`}</span></div><div class="small muted">${fx}</div></div>`;
}

/* ---------- 戦闘 ---------- */
function startBattle(areaId){
  const area = AREAS.find(a=>a.id===areaId);
  const party = S.party.map(byUid).filter(Boolean);
  let enemies;
  if (area.boss){
    enemies = area.boss.map(([id,lv]) => { const e = Engine.makeInst(id,lv); if (id==='MON101') e.aiOverride = 'boss'; return e; });
  } else {
    const pool = area.pool.concat(isNight()?area.night:[]);
    enemies = Array.from({length:randInt(area.count[0],area.count[1])}, () => Engine.makeInst(wpick(pool), randInt(area.lv[0],area.lv[1])));
  }
  enemies.forEach(e => S.dex.seen[e.sp] = 1);
  const b = new Engine.Battle(party, enemies, {night:isNight()});
  BT = {b, area, disp:b.snap(), log:[area.boss?'地獄門が開く。焔の将が待っていた。':`${area.name}で異界の気配がする。`], mode:'wait', actor:null, sub:null, pending:null, resolve:null, auto:false, fast:false, over:null};
  save(); render(); loop();
}
async function loop(){
  const b = BT.b;
  while (!b.result()){
    const u = b.next(); if (!u) continue;
    BT.actor = u.id;
    const st = b.startTurn(u);
    await play(st.ev);
    if (!BT || b.result()) break;
    if (!st.canAct) continue;
    let action;
    if (u.side==='a' && !BT.auto){
      action = await chooseAction(u);
      if (!BT) return;
      if (action.kind==='flee'){
        if (R()<0.65){ BT.log.push('うまく逃げ切った'); render(); await wait(500); endBattle('flee'); return; }
        await play([{t:'log', m:'逃げられなかった', snap:b.snap()}]); continue;
      }
      if (action.kind==='item') S.items[action.item]--;
    } else action = b.ai(u);
    await play(b.act(u, action));
    if (!BT) return;
  }
  BT.actor = null;
  endBattle(b.result());
}
function chooseAction(u){
  return new Promise(res => {
    BT.mode = 'cmd'; BT.sub = null; BT.pending = null;
    BT.resolve = a => { BT.mode = 'wait'; BT.sub = null; BT.pending = null; BT.resolve = null; res(a); render(); };
    render();
  });
}
async function play(evs){
  for (const e of evs){
    if (!BT) return;
    if (e.m) BT.log.push(e.m);
    if (BT.log.length > 40) BT.log.splice(0, BT.log.length-40);
    if (e.snap) BT.disp = e.snap;
    render();
    if (e.t==='ult'){ await cutin(e); continue; }
    if (e.t==='hit'||e.t==='heal'||e.t==='miss') floatAt(e);
    await wait(reduced() ? 120 : BT.fast ? 150 : (e.t==='log' ? 300 : 460));
  }
}
function floatAt(e){
  const el = document.getElementById('u-'+e.id); if (!el) return;
  const f = document.createElement('span');
  f.className = 'float ' + (e.t==='heal'?'heal':e.t==='miss'?'miss':e.crit?'crit':'');
  f.innerHTML = e.t==='miss' ? 'MISS' : (e.t==='heal'?'+':'') + e.v + (e.em>1.01?'<span class="eff">抜群</span>':'');
  el.appendChild(f);
  if (e.t==='hit') el.classList.add('shake');
  setTimeout(() => f.remove(), 950);
}
function cutin(e){
  return new Promise(res => {
    const u = BT.b.unit(e.id), sk = SKILLS[e.sk], c = sk.el ? ELEMENTS[sk.el].c : '#caa55d';
    const ov = $('#cutin');
    ov.innerHTML = `<div class="ci-flash" style="--c:${c}"></div><div class="ci-band" style="--c:${c}"><div class="ci-glyph" style="--c:${c}">${u.sp.glyph}</div><div class="ci-txt"><span>${esc(u.name)}</span><strong>${sk.n}</strong></div></div>`;
    ov.hidden = false; ov.classList.remove('run'); void ov.offsetWidth; ov.classList.add('run');
    setTimeout(() => { ov.hidden = true; ov.classList.remove('run'); res(); }, reduced() ? 400 : BT.fast ? 800 : 1500);
  });
}
function unitCard(u){
  const d = BT.disp[u.id] || {hp:u.hp, mp:u.mp, g:0, sts:[]};
  const ko = d.hp<=0, mode = BT.mode;
  const tgt = (mode==='target-e' && u.side==='e' && !ko) || (mode==='target-a' && u.side==='a' && !ko) || (mode==='target-dead' && u.side==='a' && ko);
  const hpPct = d.hp/u.max.hp*100;
  return `<button class="uc ${BT.actor===u.id&&!BT.over?'act':''} ${ko?'ko':''} ${tgt?'tgt '+(u.side==='a'?'ally':''):''}" id="u-${u.id}" ${tgt?`data-a="tgt:${u.id}"`:'tabindex="-1"'}>
${sigil(u.inst.sp, 52, {variant:u.inst.variant})}
<div class="nm">${esc(u.name)}</div><div class="lv">Lv ${u.lv} ${elChips(u.el)}</div>
<div class="bars"><div class="bar" style="--c:${hpPct<30?'var(--danger)':'var(--ok)'}"><span style="width:${hpPct}%"></span></div>
${u.side==='a'?`<div class="hpn">${d.hp}/${u.max.hp}</div><div class="bar" style="--c:var(--mp)"><span style="width:${d.mp/u.max.mp*100}%"></span></div>`:''}
<div class="bar gauge ${d.g>=100?'full':''}"><span style="width:${d.g}%"></span></div></div>
<div class="sts">${d.sts.map(s=>`<span class="st">${STATUS[s].n}</span>`).join('')}</div></button>`;
}
function viewBattle(){
  const b = BT.b, u = BT.actor ? b.unit(BT.actor) : null;
  let panel = '';
  if (BT.over) panel = '';
  else if (BT.mode==='cmd' && u){
    if (BT.sub==='skills'){
      panel = `<div class="skl">${u.skills.map(id=>{ const s=SKILLS[id], ok=u.mp>=s.mp; return `<button class="li ${ok?'':'off'}" ${ok?`data-a="useSkill:${id}"`:'disabled'}>${skillLine(id)}</button>`;}).join('')}<button class="btn ghost" data-a="bcancel">戻る</button></div>`;
    } else if (BT.sub==='items'){
      const its = Object.entries(ITEMS).filter(([k,it])=>it.battle && S.items[k]>0);
      panel = `<div class="skl">${its.length?its.map(([k,it])=>`<button class="li" data-a="useItem:${k}"><div class="grow"><b>${it.n}</b> <span class="small muted">×${S.items[k]}</span><div class="small muted">${it.d}</div></div></button>`).join(''):'<p class="small muted">使える道具がない</p>'}<button class="btn ghost" data-a="bcancel">戻る</button></div>`;
    } else {
      const d = BT.disp[u.id];
      panel = `<p class="small"><b style="color:var(--gold)">${esc(u.name)}</b> はどうする？ <span class="muted">MP ${d.mp}/${u.max.mp}</span></p>
<div class="cmd"><button class="btn solid" data-a="cmd:attack">攻撃</button><button class="btn" data-a="cmd:skills">技・魔法</button><button class="btn" data-a="cmd:defend">防御</button>

function endBattle(res){
  const b = BT.b;

  const foes = b.units.filter(u=>u.side==='e');
  let html = '';
  if (res==='win'){
    S.wins++;
    const boss = !!BT.area.boss;
    const exp = foes.reduce((s,f)=>s + Math.floor((10+f.lv*7)*RARITY[f.sp.rar].m), 0) * (boss?1.5:1);
    const gold = foes.reduce((s,f)=>s + f.lv*12, 0) + randInt(10,40);
    const fu = boss ? 10 : (R()<0.7?1:2);
    S.gold += gold; S.fu += fu;
    const drops = [];
    if (R()<0.2){ S.items.fuda++; drops.push('回復の札'); }
    if(boss&&window.tgClear)tgClear('ikai');
    if (boss){ if (!S.boss || R()<0.3){ S.items.kinki++; drops.push('禁忌の香'); } S.boss++; }

      const g = Engine.gainExp(p.inst, Math.floor(exp * (p.hp>0?1:0.5)));
      return `<div class="li">${sigil(p.inst.sp,40,{variant:p.inst.variant})}<div class="grow"><b>${esc(p.name)}</b> <span class="small muted">Lv ${p.inst.lv}</span>

${Engine.evoOptions(p.inst).length?'<div class="small" style="color:var(--ok)">進化できる</div>':''}</div></div>`;
    }).join('');
    const rates = [0.55,0.38,0.22,0.12,0.06,0.04,0.02];
    BT.offers = foes.filter(f => R() < rates[RARITY[f.sp.rar].i] * (boss?0.5:1)).map(f => { f.inst.exp = 0; delete f.inst.aiOverride; return f.inst; });
    html = `<h2>勝利</h2><p class="small muted">経験値 ${Math.floor(exp)} ・ ${gold}両 ・ 霊符 ${fu}${drops.length?' ・ '+drops.join('、'):''}</p><div class="list">${lines}</div>
${BT.offers.length?`<div class="sec"><div class="sec-h"><h3>契約を望む者がいる</h3></div><div class="list" id="offers">${BT.offers.map((o,i)=>`<div class="li">${sigil(o.sp,48)}<div class="grow"><b>${SPECIES[o.sp].name}</b> <span class="small muted">Lv ${o.lv}</span> ${rarChip(SPECIES[o.sp].rar)}<div class="small muted">${SPECIES[o.sp].style}</div></div><button class="btn solid" data-a="contract:${i}">契約</button></div>`).join('')}</div></div>`:''}
<button class="btn wide" data-a="leave">庵へ戻る</button>`;
  } else if (res==='lose'){

<script>
/* ---------- 全体オート：探索・戦闘・契約・進化を自動で回す ---------- */
(function(){
  let lost={}, lastArea=null, wait=0, tick=0;
  const q=sel=>document.querySelector(sel), qa=sel=>[...document.querySelectorAll(sel)];
  const hit=el=>{ if(el&&!el.disabled){ el.click(); return true; } return false; };
  setInterval(()=>{
    if(!window.tgAuto) return;
    if(wait>0){ wait--; return; }
    tick++;
    if(!S){ const b=qa('[data-a^="start:"]'); if(b.length) hit(b[Math.floor(Math.random()*b.length)]); return; }
    if(BT){
      if(BT.over){
        if(BT.over==='win'){
          for(const k in lost) lost[k]=Math.max(0,lost[k]-.34);
          const o=q('[data-a^="contract:"]');
          if(o&&S.roster.length<30){ hit(o); return; }
        } else if(lastArea) lost[lastArea]=(lost[lastArea]||0)+1;
        hit(q('[data-a="leave"]')); wait=1; return;
      }
      if(!BT.auto) hit(q('[data-a="auto"]'));
      if(!BT.fast) hit(q('[data-a="fast"]'));
      return;
    }
    if(UI.modal){ hit(q('[data-a="closeModal"]')); return; }
    for(const uid of S.party){
      const c=byUid(uid), ev=c&&Engine.evoOptions(c);
      if(ev&&ev.length){ A.evolve(uid,ev[0].to); return; }
    }
    if(tick%8===0&&UI.tab!=='home'){ A.tab('home'); return; }
    if(UI.tab==='home'){ if(hit(q('[data-a^="claim:"]:not([disabled])'))) return; }
    if(UI.tab!=='explore'){ A.tab('explore'); return; }
    const areas=qa('[data-a^="battle:"]');
    if(!areas.length) return;
    let i=areas.length-1;
    while(i>0&&(lost[areas[i].dataset.a]||0)>=2) i--;
    lastArea=areas[i].dataset.a; hit(areas[i]); wait=1;
  },800);
})();

/* ---------- 共通の効果音（Web Audioで合成） ---------- */
window.tgSound = (function(){
  var AC = null, noiseBuf = null, on = true, last = {};
  try { on = localStorage.getItem('tg_sound') !== '0'; } catch (e) {}
  function ctx(){
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = 1;

  }
  function arp(fs, step, type, vol, dur){ fs.forEach(function(f, i){ tone(f, dur || .22, type, vol, 0, i * step); }); }
  var LIB = {
    click:  function(){ tone(900, .05, 'square', .03); },
    pick:   function(){ tone(660, .06, 'triangle', .07); tone(990, .08, 'triangle', .06, 0, .05); },
    unpick: function(){ tone(520, .08, 'triangle', .06, .7); },

    shotFoe:function(){ tone(700, .08, 'square', .02, .5); },
    slash:  function(){ noise(.12, .12, 2600, 0, 'highpass'); tone(500, .1, 'sawtooth', .03, .5); },
    dash:   function(){ noise(.2, .1, 800, 0, 'bandpass'); tone(200, .2, 'sine', .06, 2.2); },
    charge: function(){ tone(200, .7, 'sawtooth', .05, 4); },
    beam:   function(){ noise(.5, .2, 500, 0, 'lowpass'); tone(90, .5, 'sawtooth', .08, .5); },
    hit:    function(){ noise(.09, .14, 900, 0, 'lowpass'); tone(160, .08, 'square', .04, .6); },
    big:    function(){ noise(.3, .22, 400, 0, 'lowpass'); tone(110, .3, 'sawtooth', .07, .5); },
    heal:   function(){ arp([784, 988, 1319], .06, 'sine', .06, .2); },
    miss:   function(){ noise(.15, .06, 3000, 0, 'highpass'); },
    good:   function(){ arp([659, 784, 1047], .08, 'triangle', .07, .25); },
    bad:    function(){ tone(330, .25, 'triangle', .07, .75); tone(247, .35, 'triangle', .06, .8, .18); },
    win:    function(){ arp([523, 659, 784, 1047, 1319], .1, 'square', .045, .28); },
    lose:   function(){ arp([392, 330, 262, 196], .22, 'triangle', .08, .4); },
    splash: function(){ noise(.35, .18, 700, 0, 'lowpass'); noise(.2, .08, 2400, .05, 'bandpass'); },
    bubble: function(){ tone(250 + Math.random() * 250, .07, 'sine', .04, 1.8); },
    slurp:  function(){ noise(.5, .12, 1400, 0, 'bandpass'); noise(.3, .08, 900, .55, 'bandpass'); },
    coin:   function(){ tone(988, .06, 'square', .04); tone(1319, .14, 'square', .04, 0, .06); },
    summon: function(){ tone(130, 1, 'sawtooth', .05, 3); arp([523, 784, 1047, 1568], .12, 'sine', .07, .5); },
    evolve: function(){ arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], .07, 'triangle', .06, .3); },
    fuse:   function(){ tone(110, 1.1, 'sawtooth', .06, 2.5); noise(.9, .1, 300, .2, 'lowpass'); arp([659, 880, 1319], .12, 'sine', .07, .4); }
  };
  function play(name){
    if (!on || !LIB[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < 55) return;
    last[name] = now;
    if (!ctx()) return;
    try { LIB[name](); } catch (e) {}
  }
  var btn = document.querySelector('.tg-snd');
  function sync(){ if (btn) { btn.textContent = on ? '音：ON' : '音：OFF'; btn.setAttribute('aria-pressed', String(on)); } }
  if (btn) {
    ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ btn.addEventListener(t, function(e){ e.stopPropagation(); }); });
    btn.addEventListener('click', function(e){
      e.stopPropagation(); on = !on; sync(); btn.blur();
      try { localStorage.setItem('tg_sound', on ? '1' : '0'); } catch (err) {}
      if (on) { ctx(); play('pick'); }
    });
  }
  sync();
  // ブラウザは最初の操作まで音を出せないので、最初のタップで準備する
  window.addEventListener('pointerdown', function(){ if (on) ctx(); }, { once: true, capture: true });
  return { play: play };
})();
</script>

  [['evolve','evolve'],['summon','summon'],['doFuse','fuse']].forEach(([k,n])=>{ const o=A[k]; A[k]=function(){ P(n); return o.apply(this,arguments); }; });
  const M={start:'good',battle:'start',contract:'good',claim:'coin',buy:'coin',doRelease:'bad',evolve:'',summon:'',doFuse:''};
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]'); if(!b||b.disabled) return;

<!-- tg-swipe-guard: スワイプでの更新・戻るを防ぐ -->
<style>html,body{overscroll-behavior:none}</style>
<script>
(function(){
  var GAME=!!document.querySelector('.tg-auto');
  var sx=0,sy=0;
  function scroller(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){var s=getComputedStyle(el).overflowY;if((s==='auto'||s==='scroll')&&el.scrollHeight>el.clientHeight)return el;}return null;}
  document.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;
    // 画面端からのスワイプ（戻る・進む）を止める
    if(sx<14||sx>innerWidth-14){e.preventDefault();}},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
})();
</script>
