<title>錬成キメラ研究所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: 地下研究室の机。上に日付・行動・財布・疑惑の札、その下に檻（持ち物）と、外出・錬成・売買の帳面 */
:root{
  --bg:#141218; --panel:#1f1c25; --panel2:#2a2631; --ink:#ece6f2; --muted:#9a92a8; --line:#363042;
  --acc:#9a6aff; --gold:#e8b84a; --red:#e0574a; --green:#7fbf6a; --sus:#ff7a5a;
  --disp:"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:640px;margin:0 auto;padding:52px 14px 32px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:9px 18px;font-weight:900;font-size:15px}
.btn.main{background:var(--acc);border-color:var(--acc);color:#120a22}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d1404}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}

/* タイトル */
.title{min-height:calc(100dvh - 90px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center}
.title canvas{width:220px;height:165px}
.title h1{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(38px,11vw,64px);line-height:1.1}
.title h1 small{display:block;font-size:.4em;color:var(--acc);letter-spacing:.2em}
.title p{margin:0;line-height:1.9;color:#d8d0e4;max-width:30em;text-wrap:balance}
.title .warn{font-size:13px;color:var(--sus)}

/* 札 */
.top{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.top .day{font-family:var(--disp);font-size:24px}
.top .day small{font-family:var(--body);font-weight:700;font-size:13px;color:var(--muted);margin-left:6px}
.top .ap{text-align:right;font-weight:900;font-size:13px;color:var(--muted)}
.top .ap i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--acc);margin-left:4px;vertical-align:middle}
.top .ap i.used{background:var(--line)}
.top .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);font-weight:700}
.top .meta b{color:var(--ink);font-size:16px}
.top .meta .g b{color:var(--gold)}
.meter{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12px;font-weight:900;color:var(--muted)}
.meter .bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%}
.meter .sus i{background:linear-gradient(90deg,#d9a24a,var(--sus))}
.meter .kid i{background:var(--red)}
.meter span.v{font-variant-numeric:tabular-nums;color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 2px;font-weight:900;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--acc);color:#120a22;border-color:var(--acc)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sec h2{margin:0 0 6px;font-size:16px}
.sec p{margin:0 0 8px;font-size:13px;line-height:1.7;color:#d8d0e4}
.acts{display:grid;gap:8px}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.act .ico{font-size:26px}
.act b{display:block;font-size:15px}
.act small{display:block;font-size:12px;color:var(--muted);line-height:1.6}

/* 檻 */
.cages{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.cage{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:left;display:grid;gap:4px;position:relative}
.cage[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.cage canvas{width:100%;aspect-ratio:4/3;border-radius:8px;background:repeating-linear-gradient(90deg,#2a2631 0 10px,#24212b 10px 12px)}
.cage .nm{font-weight:900;font-size:13px;line-height:1.3}
.cage .st{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cage .tag{position:absolute;top:12px;left:12px;font-size:10px;font-weight:900;padding:2px 6px;border-radius:999px;background:var(--red);color:#fff}
.cage .tag.gen{left:auto;right:12px;background:var(--acc);color:#120a22}
.cage.empty{display:grid;place-items:center;min-height:120px;color:var(--muted);font-size:12px;border-style:dashed}
.fuse{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:8px 0}
.fuse .slot{background:var(--panel2);border:1.5px dashed var(--line);border-radius:12px;min-height:90px;display:grid;place-items:center;font-size:12px;color:var(--muted);padding:6px;text-align:center}
.fuse .slot canvas{width:100%;aspect-ratio:4/3}
.fuse .plus{font-family:var(--disp);font-size:26px;color:var(--acc)}
.pred{font-size:13px;color:#d8d0e4;line-height:1.7;background:var(--panel2);border-radius:10px;padding:8px 12px}
.pred b{color:var(--gold)}
.shop .act{grid-template-columns:auto 1fr auto}
.log{font-size:13px;line-height:1.8;color:#d8d0e4}

/* 札（モーダル） */
.modal{position:fixed;inset:0;background:rgba(5,3,10,.72);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.sheet{width:min(100%,460px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-height:calc(100dvh - 32px);overflow:auto}
.sheet h2{margin:0 0 8px;font-family:var(--disp);font-weight:400;font-size:24px;text-align:center}
.sheet p{margin:0 0 10px;line-height:1.8;color:#d8d0e4;font-size:14px}
.sheet canvas{display:block;margin:0 auto 10px;width:260px;height:195px}
.kid{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;margin-bottom:10px}
.kid canvas{width:72px;height:72px;margin:0}
.bubble{background:#f6f0ff;color:#1a1424;border-radius:14px;padding:10px 14px;font-weight:900;line-height:1.6;position:relative}
.bubble::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#f6f0ff;border-left:0}
.choices{display:grid;gap:8px}
.choices button{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 14px;font-weight:700;line-height:1.5}
.choices button small{display:block;color:var(--muted);font-size:11px;font-weight:700}
.verdict{font-family:var(--disp);font-size:22px;text-align:center;margin:4px 0 8px}
.verdict.ok{color:var(--green)} .verdict.ng{color:var(--red)}

/* ゲームオーバー */
.over{min-height:calc(100dvh - 90px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;text-align:center}
.over canvas{width:180px;height:180px}
.over .line{font-family:var(--disp);font-weight:400;font-size:clamp(22px,6.2vw,40px);line-height:1.4;color:#f0e8ff;text-shadow:0 0 30px rgba(154,106,255,.6);margin:0;text-wrap:balance}
.over .line small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px;letter-spacing:.2em}
.over p{margin:0;color:#d8d0e4;line-height:1.8}
.result{text-align:center;display:grid;gap:12px}
.result h2{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(30px,9vw,44px)}
.result canvas{width:260px;height:195px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:900;font-size:14px;z-index:200;pointer-events:none;animation:toast 1.8s ease forwards;max-width:calc(100% - 32px)}
@keyframes toast{0%{opacity:0}12%,80%{opacity:1}100%{opacity:0}}
</style>

<body>

<script>
'use strict';
/* ================= データ ================= */
// 部位：head 頭の形, col 体の色, legs 脚, tail 尾, wings 翼
const ANIMALS = {
  inu:      { n: '犬',   pow: 14, spd: 14, def: 8,  int: 12, head: 'dog',    col: '#c08850', legs: 4, tail: 'fluffy', price: 20 },
  neko:     { n: '猫',   pow: 10, spd: 18, def: 6,  int: 14, head: 'cat',    col: '#9a9a9a', legs: 4, tail: 'thin',   price: 20 },
  niwatori: { n: '鶏',   pow: 6,  spd: 10, def: 5,  int: 6,  head: 'bird',   col: '#f2efe6', legs: 2, tail: 'feather', wings: 'bird', comb: true, price: 12 },
  kaeru:    { n: '蛙',   pow: 8,  spd: 12, def: 6,  int: 6,  head: 'frog',   col: '#6aa84f', legs: 4, tail: null,     price: 10 },
  nezumi:   { n: '鼠',   pow: 4,  spd: 20, def: 4,  int: 10, head: 'mouse',  col: '#8a7f75', legs: 4, tail: 'thin',   price: 8 },
  hebi:     { n: '蛇',   pow: 16, spd: 14, def: 10, int: 12, head: 'snake',  col: '#5f8a3a', legs: 0, tail: 'snake',  price: 35 },
  koumori:  { n: '蝙蝠', pow: 8,  spd: 24, def: 4,  int: 10, head: 'bat',    col: '#4a3f4a', legs: 2, tail: null,     wings: 'bat', price: 30 },
  yagi:     { n: '山羊', pow: 14, spd: 10, def: 16, int: 10, head: 'goat',   col: '#e8e0d0', legs: 4, tail: null,     price: 35 },
  karasu:   { n: '烏',   pow: 8,  spd: 18, def: 6,  int: 30, head: 'bird',   col: '#26232b', legs: 2, tail: 'feather', wings: 'bird', price: 40 },
  saru:     { n: '猿',   pow: 14, spd: 16, def: 8,  int: 34, head: 'monkey', col: '#a0703a', legs: 2, tail: 'thin',   price: 45 },
  kuma:     { n: '熊',   pow: 32, spd: 10, def: 22, int: 12, head: 'bear',   col: '#5a3a24', legs: 4, tail: null,     price: 80 },
  washi:    { n: '鷲',   pow: 22, spd: 28, def: 10, int: 18, head: 'eagle',  col: '#6b4a2a', legs: 2, tail: 'feather', wings: 'bird', price: 80 },
  ookami:   { n: '狼',   pow: 26, spd: 24, def: 14, int: 18, head: 'dog',    col: '#6f7378', legs: 4, tail: 'fluffy', price: 80 },
  kame:     { n: '亀',   pow: 10, spd: 4,  def: 42, int: 16, head: 'turtle', col: '#4f7a5a', legs: 4, tail: null,     shell: true, price: 70 },
};
const FORESTS = [
  { n: '森の入口',   cost: 0,   pool: ['inu', 'neko', 'niwatori', 'kaeru', 'nezumi'] },
  { n: '森の奥',     cost: 200, pool: ['hebi', 'koumori', 'yagi', 'karasu', 'saru', 'inu', 'neko'] },
  { n: '霊獣の森',   cost: 550, pool: ['kuma', 'washi', 'ookami', 'kame', 'hebi', 'saru', 'karasu'] },
];
// 村人：alibi は言い訳の通りやすさに効く
const VILLAGERS = [
  { id: 'gen',   n: 'ゲン',     job: '旅人',     alibi: '旅',   hair: '#3a2a1a', cloth: '#7a5a3a' },
  { id: 'sakichi', n: 'サキチ', job: '行商人',   alibi: '商い', hair: '#1a1a1a', cloth: '#4a6a8a' },
  { id: 'tome',  n: 'トメ',     job: '飲んだくれ', alibi: '酒', hair: '#8a8a8a', cloth: '#8a4a4a' },
  { id: 'gonzo', n: 'ゴンゾウ', job: '借金取り', alibi: '仕事', hair: '#2a2a2a', cloth: '#2a2a3a' },
  { id: 'obaba', n: 'オババ',   job: '占い師',   alibi: '山',   hair: '#e8e8e8', cloth: '#6a3a8a' },
  { id: 'lute',  n: 'リュート', job: '吟遊詩人', alibi: '旅',   hair: '#c8a040', cloth: '#3a7a5a' },
  { id: 'kazura', n: 'カズラ',  job: '薬売り',   alibi: '商い', hair: '#5a2a1a', cloth: '#8a7a3a' },
  { id: 'matagi', n: 'マタギ',  job: '木こり',   alibi: '山',   hair: '#4a3a2a', cloth: '#5a6a3a' },
];
const EXCUSES = [
  { tag: '旅',   t: '遠い国へ旅に出たって言ってたよ' },
  { tag: '商い', t: '仕入れで都まで行ってるらしいよ' },
  { tag: '酒',   t: '隣町の酒場に入り浸ってるんだってさ' },
  { tag: '仕事', t: '取り立ての仕事で忙しいんだって' },
  { tag: '山',   t: '山に籠もって修行してるそうだよ' },
  { tag: '知らない', t: 'さあ……最近見てないなあ' },
  { tag: '菓子', t: 'それより、お菓子食べるかい？' },
];
const KID = 'ケンタ';
const DAYS = 30, AP_PER_DAY = 3, SAVE_KEY = 'chimera_best', TALK_INT = 50;
const SHOP = [
  { id: 'cage',   n: '檻を増やす',     d: '檻が2つ増える',                     cost: 120, max: 3 },
  { id: 'cloth',  n: '檻にかける黒い布', d: '人の面影があるキメラを子供に見られにくくなる', cost: 150, max: 1 },
  { id: 'incense', n: 'お香を焚く',    d: '研究所の妙な匂いを消す。疑惑 −15',  cost: 60,  max: 99 },
];

/* ================= 状態 ================= */
let G = null, UI = { screen: 'title', tab: 'out', modal: null, sel: [] };
let best = 0;
try { best = parseInt(localStorage.getItem(SAVE_KEY) || '0', 10) || 0; } catch (e) { best = 0; }
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const snd = n => { if (window.tgSound) window.tgSound.play(n); };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function newGame() {
  G = {
    day: 1, ap: AP_PER_DAY, gold: 150, sus: 0, kid: 0, cages: [], cap: 6, forest: 0,
    owned: { cage: 0, cloth: 0, incense: 0 }, used: [], lastHumanDay: -99, missing: [],
    log: ['街はずれの古い屋敷を買い取り、地下に研究室をこしらえた。三十日後には国家錬金術師の査定がある。'],
    stats: { fused: 0, fail: 0, humans: 0, excuses: 0, sold: 0 },
  };
  for (let i = 0; i < 2; i++) G.cages.push(makeAnimal(pick(FORESTS[0].pool)));
  UI = { screen: 'game', tab: 'out', modal: null, sel: [] };
  render();
}
let uid = 1;
function makeAnimal(k) {
  const a = ANIMALS[k];
  const v = () => rnd(.85, 1.15);
  return { id: uid++, kind: 'animal', sp: [k], name: a.n, pow: Math.round(a.pow * v()), spd: Math.round(a.spd * v()), def: Math.round(a.def * v()), int: Math.round(a.int * v()),
    head: k, body: k, legs: k, tail: k, wings: a.wings ? k : null, humans: [], gen: 0, seed: Math.floor(Math.random() * 1e9) };
}
function makeHuman(v) {
  return { id: uid++, kind: 'human', sp: ['human'], name: v.n, hid: v.id, pow: Math.round(rnd(10, 16)), spd: Math.round(rnd(9, 14)), def: Math.round(rnd(5, 9)), int: Math.round(rnd(72, 90)),
    head: 'human:' + v.id, body: 'human:' + v.id, legs: 'human:' + v.id, tail: null, wings: null, humans: [v.id], gen: 0, seed: Math.floor(Math.random() * 1e9) };
}
const grade = c => Math.round(c.pow + c.spd + c.def + c.int * 1.5 + (c.gen ? c.gen * 6 : 0));
const sellPrice = c => c.kind === 'animal' ? ANIMALS[c.sp[0]].price : c.kind === 'human' ? 0 : Math.round(grade(c) * .9 * (c.humans.length ? 1.4 : 1));
const partName = p => p ? (p.startsWith('human') ? '人' : ANIMALS[p].n) : '';
function chimeraName(c) {
  if (c.kind !== 'chimera') return c.name;
  const h = partName(c.head), b = partName(c.body);
  return h === b ? `${h}もどき` : `${h}頭の${b}`;
}

/* ================= 錬成 ================= */
function fusePreview(a, b) {
  const gen = Math.max(a.gen, b.gen) + 1;
  const ok = clamp(.97 - gen * .04, .7, .97);
  const st = k => Math.round(Math.max(a[k], b[k]) * .75 + Math.min(a[k], b[k]) * .5);
  return { gen, ok, pow: st('pow'), spd: st('spd'), def: st('def'), int: st('int') };
}
function fuse(a, b) {
  const pv = fusePreview(a, b);
  G.ap--;
  G.cages = G.cages.filter(c => c !== a && c !== b);
  G.stats.fused++;
  const humans = [...new Set([...a.humans, ...b.humans])];
  let c;
  if (Math.random() > pv.ok) {
    G.stats.fail++;
    const keep = grade(a) >= grade(b) ? a : b;
    G.cages.push(keep);
    c = { id: uid++, kind: 'chimera', sp: [...a.sp, ...b.sp], name: '失敗作', fail: true, pow: Math.round(pv.pow * .45), spd: Math.round(pv.spd * .45), def: Math.round(pv.def * .45), int: Math.round(pv.int * .3),
      head: pick([a.head, b.head]), body: pick([a.body, b.body]), legs: pick([a.legs, b.legs]), tail: pick([a.tail, b.tail]), wings: null, humans, gen: pv.gen, seed: Math.floor(Math.random() * 1e9) };
    snd('bad');
  } else {
    const v = () => rnd(.95, 1.12), flip = Math.random() < .5, hp = flip ? a : b, bp = flip ? b : a;
    c = { id: uid++, kind: 'chimera', sp: [...a.sp, ...b.sp], pow: Math.round(pv.pow * v()), spd: Math.round(pv.spd * v()), def: Math.round(pv.def * v()), int: Math.round(pv.int * v()),
      head: hp.head, body: bp.body, legs: pick([a.legs, b.legs]), tail: pick([a.tail, b.tail].filter(Boolean).concat([null])) , wings: a.wings || b.wings ? pick([a.wings, b.wings, a.wings || b.wings]) : null, humans, gen: pv.gen, seed: Math.floor(Math.random() * 1e9) };

${FORESTS.map((f, i) => i > G.forest ? `<div class="act"><span class="ico" aria-hidden="true">🗝️</span><div><b>${f.n}へ通う</b><small>${f.pool.filter(k => !FORESTS[i - 1].pool.includes(k)).map(k => ANIMALS[k].n).join('・')}が棲む</small></div><button class="btn gold sm" data-a="forest:${i}" ${G.gold >= f.cost && G.forest === i - 1 ? '' : 'disabled'}>${f.cost}G</button></div>` : '').join('')}
</div>
<div class="row" style="margin-top:12px"><span class="grow small muted">${G.ap ? '' : 'きょうはもう動けない。'}夜になると、檻の数だけ餌代（1匹1G）がかかる。</span><button class="btn ${G.ap ? '' : 'main'}" data-a="sleep">寝る（${G.day >= DAYS ? '査定の日へ' : '次の日へ'}）</button></div>

}
function cageCard(c, selectable) {
  const sel = UI.sel.includes(c.id);
  return `<button class="cage" ${selectable ? `data-a="sel:${c.id}" aria-pressed="${sel}"` : 'data-a="noop"'} aria-label="${esc(c.name)}">
${c.humans.length ? `<span class="tag">人${c.kind === 'human' ? '' : '入り'}</span>` : ''}${c.gen ? `<span class="tag gen">${c.gen}代</span>` : ''}
<canvas data-c="${c.id}" width="280" height="210" aria-hidden="true"></canvas>
<span class="nm">${esc(c.name)}${c.kind === 'human' ? ` <small class="muted">${VILLAGERS.find(v => v.id === c.hid).job}</small>` : ''}</span>
<span class="st">力${c.pow} 速${c.spd} 硬${c.def} 知${c.int}・格${grade(c)}</span></button>`;

function vLab() {
  const [a, b] = UI.sel.map(id => G.cages.find(c => c.id === id));
  const pv = a && b ? fusePreview(a, b) : null;
  return `<section class="sec"><h2>掛け合わせる</h2><p>檻から2匹選ぶと、生まれるキメラの見込みが出る。代を重ねるほど強くなるが、失敗しやすくなる。</p>
<div class="fuse"><div class="slot">${a ? `<canvas data-c="${a.id}" width="200" height="150"></canvas>${esc(a.name)}` : '1匹目'}</div><span class="plus">＋</span><div class="slot">${b ? `<canvas data-c="${b.id}" width="200" height="150"></canvas>${esc(b.name)}` : '2匹目'}</div></div>
${pv ? `<div class="pred">見込み：力${pv.pow} 速${pv.spd} 硬${pv.def} 知<b>${pv.int}</b>・${pv.gen}代目・成功率 <b>${Math.round(pv.ok * 100)}%</b>${pv.int >= TALK_INT && (a.humans.length || b.humans.length) ? '<br>人語を解するかもしれない' : ''}</div>` : ''}
<div class="row" style="margin-top:10px"><button class="btn sm" data-a="clearSel" ${UI.sel.length ? '' : 'disabled'}>選び直す</button><span class="grow"></span><button class="btn main" data-a="fuse" ${pv && G.ap > 0 ? '' : 'disabled'}>錬成する（行動1）</button></div></section>
<div class="cages">${G.cages.map(c => cageCard(c, true)).join('')}</div>`;
}
function vCage() {

function vShop() {
  return `<div class="acts shop">${SHOP.map(s => `<div class="act"><span class="ico" aria-hidden="true">${s.id === 'cage' ? '🔒' : s.id === 'cloth' ? '🧺' : '🪔'}</span><div><b>${s.n}</b><small>${s.d}${s.max < 99 ? `（${G.owned[s.id]}/${s.max}）` : ''}</small></div><button class="btn gold sm" data-a="buy:${s.id}" ${G.gold >= s.cost && G.owned[s.id] < s.max ? '' : 'disabled'}>${s.cost}G</button></div>`).join('')}</div>`;

function vOver() {
  return `<section class="over"><canvas id="kidc" width="360" height="360" aria-hidden="true"></canvas>
<p class="muted">${KID}は、もう何を言っても信じてくれなかった。<br>翌朝、研究所には役人がやってきた。</p>
<p class="line"><small>捨て台詞</small>君のように勘のいいガキは<br>嫌いだよ</p>
<p class="small muted">${G.day}日目・行方不明 ${G.missing.length}人・錬成 ${G.stats.fused}回</p>
<div class="row" style="justify-content:center"><button class="btn main" data-a="start">もう一度研究する</button><button class="btn" data-a="title">タイトルへ</button></div></section>`;

function vJudge() {
  const r = UI.result;

${r.c ? `<canvas id="jc" width="520" height="390" aria-label="${esc(r.c.name)}"></canvas><p><b>${esc(r.c.name)}</b>（格 ${r.gd}・知恵 ${r.c.int}）</p>` : ''}
<p>${esc(r.line)}</p>
<p class="small muted">得点 ${r.score}${r.isBest ? '（これまでで最高）' : ''}・行方不明 ${G.missing.length}人・言い訳 ${G.stats.excuses}回</p>
<div class="row" style="justify-content:center"><button class="btn main" data-a="start">もう一度研究する</button><button class="btn" data-a="title">タイトルへ</button></div></section>`;
}
function vModal() {
  const m = UI.modal; if (!m) return '';
  if (m.type === 'visitor') {
    const v = m.v;
    return `<div class="modal"><div class="sheet" role="dialog" aria-label="来客"><h2>来客</h2><canvas id="vc" width="520" height="390" aria-hidden="true"></canvas>
<p>${v.job}の<b>${v.n}</b>がお茶を飲みに来た。「いやあ、立派なお屋敷ですなあ。地下には何が？」</p>
<div class="choices"><button data-a="tea">にこやかにお茶を出して帰す<small>疑惑が少し下がる</small></button><button data-a="keep" ${G.cages.length < G.cap ? '' : 'disabled'}>「ちょっと研究に協力してもらえますか」<small>人が檻に入る。とても賢い。疑惑が大きく上がる${G.cages.length < G.cap ? '' : '（檻がいっぱい）'}</small></button></div></div></div>`;
  }
  if (m.type === 'born') {
    const c = m.c;
    return `<div class="modal"><div class="sheet" role="dialog" aria-label="錬成の結果"><h2>${c.fail ? '失敗作が生まれた' : 'キメラ誕生'}</h2><canvas id="bc" width="520" height="390" aria-hidden="true"></canvas>
<p style="text-align:center"><b>${esc(c.name)}</b>（${c.gen}代目）<br>力${c.pow} 速${c.spd} 硬${c.def} 知${c.int}・格${grade(c)}</p>
${c.talk ? `<p style="text-align:center;color:var(--gold);font-weight:900">「……ハラ……ヘッタ」<br>このキメラは人の言葉を話す。</p>` : ''}
${c.fail ? '<p style="text-align:center">うまく混ざらず、ぐずぐずの毛玉のようなものができた。強いほうの片割れだけは、なんとか元の姿で残った。</p>' : ''}
<div class="row" style="justify-content:center"><button class="btn main" data-a="close">檻に入れる</button></div></div></div>`;
  }
  if (m.type === 'kid') {
    return `<div class="modal"><div class="sheet" role="dialog" aria-label="${KID}がやってきた"><h2>${KID}がやってきた</h2>
<div class="kid"><canvas id="kc" width="200" height="200" aria-hidden="true"></canvas><div class="bubble">${esc(m.q)}</div></div>
${m.result ? `<div class="verdict ${m.result.ok ? 'ok' : 'ng'}">${m.result.ok ? 'ごまかせた' : 'ごまかせなかった'}</div><p>${esc(m.result.line)}</p><p class="small muted">${KID}の確信 ${Math.round(G.kid)} / 100</p><div class="row" style="justify-content:center"><button class="btn main" data-a="kidClose">${G.kid >= 100 ? '……' : '扉を閉める'}</button></div>`
      : `<p class="small muted">なんと言ってごまかそう。</p><div class="choices">${m.choices.map((c, i) => `<button data-a="ans:${i}">${esc(c.t)}</button>`).join('')}</div>`}
</div></div>`;
  }
  return '';
}
function render() {
  if (UI.screen === 'title') app.innerHTML = vTitle();
  else if (UI.screen === 'over') app.innerHTML = vOver();
  else if (UI.screen === 'judge') app.innerHTML = vJudge();
  else app.innerHTML = vTop() + vTabs() + { out: vOut, lab: vLab, cage: vCage, shop: vShop }[UI.tab]();
  modalRoot.innerHTML = vModal();
  paint(0);
}
function paint(t) {
  document.querySelectorAll('canvas[data-c]').forEach(cv => { const c = G && G.cages.find(x => x.id === +cv.dataset.c); if (c) drawCreature(cv.getContext('2d'), c, t); });
  const one = (id, c) => { const cv = document.getElementById(id); if (cv && c) drawCreature(cv.getContext('2d'), c, t); };
  one('tcv', TITLE_C);
  if (UI.modal && UI.modal.type === 'born') one('bc', UI.modal.c);
  if (UI.modal && UI.modal.type === 'visitor') one('vc', makeHumanPreview(UI.modal.v));
  if (UI.screen === 'judge' && UI.result.c) one('jc', UI.result.c);
  const kc = document.getElementById('kc'); if (kc) drawKid(kc.getContext('2d'), t, G.kid / 100);
  const kd = document.getElementById('kidc'); if (kd) drawKid(kd.getContext('2d'), t, 1);
}
const previewCache = {};
function makeHumanPreview(v) { return previewCache[v.id] || (previewCache[v.id] = { id: -1, kind: 'human', head: 'human:' + v.id, body: 'human:' + v.id, legs: 'human:' + v.id, tail: null, wings: null, humans: [v.id], gen: 0, seed: 3 }); }

/* ================= 操作 ================= */
function act(a) {
  const [k, x] = a.split(':');
  if (k === 'start') { snd('start'); newGame(); window.scrollTo(0, 0); }
  else if (k === 'title') { UI = { screen: 'title', tab: 'out', modal: null, sel: [] }; render(); }
  else if (k === 'tab') { UI.tab = x; snd('click'); render(); }
  else if (k === 'hunt') hunt();
  else if (k === 'invite') invite();
  else if (k === 'tea') teaHuman(UI.modal.v);
  else if (k === 'keep') keepHuman(UI.modal.v);
  else if (k === 'forest') goDeeper(+x);
  else if (k === 'sleep') sleep();
  else if (k === 'sel') { const id = +x; if (UI.sel.includes(id)) UI.sel = UI.sel.filter(s => s !== id); else if (UI.sel.length < 2) UI.sel.push(id); else UI.sel = [UI.sel[1], id]; snd('click'); render(); }
  else if (k === 'clearSel') { UI.sel = []; render(); }
  else if (k === 'fuse') { const [p, q] = UI.sel.map(id => G.cages.find(c => c.id === id)); if (p && q && G.ap > 0) fuse(p, q); }
  else if (k === 'sell') sell(+x);
  else if (k === 'buy') buy(x);
  else if (k === 'close') { UI.modal = null; render(); }
  else if (k === 'ans') answer(+x);
  else if (k === 'kidClose') closeKid();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  act(el.dataset.a);
});

/* ================= オート ================= */
const AI = { next: 0, resAt: 0 };
const worth = c => grade(c) + (c.talk ? 120 : 0) + (c.kind === 'human' ? 40 : 0);
function bestPair() {
  let best = null;
  const cs = G.cages.filter(c => !c.fail);
  for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) {
    const pv = fusePreview(cs[i], cs[j]);
    const hasH = cs[i].humans.length || cs[j].humans.length;
    const v = (pv.pow + pv.spd + pv.def + pv.int * 1.6 + (hasH && pv.int >= TALK_INT + 4 ? 120 : 0)) * pv.ok;
    const cur = Math.max(worth(cs[i]), worth(cs[j]));
    if (v > cur * 1.03 && (!best || v - cur > best.gain)) best = { v, gain: v - cur, a: cs[i], b: cs[j], pv };
  }
  return best;
}
function autoStep() {
  const m = UI.modal;
  if (UI.screen === 'title') { act('start'); return; }
  if (UI.screen === 'over' || UI.screen === 'judge') { if (!AI.resAt) AI.resAt = Date.now(); else if (Date.now() - AI.resAt > 6000) { AI.resAt = 0; act('start'); } return; }
  if (m) {
    if (m.type === 'kid') {
      if (m.result) { closeKid(); return; }
      // 職業に合った言い訳を選ぶ
      let bi = 0, bv = -1; m.choices.forEach((c, i) => { if (c.base > bv) { bv = c.base; bi = i; } });
      answer(bi); return;
    }
    if (m.type === 'visitor') { const needBrain = G.day >= 6 && G.sus < 30 && G.kid < 45 && G.stats.humans < 3 && G.cages.length < G.cap; (needBrain ? keepHuman : teaHuman)(m.v); return; }
    UI.modal = null; render(); return;
  }
  // 買い物
  if (G.forest < 2 && G.gold >= FORESTS[G.forest + 1].cost + 40) { UI.tab = 'out'; goDeeper(G.forest + 1); return; }
  if (G.sus >= 45 && G.gold >= 60) { UI.tab = 'shop'; buy('incense'); return; }
  if (!G.owned.cloth && G.stats.humans && G.gold >= 190) { UI.tab = 'shop'; buy('cloth'); return; }
  if (G.owned.cage < 2 && G.cages.length >= G.cap - 1 && G.gold >= 160) { UI.tab = 'shop'; buy('cage'); return; }
  // 弱い生き物は売って餌代と資金に
  const weak = G.cages.filter(c => c.kind !== 'human' && !c.talk && !c.humans.length).sort((a, b) => (a.fail ? -999 : grade(a)) - (b.fail ? -999 : grade(b)));
  const failed = G.cages.find(c => c.fail);
  if (failed) { UI.tab = 'cage'; sell(failed.id); return; }
  if (G.cages.length >= G.cap - 1 && weak.length > 3) { UI.tab = 'cage'; sell(weak[0].id); return; }
  if (G.ap <= 0) { UI.tab = 'out'; sleep(); return; }
  // 錬成：2匹以上いれば良い組み合わせを
  const bp = G.cages.length >= 4 || G.day > 20 ? bestPair() : null;
  if (bp) { UI.tab = 'lab'; UI.sel = [bp.a.id, bp.b.id]; fuse(bp.a, bp.b); return; }
  if (G.day >= 6 && G.sus < 30 && G.kid < 45 && G.stats.humans < 3 && Math.random() < .4) { UI.tab = 'out'; invite(); return; }
  UI.tab = 'out'; hunt();
  if (G.ap > 0 && G.cages.length >= G.cap) { const w = G.cages.filter(c => c.kind !== 'human' && !c.humans.length).sort((a, b) => grade(a) - grade(b))[0]; if (w) sell(w.id); }
}
let last = performance.now(), paintT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (window.tgAuto) { AI.next -= dt; if (AI.next <= 0) { AI.next = .8; autoStep(); } }
  paintT += dt; if (paintT > .07) { paintT = 0; paint(now / 1000); }
  requestAnimationFrame(frame);
}
render();
requestAnimationFrame(frame);
</script>

window.tgSound = (function(){
  var AC = null, noiseBuf = null, on = true, last = {};
  try { on = localStorage.getItem('tg_sound') !== '0'; } catch (e) {}
  function ctx(){
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, dur, type, vol, slide, delay){
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, vol, freq, delay, kind){
    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = 1;
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + .03);
  }
  function arp(fs, step, type, vol, dur){ fs.forEach(function(f, i){ tone(f, dur || .22, type, vol, 0, i * step); }); }
  var LIB = {
    click:  function(){ tone(900, .05, 'square', .03); },
    pick:   function(){ tone(660, .06, 'triangle', .07); tone(990, .08, 'triangle', .06, 0, .05); },
    unpick: function(){ tone(520, .08, 'triangle', .06, .7); },
    tick:   function(){ tone(1500 + Math.random() * 300, .025, 'square', .025); },
    land:   function(){ tone(784, .09, 'square', .05); tone(1175, .18, 'square', .05, 0, .07); },
    start:  function(){ arp([392, 523, 659], .09, 'square', .05, .18); },
    shot:   function(){ tone(1200, .07, 'square', .025, .45); },
    shotFoe:function(){ tone(700, .08, 'square', .02, .5); },
    slash:  function(){ noise(.12, .12, 2600, 0, 'highpass'); tone(500, .1, 'sawtooth', .03, .5); },
    dash:   function(){ noise(.2, .1, 800, 0, 'bandpass'); tone(200, .2, 'sine', .06, 2.2); },
    charge: function(){ tone(200, .7, 'sawtooth', .05, 4); },
    beam:   function(){ noise(.5, .2, 500, 0, 'lowpass'); tone(90, .5, 'sawtooth', .08, .5); },
    hit:    function(){ noise(.09, .14, 900, 0, 'lowpass'); tone(160, .08, 'square', .04, .6); },
    big:    function(){ noise(.3, .22, 400, 0, 'lowpass'); tone(110, .3, 'sawtooth', .07, .5); },
    heal:   function(){ arp([784, 988, 1319], .06, 'sine', .06, .2); },
    miss:   function(){ noise(.15, .06, 3000, 0, 'highpass'); },
    good:   function(){ arp([659, 784, 1047], .08, 'triangle', .07, .25); },
    bad:    function(){ tone(330, .25, 'triangle', .07, .75); tone(247, .35, 'triangle', .06, .8, .18); },
    win:    function(){ arp([523, 659, 784, 1047, 1319], .1, 'square', .045, .28); },
    lose:   function(){ arp([392, 330, 262, 196], .22, 'triangle', .08, .4); },
    splash: function(){ noise(.35, .18, 700, 0, 'lowpass'); noise(.2, .08, 2400, .05, 'bandpass'); },
    bubble: function(){ tone(250 + Math.random() * 250, .07, 'sine', .04, 1.8); },
    slurp:  function(){ noise(.5, .12, 1400, 0, 'bandpass'); noise(.3, .08, 900, .55, 'bandpass'); },
    coin:   function(){ tone(988, .06, 'square', .04); tone(1319, .14, 'square', .04, 0, .06); },
    summon: function(){ tone(130, 1, 'sawtooth', .05, 3); arp([523, 784, 1047, 1568], .12, 'sine', .07, .5); },
    evolve: function(){ arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], .07, 'triangle', .06, .3); },
    fuse:   function(){ tone(110, 1.1, 'sawtooth', .06, 2.5); noise(.9, .1, 300, .2, 'lowpass'); arp([659, 880, 1319], .12, 'sine', .07, .4); }
  };
  function play(name){
    if (!on || !LIB[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < 55) return;
    last[name] = now;
    if (!ctx()) return;
    try { LIB[name](); } catch (e) {}
  }
  var btn = document.querySelector('.tg-snd');
  function sync(){ if (btn) { btn.textContent = on ? '音：ON' : '音：OFF'; btn.setAttribute('aria-pressed', String(on)); } }
  if (btn) {
    ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ btn.addEventListener(t, function(e){ e.stopPropagation(); }); });
    btn.addEventListener('click', function(e){
      e.stopPropagation(); on = !on; sync(); btn.blur();
      try { localStorage.setItem('tg_sound', on ? '1' : '0'); } catch (err) {}
      if (on) { ctx(); play('pick'); }
    });
  }
  sync();
  // ブラウザは最初の操作まで音を出せないので、最初のタップで準備する
  window.addEventListener('pointerdown', function(){ if (on) ctx(); }, { once: true, capture: true });
  return { play: play };
})();
</script>

<!-- tg-swipe-guard: スワイプでの更新・戻るを防ぐ -->
<style>html,body{overscroll-behavior:none}</style>
<script>
(function(){
  var GAME=!!document.querySelector('.tg-auto');
  var sx=0,sy=0;
  function scroller(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){var s=getComputedStyle(el).overflowY;if((s==='auto'||s==='scroll')&&el.scrollHeight>el.clientHeight)return el;}return null;}
  document.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;
    // 画面端からのスワイプ（戻る・進む）を止める
    if(sx<14||sx>innerWidth-14){e.preventDefault();}},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
})();
</script>
