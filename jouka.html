<style>

html,body{margin:0;height:100%;background:#0c0c12;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:#16161e;overflow:hidden}
#top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;background:#0c0c12;font-size:12px;border-bottom:1px solid #2a2a36}

#hud{display:flex;gap:10px;color:#ddd;white-space:nowrap}

#main{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
#screen{flex:none;display:flex;justify-content:center;background:#000;position:relative}
#cv{display:block}
#controls{flex:1;min-height:170px;display:flex;align-items:center;justify-content:space-between;padding:8px 20px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#1b1b25,#121218)}
#dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:2px}
.dp{background:#2c2c3a;border:none;border-radius:10px;color:#cfd3e6;font-size:22px;box-shadow:0 3px 0 #0b0b10}
.dp.on{background:#474761;transform:translateY(2px);box-shadow:0 1px 0 #0b0b10}
#ab{display:flex;gap:14px;align-items:center}
.abtn{width:74px;height:74px;border-radius:50%;border:none;font-size:14px;font-weight:bold;color:#fff;box-shadow:0 4px 0 #0b0b10}

#btnB{background:#3d5bd9;margin-top:30px}
.hidden{display:none!important}
.ov{position:absolute;inset:0}

#dname{display:inline-block;background:#e8e3d0;color:#16161e;font-weight:bold;font-size:13px;padding:2px 10px;border-radius:4px;margin-bottom:6px}
#dtext{font-size:16px;line-height:1.6;white-space:pre-wrap}
#dnext{position:absolute;right:12px;bottom:6px;font-size:12px;color:#e8e3d0;animation:blink 1s infinite}
#dchoices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#dchoices button{flex:1 1 40%;padding:11px;border-radius:8px;border:2px solid #e8e3d0;background:#23233a;color:#fff;font-size:15px}
@keyframes blink{50%{opacity:0}}
/* battle */
#battle{z-index:20;display:flex;flex-direction:column;background:#101018}
#bcv{display:block;width:100%;flex:none}
#blog{flex:none;min-height:74px;margin:6px 8px 0;padding:8px 10px;background:#0a0a14;border:2px solid #d8d3c0;border-radius:8px;font-size:14px;line-height:1.5}
#blog .pr{color:#ffe07a}
#bparty{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px 8px}
.pbox{background:#1f1f30;border:2px solid #3a3a52;border-radius:7px;padding:4px 7px;font-size:12px;transition:background .15s}
.pbox.cur{border-color:#ffe07a;background:#2c2c44}
.pbox.dead{opacity:.45}
.pbox.hit{background:#6a1f2a}
.pbox .nm{display:flex;justify-content:space-between;font-weight:bold}
.bar{height:6px;background:#333;border-radius:3px;overflow:hidden;margin:3px 0 1px}
.bar i{display:block;height:100%;background:#58d68d}
.bar i.low{background:#f0b43c}.bar i.crit{background:#e74c3c}
.pbox .sub{display:flex;justify-content:space-between;color:#bbb;font-size:11px}
#bcmd{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 8px calc(8px + env(safe-area-inset-bottom));align-content:start;overflow-y:auto}
.cbtn{padding:11px 6px;border-radius:8px;border:2px solid #d8d3c0;background:#26263c;color:#fff;font-size:15px;font-weight:bold;min-height:46px}
.cbtn small{display:block;font-size:11px;font-weight:normal;color:#bdbdd6}
.cbtn:disabled{opacity:.35}
.cbtn.back{border-color:#777;background:#1a1a26;color:#bbb}
/* panel */
#panel{z-index:30;background:rgba(14,14,24,.97);overflow-y:auto;padding:12px 12px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.ph{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #333}
.ph span{font-size:14px;color:#ffe07a}
.goal{background:#1f2a22;border:1px solid #3c6b48;color:#c8f0d4;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:12px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid button,.pbtn{padding:14px;border-radius:10px;border:2px solid #d8d3c0;background:#26263c;color:#fff;font-size:16px;font-weight:bold}
.pbtn{display:block;width:100%;margin-top:10px;padding:12px}
.pbtn.sub{border-color:#666;background:#1a1a26;color:#ccc}
.card{display:flex;gap:10px;align-items:center;background:#1f1f30;border:2px solid #3a3a52;border-radius:10px;padding:6px 10px;margin-bottom:8px}
.card.inp{border-color:#7fb8ff}
.card .info{flex:1;font-size:13px;line-height:1.5}
.card .info b{font-size:15px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#3d5bd9;margin-left:4px}
.tag.bench{background:#555}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:14px;margin:8px 0}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dotted #444}
.sklist{font-size:13px;line-height:1.7;color:#ddd}
.row{display:flex;align-items:center;gap:8px;background:#1f1f30;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.row .info{flex:1}
.row small{color:#aaa;display:block;font-size:11px}
.row button{padding:8px 12px;border-radius:8px;border:2px solid #d8d3c0;background:#2d2d48;color:#fff;font-size:13px;font-weight:bold;white-space:nowrap}
.row button:disabled{opacity:.35}
.bookgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bk{background:#1f1f30;border-radius:8px;padding:4px 2px;text-align:center;font-size:10px;line-height:1.3;border:1px solid #333}
.bk canvas{display:block;margin:0 auto}
.rec{text-align:center;padding-top:10px}
.rtitle{font-size:16px;font-weight:bold;color:#ffe07a;margin:6px 0 10px}
.rcv canvas{background:radial-gradient(#3a3a66,#15152a);border-radius:12px;max-width:100%}
.rline{background:#1f1f30;border-radius:8px;padding:10px;font-size:14px;line-height:1.6;margin:10px 0;text-align:left}
.rname{font-size:15px;margin-bottom:6px}
.rbtns{display:flex;gap:10px}
.rbtns button{flex:1}
/* overlays */
#presents,#title,#ending{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center}
#presents{background:#000;font-size:20px;letter-spacing:.3em;color:#eee}
#presents div{animation:pres 2.8s ease forwards;opacity:0}
@keyframes pres{0%{opacity:0}30%{opacity:1}75%{opacity:1}100%{opacity:0}}
#title{background:#120d1c}
#tcv{position:absolute;inset:0;width:100%;height:100%}
.tbox{position:relative;text-align:center;margin-top:-40%}
.t1{font-size:54px;font-weight:900;color:#fff;letter-spacing:.05em;text-shadow:0 0 12px #7fe3ff,3px 3px 0 #d9443b}
.t2{font-size:34px;font-weight:900;color:#ffe07a;text-shadow:3px 3px 0 #3a1a5a,0 0 10px rgba(0,0,0,.6);margin-top:-6px}
.tsub{font-size:12px;color:#ddd;margin-top:6px;letter-spacing:.2em}
.tbtns{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom));left:30px;right:30px;display:flex;flex-direction:column;gap:12px}
.tbtns button{padding:15px;border-radius:12px;border:2px solid #fff;background:rgba(20,20,40,.85);color:#fff;font-size:18px;font-weight:bold}
.tbtns button:disabled{opacity:.35}
#ending{background:#0e1a2a;overflow-y:auto;justify-content:flex-start;padding:20px 12px}
#ecv{max-width:100%;border-radius:12px}
.etext{text-align:center;font-size:15px;line-height:1.8;margin:14px 0}
.etext b{font-size:22px;color:#ffe07a}
#fade{position:absolute;inset:0;z-index:55;background:#000;opacity:0;pointer-events:none;transition:opacity .3s}
#fade.white{background:#fff}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(0,0,0,.75);border:1px solid #888;border-radius:20px;padding:6px 16px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#banner{position:absolute;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;pointer-events:none}
#banner div{font-size:64px;font-weight:900;color:#fff;text-shadow:0 0 20px #7fe3ff,0 0 40px #fff,4px 4px 0 #3d5bd9;animation:ban 2.2s ease forwards}

/* ---- 見た目強化 ---- */
#top{position:relative;z-index:70;background:linear-gradient(#17172a,#0c0c14);border-bottom:1px solid #3a3456;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#hud{font-weight:bold;text-shadow:0 1px 2px #000}
#screen{box-shadow:0 4px 14px rgba(0,0,0,.7);z-index:1}
#controls{background:radial-gradient(120% 90% at 50% 0%,#262640,#121220 60%,#0b0b14)}
.dp{background:linear-gradient(#3b3b52,#24243a);border:1px solid #4c4c6a;box-shadow:0 4px 0 #08080e,inset 0 1px 0 rgba(255,255,255,.15)}
.dp.on{background:linear-gradient(#5a5a80,#3a3a5a)}
.abtn{border:2px solid rgba(255,255,255,.25);box-shadow:0 5px 0 #08080e,inset 0 2px 0 rgba(255,255,255,.3),0 0 18px rgba(0,0,0,.4);text-shadow:0 1px 2px rgba(0,0,0,.5)}
#btnA{background:radial-gradient(circle at 35% 30%,#ff7a6a,#c8302a 70%)}
#btnB{background:radial-gradient(circle at 35% 30%,#7a96ff,#2f48c0 70%)}
#dialog{background:linear-gradient(rgba(22,20,48,.96),rgba(8,8,22,.97));border:2px solid #f2ead0;box-shadow:0 0 0 2px #2a2440,0 0 0 4px rgba(242,234,208,.35),0 8px 24px rgba(0,0,0,.6)}
#dname{background:linear-gradient(#fff6dc,#d8cfae);box-shadow:0 2px 0 #8a7a50}
#dchoices button,.cbtn,.mgrid button,.pbtn,.row button{background:linear-gradient(#34345a,#20203a);box-shadow:0 3px 0 #0a0a14,inset 0 1px 0 rgba(255,255,255,.15)}
#dchoices button:active,.cbtn:active,.mgrid button:active,.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0a14}
#blog{background:linear-gradient(#141430,#0a0a16);box-shadow:inset 0 0 12px rgba(0,0,0,.6)}
.pbox{background:linear-gradient(#25253c,#1a1a2a)}
.pbox.cur{box-shadow:0 0 10px rgba(255,224,122,.45)}
.bar{height:7px;background:#14141e;border:1px solid #000}
.bar i{background:linear-gradient(#8ff0b0,#2fae6a)}
.bar i.low{background:linear-gradient(#ffd77a,#d48a1c)}.bar i.crit{background:linear-gradient(#ff8a7a,#c8261e)}
.t1{font-size:60px;background:linear-gradient(#ffffff,#bff4ff 60%,#7fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(3px 3px 0 #d9443b) drop-shadow(0 0 10px rgba(127,227,255,.8))}
.t2{background:linear-gradient(#fff4b0,#ffc83a 60%,#ff8a2a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(3px 3px 0 #3a1a5a) drop-shadow(0 0 8px rgba(0,0,0,.6))}
.tbtns button{background:linear-gradient(rgba(40,30,70,.9),rgba(14,12,30,.92));box-shadow:0 4px 0 rgba(0,0,0,.6),0 0 16px rgba(127,227,255,.25)}
.tg-inline{position:static!important;margin:0!important}
#top .tbx{display:flex;gap:6px;align-items:center}
</style>
</head>

let S=null;
const SAVE_KEY='jokaFuryoCity_v1';
function newMember(id,lv){const m={id,lv,exp:0,eq:{w:null,b:null,a:null}};const s=mStats(m);m.hp=s.hp;m.mp=s.mp;return m;}
function newState(){
 const st={map:'town',x:3,y:11,dir:0,gold:100,items:{anpan:3,milk:1},eqInv:{},members:{},party:['hero'],seen:{},purified:[false,false,false,false],cleared:false};
 S=st; const h={id:'hero',lv:1,exp:0,eq:{w:'pencil',b:null,a:null}}; st.members.hero=h; const s=mStats(h); h.hp=s.hp; h.mp=s.mp;
 return st;
}
function baseStat(id,lv){const c=CH[id];return c.st.map((b,i)=>Math.round(b+c.gr[i]*(lv-1)));}
function mStats(m){const [hp,mp,atk,def,spd]=baseStat(m.id,m.lv);const r={hp,mp,atk,def,spd};for(const k of ['w','b','a']){const e=m.eq[k];if(e){const q=EQ[e].st;for(const s in q)r[s]+=q[s];}}return r;}
function nextExp(lv){return Math.round(8*Math.pow(lv,1.7)+6);}
function skillsOf(m){if(m.id==='hero')return HERO_LEARN.filter(l=>l[0]<=m.lv).map(l=>l[1]);return CH[m.id].sk||[];}
function gainExp(m,amt){const out=[];m.exp+=amt;const n=CH[m.id].n;while(m.exp>=nextExp(m.lv)&&m.lv<60){m.exp-=nextExp(m.lv);const b=mStats(m);m.lv++;const a=mStats(m);m.hp+=a.hp-b.hp;m.mp+=a.mp-b.mp;out.push(`${n}はレベル${m.lv}に上がった！`);if(m.id==='hero'){const l=HERO_LEARN.find(x=>x[0]===m.lv);if(l)out.push(`${n}は「${SK[l[1]].name}」を覚えた！`);}}return out;}
function purCount(){return S.purified.filter(Boolean).length;}
function heroLv(){return S.members.hero.lv;}
function healAll(){for(const id in S.members){const m=S.members[id];const s=mStats(m);m.hp=s.hp;m.mp=s.mp;}}
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));return true;}catch(e){return false;}}
function loadGame(){try{const t=localStorage.getItem(SAVE_KEY);if(!t)return null;return JSON.parse(t);}catch(e){return null;}}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}

function castShadows(g,m){
 for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){
  const c=m.rows[y][x];if(!TALL.includes(c)||c==='T')continue;
  const r=m.rows[y][x+1],b=m.rows[y+1]&&m.rows[y+1][x];
  if(r!==undefined&&!TALL.includes(r)&&r!=='G'){const X=(x+1)*TS,Y=y*TS;const gr=g.createLinearGradient(X,0,X+8,0);gr.addColorStop(0,'rgba(0,0,0,.28)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(X,Y+6,8,TS-6);}
  if(b!==undefined&&!TALL.includes(b)&&b!=='G'&&m.kind!=='bld'){const X=x*TS,Y=(y+1)*TS;const gr=g.createLinearGradient(0,Y,0,Y+7);gr.addColorStop(0,'rgba(0,0,0,.26)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(X+4,Y,TS,7);}
 }
}
const mapCache={};

 const c0=mapCache[m.id];if(c0&&c0.key===key)return c0.c;

 grace--;

 if(enc&&grace<=0&&chance(enc.rate)){busy=true;held.dir=-1;grace=5;await randomBattle(enc);busy=false;}
}

  return;
 }
 snd('land');await fadeTo(1);S.map=w.to;S.x=w.tx;S.y=w.ty;S.dir=w.dir;resetTrail();grace=5;updateHUD();await fadeTo(0);toast(curMap().name);

}

async function pickAction(a,canBack,resv){
 if(window.tgAuto)return autoAct(a,resv);
 while(true){
  setPrompt(`${a.name}はどうする？`);
  const c=await cmdChoose([{label:'説教',v:'atk'},{label:'スキル',v:'sk'},{label:'道具',v:'it'},{label:'防御',v:'gd'},{label:'逃げる',v:'run',dis:B.o.boss}],canBack);
  if(c==='__back')return 'back';
  if(c==='atk'){const t=await pickEnemy();if(t==='__back')continue;return {ty:'atk',t};}
  if(c==='sk'){const sks=skillsOf(a.m);if(!sks.length)continue;setPrompt(`${a.name}のスキル（MP ${a.mp}）`);const s=await cmdChoose(sks.map(id=>({label:SK[id].name,sub:`MP${SK[id].mp}・${SK[id].d}`,v:id,dis:a.mp<SK[id].mp})),true);if(s==='__back')continue;const sk=SK[s];let t=null;
   if(sk.tg==='enemy'){t=await pickEnemy();if(t==='__back')continue;}
   else if(sk.tg==='ally'){t=await pickAlly(false);if(t==='__back')continue;}
   else if(sk.tg==='dead'){t=await pickAlly(true);if(t==='__back')continue;}
   return {ty:'sk',sk:s,t,pri:sk.ef==='protect'};}
  if(c==='it'){const ids=Object.keys(S.items).filter(k=>S.items[k]-(resv[k]||0)>0);if(!ids.length){await bmsg('道具を持っていない。',600);continue;}
   const v=await cmdChoose(ids.map(k=>({label:IT[k].name,sub:`×${S.items[k]-(resv[k]||0)}・${IT[k].d}`,v:k})),true);if(v==='__back')continue;
   let t=null;const ty=IT[v].ty;if(ty!=='healall'){t=await pickAlly(ty==='revive');if(t==='__back')continue;}
   resv[v]=(resv[v]||0)+1;return {ty:'it',it:v,t};}
  if(c==='gd')return {ty:'gd',pri:true};
  if(c==='run')return {ty:'run'};
 }
}

 const atk=a.atk*(a.atkUp?1.3:1)*(a.atkDn?0.7:1),def=e.def*(e.defDn?0.6:1);

async function runBattle(list,o={}){
 mode='battle';held.dir=-1;
 await fadeTo(1,true);
 const counts={},idx={};list.forEach(e=>counts[e.cid]=(counts[e.cid]||0)+1);
 const en=list.map(e=>{const x=mkEnemy(e.cid,e.lv,e.boss);if(counts[e.cid]>1){idx[e.cid]=(idx[e.cid]||0)+1;x.name+='ABC'[idx[e.cid]-1];}S.seen[e.cid]=true;return x;});
 const pa=S.party.map(mkAlly);
 snd(o.boss?'summon':'start');B={en,pa,o,log:[],fx:[],flashT:performance.now(),protector:null,cur:null,bgc:bgColors(o)};
 $('battle').classList.remove('hidden');$('bcmd').innerHTML='';renderParty();

 await bmsg(o.boss?`${en[0].name}が立ちはだかった！`:`${en.map(e=>e.name).join('、')}が現れた！`,900);
 let result=null;
 while(!result){

  const acts=new Map(),resv={};let i=0,ran=false;
  const sel=j=>pa[j].hp>0&&!(pa[j].stun>0);
  while(i<pa.length){
   const a=pa[i];
   if(!sel(i)){if(a.hp>0&&a.stun>0)acts.set(a,{ty:'skip'});i++;continue;}
   let prev=i-1;while(prev>=0&&!sel(prev))prev--;
   B.cur=a;renderParty();
   const act=await pickAction(a,prev>=0,resv);
   if(act==='back'){const pv=acts.get(pa[prev]);if(pv&&pv.ty==='it')resv[pv.it]--;acts.delete(pa[prev]);i=prev;continue;}
   if(act.ty==='run'){B.cur=null;renderParty();B.log=[];await bmsg(`${a.name}たちは逃げ出した！`,600);if(tryRun()){await bmsg('うまく逃げきれた！',700);result='run';}else{await bmsg('しかし回りこまれてしまった！',700);}ran=true;break;}
   acts.set(a,act);i++;
  }
  B.cur=null;renderParty();B.log=[];renderLog();$('bcmd').innerHTML='';
  if(result)break;
  const q=[];
  if(!ran)for(const [a,act] of acts)q.push({b:a,act,pri:act.pri?1:0,sp:a.spd*(0.8+Math.random()*0.4)});
  else for(const [a,act] of acts)if(act.ty==='skip')q.push({b:a,act,pri:0,sp:0});
  for(const e of en)if(!e.reformed)q.push({b:e,act:null,pri:0,sp:e.spd*(0.8+Math.random()*0.4)});
  q.sort((x,y)=>(y.pri-x.pri)||(y.sp-x.sp));
  for(const it of q){
   const b=it.b;
   if(b.isE){if(b.reformed)continue;if(b.stun>0){b.stun=0;await bmsg(`${b.name}は動けない！`,600);continue;}await enemyAct(b);}
   else{if(b.hp<=0)continue;if(b.stun>0){b.stun=0;renderParty();await bmsg(`${b.name}は授業をサボってしまった…`,700);continue;}if(it.act.ty==='skip')continue;await allyAct(b,it.act);}
   if(en.every(e=>e.reformed)){result='win';break;}
   if(pa.every(a=>a.hp<=0)){result='lose';break;}
  }
  for(const x of [...en,...pa])for(const k of ['atkDn','defDn','atkUp'])if(x[k]>0)x[k]--;
 }
 for(const a of pa){a.m.hp=result==='lose'?0:Math.max(1,a.hp);a.m.mp=a.mp;}
 if(result==='win'){
  await sleep(300);
  const exp=en.reduce((s,e)=>s+e.exp,0),gold=en.reduce((s,e)=>s+e.gold,0);S.gold+=gold;snd('win');
  await bmsg(o.boss?`${en[0].name}を更生させた！`:'不良たちを全員更生させた！',800);
  await bmsg(`経験値${exp}と、${gold}円を手に入れた！`,1000);
  for(const id of Object.keys(S.members)){const m=S.members[id];const inP=S.party.includes(id);const msgs=gainExp(m,inP?exp:Math.floor(exp/2));if(inP)for(const t of msgs)await bmsg(t,1000);}
  if(!o.boss){const done=new Set();for(const e of en){if(done.has(e.cid)||S.members[e.cid])continue;done.add(e.cid);if(chance(0.35))await recruitPopup(e.cid,false,e.lv);}}
 }else if(result==='lose'){snd('lose');await bmsg('みんなの心が折れてしまった…',1400);}
 await fadeTo(1);
 $('battle').classList.add('hidden');B=null;msgSkip=null;mode='map';updateHUD();
 await fadeTo(0);
 return result;
}

  d.insertAdjacentHTML('beforeend',has?`<b>${CH[id].n}</b><br>${CH[id].title}`:seen?`<span style="color:#e88">${CH[id].en}</span><br>未更生`:'？？？<br>&nbsp;');bg.appendChild(d);});
 $('bback').onclick=menuMain;
}
function menuSave(){const ok=saveGame();toast(ok?'セーブしました':'セーブできませんでした');}

/* ================= input ================= */
document.querySelectorAll('.dp').forEach(b=>{const d=+b.dataset.d;
 const on=e=>{e.preventDefault();held.dir=d;b.classList.add('on');if(dlgNext){}};
 const off=e=>{e.preventDefault();if(held.dir===d)held.dir=-1;b.classList.remove('on');};
 b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
});
function pressA(){if(dlgNext){dlgNext();return;}if(mode==='battle'){msgSkip&&msgSkip();return;}if(mode==='map'&&!busy&&!mv)interact();}
function pressB(){if(dlgNext){dlgNext();return;}if(mode==='map')openMenu();}
$('btnA').addEventListener('pointerdown',e=>{e.preventDefault();pressA();});
$('btnB').addEventListener('pointerdown',e=>{e.preventDefault();pressB();});
const KEYD={ArrowDown:0,ArrowUp:1,ArrowLeft:2,ArrowRight:3,s:0,w:1,a:2,d:3};
document.addEventListener('keydown',e=>{if(e.key in KEYD){held.dir=KEYD[e.key];e.preventDefault();}else if(e.key==='z'||e.key==='Enter'||e.key===' '){if(!e.repeat)pressA();e.preventDefault();}else if(e.key==='x'||e.key==='Escape'){if(!e.repeat){if(!$('panel').classList.contains('hidden')&&mode==='map'&&$('panel').querySelector('#pback,#iback,#eback,#bback')===null&&$('panel').querySelector('.mgrid'))closeMenu();else pressB();}}});
document.addEventListener('keyup',e=>{if(e.key in KEYD&&held.dir===KEYD[e.key])held.dir=-1;});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest('#panel,#bcmd,#ending'))e.preventDefault();},{passive:false});

/* ================= flow ================= */
function showTitle(){
 mode='title';busy=true;updateHUD();$('title').classList.remove('hidden');drawTitleArt();
 $('bLoad').disabled=!hasSave();
}
$('bNew').onclick=async()=>{newState();$('title').classList.add('hidden');await startGame(false);};
$('bLoad').onclick=async()=>{const d=loadGame();if(!d)return;S=d;S.seen=S.seen||{};S.eqInv=S.eqInv||{};$('title').classList.add('hidden');await startGame(true);};
async function startGame(loaded){
 mode='map';busy=true;mv=null;resetTrail();grace=6;updateHUD();
 await fadeTo(1);await fadeTo(0);
 if(!loaded)await intro();else toast('つづきから');
 busy=false;
}
function loop(now){
 if(mode==='map'||mode==='battle'){update(now);if(S&&mode==='map')renderMap(now);}
 if(mode==='battle'&&B)renderBattle(now);
 requestAnimationFrame(loop);
}
resize();
/* ================= AUTO（オートプレイ） ================= */
const snd=n=>{try{window.tgSound&&window.tgSound.play(n);}catch(e){}};
function autoAct(a,resv){
 const es=aliveE(),as=aliveA(),dead=B.pa.filter(x=>x.hp<=0);
 const sks=skillsOf(a.m).filter(id=>a.mp>=SK[id].mp);const fs=f=>sks.find(id=>f(SK[id]));
 const itm=ty=>Object.keys(S.items).find(k=>IT[k].ty===ty&&S.items[k]-(resv[k]||0)>0);
 if(dead.length){const r=fs(s=>s.ef==='revive');if(r)return {ty:'sk',sk:r,t:dead[0]};const it=itm('revive');if(it){resv[it]=(resv[it]||0)+1;return {ty:'it',it,t:dead[0]};}}
 const low=as.filter(x=>x.hp/x.max<.4);
 if(low.length){const w=low.reduce((p,x)=>x.hp/x.max<p.hp/p.max?x:p);
  if(low.length>1){const h=fs(s=>s.ef==='heal'&&s.tg==='allies');if(h)return {ty:'sk',sk:h,t:null};const it=itm('healall');if(it){resv[it]=(resv[it]||0)+1;return {ty:'it',it,t:null};}}
  const h=fs(s=>s.ef==='heal'&&s.tg==='ally');if(h)return {ty:'sk',sk:h,t:w};
  const it=itm('heal');if(it){resv[it]=(resv[it]||0)+1;return {ty:'it',it,t:w};}}
 const tgt=es.reduce((p,e)=>e.hp<p.hp?e:p,es[0]);
 if(es.length>=2){const aoe=fs(s=>s.tg==='enemies'&&s.ef==='dmg');if(aoe)return {ty:'sk',sk:aoe,t:null};}
 const dm=sks.filter(id=>SK[id].tg==='enemy'&&(SK[id].ef==='dmg'||SK[id].ef==='multi')).sort((x,y)=>SK[y].mp-SK[x].mp)[0];
 if(dm&&(B.o.boss||a.mp>=SK[dm].mp*2))return {ty:'sk',sk:dm,t:tgt};
 return {ty:'atk',t:tgt};
}
/* マップ：目的地への経路をたどる */
let autoWander=null;
function mapRoute(from,to){if(from===to)return [];const prev={[from]:null},q=[from];
 while(q.length){const id=q.shift();for(const w of MAPS[id].warps){if(w.ev||w.to in prev)continue;prev[w.to]={id,w};if(w.to===to){const path=[];let k=to;while(prev[k]){path.unshift(prev[k]);k=prev[k].id;}return path;}q.push(w.to);}}return null;}
function tileStep(m,gx,gy){
 const blk=new Set(npcsOf(m).map(n=>n.x+','+n.y));const warp=new Set(m.warps.map(w=>w.x+','+w.y));
 const key=(x,y)=>x+','+y,st=key(S.x,S.y),prev={[st]:null},q=[[S.x,S.y]];
 while(q.length){const [x,y]=q.shift();if(x===gx&&y===gy){let k=key(x,y),c=k;while(prev[c]!==st){if(prev[c]===null)return -1;c=prev[c];}const [cx,cy]=c.split(',').map(Number);return cx>S.x?3:cx<S.x?2:cy<S.y?1:0;}
  for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d],k=key(nx,ny);if(k in prev)continue;const goal=nx===gx&&ny===gy;
   if(!goal&&(!walkable(m,nx,ny)||blk.has(k)||warp.has(k)))continue;prev[k]=key(x,y);q.push([nx,ny]);}}
 return -1;
}
function autoGoal(){
 const c=purCount();if(c>=4)return null;const sc=SCH[c];
 const tot=S.party.reduce((s,id)=>{const m=S.members[id],st=mStats(m);return s+m.hp/st.hp;},0)/S.party.length;
 const hero=S.members.hero,hs=mStats(hero);
 if(tot<.45||hero.hp/hs.hp<.35||(hero.mp<4&&tot<.7)){const w=MAPS.town.warps.find(w=>w.ev==='home');return {map:'town',x:w.x,y:w.y};}
 if(heroLv()>=sc.bossLv-1){const roof=`s${c}_roof`;const n=MAPS[roof].npcs.find(n=>n.boss===c);return {map:roof,x:n.x,y:n.y};}
 return {wander:`s${c}_yard`,alt:`s${c}_1f`};
}
function autoMap(){
 const m=curMap(),g=autoGoal();if(!g)return;
 let tm=g.map,tx=g.x,ty=g.y;
 if(g.wander){if(S.map===g.wander||S.map===g.alt){if(!autoWander||autoWander.map!==S.map||(S.x===autoWander.x&&S.y===autoWander.y)||autoWander.n++>60){let x,y,k=0;do{x=rnd(0,m.w-1);y=rnd(0,m.h-1);}while((!walkable(m,x,y)||m.warps.some(w=>w.x===x&&w.y===y))&&++k<200);autoWander={map:S.map,x,y,n:0};}tm=S.map;tx=autoWander.x;ty=autoWander.y;}else tm=g.wander;}
 if(tm!==S.map){const r=mapRoute(S.map,tm);if(!r||!r.length)return;tx=r[0].w.x;ty=r[0].w.y;}
 else if(tx===undefined){return;}
 let d=tileStep(m,tx,ty);if(d<0){autoWander=null;d=rnd(0,3);}
 tryMove(d,performance.now());
}
function autoTick(){
 if(!window.tgAuto)return;
 const vis=id=>!$(id).classList.contains('hidden');
 if(mode==='title'&&vis('title')){const l=$('bLoad');(l&&!l.disabled?l:$('bNew')).click();return;}
 if(vis('dialog')){const cb=$('dchoices').querySelector('button');if(cb){cb.click();return;}if(dlgNext){dlgNext();return;}}
 if(vis('panel')){const b=$('panel').querySelector('.rbtns .pbtn')||$('shopClose');if(b)b.click();return;}
 if(mode==='battle'){const b=[...$('bcmd').querySelectorAll('.cbtn:not(.back)')].find(b=>!b.disabled);if(b){b.click();return;}if(msgSkip)msgSkip();return;}
 if(mode==='map'&&!busy&&!mv)autoMap();
}
setInterval(autoTick,170);
window.addEventListener('tgauto',()=>{if(!window.tgAuto)held.dir=-1;});
requestAnimationFrame(loop);
(function presents(){let done=false;const go=()=>{if(done)return;done=true;$('presents').classList.add('hidden');showTitle();};$('presents').addEventListener('click',go);setTimeout(go,2900);})();
</script>

<style>

  display:inline-block;margin:0;padding:6px 12px;border-radius:999px;background:rgba(12,14,24,.72);color:#fff;cursor:pointer;
  font:700 13px/1.2 "Hiragino Sans","Yu Gothic",sans-serif;letter-spacing:.06em;border:1px solid rgba(255,255,255,.35);box-shadow:none;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-tap-highlight-color:transparent;transform:none}

<script>
(function(){
  window.tgAuto = false;
  var b = document.querySelector('.tg-auto');
  if (!b) return;
  var stop = function(e){ e.stopPropagation(); };
  ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ b.addEventListener(t, stop); });
  b.addEventListener('click', function(e){
    e.stopPropagation();
    window.tgAuto = !window.tgAuto;
    b.setAttribute('aria-pressed', String(window.tgAuto));
    b.textContent = window.tgAuto ? 'AUTO ON' : 'AUTO';

<style>
.tg-snd{position:fixed;z-index:2147483647;top:calc(8px + env(safe-area-inset-top,0px));left:calc(186px + env(safe-area-inset-left,0px));
  display:inline-block;margin:0;padding:6px 12px;border-radius:999px;background:rgba(12,14,24,.72);color:#fff;cursor:pointer;
  font:700 13px/1.2 "Hiragino Sans","Yu Gothic",sans-serif;letter-spacing:0;border:1px solid rgba(255,255,255,.35);box-shadow:none;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-tap-highlight-color:transparent;transform:none}
.tg-snd[aria-pressed="false"]{color:rgba(255,255,255,.6)}
.tg-snd:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
<script>
/* ---------- 共通の効果音（Web Audioで合成） ---------- */
window.tgSound = (function(){
  var AC = null, noiseBuf = null, on = true, last = {};
  try { on = localStorage.getItem('tg_sound') !== '0'; } catch (e) {}
  function ctx(){
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, dur, type, vol, slide, delay){
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, vol, freq, delay, kind){
    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = 1;
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + .03);
  }
  function arp(fs, step, type, vol, dur){ fs.forEach(function(f, i){ tone(f, dur || .22, type, vol, 0, i * step); }); }
  var LIB = {
    click:  function(){ tone(900, .05, 'square', .03); },
    pick:   function(){ tone(660, .06, 'triangle', .07); tone(990, .08, 'triangle', .06, 0, .05); },
    unpick: function(){ tone(520, .08, 'triangle', .06, .7); },
    tick:   function(){ tone(1500 + Math.random() * 300, .025, 'square', .025); },
    land:   function(){ tone(784, .09, 'square', .05); tone(1175, .18, 'square', .05, 0, .07); },
    start:  function(){ arp([392, 523, 659], .09, 'square', .05, .18); },
    shot:   function(){ tone(1200, .07, 'square', .025, .45); },
    shotFoe:function(){ tone(700, .08, 'square', .02, .5); },
    slash:  function(){ noise(.12, .12, 2600, 0, 'highpass'); tone(500, .1, 'sawtooth', .03, .5); },
    dash:   function(){ noise(.2, .1, 800, 0, 'bandpass'); tone(200, .2, 'sine', .06, 2.2); },
    charge: function(){ tone(200, .7, 'sawtooth', .05, 4); },
    beam:   function(){ noise(.5, .2, 500, 0, 'lowpass'); tone(90, .5, 'sawtooth', .08, .5); },
    hit:    function(){ noise(.09, .14, 900, 0, 'lowpass'); tone(160, .08, 'square', .04, .6); },
    big:    function(){ noise(.3, .22, 400, 0, 'lowpass'); tone(110, .3, 'sawtooth', .07, .5); },
    heal:   function(){ arp([784, 988, 1319], .06, 'sine', .06, .2); },
    miss:   function(){ noise(.15, .06, 3000, 0, 'highpass'); },
    good:   function(){ arp([659, 784, 1047], .08, 'triangle', .07, .25); },
    bad:    function(){ tone(330, .25, 'triangle', .07, .75); tone(247, .35, 'triangle', .06, .8, .18); },
    win:    function(){ arp([523, 659, 784, 1047, 1319], .1, 'square', .045, .28); },
    lose:   function(){ arp([392, 330, 262, 196], .22, 'triangle', .08, .4); },
    splash: function(){ noise(.35, .18, 700, 0, 'lowpass'); noise(.2, .08, 2400, .05, 'bandpass'); },
    bubble: function(){ tone(250 + Math.random() * 250, .07, 'sine', .04, 1.8); },
    slurp:  function(){ noise(.5, .12, 1400, 0, 'bandpass'); noise(.3, .08, 900, .55, 'bandpass'); },
    coin:   function(){ tone(988, .06, 'square', .04); tone(1319, .14, 'square', .04, 0, .06); },
    summon: function(){ tone(130, 1, 'sawtooth', .05, 3); arp([523, 784, 1047, 1568], .12, 'sine', .07, .5); },
    evolve: function(){ arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], .07, 'triangle', .06, .3); },
    fuse:   function(){ tone(110, 1.1, 'sawtooth', .06, 2.5); noise(.9, .1, 300, .2, 'lowpass'); arp([659, 880, 1319], .12, 'sine', .07, .4); }
  };
  function play(name){
    if (!on || !LIB[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < 55) return;
    last[name] = now;
    if (!ctx()) return;
    try { LIB[name](); } catch (e) {}
  }
  var btn = document.querySelector('.tg-snd');
  function sync(){ if (btn) { btn.textContent = on ? '音：ON' : '音：OFF'; btn.setAttribute('aria-pressed', String(on)); } }
  if (btn) {
    ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ btn.addEventListener(t, function(e){ e.stopPropagation(); }); });
    btn.addEventListener('click', function(e){
      e.stopPropagation(); on = !on; sync(); btn.blur();
      try { localStorage.setItem('tg_sound', on ? '1' : '0'); } catch (err) {}
      if (on) { ctx(); play('pick'); }
    });
  }
  sync();
  // ブラウザは最初の操作まで音を出せないので、最初のタップで準備する
  window.addEventListener('pointerdown', function(){ if (on) ctx(); }, { once: true, capture: true });
  return { play: play };
})();
</script>
