<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#1a1526;color:#2a2230;overflow:hidden;touch-action:manipulation;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;background:radial-gradient(120% 70% at 50% 0%,#3a2a5a,#1a1526 70%);padding-top:calc(env(safe-area-inset-top) + 44px)}
#dev{width:calc(100% - 16px);max-width:470px;border-radius:30px 30px 46px 46px;padding:10px 12px 12px;background:linear-gradient(160deg,#ffd9a0,#ff9f5a 45%,#e8663a);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),inset 0 -6px 0 rgba(120,30,0,.35),0 10px 24px rgba(0,0,0,.5);position:relative}
#dev .brand{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:11px;letter-spacing:.18em;color:#7a2a08;padding:0 8px 6px}
#dev .brand i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3a3a;box-shadow:0 0 6px #ff3a3a;margin-right:6px;vertical-align:middle}
#dev .brand i.off{background:#7a2a08;box-shadow:none}
#scr{border-radius:16px;padding:6px;background:#2a2230;box-shadow:inset 0 3px 8px rgba(0,0,0,.7),0 2px 0 rgba(255,255,255,.5)}
#info{display:flex;justify-content:space-between;align-items:center;gap:6px;color:#d8ffd0;font-size:11px;font-weight:bold;padding:2px 6px 5px;font-family:ui-monospace,Menlo,monospace}
#info b{color:#fff;font-size:13px}
#info .st{background:#3a7a3a;color:#eaffea;border-radius:4px;padding:1px 5px;font-size:10px}
#cv{display:block;width:100%;border-radius:10px;background:#9bbc7a}
#meters{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;padding:6px 6px 2px;font-size:11px;font-weight:bold;color:#d8ffd0}
#meters .m{display:flex;align-items:center;gap:5px;white-space:nowrap}
#meters .m span{min-width:3.2em;color:#a8d8a0}
.hearts{letter-spacing:1px;font-size:12px}
.bar{flex:1;height:7px;border-radius:4px;background:#14101a;overflow:hidden}
.bar>div{height:100%;border-radius:4px;background:#7ae07a;transition:width .3s}
#btns{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:calc(100% - 16px);max-width:470px;margin-top:10px}
.ab{position:relative;aspect-ratio:1/1;max-height:74px;border-radius:50%;border:none;font-family:inherit;font-weight:900;font-size:10px;color:#4a2010;background:radial-gradient(circle at 35% 28%,#fff6e0,#ffd08a 55%,#e89040);box-shadow:inset 0 -4px 0 rgba(140,50,0,.35),0 4px 0 #8a3a10,0 6px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0}
.ab .e{font-size:22px;line-height:1;margin-bottom:2px}
.ab:active,.ab.on{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(140,50,0,.35),0 1px 0 #8a3a10}
.ab:disabled{filter:grayscale(.9) brightness(.7)}
.ab.alert::after{content:'!';position:absolute;top:-4px;right:-2px;width:18px;height:18px;border-radius:50%;background:#ff3a3a;color:#fff;font-size:12px;line-height:18px;box-shadow:0 0 8px #ff3a3a;animation:pul .6s infinite alternate}
@keyframes pul{to{transform:scale(1.2)}}
#bat{display:none;grid-template-columns:repeat(2,1fr);gap:8px;width:calc(100% - 16px);max-width:470px;margin-top:10px}
#bat.show{display:grid}
#bat button{padding:14px 6px;border-radius:14px;border:none;font-family:inherit;font-weight:900;font-size:15px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.45);text-shadow:0 1px 2px rgba(0,0,0,.5)}
#bat button small{display:block;font-size:10px;opacity:.85}
#bat button:disabled{filter:grayscale(1) brightness(.6)}
#bat .c0{background:linear-gradient(#ff7a5a,#c8402a)}#bat .c1{background:linear-gradient(#ffd04a,#c88a10)}#bat .c2{background:linear-gradient(#5ac0ff,#2a6ac8)}#bat .c3{background:linear-gradient(#7ad87a,#2a8a3a)}
#log{width:calc(100% - 16px);max-width:470px;min-height:20px;margin-top:8px;color:#ffe8c0;font-size:12px;font-weight:bold;text-align:center;text-shadow:0 1px 2px #000}
#sub{width:calc(100% - 16px);max-width:470px;margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#sub div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:6px 4px;text-align:center;color:#ffe8c0;font-size:10px;font-weight:bold}
#sub b{display:block;font-size:15px;color:#fff;margin-top:2px}
@media (max-height:740px){#sub{display:none}}
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,6,20,.72)}
#modal.hidden{display:none}
.mbox{width:100%;max-width:400px;max-height:calc(100% - 40px);overflow:auto;background:#fff8ec;border-radius:20px;padding:16px;box-shadow:0 0 0 4px #ff9f5a,0 12px 30px rgba(0,0,0,.6);-webkit-overflow-scrolling:touch;touch-action:pan-y}
.mbox h2{margin:0 0 10px;font-size:18px;color:#7a2a08;text-align:center}
.mbox p{font-size:13px;line-height:1.7;margin:6px 0}
.mb{display:block;width:100%;margin:8px 0 0;padding:12px;border:none;border-radius:12px;font-family:inherit;font-weight:900;font-size:15px;color:#fff;background:linear-gradient(#ff9f5a,#e8663a);box-shadow:0 3px 0 #8a3a10}
.mb.sub{background:linear-gradient(#b8aac8,#7a6a8a);box-shadow:0 3px 0 #4a3a5a}
.mb:disabled{filter:grayscale(1);opacity:.5}
.mb small{display:block;font-size:11px;opacity:.9;font-weight:bold}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border-radius:14px;background:#fff;border:2px solid #f0d8b8;padding:8px;text-align:center;font-size:12px;font-weight:bold;color:#4a2a10}
.card canvas{display:block;margin:0 auto;width:100%;max-width:140px;aspect-ratio:1/1}
.card.sel{border-color:#e8663a;box-shadow:0 0 0 2px #ff9f5a}
.card .nm{font-size:13px;margin-top:2px}
.card small{display:block;color:#8a6a4a;font-weight:bold}
.stt{width:100%;border-collapse:collapse;font-size:13px}
.stt td{padding:5px 4px;border-bottom:1px dashed #e8d0b0}.stt td:first-child{white-space:nowrap;width:76px}
.stt td:last-child{text-align:right;font-weight:900}
.sbar{height:8px;border-radius:4px;background:#f0e0c8;overflow:hidden;margin-top:2px}.sbar div{height:100%;background:linear-gradient(90deg,#ff9f5a,#e8663a)}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dex div{border-radius:10px;background:#fff;border:1px solid #f0d8b8;padding:3px;font-size:9px;font-weight:bold;text-align:center;color:#4a2a10}
.dex canvas{width:100%;aspect-ratio:1/1;display:block}
.tab{display:flex;gap:6px;margin-bottom:8px}.tab button{flex:1;padding:8px;border-radius:10px;border:none;font-family:inherit;font-weight:900;background:#f0e0c8;color:#7a4a20}.tab button.on{background:#e8663a;color:#fff}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 56px);transform:translateX(-50%);z-index:70;background:rgba(30,20,40,.92);color:#fff;font-size:13px;font-weight:bold;padding:8px 16px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
.mg{text-align:center}
.mg canvas{width:100%;max-width:340px;border-radius:12px;background:#2a2230;display:block;margin:0 auto}
.ttl{font-size:40px;font-weight:900;line-height:1.05;text-align:center;color:#fff;letter-spacing:.02em;text-shadow:0 4px 0 #8a3a10,0 0 18px rgba(255,160,90,.7)}
.ttl small{display:block;font-size:12px;letter-spacing:.4em;color:#ffd9a0;margin-top:8px;text-shadow:none}
input.nm{width:100%;padding:10px;font-size:16px;border-radius:10px;border:2px solid #f0d8b8;font-family:inherit;font-weight:bold;text-align:center;-webkit-user-select:text;user-select:text}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#1a1526;color:#fff;align-items:center;justify-content:center}
@media (orientation:landscape) and (max-height:500px){#rot{display:flex}}
@media (max-height:700px){.ab .e{font-size:18px}#btns{gap:5px}}
</style>
<script>/* tg-common: クリア記録・最近遊んだゲーム */
(function(){var id=(location.pathname.split('/').pop()||'').replace(/\.html$/,'');window.__tgAutoEver=false;
 addEventListener('tgauto',function(){if(window.tgAuto)window.__tgAutoEver=true;});
 window.tgClear=function(gid,info){try{if(window.tgAuto||window.tgAutoUsed||window.__tgAutoEver)return;gid=gid||id;var o=JSON.parse(localStorage.getItem('tg_clear')||'{}');var r=o[gid]||{n:0};r.n=(r.n||0)+1;r.t=Date.now();if(info)r.info=info;o[gid]=r;localStorage.setItem('tg_clear',JSON.stringify(o));}catch(e){}};
 try{var a=JSON.parse(localStorage.getItem('tg_recent')||'[]').filter(function(x){return x.id!==id;});a.unshift({id:id,t:Date.now()});localStorage.setItem('tg_recent',JSON.stringify(a.slice(0,10)));}catch(e){}})();
</script>

<body>

<script>
'use strict';
/* ================= 基本 ================= */
const VW=360,VH=240,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');const DPR=Math.min(window.devicePixelRatio||1,2.5);let SC=1;
function resize(){const w=cv.parentElement.clientWidth-12;const maxH=Math.max(150,innerHeight-430);let cw=Math.min(w,maxH*VW/VH);SC=cw/VW;cv.style.width=Math.round(cw)+'px';cv.style.height=Math.round(VH*SC)+'px';cv.style.margin='0 auto';cv.width=Math.round(VW*SC*DPR);cv.height=Math.round(VH*SC*DPR);}
addEventListener('resize',resize);
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,pick=a=>a[Math.floor(Math.random()*a.length)],irnd=(a,b)=>Math.floor(rnd(a,b+1));
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
const SPD=()=>window.__speed||1;
const wait=ms=>new Promise(r=>setTimeout(r,ms/SPD()));
document.addEventListener('touchmove',e=>{if(!e.target.closest('.mbox'))e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
let toastT=null;function toast(s,ms){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),(ms||1800)/Math.min(SPD(),4));}
/* ================= 音 ================= */
let AC=null,NB=null,MG=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.85;MG.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function sndOn(){try{return localStorage.getItem('tg_sound')!=='0';}catch(e){return true;}}
function nbuf(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;}
function tone(f,dur,type,vol,f2,delay,at){const t=(at||AC.currentTime)+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol,freq,type,delay,f2,at){const t=(at||AC.currentTime)+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf();f.type=type||'lowpass';f.frequency.setValueAtTime(freq,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}
const SFX={
 beep(){tone(1760,.06,'square',.04);tone(1760,.06,'square',.04,0,.1);},
 call(){[1568,1318,1568].forEach((f,i)=>tone(f,.08,'square',.04,0,i*.11));},
 click(){tone(880,.04,'triangle',.06);},
 ok(){tone(1046,.07,'square',.04);tone(1568,.1,'square',.04,0,.07);},
 ng(){tone(220,.18,'square',.05,.8);},
 eat(){[0,.12,.24].forEach(d=>{noise(.06,.12,1200,'bandpass',d);tone(300,.05,'square',.03,.7,d);});},
 flush(){noise(.8,.2,900,'lowpass',0,200);tone(400,.6,'sine',.03,.3);},
 clean(){noise(.25,.12,3000,'highpass',0,1200);noise(.25,.12,3000,'highpass',.25,1200);},
 poop(){tone(180,.15,'square',.05,.6);noise(.12,.1,300,'lowpass');},
 med(){[660,880,1320].forEach((f,i)=>tone(f,.12,'sine',.05,0,i*.08));},
 scold(){tone(330,.12,'sawtooth',.06);tone(262,.2,'sawtooth',.06,0,.13);},
 happy(){[784,988,1175,1568].forEach((f,i)=>tone(f,.1,'square',.035,0,i*.07));},
 sad(){[523,494,440,392].forEach((f,i)=>tone(f,.18,'triangle',.05,0,i*.15));},
 train(){noise(.1,.25,700,'lowpass',0,150);tone(160,.08,'sine',.15,.5);},
 perfect(){[1046,1318,1568,2093].forEach((f,i)=>tone(f,.09,'square',.04,0,i*.05));},
 good(){tone(988,.08,'square',.04);tone(1318,.1,'square',.04,0,.07);},
 miss(){tone(200,.15,'sawtooth',.05,.7);},
 hit(){noise(.12,.35,1000,'lowpass',0,150);tone(130,.1,'sine',.25,.5);},
 crit(){noise(.25,.45,2400,'bandpass',0,300);tone(90,.25,'sine',.3,.4);tone(1800,.1,'square',.04,.5);},
 dodge(){tone(1200,.12,'sine',.04,2.2);},
 guard(){tone(1800,.08,'square',.05,.7);noise(.08,.15,3000,'highpass');},
 charge(){tone(220,.6,'sawtooth',.05,4);noise(.6,.08,800,'bandpass',0,4000);},
 special(){noise(1,.45,900,'lowpass',0,60);tone(110,.9,'sawtooth',.18,.4);tone(660,.5,'square',.05,2.5,.1);},
 win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'square',.05,0,i*.11));},
 lose(){[392,349,311,262].forEach((f,i)=>tone(f,.4,'triangle',.07,0,i*.2));},
 evo(){for(let i=0;i<16;i++)tone(400+i*90,.12,'square',.03,0,i*.09);},
 evo2(){[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,.25,'square',.05,0,i*.1));noise(1,.2,4000,'bandpass',0,600);},
 hatch(){noise(.15,.25,2000,'bandpass');[784,1047,1319].forEach((f,i)=>tone(f,.15,'square',.05,0,.15+i*.1));},
 crack(){noise(.07,.3,3000,'highpass');},
 love(){[659,784,988,1319,988,1319].forEach((f,i)=>tone(f,.2,'sine',.05,0,i*.13));},
 coin(){tone(1318,.06,'square',.04);tone(1976,.15,'square',.04,0,.06);},
 sleep(){tone(392,.4,'sine',.04,.8);tone(330,.5,'sine',.04,.8,.35);},
 type(){tone(1600,.015,'square',.01);},
};
const sfxLast={};
function sfx(n,gap){if(!sndOn()||!ac())return;const now=performance.now();if(gap&&sfxLast[n]&&now-sfxLast[n]<gap)return;sfxLast[n]=now;try{SFX[n]();}catch(e){}}
addEventListener('pointerdown',()=>{if(sndOn())ac();},{capture:true});
const BGM={mode:'none',next:0,beat:0};
function setBgm(m){if(BGM.mode!==m){BGM.mode=m;BGM.beat=0;}}
const BG={
 home:{bpm:96,f(b,t){const C=[[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]];const c=C[(b>>4)%4];if(b%4===0)tone(c[0]/2,.35,'triangle',.05,0,0,t);if(b%4===2)tone(c[2]/2,.3,'triangle',.035,0,0,t);const m=[784,659,784,880,784,659,523,587,659,587,523,440,392,440,523,0];const n=m[(b>>1)%16];if(b%2===0&&n&&b%64<48)tone(n,.22,'square',.012,0,0,t);if(b%8===4)noise(.03,.03,6000,'highpass',0,0,t);}},
 night:{bpm:64,f(b,t){if(b%8===0)for(const f of [196,246.9,293.7])tone(f,2.5,'sine',.015,0,0,t);if(b%4===2)tone([784,659,587,523][(b>>2)%4],.6,'sine',.01,0,0,t);}},
 battle:{bpm:156,f(b,t){const B=[110,110,130.8,110,146.8,110,164.8,146.8];tone(B[b%8],.12,'square',.035,0,0,t);if(b%4===0)noise(.1,.12,150,'lowpass',0,0,t);if(b%4===2)noise(.08,.08,2000,'bandpass',0,0,t);const m=[659,0,784,659,880,784,659,587,523,587,659,0,784,880,988,0];if(m[b%16]&&b%64>=16)tone(m[b%16],.11,'square',.016,0,0,t);}},
 tour:{bpm:168,f(b,t){const B=[82.4,82.4,98,82.4,110,103.8,98,92.5];tone(B[b%8],.12,'sawtooth',.045,0,0,t);if(b%2===0)noise(.1,.11,130,'lowpass',0,0,t);if(b%4===2)noise(.1,.09,1800,'bandpass',0,0,t);const m=[659,659,784,0,880,0,988,880,784,0,659,0,587,659,0,0];if(m[b%16]&&b%32>=16)tone(m[b%16],.1,'square',.017,0,0,t);}},
 evo:{bpm:120,f(b,t){if(b%4===0)for(const f of [523,659,784])tone(f*(1+((b>>2)%4)*.12),.4,'triangle',.015,0,0,t);}},
};
setInterval(()=>{if(!AC||!sndOn()||!BG[BGM.mode])return;const m=BG[BGM.mode],sp=60/m.bpm/2,now=AC.currentTime;if(BGM.next<now)BGM.next=now+.05;let n=0;while(BGM.next<now+.25&&n<8){try{m.f(BGM.beat,BGM.next);}catch(e){}BGM.next+=sp;BGM.beat++;n++;}},60);

/* ================= データ ================= */

const SAVE_KEY='anamon_v1';

const M=()=>S&&S.mon;
const hour=()=>Math.floor(S.clock/60)%24,minute=()=>Math.floor(S.clock)%60,dayN=()=>Math.floor(S.clock/1440)+1;
const isNight=()=>{const h=hour();return h>=21||h<7;};
const ageDays=m=>m.age/1440;

/* ---- 能力 ---- */
function baseStats(spid){const sp=SP[spid];const tot=BT[sp.s]*(sp.id==='omega'?1.3:1);const sw=sp.w.reduce((a,b)=>a+b,0);const o={};STAT_K.forEach((k,i)=>o[k]=tot*sp.w[i]/sw);return o;}
function stats(m){if(!m||!m.sp)return blankStats();const sp=SP[m.sp],b=baseStats(m.sp),o={};
 STAT_K.forEach(k=>{o[k]=b[k]+m.trained[k]+m.genes[k]*GF[sp.s];});
 const w0=WEIGHT0[sp.s];if(m.wt>w0*1.6)o.spd*=.8;if(m.wt<w0*.55)o.hp*=.85;if(m.hurt){STAT_K.forEach(k=>o[k]*=.85);}
 STAT_K.forEach(k=>o[k]=Math.max(1,Math.round(o[k])));return o;}
const power=st=>STAT_K.reduce((a,k)=>a+st[k],0);
function rankName(r){return r<0?'なし':RANKS[r].n;}

/* ---- お世話ミス ---- */
function mistake(why){const m=M();m.cm++;m.cmTotal++;toast('お世話ミス… '+why);sfx('ng');log('⚠ お世話ミス：'+why);}
function log(s){$('log').textContent=s;}

/* ---- 時間の進行 ---- */
function simulate(dm){const m=M();if(!m)return;S.clock+=dm;
 if(m.egg){m.egg.t+=dm;return;}
 m.age+=dm;const h=dm/60;const st=SP[m.sp].s;
 // 睡眠
 const night=isNight();
 if(night){if(!S.light){if(!m.sleeping){m.sleeping=true;}}else{if(m.sleeping)m.sleeping=false;m.lightT+=dm;if(m.lightT>60&&!m.lightMis){m.lightMis=true;mistake('夜なのに電気がついていた');}}}
 else{m.lightT=0;m.lightMis=false;if(m.sleeping&&S.light){m.sleeping=false;}if(m.sleeping&&!S.light&&m.sta>=100){m.sleeping=false;}if(!m.sleeping&&!S.light&&m.sta<40)m.sleeping=true;}
 const sl=m.sleeping;
 // 空腹・機嫌・体力
 m.hun=Math.max(0,m.hun-h/(sl?7:(st<=1?2.2:3)));
 m.hap=Math.max(0,m.hap-h/(sl?12:(m.sick?2.5:5)));
 m.sta=clamp(m.sta+h*(sl?35:10)*(m.sick?.4:1)*(m.hun<=0?.3:1),0,100);
 m.dis=Math.max(0,m.dis-h*1.2);
 if(m.hun<=0){m.hungryT+=dm;if(m.hungryT>90&&!m.hungryMis){m.hungryMis=true;mistake('おなかをすかせたままにした');}}else{m.hungryT=0;m.hungryMis=false;}
 // トイレ
 if(m.toiletIn!=null){m.toiletIn-=dm*(sl?.5:1);if(m.toiletIn<=60&&!m.needT){m.needT=true;if(!sl)sfx('call');}
  if(m.toiletIn<=0){m.toiletIn=null;m.needT=false;m.poops.push({x:clamp(m.x+rnd(-30,30),40,VW-30),t:0});sfx('poop');m.hap=Math.max(0,m.hap-.3);if(m.poops.length>=3&&!m.poopMis){m.poopMis=true;mistake('うんちがたまっている');}}}
 for(const p of m.poops)p.t+=dm;if(m.poops.some(p=>p.t>240)&&!m.poopMis){m.poopMis=true;mistake('うんちを放置した');}
 if(!m.poops.length)m.poopMis=false;
 // 病気
 if(!m.sick){const ch=(m.poops.length*.045+(m.hun<=0?.06:0)+(m.wt>WEIGHT0[st]*1.8?.04:0))*h;if(Math.random()<ch){m.sick=true;m.sickT=0;sfx('call');log('🤒 '+m.name+'が病気になった！ おくすりをあげよう');}}
 else{m.sickT+=dm;if(m.sickT>360){m.sickT=0;mistake('病気をほうっておいた');}}
 if(m.hurt){m.hurtT+=dm;if(m.hurtT>1440){m.hurt=false;log(m.name+'のケガが自然に治った');}}
 // わがまま
 if(m.whine>0){m.whine-=dm;if(m.whine<=0){m.whine=0;m.dis=Math.max(0,m.dis-6);}}
 else if(!sl&&st>=1&&m.hun>=2&&m.hap>=2&&!m.sick&&!m.needT&&Math.random()<.07*h){m.whine=60;sfx('call');}
 m.petT=Math.max(0,m.petT-dm);
 // 寿命
 const life=lifespan(m),ad=ageDays(m);
 if(!m.warned&&ad>life-2&&st>=4){m.warned=true;toast('そろそろ寿命が近いみたい… 掛け合わせを考えよう',3000);}
 if(ad>=life&&!busy){farewell();return;}
 // 進化
 if(!busy&&!sl&&!m.sleeping){const nx=nextEvo(m);if(nx)evolve(nx);}}
function nextEvo(m){const sp=SP[m.sp],s=sp.s,ad=ageDays(m),r=ROOT[sp.f];if(s>=5||m.sp==='omega')return null;
 if(s<4&&ad<EVO_DAY[s])return null;
 if(s===0)return r+'1';
 if(s===1)return sp.f==='light'?'l2a':(m.cm<=2?r+'2a':r+'2b');
 if(s===2){if(sp.f==='light')return 'l3a';const st=m.trained,g=m.genes;const v=k=>st[k]+g[k]*.5;
  if(m.cm>=5||(sp.id.endsWith('b')&&m.cm>=3))return r+'3c';
  const sc={a:v('atk')+v('hp')*.5,b:v('spd')+v('int'),c:v('def')+v('hp')*.5+(sp.id.endsWith('b')?5:0)};const best=Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0];return r+'3'+best;}
 if(s===3){return sp.f==='light'?'l4a':r+'4'+sp.id.slice(-1);}
 if(s===4){if(ad<EVO_DAY[4])return null;if(m.lastChk&&m.age-m.lastChk<60)return null;m.lastChk=m.age;const pw=power(stats(m));
  if(S.gen>=3&&pw>=700&&m.wins>=10&&m.cmTotal<=8)return 'omega';
  if(m.wins>=4&&pw>=300&&m.cm<=4)return sp.f==='light'?'l5a':r+'5'+sp.id.slice(-1);}
 return null;}

function scold(){const m=M();if(!canAct())return;if(m.sleeping){toast('ねむっている…');return;}
 if(m.whine>0){m.whine=0;m.dis=Math.min(100,m.dis+15);sfx('scold');m.mood='sad';m.moodT=1.5;toast('しつけ成功！');}
 else{m.hap=Math.max(0,m.hap-.6);sfx('scold');m.mood='sad';m.moodT=1.5;toast('理由もなくしかられて、しょんぼり…');}save();}
function toggleLight(){S.light=!S.light;sfx('click');const m=M();if(m&&!m.egg){if(!S.light&&(isNight()||m.sta<40)){m.sleeping=true;sfx('sleep');}if(S.light)m.sleeping=false;}save();}
function pet(){const m=M();if(!canAct()||m.sleeping)return;if(m.petT>0){m.mood='happy';m.moodT=.8;return;}m.hap=Math.min(4,m.hap+.5);m.petT=40;m.mood='happy';m.moodT=1.4;sfx('happy');hearts(m.x,150);save();}
function useItem(k){const m=M();if(!canAct())return;if((S.inv[k]||0)<=0)return;
 if(k==='steak'||k==='cake'){feed(k);return;}
 if(k==='med'||k==='band'){medicine();return;}
 S.inv[k]--;if(k==='energy'){m.sta=Math.min(100,m.sta+50);}
 if(k==='protein'){m.trained.atk+=3;m.trained.hp+=3;}if(k==='shield'){m.trained.def+=3;m.trained.hp+=3;}if(k==='feather'){m.trained.spd+=3;m.trained.int+=3;}
 m.wt+=1;sfx('ok');m.mood='happy';m.moodT=1.2;toast(ITEMS[k].n+'をつかった');save();}

let busy=false;   // 演出中
let fxFood=null,fxFoodT=0,fxClean=0,evoFx=null;
async function hatch(){const m=M();busy=true;setBgm('evo');sfx('crack');evoFx={kind:'hatch',t:0};await wait(1800);sfx('hatch');
 const fam=m.egg.fam;m.sp=ROOT[fam]+'0';m.stage=0;delete m.egg;m.wt=WEIGHT0[0];m.x=VW/2;S.dex[m.sp]=1;evoFx={kind:'burst',t:0};await wait(600);evoFx=null;
 const nm=await askName(m.name||pick(NAMEPOOL),`${FAM[fam].egg}から ${SP[m.sp].n} が生まれた！`);m.name=nm;busy=false;setBgm(isNight()?'night':'home');save();updateHud();}
async function evolve(nx){const m=M();busy=true;const from=m.sp;setBgm('evo');sfx('evo');log('……！？ '+m.name+'の様子が……！');evoFx={kind:'evo',t:0,from,to:nx};await wait(3200);
 m.sp=nx;m.stage=SP[nx].s;m.cm=0;m.stageWins=0;S.dex[nx]=1;if(m.wt<WEIGHT0[m.stage]*.8)m.wt=Math.round(WEIGHT0[m.stage]*.9);
 sfx('evo2');evoFx={kind:'burst',t:0};await wait(700);evoFx=null;
 await infoModal(`<h2>進化！</h2><div style="text-align:center" id="evoPic"></div><p style="text-align:center;font-size:15px"><b>${m.name}</b>は<br><b style="font-size:20px;color:#e8663a">${SP[nx].n}</b>（${STAGE_N[SP[nx].s]}）に進化した！</p><p style="font-size:12px;color:#8a6a4a;text-align:center">${SP[nx].d}</p>`,()=>{$('evoPic').appendChild(thumb(nx,false,180));});
 busy=false;setBgm(isNight()?'night':'home');save();updateHud();}
async function farewell(){const m=M();busy=true;setBgm('night');
 await infoModal(`<h2>旅立ち</h2><div style="text-align:center" id="fwPic"></div><p>${m.name}は寿命をむかえ、空へ旅立っていった……。</p><p>あとには、小さなタマゴがひとつ残されていた。</p>`,()=>{$('fwPic').appendChild(thumb(m.sp,false,140));});
 const g=blankStats();const fin=stats(m);STAT_K.forEach(k=>g[k]=Math.round(fin[k]*.22));retire(m,null);S.mon=newEgg(m.fam,g);busy=false;save();}
function retire(m,partner){const st=stats(m);S.hall.unshift({n:m.name,sp:m.sp,gen:S.gen,pow:power(st),rank:S.rank,wins:m.wins,partner:partner?partner.sp:null});S.hall=S.hall.slice(0,40);S.gen++;}
function genPartner(){const r=clamp(S.rank,0,6);const fams=['fire','water','forest','dark'];if(S.rank>=3)fams.push('light');const fam=pick(fams);
 const st=S.rank>=4&&Math.random()<.5?5:4;let pool=SPL.filter(s=>s.f===fam&&s.s===st&&s.id!=='omega');if(!pool.length)pool=SPL.filter(s=>s.f===fam&&s.s===4);const sp=pick(pool);
 const pw=Math.round(Math.max(160,RANKS[r].pow*rnd(.8,1.1)));const sw=sp.w.reduce((a,b)=>a+b,0);const o={};STAT_K.forEach((k,i)=>o[k]=Math.round(pw*sp.w[i]/sw));return {sp:sp.id,fam,stats:o,pow:pw,name:sp.n};}
function breedEggOptions(m,pt){const opts=[m.fam];if(pt.fam!==m.fam)opts.push(pt.fam);if((m.fam!==pt.fam&&Math.random()<.4)||m.fam==='light'||pt.fam==='light'){if(!opts.includes('light'))opts.push('light');}return opts;}
function childGenes(m,pt){const fin=stats(m),g=blankStats();STAT_K.forEach(k=>g[k]=Math.round(fin[k]*.3+pt.stats[k]*.18));return g;}

/* ================= バトル ================= */
let B=null;
function mkFighter(name,spid,st,isMe){const mx=Math.round(st.hp*2.4+20);return {name,sp:spid,st,hp:mx,max:mx,g:0,el:FAM[SP[spid].f].el,me:isMe,x:isMe?92:268,off:0,flash:0,guard:false,charge:false,mood:'idle',dodge:0};}
function mkOpp(pw,stage){stage=clamp(stage,1,5);let pool=SPL.filter(s=>s.s===stage&&s.id!=='omega'&&(s.f!=='light'||stage>=3));const sp=pick(pool);const sw=sp.w.reduce((a,b)=>a+b,0);const st={};STAT_K.forEach((k,i)=>st[k]=Math.max(1,Math.round(pw*sp.w[i]/sw*rnd(.92,1.08))));return {sp:sp.id,st,name:sp.n};}
async function runBattle(opp,mode,title){const m=M();busy=true;paused=true;B={me:mkFighter(m.name,m.sp,stats(m),true),en:mkFighter(opp.name,opp.sp,opp.st,false),mode,title,turn:0,wait:null,fx:[],txt:''};
 S.dex[opp.sp]=S.dex[opp.sp]||2;
 $('btns').style.display='none';$('bat').classList.add('show');$('spName').textContent=SP[m.sp].mv;setBgm(mode==='tour'?'tour':'battle');
 btxt(`${title}　VS ${opp.name}！`);await wait(1100);
 let res=null;
 while(!res){B.turn++;B.me.guard=B.en.guard=false;
  const cmd=await getCmd();
  const ecmd=enemyCmd();
  let first=B.me,second=B.en,c1=cmd,c2=ecmd;const sp1=B.me.st.spd*rnd(.85,1.15),sp2=B.en.st.spd*rnd(.85,1.15);
  if(sp2>sp1){first=B.en;second=B.me;c1=ecmd;c2=cmd;}
  if(c1==='grd'){first.guard=true;}if(c2==='grd'){second.guard=true;}
  await act(first,second,c1);if(second.hp<=0){res=first.me?'win':'lose';break;}
  await act(second,first,c2);if(first.hp<=0){res=second.me?'win':'lose';break;}
  await wait(250);}
 await wait(500);
 const out={res,hpLeft:B.me.hp/B.me.max};
 $('bat').classList.remove('show');$('btns').style.display='';B.done=true;
 return out;}
function btxt(s){B.txt=s;log(s);}
function getCmd(){updBat();if(window.tgAuto){return wait(380).then(()=>autoCmd());}return new Promise(r=>{B.wait=r;updBat();});}
function updBat(){if(!B)return;document.querySelectorAll('#bat button').forEach(b=>{b.disabled=!B.wait;});const sp=$('bSp');if(B.me.g<100)sp.disabled=true;}
document.querySelectorAll('#bat button').forEach(b=>b.addEventListener('click',()=>{if(!B||!B.wait)return;if(b.dataset.c==='sp'&&B.me.g<100)return;sfx('click');const r=B.wait;B.wait=null;updBat();r(b.dataset.c);}));
function enemyCmd(){const e=B.en;if(e.g>=100)return 'sp';if(e.hp<e.max*.35&&Math.random()<.3)return 'grd';if(Math.random()<.16)return 'chg';return 'atk';}
async function act(a,d,cmd){const m=M();
 if(a.me&&m.dis<35&&Math.random()<(35-m.dis)/80){btxt(`${a.name}はいうことをきかない！`);sfx('ng');const r=pick(['nap','atk','chg']);if(r==='nap'){a.mood='sad';await wait(800);a.mood='idle';return;}cmd=r;}
 if(cmd==='grd'){btxt(`${a.name}はみをまもっている！`);sfx('guard');a.g=Math.min(100,a.g+12);await wait(650);return;}
 if(cmd==='chg'){btxt(`${a.name}は力をためている！`);sfx('charge');a.charge=true;a.g=Math.min(100,a.g+45);a.mood='angry';B.fx.push({t:'chg',f:a,life:.8});await wait(800);a.mood='idle';return;}
 const sp=cmd==='sp';if(sp){a.g=0;btxt(`${a.name}の ${SP[a.sp].mv}！`);sfx('special');B.fx.push({t:'sp',f:a,life:1.1});a.mood='attack';await wait(700);}
 else{btxt(`${a.name}のこうげき！`);}
 // 突進
 const dir=a.me?1:-1;for(let i=0;i<8;i++){a.off=dir*i*7;a.mood='attack';await wait(25);}
 const hitC=clamp(.9+(a.st.spd-d.st.spd)/(a.st.spd+d.st.spd+1)*.25,.65,.97);
 if(!sp&&Math.random()>hitC){d.dodge=1;sfx('dodge');btxt(`${d.name}はひらりとかわした！`);B.fx.push({t:'miss',f:d,life:.8});}
 else{const em=elMul(a.el,d.el);let dmg;
  if(sp)dmg=(a.st.atk*.55+a.st.int*.95)*1.75*em*rnd(.92,1.08);
  else dmg=a.st.atk*(a.st.atk/(a.st.atk+d.st.def))*1.6*em*rnd(.88,1.12);
  if(a.charge){dmg*=1.3;a.charge=false;}
  const crit=!sp&&Math.random()<.06+a.st.int/(a.st.int+200)*.12;if(crit)dmg*=1.6;
  if(d.guard)dmg*=.45;dmg=Math.max(1,Math.round(dmg));d.hp=Math.max(0,d.hp-dmg);d.flash=1;d.mood='hurt';
  a.g=Math.min(100,a.g+(sp?0:22));d.g=Math.min(100,d.g+14);
  sfx(crit||sp?'crit':'hit');B.fx.push({t:'num',f:d,s:String(dmg),c:crit?'#ffe040':'#fff',life:1});B.fx.push({t:'boom',f:d,life:.35,big:sp||crit});
  if(crit)btxt('きゅうしょにあたった！');else if(em>1.1)btxt('こうかはばつぐんだ！');else if(em<.9)btxt('いまひとつのようだ…');}
 for(let i=8;i>=0;i--){a.off=dir*i*7;await wait(22);}a.off=0;a.mood='idle';await wait(500);d.mood=d.hp<=0?'faint':'idle';d.dodge=0;}
function autoCmd(){const me=B.me,en=B.en;if(me.g>=100)return 'sp';if(en.g>=100&&Math.random()<.6)return 'grd';if(me.g>=55&&me.g<100&&Math.random()<.35)return 'chg';if(Math.random()<.1)return 'chg';return 'atk';}
function drawBattle(g,t){const bg=g.createLinearGradient(0,0,0,VH);bg.addColorStop(0,'#3a2a6a');bg.addColorStop(.6,'#8a5aa8');bg.addColorStop(1,'#e8a05a');g.fillStyle=bg;g.fillRect(0,0,VW,VH);
 g.fillStyle='rgba(255,255,255,.15)';for(let i=0;i<7;i++){g.beginPath();g.moveTo(i*60-20,0);g.lineTo(i*60+30+Math.sin(t+i)*10,150);g.lineTo(i*60+10,150);g.closePath();g.fill();}
 for(let i=0;i<30;i++){g.fillStyle=`hsl(${i*37%360},50%,${30+((i*7)%20)}%)`;g.beginPath();g.arc((i*13.7)%VW,128+(i%3)*6+Math.sin(t*6+i)*1.5,6,0,TAU);g.fill();}
 g.fillStyle='#c88a4a';g.fillRect(0,150,VW,VH-150);g.fillStyle='#e8b070';g.beginPath();g.ellipse(VW/2,198,170,36,0,0,TAU);g.fill();g.strokeStyle='#fff8';g.lineWidth=2;g.stroke();
 for(const f of [B.me,B.en]){const sp=SP[f.sp];const sz=Math.min(96,SIZE[sp.s]*.95+6);const x=f.x+f.off+(f.dodge?(f.me?-18:18):0);
  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x,206,sz*.4,6,0,0,TAU);g.fill();
  drawMon(g,f.sp,x,205,sz,{t,dir:f.me?1:-1,mood:f.mood==='hurt'?'hurt':f.mood,flash:f.flash,alpha:f.hp<=0?.5:1});f.flash=Math.max(0,f.flash-.06);}
 // HP
 for(const f of [B.me,B.en]){const x=f.me?8:VW-168,y=8;g.fillStyle='rgba(20,10,30,.75)';rrect(g,x,y,160,40,8);g.fillStyle='#fff';g.font='bold 11px sans-serif';g.textAlign='left';g.fillText(f.name,x+8,y+14);
  g.fillStyle='#ffd';g.font='bold 9px sans-serif';g.textAlign='right';g.fillText(`${STAGE_N[SP[f.sp].s]} ${FAM[SP[f.sp].f].n}`,x+152,y+14);
  g.fillStyle='#300';g.fillRect(x+8,y+19,144,7);const k=f.hp/f.max;g.fillStyle=k>.5?'#5ae07a':k>.25?'#ffd040':'#ff5a4a';g.fillRect(x+8,y+19,144*k,7);
  g.fillStyle='#223';g.fillRect(x+8,y+29,144,5);g.fillStyle=f.g>=100?`hsl(${t*300%360},90%,60%)`:'#5ac8ff';g.fillRect(x+8,y+29,144*f.g/100,5);
  g.fillStyle='#fff';g.font='bold 8px sans-serif';g.textAlign='left';g.fillText(`${f.hp}/${f.max}`,x+8,y+44-1);}
 for(const e of B.fx){e.life-=.016;const f=e.f,x=f.x,y=150;
  if(e.t==='num'){g.font='bold 18px sans-serif';g.textAlign='center';g.strokeStyle='#000';g.lineWidth=4;const yy=y-20-(1-e.life)*30;g.strokeText(e.s,x,yy);g.fillStyle=e.c;g.fillText(e.s,x,yy);}
  else if(e.t==='boom'){g.save();g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,240,180,${e.life*2})`;const r=(e.big?50:28)*(1.2-e.life*2);g.beginPath();for(let i=0;i<12;i++){const a=i/12*TAU,rr=i%2?r*.5:r;g.lineTo(x+Math.cos(a)*rr,y+20+Math.sin(a)*rr);}g.fill();g.restore();}
  else if(e.t==='miss'){g.font='bold 14px sans-serif';g.textAlign='center';g.fillStyle='#fff';g.fillText('MISS',x,y-30-(1-e.life)*20);}
  else if(e.t==='chg'){g.save();g.globalCompositeOperation='lighter';for(let i=0;i<8;i++){const a=i/8*TAU+t*4;g.fillStyle='rgba(255,200,80,.6)';g.beginPath();g.arc(x+Math.cos(a)*40*e.life,y+30+Math.sin(a)*40*e.life,4,0,TAU);g.fill();}g.restore();}
  else if(e.t==='sp'){const c=FAM[SP[f.sp].f].pal[0];g.save();g.globalCompositeOperation='lighter';const tx=f.me?B.en.x:B.me.x;const k=1-e.life/1.1;const bx=lerp(x,tx,clamp(k*1.6,0,1));const [R,G2,Bb]=hx(c);g.fillStyle=`rgba(${R},${G2},${Bb},.7)`;g.beginPath();g.arc(bx,y+20,16+k*16,0,TAU);g.fill();g.fillStyle='rgba(255,255,255,.8)';g.beginPath();g.arc(bx,y+20,8+k*6,0,TAU);g.fill();g.restore();}}
 B.fx=B.fx.filter(e=>e.life>0);
 g.textAlign='left';}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fill();}

function battleMenu(){const m=M();if(!canAct())return;
 if(m.stage<1){toast('幼体はまだ戦えない');return;}if(m.sleeping){toast('ねむっている…');return;}
 if(m.sick||m.hurt){toast('具合が悪くて戦えない');return;}
 const pw=power(stats(m));const nx=S.rank+1;
 let h=`<h2>⚔️ バトル</h2><p style="text-align:center">戦闘力 <b>${pw}</b>　ランク <b>${rankName(S.rank)}</b></p>`;
 h+=`<button class="mb" id="bFree">野良試合<small>手ごろな相手と1戦　たいりょく-30</small></button>`;
 if(nx<RANKS.length){const R=RANKS[nx];const ok=m.stage>=R.st;h+=`<button class="mb" id="bTour" ${ok?'':'disabled'}>${R.n}ランク大会に挑戦<small>${ok?`3連戦　参加費${R.fee}G　優勝賞金${R.prize}G　目安の戦闘力${R.pow}`:`${STAGE_N[R.st]}以上で参加できる`}</small></button>`;}
 else h+=`<p style="text-align:center;color:#e8663a;font-weight:900">👑 MASTERランク達成済み！</p>`;
 h+=`<button class="mb sub" id="bX">もどる</button>`;
 openModal(h,{auto(){const R=RANKS[nx];if(R&&m.stage>=R.st&&pw>=R.pow*(1.02)&&S.money>=R.fee&&m.sta>=60)$('bTour').click();else $('bFree').click();}});
 $('bFree').onclick=()=>{if(m.sta<30){toast('たいりょくがたりない');return;}closeModal();freeBattle();};
 if($('bTour'))$('bTour').onclick=()=>{const R=RANKS[nx];if(m.sta<30){toast('たいりょくがたりない');return;}if(S.money<R.fee){toast('参加費がたりない');return;}closeModal();tournament(nx);};
 $('bX').onclick=()=>{sfx('click');closeModal();};}
async function freeBattle(){const m=M();m.sta-=30;m.hun=Math.max(0,m.hun-.5);const pw=power(stats(m));const opp=mkOpp(Math.max(20,pw*rnd(.72,.95)),clamp(m.stage+(Math.random()<.3?-1:0),1,5));
 const r=await runBattle(opp,'free','野良試合');await afterBattle(r,Math.round(20+pw*.22),false);}
async function tournament(ri){const m=M();const R=RANKS[ri];S.money-=R.fee;m.sta-=30;m.hun=Math.max(0,m.hun-.5);
 const mul=[.86,.96,1.06];let ok=true;
 for(let i=0;i<3;i++){const st=clamp(R.st+(i===2?1:0),1,5);const opp=mkOpp(R.pow*mul[i],Math.min(st,5));
  await infoModal(`<h2>${R.n}ランク大会</h2><p style="text-align:center;font-size:15px">第${i+1}試合${i===2?'（決勝）':''}</p><div id="oppPic" style="text-align:center"></div><p style="text-align:center">相手：<b>${opp.name}</b>（${STAGE_N[SP[opp.sp].s]}）</p>`,()=>$('oppPic').appendChild(thumb(opp.sp,false,120)));
  const r=await runBattle(opp,'tour',`${R.n}ランク大会 第${i+1}試合`);if(r.res!=='win'){ok=false;await afterBattle(r,0,true);break;}
  m.wins++;m.stageWins++;}
 if(ok){S.rank=ri;S.money+=R.prize;sfx('win');const m2=M();m2.hap=Math.min(4,m2.hap+2);
  const master=ri===RANKS.length-1;if(master&&window.tgClear)tgClear('anamon');
  await infoModal(`<h2>🏆 優勝！</h2><p style="text-align:center;font-size:16px">${R.n}ランク大会で優勝した！</p><p style="text-align:center">賞金 <b>${R.prize}G</b> を手に入れた</p>${master?'<p style="text-align:center;color:#e8663a;font-weight:900;font-size:16px">👑 MASTERランク制覇！<br>あなたのモンスターは世界最強になった！</p>':''}`);
  finishBattle();}}
async function afterBattle(r,prize,tour){const m=M();
 if(r.res==='win'){m.wins++;m.stageWins++;S.money+=prize;m.hap=Math.min(4,m.hap+1);sfx('win');STAT_K.forEach(k=>{if(Math.random()<.5)m.trained[k]+=1;});
  await infoModal(`<h2>WIN!</h2><p style="text-align:center">${m.name}の勝ち！</p><p style="text-align:center">${prize}G 手に入れた　能力が少し上がった</p>`);}
 else{m.losses++;m.hap=Math.max(0,m.hap-1);sfx('lose');const hurt=Math.random()<.35;if(hurt){m.hurt=true;m.hurtT=0;}
  await infoModal(`<h2>LOSE…</h2><p style="text-align:center">${m.name}は負けてしまった…</p>${hurt?'<p style="text-align:center;color:#c8402a">ケガをしてしまった！ ばんそうこうで治そう</p>':''}${tour?'<p style="text-align:center">大会は敗退…また挑戦しよう</p>':''}`);}
 finishBattle();}
function finishBattle(){B=null;busy=false;paused=false;setBgm(isNight()?'night':'home');save();updateHud();}

let MOD=null;
function openModal(html,o){MOD=Object.assign({t:0},o||{});$('mbox').innerHTML=html;$('modal').classList.remove('hidden');$('mbox').scrollTop=0;}

/* ================= 部屋の描画 ================= */
function skyCol(){const h=S.clock/60%24;const keys=[[0,'#0a0e2a','#1a1a4a'],[5,'#1a1a4a','#4a3a6a'],[6.5,'#ff9a6a','#ffd8a0'],[9,'#7ac8f0','#d8f0ff'],[16,'#7ac8f0','#d8f0ff'],[18,'#ff8a5a','#ffc890'],[19.5,'#3a2a6a','#6a4a8a'],[21,'#0a0e2a','#1a1a4a'],[24,'#0a0e2a','#1a1a4a']];
 for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(h>=a[0]&&h<b[0]){const k=(h-a[0])/(b[0]-a[0]);return [mix(a[1],b[1],k),mix(a[2],b[2],k)];}}return ['#0a0e2a','#1a1a4a'];}
function drawRoom(g,t){const m=M();const [s1,s2]=skyCol();
 // 壁
 const wall=g.createLinearGradient(0,0,0,170);wall.addColorStop(0,'#f8e8c8');wall.addColorStop(1,'#f0d8a8');g.fillStyle=wall;g.fillRect(0,0,VW,170);
 g.fillStyle='rgba(200,150,90,.18)';for(let x=0;x<VW;x+=24)g.fillRect(x,0,10,170);
 // 窓
 const wx=200,wy=22,ww=120,wh=80;const sk=g.createLinearGradient(0,wy,0,wy+wh);sk.addColorStop(0,s1);sk.addColorStop(1,s2);g.fillStyle=sk;g.fillRect(wx,wy,ww,wh);
 const h=S.clock/60%24;if(h>=19.5||h<6){g.fillStyle='#fff';for(let i=0;i<10;i++)g.fillRect(wx+(i*37)%ww,wy+(i*23)%(wh-20),1.5,1.5);g.fillStyle='#fff8d0';g.beginPath();g.arc(wx+90,wy+22,9,0,TAU);g.fill();}
 else{const sx=wx+lerp(10,110,clamp((h-6)/13,0,1));g.fillStyle='#fff4b0';g.beginPath();g.arc(sx,wy+30-Math.sin(clamp((h-6)/13,0,1)*Math.PI)*16,8,0,TAU);g.fill();g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.ellipse(wx+30+((t*4)%100),wy+55,14,5,0,0,TAU);g.fill();}
 g.fillStyle='#5ab04a';g.beginPath();g.ellipse(wx+30,wy+wh,40,14,0,Math.PI,TAU);g.fill();g.beginPath();g.ellipse(wx+95,wy+wh,34,10,0,Math.PI,TAU);g.fill();
 g.strokeStyle='#a87a4a';g.lineWidth=5;g.strokeRect(wx,wy,ww,wh);g.lineWidth=3;g.beginPath();g.moveTo(wx+ww/2,wy);g.lineTo(wx+ww/2,wy+wh);g.moveTo(wx,wy+wh/2);g.lineTo(wx+ww,wy+wh/2);g.stroke();
 // ポスター・棚
 g.fillStyle='#ffb07a';g.fillRect(30,30,46,58);g.fillStyle='#fff';g.font='bold 9px sans-serif';g.textAlign='center';g.fillText('RANK',53,46);g.font='bold 18px sans-serif';g.fillStyle='#7a2a08';g.fillText(rankName(S.rank)==='なし'?'-':rankName(S.rank).slice(0,3),53,72);
 g.fillStyle='#a87a4a';g.fillRect(100,70,70,6);g.fillStyle='#ffd040';for(let i=0;i<Math.min(5,S.rank+1);i++){g.fillRect(104+i*13,56,9,14);}
 // 床
 const fl=g.createLinearGradient(0,170,0,VH);fl.addColorStop(0,'#c8905a');fl.addColorStop(1,'#a06a3a');g.fillStyle=fl;g.fillRect(0,170,VW,VH-170);g.strokeStyle='rgba(90,50,20,.25)';g.lineWidth=1;for(let y=180;y<VH;y+=14){g.beginPath();g.moveTo(0,y);g.lineTo(VW,y);g.stroke();}
 // トイレ
 g.fillStyle='#e8f0ff';g.beginPath();g.ellipse(26,200,16,7,0,0,TAU);g.fill();g.fillStyle='#c8d8f0';g.fillRect(14,176,24,22);g.fillStyle='#fff';g.beginPath();g.ellipse(26,198,13,5,0,0,TAU);g.fill();g.strokeStyle='#8aa0c0';g.lineWidth=1.5;g.strokeRect(14,176,24,22);
 if(!m)return;
 // うんち
 for(const p of m.poops)drawPoop(g,p.x,212,t);
 // モンスター
 if(m.egg){drawEgg(g,m.fam,VW/2,212,46,t,evoFx&&evoFx.kind==='hatch'||m.egg.t>20);}
 else{const sp=SP[m.sp];const sz=SIZE[sp.s];
  let mood=m.mood;if(m.moodT<=0){mood=m.sleeping?'sleep':m.sick?'sick':m.hun<1||m.hap<1?'sad':'idle';}
  let x=m.x,y=212;if(m.mood==='toilet'&&m.moodT>0){x=lerp(m.x,32,clamp((2.2-m.moodT)*2,0,1));}
  const blink=(t%4)<.12;g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.ellipse(x,y+2,sz*.35,5,0,0,TAU);g.fill();
  let o={t,dir:m.dir,mood,blink,walk:m.walking?t*8:0};
  if(evoFx&&evoFx.kind==='evo'){const k=evoFx.t;const flip=Math.floor(k*(2+k*3))%2;const id=flip?evoFx.to:evoFx.from;const sz2=SIZE[SP[id].s];drawMon(g,id,x,y,sz2,{t,dir:1,sil:'#fff'});
   g.save();g.globalCompositeOperation='lighter';for(let i=0;i<10;i++){const a=i/10*TAU+k*3;g.fillStyle='rgba(255,255,200,.5)';g.beginPath();g.arc(x+Math.cos(a)*60*(1-k/4),y-50+Math.sin(a)*40*(1-k/4),3,0,TAU);g.fill();}g.restore();}
  else{if(mood==='happy')y-=Math.abs(Math.sin(t*8))*6;drawMon(g,m.sp,x,y,sz,o);}
  if(m.sleeping){g.fillStyle='#4a6aa0';g.font='bold 14px sans-serif';g.textAlign='left';for(let i=0;i<3;i++){const ph=(t*.6+i/3)%1;g.globalAlpha=1-ph;g.fillText('Z',x+sz*.3+ph*20,y-sz*.8-ph*30);}g.globalAlpha=1;}
  // ふきだし
  const icon=m.sleeping?null:m.needT?'💦トイレ':m.sick?'🤒':m.hurt?'🩹':m.hun<1?'🍖':m.whine>0?'❗':m.hap<1?'💢':null;
  if(icon&&!evoFx){const bx=clamp(x+sz*.35,30,VW-40),by=y-sz-14;g.fillStyle='#fff';g.strokeStyle='#2a2230';g.lineWidth=1.5;g.beginPath();g.ellipse(bx,by,icon.length>2?28:14,12,0,0,TAU);g.fill();g.stroke();g.font='13px sans-serif';g.textAlign='center';g.fillStyle='#000';g.fillText(icon,bx,by+5);}
  if(fxFoodT>0&&fxFood){g.font='22px sans-serif';g.textAlign='center';g.fillText(fxFood,x+m.dir*sz*.5,y-sz*.3+Math.sin(t*10)*2);}}
 if(evoFx&&evoFx.kind==='burst'){g.save();g.globalCompositeOperation='lighter';const k=evoFx.t;g.fillStyle=`rgba(255,255,230,${Math.max(0,1-k*1.5)})`;g.fillRect(0,0,VW,VH);for(let i=0;i<16;i++){const a=i/16*TAU;g.fillStyle='rgba(255,230,120,.8)';g.beginPath();g.arc(m.x+Math.cos(a)*k*160,170+Math.sin(a)*k*120,4,0,TAU);g.fill();}g.restore();}
 for(const f of roomFx){if(f.t==='heart'){g.globalAlpha=Math.min(1,f.life);g.fillStyle='#ff5a8a';g.font='16px sans-serif';g.textAlign='center';g.fillText('♥',f.x+Math.sin(f.life*8)*6,f.y-(1.2-f.life)*40);g.globalAlpha=1;}}
 if(fxClean>0){g.fillStyle=`rgba(255,255,255,${fxClean*.6})`;g.fillRect(0,170,VW,VH-170);g.font='20px sans-serif';g.textAlign='center';g.fillText('✨',VW*.3,200);g.fillText('✨',VW*.7,190);}
 if(!S.light){g.fillStyle='rgba(8,8,30,.72)';g.fillRect(0,0,VW,VH);}
 g.textAlign='left';}
function drawPoop(g,x,y,t){g.fillStyle='#8a5a2a';g.strokeStyle='#3a2010';g.lineWidth=1.2;for(const [dy,r] of [[0,8],[-6,6],[-11,4]]){g.beginPath();g.ellipse(x,y+dy,r,r*.65,0,0,TAU);g.fill();g.stroke();}
 g.strokeStyle='rgba(120,160,60,.6)';g.lineWidth=1.2;for(let i=0;i<2;i++){g.beginPath();const ox=x-4+i*8;for(let k=0;k<8;k++)g.lineTo(ox+Math.sin(t*4+k+i)*2,y-16-k*2);g.stroke();}}

/* ================= メイン描画ループ ================= */
let lastR=performance.now();
function render(){const now=performance.now(),dt=Math.min(.1,(now-lastR)/1000)*Math.min(SPD(),8);lastR=now;const t=now/1000;const g=ctx;g.setTransform(SC*DPR,0,0,SC*DPR,0,0);
 if(MOD)MOD.t+=dt;
 for(const f of roomFx)f.life-=dt;for(let i=roomFx.length-1;i>=0;i--)if(roomFx[i].life<=0)roomFx.splice(i,1);
 fxClean=Math.max(0,fxClean-dt*1.5);fxFoodT=Math.max(0,fxFoodT-dt);if(evoFx)evoFx.t+=dt;
 if(!S){drawTitleScr(g,t);return;}
 const m=M();if(m&&!m.egg){m.moodT=Math.max(0,m.moodT-dt);
  if(!m.sleeping&&m.moodT<=0&&!busy){m.wt0=m.wt0||0;if(!m.walking&&Math.random()<dt*.5){m.walking=true;m.tx=rnd(70,VW-50);}
   if(m.walking){const d=m.tx-m.x;m.dir=d>0?1:-1;m.x+=Math.sign(d)*Math.min(Math.abs(d),dt*28);if(Math.abs(d)<2)m.walking=false;}}else m.walking=false;}
 if(B&&!B.done)drawBattle(g,t);else drawRoom(g,t);}
function drawTitleScr(g,t){const bg=g.createLinearGradient(0,0,0,VH);bg.addColorStop(0,'#3a2a6a');bg.addColorStop(1,'#e8865a');g.fillStyle=bg;g.fillRect(0,0,VW,VH);
 const ids=['f5a','w5a','g5b','d5c'];ids.forEach((id,i)=>{drawMon(g,id,60+i*80,200+Math.sin(t*2+i)*2,70,{t:t+i,dir:i<2?1:-1});});}

function trainGame(k){const m=M();const tr=TRAIN.find(x=>x.k===k);busy=true;
 if(window.tgAuto&&SPD()>=10){finishTrain(k,[0,0,0].map(()=>pick([1,1,.6,.6,.12])));return;}
 openModal(`<h2>${tr.e} ${tr.n}</h2><div class="mg"><canvas id="tgc" width="680" height="300"></canvas></div><p style="text-align:center" id="tgMsg">ゾーンでSTOP！（3回）</p><button class="mb" id="tgStop" style="font-size:20px;padding:16px">STOP！</button>`,{train:true,auto(){const T=MOD.tg;if(!T||T.lock)return;const inZ=Math.abs(T.pos-T.zc)<T.zw*.35;if(inZ&&Math.random()<.5)$('tgStop').click();}});

 let last=performance.now();(function loop(){if(!c.isConnected)return;const now=performance.now(),dt=Math.min(.05,(now-last)/1000)*Math.min(SPD(),6);last=now;const t=now/1000;
  if(!T.lock){T.pos+=T.v*dt*(.9+T.round*.35);if(T.pos>1){T.pos=1;T.v=-1;}if(T.pos<0){T.pos=0;T.v=1;}}
  T.hitT=Math.max(0,T.hitT-dt);
  g.fillStyle='#2a2230';g.fillRect(0,0,340,150);
  drawMon(g,m.sp,80+(T.hitT>0?6:0),132,Math.min(90,SIZE[SP[m.sp].s]*1.05),{t,dir:1,mood:T.hitT>0?'attack':'idle'});
  const tx=210;if(k==='atk'){g.fillStyle='#a83a2a';g.fillRect(tx-14,40+(T.hitT>0?Math.sin(t*40)*3:0),28,70);g.fillStyle='#5a3a2a';g.fillRect(tx-2,20,4,22);}
  else if(k==='def'){g.fillStyle='#7ac8ff';for(let i=0;i<6;i++)g.fillRect(70+i*14,0,6,((t*300+i*40)%140));}
  else if(k==='spd'){g.strokeStyle='#fff8';g.lineWidth=2;for(let i=0;i<5;i++){const y=60+i*15,x=(340-((t*400+i*90)%340));g.beginPath();g.moveTo(x,y);g.lineTo(x+40,y);g.stroke();}}
  else if(k==='int'){g.fillStyle='#ffd040';for(let i=0;i<3;i++)for(let j=0;j<3;j++){g.fillStyle=(i+j+Math.floor(t*2))%2?'#ffd040':'#5ac8ff';g.fillRect(190+i*24,40+j*24,20,20);}}
  else{g.fillStyle='#5ab04a';g.fillRect(0,132,340,18);g.fillStyle='#fff';for(let i=0;i<6;i++)g.fillRect((i*70-t*120)%420+20,138,20,3);}
  // ゲージ
  const bx=20,by=8,bw=300,bh=16;g.fillStyle='#14101a';g.fillRect(bx,by,bw,bh);const zx=bx+(T.zc-T.zw/2)*bw;g.fillStyle='#5ae07a';g.fillRect(zx,by,T.zw*bw,bh);g.fillStyle='#ffe040';g.fillRect(bx+(T.zc-T.zw*.15)*bw,by,T.zw*.3*bw,bh);
  g.fillStyle='#fff';g.fillRect(bx+T.pos*bw-2,by-4,4,bh+8);
  for(let i=0;i<3;i++){g.fillStyle=T.res[i]==null?'#4a4058':T.res[i]>=1?'#ffe040':T.res[i]>=.6?'#5ae07a':'#ff5a4a';g.beginPath();g.arc(300+i*-14,40,5,0,TAU);g.fill();}
  if(T.q){g.font='bold 22px sans-serif';g.textAlign='center';g.fillStyle=T.q==='PERFECT'?'#ffe040':T.q==='GOOD'?'#5ae07a':'#ff7a6a';g.fillText(T.q,240,90);g.textAlign='left';}
  requestAnimationFrame(loop);})();
 $('tgStop').onclick=async()=>{if(T.lock)return;T.lock=true;const d=Math.abs(T.pos-T.zc);let q;if(d<T.zw*.15){q=1;T.q='PERFECT';sfx('perfect');}else if(d<T.zw/2){q=.6;T.q='GOOD';sfx('good');}else{q=.12;T.q='MISS';sfx('miss');}
  T.res.push(q);T.hitT=.3;sfx('train');T.round++;await wait(650);T.q=null;
  if(T.round>=3){finishTrain(k,T.res);return;}T.zc=rnd(.25,.8);T.pos=Math.random()<.5?0:1;T.v=T.pos?-1:1;T.lock=false;};}
function finishTrain(k,res){const m=M();const st=SP[m.sp].s;const mul=[.6,.8,1,1.25,1.5,1.8][st]*(1+(S.gen-1)*.06)*(m.hap>=2?1:.6)*(m.dis>=50?1.15:1);
 const sum=res.reduce((a,b)=>a+b,0);const gain=Math.max(1,Math.round(sum*1.25*mul));const side={hp:'def',atk:'hp',def:'hp',spd:'int',int:'spd'}[k];const g2=Math.round(gain*.3);
 m.trained[k]+=gain;m.trained[side]+=g2;m.sta=Math.max(0,m.sta-25);m.hun=Math.max(0,m.hun-.5);m.wt=Math.max(Math.round(WEIGHT0[st]*.5),m.wt-1);if(sum<1)m.hap=Math.max(0,m.hap-.4);
 busy=false;closeModal();toast(`${STAT_N[k]} +${gain}　${STAT_N[side]} +${g2}`,2200);log(`💪 トレーニング完了！ ${STAT_N[k]}+${gain} ${STAT_N[side]}+${g2}`);m.mood=sum>=1.5?'happy':'idle';m.moodT=1.2;save();updateHud();}

 openModal(`<h2>📋 メニュー</h2>

 STAT_K.forEach(k=>{h+=`<tr><td style="width:70px">${STAT_N[k]}</td><td><div class="sbar"><div style="width:${st[k]/mx*100}%"></div></div><small style="color:#a08060">血統 +${Math.round(m.genes[k]*GF[sp.s])}</small></td><td>${st[k]}</td></tr>`;});

 const nx=sp.s===4?`<p style="font-size:11px;color:#8a6a4a">極限期への条件：9日目以降・バトル4勝以上・戦闘力300以上・この段階のお世話ミス4回以下</p>`:'';
 h+=nx+`<button class="mb sub" id="stRn">なまえをかえる</button><button class="mb" id="stX">もどる</button>`;
 openModal(h,{auto(){$('stX').click();}});$('stPic').appendChild(thumb(m.sp,false,150));$('stX').onclick=()=>{sfx('click');mainMenu();};

 S.hall.forEach((r,i)=>{h+=`<div class="card" style="display:flex;align-items:center;gap:8px;margin-top:6px;text-align:left"><div style="width:64px" data-h="${i}"></div><div>第${r.gen}世代 <b>${r.n}</b><br><small>${SP[r.sp].n}（${STAGE_N[SP[r.sp].s]}）　戦闘力${r.pow}　${r.wins}勝　ランク${rankName(r.rank)}</small></div></div>`;});
 h+='<button class="mb" id="hX">もどる</button>';openModal(h,{auto(){$('hX').click();}});$('mbox').querySelectorAll('[data-h]').forEach(d=>d.appendChild(thumb(S.hall[+d.dataset.h].sp,false,64)));$('hX').onclick=()=>{sfx('click');mainMenu();};}

 if(MOD&&MOD.auto){try{MOD.auto();}catch(e){}return;}
 if(!S){return;}const m=M();if(!m||busy||B)return;if(m.egg)return;
 const now=performance.now();if(now<autoNext)return;autoNext=now+260/Math.min(SPD(),4);
 const sp=SP[m.sp];
 if(isNight()&&S.light){if(m.hun<2.5&&!m.sleeping){feed('meat');return;}if(m.needT){toilet();return;}if(m.poops.length){clean();return;}toggleLight();return;}
 if(!isNight()&&!S.light&&(m.sta>=95||!m.sleeping)){toggleLight();return;}
 if(m.poops.length){clean();return;}
 if(m.sick||m.hurt){medicine();return;}
 if(m.sleeping)return;
 if(m.needT){toilet();return;}

 if(m.hun<2){feed('meat');return;}
 if(m.hap<1.5){if((S.inv.cake||0)>0){feed('cake');return;}if(S.money>400){S.money-=30;S.inv.cake=(S.inv.cake||0)+1;return;}pet();return;}
 if((S.inv.med||0)<1&&S.money>=200){S.money-=40;S.inv.med=(S.inv.med||0)+1;}
 if(sp.s>=4){const ad=ageDays(m),life=lifespan(m);if(ad>life-1.2||(sp.s===5&&(S.rank>=6||m.wins>=12+S.gen*2))){if(S.money>=100){breedMenu();return;}}}
 const pw=power(stats(m));const nx=S.rank+1,R=RANKS[nx];
 if(m.sta>=60&&sp.s>=1&&m.hun>=1.5){if(R&&sp.s>=R.st&&pw>=R.pow*1.02&&S.money>=R.fee){battleMenu();return;}
  if(Math.random()<(sp.s===4?.45:.18)||S.money<80){battleMenu();return;}}

let lastT=performance.now(),saveAcc=0,hudAcc=0;
function tick(){const now=performance.now();const dt=Math.min(.25,(now-lastT)/1000);lastT=now;if(!S)return;const m=M();
 const running=!MOD&&!busy&&!B;
 if(running&&m){const dm=dt*6*S.speed*SPD();
  // 細かく刻んで進める
  let left=dm;while(left>0&&!busy&&!MOD){const d=Math.min(left,5);simulate(d);left-=d;}
  if(m.egg&&m.egg.t>=40&&!busy)hatch();}
 const want=B?BGM.mode:(isNight()&&!S.light?'night':busy&&evoFx?'evo':'home');if(!B&&!busy&&!MOD&&BGM.mode!==want&&BGM.mode!=='none')setBgm(want);

<script>
/* ---------- 共通の効果音（Web Audioで合成） ---------- */
window.tgSound = (function(){
  var AC = null, noiseBuf = null, on = true, last = {};
  try { on = localStorage.getItem('tg_sound') !== '0'; } catch (e) {}
  function ctx(){
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, dur, type, vol, slide, delay){
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, vol, freq, delay, kind){
    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = 1;
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + .03);
  }
  function arp(fs, step, type, vol, dur){ fs.forEach(function(f, i){ tone(f, dur || .22, type, vol, 0, i * step); }); }
  var LIB = {
    click:  function(){ tone(900, .05, 'square', .03); },
    pick:   function(){ tone(660, .06, 'triangle', .07); tone(990, .08, 'triangle', .06, 0, .05); },
    unpick: function(){ tone(520, .08, 'triangle', .06, .7); },
    tick:   function(){ tone(1500 + Math.random() * 300, .025, 'square', .025); },
    land:   function(){ tone(784, .09, 'square', .05); tone(1175, .18, 'square', .05, 0, .07); },
    start:  function(){ arp([392, 523, 659], .09, 'square', .05, .18); },
    shot:   function(){ tone(1200, .07, 'square', .025, .45); },
    shotFoe:function(){ tone(700, .08, 'square', .02, .5); },
    slash:  function(){ noise(.12, .12, 2600, 0, 'highpass'); tone(500, .1, 'sawtooth', .03, .5); },
    dash:   function(){ noise(.2, .1, 800, 0, 'bandpass'); tone(200, .2, 'sine', .06, 2.2); },
    charge: function(){ tone(200, .7, 'sawtooth', .05, 4); },
    beam:   function(){ noise(.5, .2, 500, 0, 'lowpass'); tone(90, .5, 'sawtooth', .08, .5); },
    hit:    function(){ noise(.09, .14, 900, 0, 'lowpass'); tone(160, .08, 'square', .04, .6); },
    big:    function(){ noise(.3, .22, 400, 0, 'lowpass'); tone(110, .3, 'sawtooth', .07, .5); },
    heal:   function(){ arp([784, 988, 1319], .06, 'sine', .06, .2); },
    miss:   function(){ noise(.15, .06, 3000, 0, 'highpass'); },
    good:   function(){ arp([659, 784, 1047], .08, 'triangle', .07, .25); },
    bad:    function(){ tone(330, .25, 'triangle', .07, .75); tone(247, .35, 'triangle', .06, .8, .18); },
    win:    function(){ arp([523, 659, 784, 1047, 1319], .1, 'square', .045, .28); },
    lose:   function(){ arp([392, 330, 262, 196], .22, 'triangle', .08, .4); },
    splash: function(){ noise(.35, .18, 700, 0, 'lowpass'); noise(.2, .08, 2400, .05, 'bandpass'); },
    bubble: function(){ tone(250 + Math.random() * 250, .07, 'sine', .04, 1.8); },
    slurp:  function(){ noise(.5, .12, 1400, 0, 'bandpass'); noise(.3, .08, 900, .55, 'bandpass'); },
    coin:   function(){ tone(988, .06, 'square', .04); tone(1319, .14, 'square', .04, 0, .06); },
    summon: function(){ tone(130, 1, 'sawtooth', .05, 3); arp([523, 784, 1047, 1568], .12, 'sine', .07, .5); },
    evolve: function(){ arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], .07, 'triangle', .06, .3); },
    fuse:   function(){ tone(110, 1.1, 'sawtooth', .06, 2.5); noise(.9, .1, 300, .2, 'lowpass'); arp([659, 880, 1319], .12, 'sine', .07, .4); }
  };
  function play(name){
    if (!on || !LIB[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < 55) return;
    last[name] = now;
    if (!ctx()) return;
    try { LIB[name](); } catch (e) {}
  }
  var btn = document.querySelector('.tg-snd');
  function sync(){ if (btn) { btn.textContent = on ? '音：ON' : '音：OFF'; btn.setAttribute('aria-pressed', String(on)); } }
  if (btn) {
    ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ btn.addEventListener(t, function(e){ e.stopPropagation(); }); });
    btn.addEventListener('click', function(e){
      e.stopPropagation(); on = !on; sync(); btn.blur();
      try { localStorage.setItem('tg_sound', on ? '1' : '0'); } catch (err) {}
      if (on) { ctx(); play('pick'); }
    });
  }
  sync();
  // ブラウザは最初の操作まで音を出せないので、最初のタップで準備する
  window.addEventListener('pointerdown', function(){ if (on) ctx(); }, { once: true, capture: true });
  return { play: play };
})();
</script>

<!-- tg-swipe-guard: スワイプでの更新・戻るを防ぐ -->
<style>html,body{overscroll-behavior:none}</style>
<script>
(function(){
  var GAME=!!document.querySelector('.tg-auto');
  var sx=0,sy=0;
  function scroller(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){var s=getComputedStyle(el).overflowY;if((s==='auto'||s==='scroll')&&el.scrollHeight>el.clientHeight)return el;}return null;}
  document.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;
    // 画面端からのスワイプ（戻る・進む）を止める
    if(sx<14||sx>innerWidth-14){e.preventDefault();}},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
})();
</script>
