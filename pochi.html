<script>

function resize(){const aw=Math.min(innerWidth,560)-8,ah=innerHeight-48-215;SC=Math.max(.5,Math.min(aw/VW,ah/VH));cv.style.width=Math.round(VW*SC)+'px';cv.style.height=Math.round(VH*SC)+'px';cv.width=Math.round(VW*SC*DPR);cv.height=Math.round(VH*SC*DPR);}

let AC=null,NB=null,MG=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.85;MG.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function sndOn(){try{return localStorage.getItem('tg_sound')!=='0';}catch(e){return true;}}
function nbuf(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;}
function tone(f,dur,type,vol,f2,delay,at){const t=(at||AC.currentTime)+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.05);}

 bark(){tone(760,.07,'square',.06,.6);tone(560,.1,'sawtooth',.05,.7,.06);noise(.08,.08,1500,'bandpass');},
 howl(){tone(480,1.3,'triangle',.08,1.7);tone(720,1.2,'sine',.035,1.6,.05);},

function mkPlayer(){return {x:70,y:0,vx:0,vy:0,dir:1,hp:100,max:100,star:0,inv:0,hurtT:0,down:0,atk:null,queue:false,dashT:0,dashCD:0,airDash:true,jumps:0,sticky:0,special:null,dead:false,walk:0,trail:[],combo:0,comboT:0,dashHit:null};}
function startAtk(def){P.atk={def,t:0,hit:new Set()};P.queue=false;
 if(def.air){P.vy=-380;P.vx=P.dir*240;sfx('dash');}else if(def.n==='spin')sfx('spin');else sfx('bite');}
function pUpdate(dt,I){P.inv=Math.max(0,P.inv-dt);P.comboT-=dt;if(P.comboT<=0)P.combo=0;P.dashCD=Math.max(0,P.dashCD-dt);P.sticky=Math.max(0,P.sticky-dt);
 P.trail.unshift({x:P.x,y:P.y+14});if(P.trail.length>16)P.trail.pop();
 const phys=fr=>{P.vy-=1500*dt;P.x+=P.vx*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0;P.vx*=Math.pow(fr,dt*60);}P.x=clamp(P.x,LOCK.l+12,LOCK.r-12);};
 if(P.dead){phys(.85);return;}
 if(P.special){specUpdate(dt);return;}
 if(P.down>0){phys(.88);if(P.y<=0)P.down-=dt;if(P.down<=0)P.inv=Math.max(P.inv,.8);return;}
 if(P.hurtT>0){P.hurtT-=dt;phys(.8);return;}
 const ground=P.y<=0;if(ground&&!P.atk){P.jumps=0;P.airDash=true;}
 if(P.dashT>0){P.dashT-=dt;P.vx=P.dir*430;P.vy=0;P.x+=P.vx*dt;P.x=clamp(P.x,LOCK.l+12,LOCK.r-12);dashHits();
  if(Math.random()<.9)fx.push({t:'star',x:P.x-P.dir*10+rnd(-4,4),y:P.y+rnd(6,24),vx:-P.dir*rnd(40,120),vy:rnd(-30,30),c:pick(['#fff3a0','#ffd060','#ffffff']),life:rnd(.2,.4),r:rnd(1.5,3)});
  if(P.dashT<=0)P.vx=P.dir*140;return;}
 if(I.mx&&!(P.atk&&!P.atk.def.air))P.dir=I.mx>0?1:-1;
 if(I.sp&&P.star>=100){startSpecial();return;}
 if(I.dash&&P.dashCD<=0&&(ground||P.airDash)){if(!ground)P.airDash=false;P.atk=null;P.dashT=.22;P.dashCD=.55;P.inv=Math.max(P.inv,.3);P.dashHit=new Set();P.vy=0;sfx('dash');return;}
 if(I.atk){if(!P.atk)startAtk(ground?ATK[0]:AIRATK);else if(P.atk.t>P.atk.def.t0)P.queue=true;}
 if(P.atk){const a=P.atk,d=a.def;a.t+=dt;
  if(!d.air)P.vx=a.t<d.t1?P.dir*(d.hv?110:60):0;
  if(a.t>=d.t0&&a.t<=d.t1)atkCheck(a);
  if(P.atk===a&&!d.air&&a.t>=d.t2){const idx=ATK.indexOf(d);if(P.queue&&idx<2&&ground)startAtk(ATK[idx+1]);else P.atk=null;}}
 else{P.vx=I.mx*(P.sticky>0?65:150);
  if(I.jump&&P.jumps<2){const first=ground;P.vy=first?(P.sticky>0?330:540):460;P.jumps=first?1:2;sfx(first?'jump':'jump2');if(!first)starBurst(P.x,P.y+8,8);}}
 const wasAir=P.y>0;phys(P.atk&&P.atk.def.air?1:.75);
 if(wasAir&&P.y<=0){if(P.atk&&P.atk.def.air){P.atk=null;sfx('land');dust(P.x,5);}else sfx('land');P.jumps=0;P.airDash=true;}
 if(Math.abs(P.vx)>5&&P.y<=0)P.walk+=dt*Math.abs(P.vx)*.1;}
function atkCheck(a){const d=a.def;
 for(const f of foes){if(f.st==='dead'||f.flee||a.hit.has(f))continue;const dx=(f.x-P.x)*P.dir,h=80*f.scale;
  const inR=d.both?Math.abs(f.x-P.x)<d.r+14*f.scale:dx>-12&&dx<d.r+14*f.scale;
  if(inR&&P.y-4<f.y+h&&P.y+30>f.y){a.hit.add(f);hitFoe(f,d.dmg,d.kb,d.up,d.hv||d.air?'heavy':'',P.x);onHit(a,f.x-P.dir*8,P.y+16);if(!P.atk)return;}}
 if(boss&&!a.hit.has(boss)&&!boss.entering&&!boss.dying){const b=boss,dx=(b.x-P.x)*P.dir,bh=bossH(b);
  const inR=d.both?Math.abs(b.x-P.x)<d.r+b.w/2:dx>-b.w/2&&dx<d.r+b.w/2;
  if(inR&&P.y<b.y+bh&&P.y+30>b.y){a.hit.add(b);if(bossHit(d.dmg))onHit(a,b.x-P.dir*b.w*.35,P.y+16);}}
 for(const p of projs)if(p.kind==='orb'&&Math.abs(p.x-(P.x+P.dir*d.r*.5))<d.r&&Math.abs(p.y-(P.y+14))<26){p.life=0;burst(p.x,p.y,'#c89aff',12);sfx('poof');P.star=Math.min(100,P.star+5);}}

 P.combo++;P.comboT=1.5;G.maxCombo=Math.max(G.maxCombo,P.combo);P.star=Math.min(100,P.star+(boss&&G.phase==='boss'?2.5:4));

 if(boss&&!P.dashHit.has(boss)&&!boss.entering&&!boss.dying&&Math.abs(boss.x-P.x)<boss.w/2+10&&P.y<bossH(boss)){P.dashHit.add(boss);if(bossHit(7))sparks(P.x,P.y+14,'#fff3a0',P.dir);}}
function hurtP(dmg,sx,knock,o){o=o||{};if(state!=='play'||!P||P.dead||!G||G.phase==='win'||G.phase==='pre')return false;if(P.inv>0||P.special||P.dashT>0)return false;

 for(const f of foes)foeUpdate(f,dt);
 const live=foes.filter(f=>f.st!=='dead'&&!f.flee&&f.y<=0);for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){const a=live[i],c=live[j],d=c.x-a.x,m=14*(a.scale+c.scale);if(Math.abs(d)<m){const push=(m-Math.abs(d))*.5*Math.min(1,dt*10)*(d>=0?1:-1);a.x-=push;c.x+=push;}}

function bossPoseOf(b){const a=b.att;let pose='idle',lie=0,ko=0;

  if(k==='swipe')pose=ph==='tele'?'wind':ph==='go'?'atk':'idle';
  else if(k==='charge')pose=ph==='go'?'four':ph==='tele'?'crouch':'hurt';
  else if(k==='slide')pose=ph==='go'?'slide':ph==='tele'?'crouch':'idle';
  else if(k==='slam')pose=ph==='tele'?'crouch':ph==='air'?'jump':'crouch';
  else if(k==='salmon'||k==='bamboo')pose=ph==='tele'?'throw':'throw2';
  else if(k==='ice')pose=ph==='go'?'roar':'crouch';
  else if(k==='icicle'||k==='shove'||k==='roar'||k==='meteor'||k==='orb')pose=ph==='tele'?'roar':'roar';
  else if(k==='combo')pose=ph==='go'?'palm':'stance';
  else if(k==='counter')pose=ph==='strike'?'palm':'stance';
  else if(k==='kick')pose=ph==='air'?'kick':'crouch';}
 return {pose,lie,ko};}

let sLines=null,sIdx=0,sRes=null,sTm=null,sFull=false,sPrev=null;
function story(lines){return new Promise(res=>{sPrev=state;state='story';sLines=lines;sIdx=0;sRes=res;$('story').classList.remove('hidden');showS();});}
function showS(){const [n,tx]=sLines[sIdx];const nm=$('sname'),el=$('stext');nm.style.display=n?'inline-block':'none';nm.textContent=n;nm.style.background=NC[n]||'#c8d4ff';el.className='stext'+(n?'':' nar');
 clearInterval(sTm);let i=0;sFull=false;el.textContent='';sTm=setInterval(()=>{i++;el.textContent=tx.slice(0,i);if(i%3===0)sfx('type');if(i>=tx.length){clearInterval(sTm);sFull=true;}},30/SPD());
 if(n==='ポチ'&&/ワン|ワオ|ワフ/.test(tx))sfx(/ワオ/.test(tx)?'howl':'bark');
 const idx=sIdx;if(window.tgAuto)setTimeout(()=>{if(sLines&&sIdx===idx)nextS(true);},(800+tx.length*20)/SPD());}
function nextS(force){if(!sLines)return;if(!sFull&&!force){clearInterval(sTm);$('stext').textContent=sLines[sIdx][1];sFull=true;return;}sIdx++;sfx('click');if(sIdx>=sLines.length)endS();else showS();}
function endS(){clearInterval(sTm);$('story').classList.add('hidden');const r=sRes;sLines=null;sRes=null;state=sPrev==='story'?'play':sPrev;r&&r();}
$('sbox').addEventListener('click',e=>{if(e.target.id==='sskip')return;nextS(false);});
$('sskip').addEventListener('click',e=>{e.stopPropagation();endS();});

/* ================= 進行 ================= */
const ov=$('ov');function showOv(h,bg){ov.className='';ov.innerHTML=h;ov.style.background=bg||'';}function hideOv(){ov.className='hidden';ov.innerHTML='';}
function initStage(i){const retry=G&&G.stage===i;items=[];G={retry,stage:i,phase:'grunt',kills:0,need:STAGES[i].need,spawned:0,spawnT:1,time:0,dmg:0,maxCombo:0};
 P=mkPlayer();foes=[];projs=[];fx=[];bubbles=[];boss=null;CAM.x=0;LOCK={l:0,r:W};hitstop=0;flashW=0;flashR=0;flashV=0;bossCard=null;stageCard=null;}
async function playStage(i,fromBoss){initStage(i);hideOv();state='play';setBgm('none');
 if(fromBoss){P.x=W*.5;P.star=50;CAM.x=clamp(P.x-VW*.4,0,W-VW);G.kills=G.need;G.midDone=true;await bossSeq();return;}
 if(!G.retry)await story(STORY[i].pre);
 stageCard={s:STAGES[i].name,s2:STAGES[i].sub,t:0,d:2.4};setBgm('battle');state='play';}
async function midStory(){projs=projs.filter(p=>p.kind!=='pot');for(const f of foes){if(f.st==='wind'||f.st==='atk'){f.st='idle';f.cd=1.2;}}const b=BGM.mode;setBgm('none');await wait(250);await story(MID[G.stage]);setBgm(b);P.inv=Math.max(P.inv,.8);}
async function bossSeq(){G.phase='pre';for(const f of foes)if(f.st!=='dead'){f.flee=true;f.fleeDir=f.x<P.x?-1:1;}
 P.atk=null;P.dashT=0;CAM.x=clamp(P.x-VW*.4,0,W-VW);LOCK={l:CAM.x,r:CAM.x+VW};setBgm('none');stageText('WARNING',1.6);sfx('warn');await wait(1300);
 boss=mkBoss(G.stage);
 await new Promise(r=>{const iv=setInterval(()=>{if(!boss||!boss.entering){clearInterval(iv);r();}},50);});
 sfx('roar');shake(8);await wait(500);faceP(boss);P.dir=boss.x>P.x?1:-1;
 if(!G.retry)await story(STORY[G.stage].boss);
 sfx('howl');P.star=Math.min(100,P.star+30);P.hp=Math.min(P.max,P.hp+30);starBurst(P.x,P.y+16,16);stageText('ワオーーン！',1.0);await wait(700);
 bossCard={name:boss.name,title:boss.title,t:0,d:2.2};setBgm(G.stage===4?'final':'boss');G.phase='boss';boss.cd=1.4;}
async function phase2(){const b=boss;if(b.id==='gou'){G.phase='pre';projs=[];setBgm('none');sfx('roar');shake(12);
  if(!G.retry)await story(GOU_PH2);else await wait(600);
  flashV=1;sfx('boom');shake(16);b.name='星喰いゴウガ';b.title='凶星に呑まれし王';bossCard={name:b.name,title:b.title,t:0,d:2};setBgm('final');G.phase='boss';b.cd=1;}
 else{say(b,PH2LINE[G.stage],1);sfx('roar');shake(8);b.cd=.8;}}
async function stageWin(){G.phase='win';P.inv=99;setBgm('none');await wait(900);sfx('win');P.dir=1;
 await story(STORY[G.stage].win);
 const sc=Math.round(1000-G.dmg*3-G.time*1.0+G.maxCombo*6);const rank=sc>=850?'S':sc>=700?'A':sc>=500?'B':'C';
 const last=G.stage===4;if(last&&window.tgClear)tgClear('pochi');
 const prog=loadProg();if(!window.tgAutoUsed){prog.open=Math.max(prog.open,Math.min(5,G.stage+2));const old=prog.rank[G.stage];if(!old||'SABC'.indexOf(rank)<'SABC'.indexOf(old))prog.rank[G.stage]=rank;saveProg(prog);}
 setBgm('clear');
 showOv(`<div class="panel"><h2>STAGE CLEAR</h2><p style="color:#c8d4ff;margin:0 0 8px">${STAGES[G.stage].name}　${STAGES[G.stage].sub}</p><div class="row"><span>タイム</span><span>${Math.floor(G.time/60)}分${String(Math.floor(G.time%60)).padStart(2,'0')}秒</span></div><div class="row"><span>被ダメージ</span><span>${Math.round(G.dmg)}</span></div><div class="row"><span>最大コンボ</span><span>${G.maxCombo} HIT</span></div><div class="rank">${rank}</div><p style="font-size:11px;color:#8a9ac8">${window.tgAutoUsed?'（AUTO使用のため記録されません）':''}</p><button class="mbtn" id="nx">${last?'エンディングへ':'次のステージへ'}</button><button class="mbtn" id="ts">ステージセレクト</button></div>`);
 $('nx').onclick=()=>{sfx('click');if(last)ending();else playStage(G.stage+1);};$('ts').onclick=()=>{sfx('click');select();};
 if(window.tgAuto)setTimeout(()=>{if($('nx'))$('nx').click();},1800/SPD());}
function gameOver(){state='over';const inBoss=G.phase==='boss'||!!boss;
 showOv(`<div class="panel"><h2 style="color:#ff8a7a">GAME OVER</h2><p style="color:#c8d4ff;line-height:1.8">「ポチ……！ 立って……！」</p>${inBoss?'<button class="mbtn" id="rb">ボス戦からリトライ</button>':''}<button class="mbtn" id="rs">ステージ最初から</button><button class="mbtn" id="ts">ステージセレクト</button></div>`);
 if(inBoss)$('rb').onclick=()=>{sfx('click');playStage(G.stage,true);};$('rs').onclick=()=>{sfx('click');playStage(G.stage);};$('ts').onclick=()=>{sfx('click');select();};
 if(window.tgAuto)setTimeout(()=>{const b=inBoss?$('rb'):$('rs');if(b)b.click();},1500/SPD());}
async function ending(){hideOv();state='play';setBgm('title');G.phase='win';boss=null;foes=[];await story(ENDING);
 showOv(`<div style="max-width:340px"><div class="ttl" style="font-size:48px">箒星ポチ</div><p style="color:#c8d4ff;line-height:2;margin-top:18px">THE END<br><span style="font-size:12px">THANK YOU FOR PLAYING<br>ザ・ゲーム プレゼンツ</span></p><button class="mbtn" id="tt">タイトルへ</button></div>`,'rgba(6,10,30,.75)');$('tt').onclick=()=>{sfx('click');title();};}
function title(){state='title';G=null;boss=null;P=null;setBgm('title');
 showOv(`<div style="margin-top:22vh;width:100%;max-width:330px"><div class="ttl" style="font-size:50px">箒星ポチ<small style="font-size:13px;letter-spacing:.3em">HOUKIBOSHI POCHI</small></div><div class="sub">柴犬 VS 熊軍団</div><button class="mbtn" id="st" style="margin-top:16px">START</button><p style="font-size:11px;color:#a8b8e0;margin-top:14px;line-height:1.7">左：移動（上に弾くとジャンプ・2段ジャンプ可）<br>かみつき連打で3段コンボ／空中でダイブ<br>ダッシュ中は無敵／★ゲージ満タンで「箒星」</p></div>`,'rgba(6,10,30,.3)');
 $('st').onclick=()=>{sfx('click');sfx('bark');select();};
 if(window.tgAuto)setTimeout(()=>{if(state==='title')playStage(0);},700/SPD());}
function select(){state='select';G=null;P=null;boss=null;setBgm('title');const prog=loadProg();
 const its=STAGES.map((s,i)=>{const open=i<prog.open;return `<button data-i="${i}" ${open?'':'disabled'}><b>${i+1}</b><span>${s.sub}<small>${open?'ボス：'+BOSSDEF[i].name:'？？？'}</small></span><i>${prog.rank[i]||''}</i></button>`;}).join('');
 showOv(`<div style="width:100%;max-width:330px"><h2 style="color:#ffe680;letter-spacing:.2em;margin:0 0 12px">STAGE SELECT</h2><div class="sel">${its}</div><button class="mbtn" id="bk">タイトルへ</button></div>`,'rgba(6,10,30,.6)');
 ov.querySelectorAll('.sel button').forEach(b=>b.onclick=()=>{sfx('click');playStage(+b.dataset.i);});$('bk').onclick=()=>{sfx('click');title();};}
window.addEventListener('tgauto',()=>{if(window.tgAuto){window.tgAutoUsed=true;if(state==='title'||state==='select')playStage(0);if(sLines)nextS(true);}});

/* ================= 起動 ================= */
(function loop(){try{render();}catch(e){console.error(e);}requestAnimationFrame(loop);})();
let last=performance.now();setInterval(()=>{const now=performance.now();const dt=Math.min(.05,(now-last)/1000);last=now;const sp=SPD();for(let k=0;k<sp;k++)step(dt);},16);
title();

</script>

  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-tap-highlight-color:transparent;transform:none}

<script>
/* ---------- 共通の効果音（Web Audioで合成） ---------- */
window.tgSound = (function(){
  var AC = null, noiseBuf = null, on = true, last = {};
  try { on = localStorage.getItem('tg_sound') !== '0'; } catch (e) {}
  function ctx(){
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, dur, type, vol, slide, delay){
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, vol, freq, delay, kind){
    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = 1;
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + .03);
  }
  function arp(fs, step, type, vol, dur){ fs.forEach(function(f, i){ tone(f, dur || .22, type, vol, 0, i * step); }); }
  var LIB = {
    click:  function(){ tone(900, .05, 'square', .03); },
    pick:   function(){ tone(660, .06, 'triangle', .07); tone(990, .08, 'triangle', .06, 0, .05); },
    unpick: function(){ tone(520, .08, 'triangle', .06, .7); },
    tick:   function(){ tone(1500 + Math.random() * 300, .025, 'square', .025); },
    land:   function(){ tone(784, .09, 'square', .05); tone(1175, .18, 'square', .05, 0, .07); },
    start:  function(){ arp([392, 523, 659], .09, 'square', .05, .18); },
    shot:   function(){ tone(1200, .07, 'square', .025, .45); },
    shotFoe:function(){ tone(700, .08, 'square', .02, .5); },
    slash:  function(){ noise(.12, .12, 2600, 0, 'highpass'); tone(500, .1, 'sawtooth', .03, .5); },
    dash:   function(){ noise(.2, .1, 800, 0, 'bandpass'); tone(200, .2, 'sine', .06, 2.2); },
    charge: function(){ tone(200, .7, 'sawtooth', .05, 4); },
    beam:   function(){ noise(.5, .2, 500, 0, 'lowpass'); tone(90, .5, 'sawtooth', .08, .5); },
    hit:    function(){ noise(.09, .14, 900, 0, 'lowpass'); tone(160, .08, 'square', .04, .6); },
    big:    function(){ noise(.3, .22, 400, 0, 'lowpass'); tone(110, .3, 'sawtooth', .07, .5); },
    heal:   function(){ arp([784, 988, 1319], .06, 'sine', .06, .2); },
    miss:   function(){ noise(.15, .06, 3000, 0, 'highpass'); },
    good:   function(){ arp([659, 784, 1047], .08, 'triangle', .07, .25); },
    bad:    function(){ tone(330, .25, 'triangle', .07, .75); tone(247, .35, 'triangle', .06, .8, .18); },
    win:    function(){ arp([523, 659, 784, 1047, 1319], .1, 'square', .045, .28); },
    lose:   function(){ arp([392, 330, 262, 196], .22, 'triangle', .08, .4); },
    splash: function(){ noise(.35, .18, 700, 0, 'lowpass'); noise(.2, .08, 2400, .05, 'bandpass'); },
    bubble: function(){ tone(250 + Math.random() * 250, .07, 'sine', .04, 1.8); },
    slurp:  function(){ noise(.5, .12, 1400, 0, 'bandpass'); noise(.3, .08, 900, .55, 'bandpass'); },
    coin:   function(){ tone(988, .06, 'square', .04); tone(1319, .14, 'square', .04, 0, .06); },
    summon: function(){ tone(130, 1, 'sawtooth', .05, 3); arp([523, 784, 1047, 1568], .12, 'sine', .07, .5); },
    evolve: function(){ arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], .07, 'triangle', .06, .3); },
    fuse:   function(){ tone(110, 1.1, 'sawtooth', .06, 2.5); noise(.9, .1, 300, .2, 'lowpass'); arp([659, 880, 1319], .12, 'sine', .07, .4); }
  };
  function play(name){
    if (!on || !LIB[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < 55) return;
    last[name] = now;
    if (!ctx()) return;
    try { LIB[name](); } catch (e) {}
  }
  var btn = document.querySelector('.tg-snd');
  function sync(){ if (btn) { btn.textContent = on ? '音：ON' : '音：OFF'; btn.setAttribute('aria-pressed', String(on)); } }
  if (btn) {
    ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ btn.addEventListener(t, function(e){ e.stopPropagation(); }); });
    btn.addEventListener('click', function(e){
      e.stopPropagation(); on = !on; sync(); btn.blur();
      try { localStorage.setItem('tg_sound', on ? '1' : '0'); } catch (err) {}
      if (on) { ctx(); play('pick'); }
    });
  }
  sync();
  // ブラウザは最初の操作まで音を出せないので、最初のタップで準備する
  window.addEventListener('pointerdown', function(){ if (on) ctx(); }, { once: true, capture: true });
  return { play: play };
})();
</script>

<style>html,body{overscroll-behavior:none}</style>
<script>
(function(){
  var GAME=!!document.querySelector('.tg-auto');
  var sx=0,sy=0;
  function scroller(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){var s=getComputedStyle(el).overflowY;if((s==='auto'||s==='scroll')&&el.scrollHeight>el.clientHeight)return el;}return null;}
  document.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;
    // 画面端からのスワイプ（戻る・進む）を止める
    if(sx<14||sx>innerWidth-14){e.preventDefault();}},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
})();
</script>
