<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>金獅子 牙王 -GAOH-</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#0a0604;color:#f4e8d0;overflow:hidden;touch-action:none;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;background:radial-gradient(120% 80% at 50% 25%,#2a160a,#0a0604 70%)}
#cv{display:block;flex:none;margin-top:calc(env(safe-area-inset-top) + 48px);border-radius:6px;box-shadow:0 0 0 1px #6a4a1a,0 0 0 4px #1a0e04,0 10px 30px rgba(0,0,0,.8)}
#pad{flex:1;width:100%;max-width:520px;position:relative;min-height:200px}
#stick{position:absolute;left:16px;bottom:calc(20px + env(safe-area-inset-bottom));width:136px;height:136px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,120,.08),rgba(255,210,120,.02) 70%);border:2px solid rgba(255,210,120,.22)}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a6a3a,#3a2610);border:2px solid rgba(255,220,140,.4)}
.btn{position:absolute;border-radius:50%;border:2px solid rgba(255,220,140,.4);color:#fff8e8;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;text-shadow:0 1px 2px #000;box-shadow:0 4px 0 rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.15)}
.btn.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.6);filter:brightness(1.3)}
#bAtk{right:18px;bottom:calc(62px + env(safe-area-inset-bottom));width:88px;height:88px;font-size:17px;background:radial-gradient(circle at 35% 30%,#d84a2a,#6a160a 70%)}
#bJump{right:116px;bottom:calc(18px + env(safe-area-inset-bottom));width:66px;height:66px;background:radial-gradient(circle at 35% 30%,#3a7ad8,#10306a 70%)}
#bGuard{right:122px;bottom:calc(98px + env(safe-area-inset-bottom));width:62px;height:62px;font-size:13px;background:radial-gradient(circle at 35% 30%,#5a8a5a,#1a3a1a 70%)}
#bSp{right:30px;bottom:calc(162px + env(safe-area-inset-bottom));width:66px;height:66px;font-size:13px;background:radial-gradient(circle at 35% 30%,#e8c040,#7a5208 70%);color:#2a1600;text-shadow:none}
#bSp.ready{animation:spr .6s ease-in-out infinite alternate;border-color:#fff3b0}
@keyframes spr{to{box-shadow:0 0 18px #ffd75e,0 4px 0 rgba(0,0,0,.6);filter:brightness(1.25)}}
#ov{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:rgba(6,3,2,.84)}
#ov.hidden{display:none}
.ttl{font-size:54px;font-weight:900;letter-spacing:.04em;line-height:1.05;background:linear-gradient(#fff6c8,#ffd75e 40%,#b8800e 70%,#ffe9a0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a1e00) drop-shadow(0 0 14px rgba(255,190,60,.5))}
.ttl small{display:block;font-size:22px;letter-spacing:.5em;margin-top:6px}
.sub{font-size:12px;letter-spacing:.3em;color:#e8b860;margin-top:10px}
.mbtn{display:block;width:100%;max-width:290px;margin:10px auto 0;padding:13px;border:1px solid #c89a3a;background:linear-gradient(#3a2208,#1a0e04);color:#ffe9a0;font-size:16px;font-weight:900;letter-spacing:.12em;font-family:inherit;border-radius:4px}
.mbtn:disabled{opacity:.35}
.mbtn small{display:block;font-size:11px;letter-spacing:.05em;color:#c8a870;font-weight:bold;margin-top:2px}
.panel{width:100%;max-width:340px;border:1px solid #a87a2a;background:linear-gradient(#2a1808,#120a04);padding:16px;border-radius:6px;box-shadow:0 0 30px rgba(255,180,60,.15)}
.panel h2{margin:0 0 10px;font-size:24px;letter-spacing:.15em;color:#ffd75e}
.panel .row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px dashed #5a3a14}
.rank{font-size:56px;font-weight:900;color:#ffd75e;text-shadow:0 0 16px rgba(255,200,60,.6);margin:8px 0 0}
#story{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:center;padding:0 8px calc(12px + env(safe-area-inset-bottom))}
#story.hidden{display:none}
.sbox{width:100%;max-width:500px;background:linear-gradient(#1e1006,#0c0603);border:2px solid #a87a2a;border-radius:8px;padding:12px 14px 22px;position:relative;box-shadow:0 0 24px rgba(0,0,0,.8)}
.sname{display:inline-block;padding:2px 12px;border-radius:3px;font-weight:900;font-size:13px;color:#1a0e04;margin-bottom:6px}
.stext{font-size:16px;line-height:1.7;min-height:54px;white-space:pre-wrap}
.stext.nar{color:#e8c890;font-style:italic}
.snext{position:absolute;right:14px;bottom:6px;font-size:11px;color:#c8a060;animation:bl 1s infinite}
.sskip{position:absolute;right:8px;top:-34px;padding:5px 12px;border:1px solid #a87a2a;background:rgba(0,0,0,.6);color:#ffd75e;font-size:12px;border-radius:14px;font-family:inherit}
@keyframes bl{50%{opacity:.2}}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#0a0604;align-items:center;justify-content:center}
@media (orientation:landscape) and (max-height:500px){#rot{display:flex}}
.sel{display:grid;grid-template-columns:1fr;gap:8px;width:100%;max-width:320px}
.sel button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #a87a2a;background:linear-gradient(#2e1a08,#140a04);color:#ffe9a0;font-family:inherit;border-radius:5px;text-align:left}
.sel button:disabled{opacity:.35}
.sel b{font-size:22px;color:#ffd75e;min-width:28px}
.sel span{font-size:14px;font-weight:900;line-height:1.3}
.sel small{display:block;font-size:11px;color:#c8a870;font-weight:bold}
.sel i{margin-left:auto;font-style:normal;font-weight:900;font-size:20px;color:#ffd75e}
</style>

<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="pad">
    <div id="stick"><div id="knob"></div></div>
    <div class="btn" id="bSp">必殺</div>
    <div class="btn" id="bGuard">ガード</div>
    <div class="btn" id="bAtk">攻撃</div>
    <div class="btn" id="bJump">ジャンプ</div>
  </div>
</div>
<div id="ov" class="hidden"></div>
<div id="story" class="hidden"><div class="sbox" id="sbox"><button class="sskip" id="sskip">スキップ ▶▶</button><div class="sname" id="sname"></div><div class="stext" id="stext"></div><div class="snext">▼ タップ</div></div></div>
<div id="rot">縦向きで遊んでね</div>
<script>
'use strict';
/* ================= 基本 ================= */
const VW=400,VH=300,GY=262,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');const DPR=Math.min(window.devicePixelRatio||1,2.5);let SC=1;
function resize(){const aw=Math.min(innerWidth,560)-8,ah=innerHeight-48-215;SC=Math.max(.5,Math.min(aw/VW,ah/VH));cv.style.width=Math.round(VW*SC)+'px';cv.style.height=Math.round(VH*SC)+'px';cv.width=Math.round(VW*SC*DPR);cv.height=Math.round(VH*SC*DPR);}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,pick=a=>a[Math.floor(Math.random()*a.length)];
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
const SPD=()=>window.__speed||1;
const wait=ms=>new Promise(r=>setTimeout(r,ms/SPD()));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ================= 音 ================= */
let AC=null,NB=null,MG=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.85;MG.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function sndOn(){try{return localStorage.getItem('tg_sound')!=='0';}catch(e){return true;}}
function nbuf(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;}
function tone(f,dur,type,vol,f2,delay,at){const t=(at||AC.currentTime)+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol,freq,type,delay,f2,at){const t=(at||AC.currentTime)+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf();f.type=type||'lowpass';f.frequency.setValueAtTime(freq,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}
const SFX={
 whiff(){noise(.1,.08,2500,'bandpass',0,900);},
 punch(){noise(.09,.3,900,'lowpass',0,200);tone(120,.08,'sine',.2,.5);},
 kick(){noise(.14,.35,700,'lowpass',0,120);tone(90,.12,'sine',.25,.5);},
 slash(){noise(.16,.18,4000,'bandpass',0,1200);tone(1400,.12,'sawtooth',.03,.4);},
 slashhit(){noise(.2,.35,2400,'bandpass',0,400);tone(180,.15,'square',.08,.4);tone(2200,.08,'sine',.05,.6);},
 bighit(){noise(.35,.45,1200,'lowpass',0,80);tone(70,.3,'sine',.35,.5);},
 guard(){tone(1800,.08,'square',.06,.7);noise(.08,.15,3000,'highpass');},
 jump(){tone(300,.12,'sine',.06,2);},
 land(){noise(.08,.12,300,'lowpass');},
 hurt(){tone(220,.2,'sawtooth',.1,.5);noise(.12,.2,800,'lowpass');},
 down(){noise(.3,.3,250,'lowpass',0,60);},
 poof(){noise(.35,.2,1600,'bandpass',0,200);tone(600,.25,'sine',.04,.3);},
 gii(){tone(900,.14,'sawtooth',.04,1.3);tone(1100,.1,'sawtooth',.03,.9,.12);},
 charge(){tone(200,1.2,'sawtooth',.06,8);noise(1.2,.1,800,'bandpass',0,4000);},
 flash(){noise(.6,.35,5000,'highpass');tone(2400,.6,'sine',.08,.5);},
 roar(){noise(1.1,.4,500,'lowpass',0,120);tone(90,1,'sawtooth',.16,.6);tone(140,.9,'sawtooth',.1,.5,.05);},
 belt(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'square',.05,0,i*.07));},
 henshin(){[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.5,'triangle',.07,0,i*.06));noise(.8,.2,3000,'bandpass',0,600);},
 special(){noise(1.2,.5,800,'lowpass',0,80);tone(110,1.1,'sawtooth',.2,.4);tone(660,.6,'square',.05,2,.1);},
 spit(){noise(.25,.15,1500,'bandpass',0,400);},
 web(){noise(.3,.12,3000,'highpass',0,800);},
 sonic(){tone(2400,.4,'sine',.06,.4);tone(1800,.4,'sine',.05,.5,.05);},
 screech(){tone(1800,.5,'sawtooth',.06,1.6);tone(2600,.4,'square',.03,.6,.1);},
 scythe(){noise(.12,.2,6000,'highpass',0,1500);tone(2800,.1,'sawtooth',.03,.4);},
 orb(){tone(150,.5,'sine',.12,2.5);},
 thunder(){noise(.7,.5,3000,'lowpass',0,100);tone(60,.6,'square',.15,.5);},
 hiss(){noise(.5,.15,4000,'highpass',0,1500);},
 counter(){tone(3000,.1,'square',.06);tone(1500,.25,'square',.06,0,.08);},
 boom(){noise(1.2,.55,700,'lowpass',0,50);tone(55,.9,'sine',.35,.4);},
 win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.4,'triangle',.08,0,i*.12));},
 lose(){[392,349,311,262].forEach((f,i)=>tone(f,.45,'triangle',.08,0,i*.22));},
 click(){tone(880,.05,'triangle',.06);},
 type(){tone(1800,.015,'square',.012);},
 heal(){[660,880].forEach((f,i)=>tone(f,.2,'sine',.05,0,i*.08));},
};
const sfxLast={};
function sfx(n,gap){if(!sndOn()||!ac())return;const now=performance.now();if(gap&&sfxLast[n]&&now-sfxLast[n]<gap)return;sfxLast[n]=now;try{SFX[n]();}catch(e){}}
addEventListener('pointerdown',()=>{if(sndOn())ac();},{capture:true});
/* BGM */
const BGM={mode:'none',next:0,beat:0};
function setBgm(m){if(BGM.mode!==m){BGM.mode=m;BGM.beat=0;}}
const BG={
 title:{bpm:80,f(b,t){const C=[[110,164.8,220],[98,146.8,196],[87.3,130.8,174.6],[98,146.8,196]];if(b%16===0)for(const f of C[(b>>4)%4])tone(f,4,'triangle',.022,0,0,t);if(b%4===0)tone(C[(b>>4)%4][0]/2,.8,'sine',.06,0,0,t);if(b%8===4)noise(.3,.05,200,'lowpass',0,0,t);const m=[440,0,523,494,440,0,392,0];if(b%2===0&&b%32>=16&&m[(b>>1)%8])tone(m[(b>>1)%8],.45,'square',.014,0,0,t);}},
 battle:{bpm:156,f(b,t){const B=[82.4,82.4,98,82.4,110,82.4,123.5,110];tone(B[b%8],.12,'sawtooth',.05,0,0,t);if(b%4===0)noise(.12,.12,140,'lowpass',0,0,t);if(b%4===2)noise(.1,.09,1800,'bandpass',0,0,t);noise(.02,.02,8000,'highpass',0,0,t);const m=[330,0,392,330,440,0,494,440];if(b%32>=16&&m[b%8])tone(m[b%8],.12,'square',.016,0,0,t);}},
 boss:{bpm:148,f(b,t){const B=[73.4,73.4,77.8,73.4,87.3,73.4,103.8,98];tone(B[b%8],.14,'sawtooth',.055,0,0,t);if(b%2===0)noise(.12,.11,130,'lowpass',0,0,t);if(b%4===2)noise(.12,.1,1600,'bandpass',0,0,t);if(b%16===0)for(const f of [293.7,349.2,415.3])tone(f,1.4,'square',.012,0,0,t);if(b%16===8)for(const f of [277.2,329.6,415.3])tone(f,1.4,'square',.012,0,0,t);}},
 hero:{bpm:150,f(b,t){const B=[110,110,130.8,110,146.8,110,164.8,146.8];tone(B[b%8],.13,'sawtooth',.05,0,0,t);if(b%4===0)noise(.12,.12,140,'lowpass',0,0,t);if(b%4===2)noise(.1,.09,1800,'bandpass',0,0,t);const m=[659,659,784,659,880,784,659,587,523,587,659,0,659,784,880,988];if(b%2===0&&m[(b>>1)%16])tone(m[(b>>1)%16],.22,'square',.02,0,0,t);}},
 clear:{bpm:120,f(b,t){if(b%8===0)for(const f of [261.6,329.6,392])tone(f,2,'triangle',.02,0,0,t);if(b%2===0)tone([523,659,784,659][(b>>1)%4],.2,'sine',.02,0,0,t);}},
};
setInterval(()=>{if(!AC||!sndOn()||!BG[BGM.mode])return;const m=BG[BGM.mode],sp=60/m.bpm/2,now=AC.currentTime;if(BGM.next<now)BGM.next=now+.05;let n=0;while(BGM.next<now+.25&&n<8){try{m.f(BGM.beat,BGM.next);}catch(e){}BGM.next+=sp;BGM.beat++;n++;}},60);

/* ================= 入力 ================= */
const hum={sx:0,sy:0,atkQ:false,jumpQ:false,spQ:false,guard:false,upLatch:false};
const stick=$('stick'),knob=$('knob');let stickId=null;
function stickSet(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),R=r.width/2;if(m>R){dx*=R/m;dy*=R/m;}hum.sx=dx/R;hum.sy=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`;if(hum.sy<-.65&&!hum.upLatch){hum.upLatch=true;hum.jumpQ=true;}if(hum.sy>-.4)hum.upLatch=false;}
function stickOff(){stickId=null;hum.sx=hum.sy=0;hum.upLatch=false;knob.style.transform='';}
$('pad').addEventListener('pointerdown',e=>{if(e.target.closest('.btn'))return;const r=$('pad').getBoundingClientRect();if(e.clientX-r.left<r.width*.5&&stickId===null){stickId=e.pointerId;stickSet(e);}});
addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickSet(e);});
addEventListener('pointerup',e=>{if(e.pointerId===stickId)stickOff();});
addEventListener('pointercancel',e=>{if(e.pointerId===stickId)stickOff();});
function bindBtn(id,down,up){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}b.classList.add('on');down();});const off=()=>{b.classList.remove('on');up&&up();};b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);}
bindBtn('bAtk',()=>{hum.atkQ=true;});bindBtn('bJump',()=>{hum.jumpQ=true;});bindBtn('bSp',()=>{hum.spQ=true;});bindBtn('bGuard',()=>{hum.guard=true;},()=>{hum.guard=false;});
const keys={};
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.key]=true;if(e.key==='j'||e.key==='z')hum.atkQ=true;if(e.key==='k'||e.key==='x'||e.key===' '||e.key==='ArrowUp'||e.key==='w')hum.jumpQ=true;if(e.key==='i'||e.key==='c')hum.spQ=true;});
addEventListener('keyup',e=>{keys[e.key]=false;});
function humanInput(){let mx=hum.sx;if(Math.abs(mx)<.2)mx=0;if(keys.ArrowLeft||keys.a)mx=-1;if(keys.ArrowRight||keys.d)mx=1;
 const I={mx,atk:hum.atkQ,jump:hum.jumpQ,sp:hum.spQ,guard:hum.guard||keys.l||keys.s||keys.ArrowDown};hum.atkQ=hum.jumpQ=hum.spQ=false;return I;}

/* ================= 骨格リグ ================= */
// 角度は「真下=0、前方水平=+PI/2、真上=PI」の絶対角
const P0={lean:.08,fh:.24,fs:.06,bh:-.26,bs:-.12,fu:.9,ff:2.3,bu:.6,bf:2.55,ht:0,sw:2.5,lift:0};
function mixP(a,b,k){const o={};for(const key in P0)o[key]=lerp(a[key]??P0[key],b[key]??P0[key],k);return o;}
function PS(o){return Object.assign({},P0,o);}
const curve=(k,a,b)=>k<a?ease(k/a):k<b?1:1-ease((k-b)/(1-b));
function walkP(base,ph,amp){const s=Math.sin(ph),c=Math.cos(ph);const o=Object.assign({},base);
 o.fh=s*.55*amp+.05;o.fs=o.fh-.15-Math.max(0,c)*.7*amp;o.bh=-s*.55*amp+.05;o.bs=o.bh-.15-Math.max(0,-c)*.7*amp;o.lift=Math.abs(s)*1.5;return o;}
function joints(p){const th=15,sh=15,bd=24,ua=12,fa=12;
 const lv=(a,b)=>th*Math.cos(a)+sh*Math.cos(b);const hipH=Math.max(lv(p.fh,p.fs),lv(p.bh,p.bs));
 const hip={x:0,y:-hipH-p.lift};
 const kF={x:hip.x+Math.sin(p.fh)*th,y:hip.y+Math.cos(p.fh)*th},fF={x:kF.x+Math.sin(p.fs)*sh,y:kF.y+Math.cos(p.fs)*sh};
 const kB={x:hip.x+Math.sin(p.bh)*th,y:hip.y+Math.cos(p.bh)*th},fB={x:kB.x+Math.sin(p.bs)*sh,y:kB.y+Math.cos(p.bs)*sh};
 const neck={x:hip.x+Math.sin(p.lean)*bd,y:hip.y-Math.cos(p.lean)*bd};
 const sh_={x:neck.x-Math.sin(p.lean)*3,y:neck.y+Math.cos(p.lean)*3};
 const eF={x:sh_.x+Math.sin(p.fu)*ua,y:sh_.y+Math.cos(p.fu)*ua},hF={x:eF.x+Math.sin(p.ff)*fa,y:eF.y+Math.cos(p.ff)*fa};
 const eB={x:sh_.x+Math.sin(p.bu)*ua,y:sh_.y+Math.cos(p.bu)*ua},hB={x:eB.x+Math.sin(p.bf)*fa,y:eB.y+Math.cos(p.bf)*fa};
 const head={x:neck.x+Math.sin(p.lean+p.ht)*9,y:neck.y-Math.cos(p.lean+p.ht)*9};

const FOE={grunt:{hp:26,dmg:6,reach:34,wind:.42,spd:78},knife:{hp:26,dmg:9,reach:40,wind:.36,spd:88},gunner:{hp:22,dmg:8,reach:0,wind:.5,spd:70},heavy:{hp:64,dmg:14,reach:44,wind:.6,spd:55,scale:1.22},spiderling:{hp:12,dmg:5,reach:26,wind:.3,spd:120}};

/* ================= 状態 ================= */
let items=[],state='title',G=null,P=null,foes=[],projs=[],pprojs=[],fx=[],bolts=[],boss=null,CAM={x:0},LOCK={l:0,r:W},hitstop=0,shk=0,flashW=0,flashR=0,H=null,bossCard=null,stageCard=null,gameT=0;
function shake(v){shk=Math.max(shk,v);}
function numFx(x,y,s,c){fx.push({t:'num',x,y,s:String(s),c,life:.8,vy:40});}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(60,240);fx.push({t:'dot',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v+60,c,life:rnd(.25,.6),r:rnd(1.5,3)});}}
function sparks(x,y,c,dir){for(let i=0;i<7;i++){const a=rnd(-1,1)+(dir>0?0:Math.PI),v=rnd(150,360);fx.push({t:'line',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c,life:rnd(.12,.25)});}fx.push({t:'ring',x,y,c,life:.25,r:6});}
function loadProg(){try{return JSON.parse(localStorage.getItem('gaoh_prog')||'{"open":1,"rank":{}}');}catch(e){return {open:1,rank:{}};}}

/* ================= プレイヤー ================= */
function mkPlayer(){return {kind:'hero',form:'human',x:70,y:0,vx:0,vy:0,dir:1,hp:100,max:100,sp:0,inv:0,hurtT:0,down:0,atk:null,queue:false,guard:0,bound:0,grabbed:false,webbed:false,poison:0,walk:0,scarf:[],combo:0,comboT:0,special:null,dead:false,pose:P0};}
function startAtk(def){P.atk={def,t:0,hit:new Set()};P.queue=false;sfx('whiff');if(P.form==='gaoh')sfx('slash');}
function startSpecial(){P.sp=0;P.atk=null;P.guard=0;P.vx=0;if(P.form==='gaoh'){P.special={kind:'shishi',t:0};sfx('charge');}else{P.special={kind:'roar',t:0};sfx('charge');}}
function pUpdate(dt,I){P.inv=Math.max(0,P.inv-dt);P.comboT-=dt;if(P.comboT<=0)P.combo=0;
 const sc={x:P.x-P.dir*4,y:P.y+58};P.scarf.unshift(sc);if(P.scarf.length>8)P.scarf.pop();
 const phys=(fr)=>{P.vy-=1500*dt;P.x+=P.vx*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0;P.vx*=Math.pow(fr,dt*60);}P.x=clamp(P.x,LOCK.l+12,LOCK.r-12);};
 if(P.dead){phys(.85);return;}
 if(P.poison>0){P.poison-=dt;P.hp=Math.max(1,P.hp-3*dt);if(Math.random()<dt*6)fx.push({t:'dot',x:P.x+rnd(-8,8),y:P.y+rnd(20,60),vx:0,vy:30,c:'#8aff4a',life:.5,r:2});}
 if(P.bound>0){P.bound-=dt;if(I.atk){P.bound-=.22;sfx('whiff');}if(P.bound<=0){P.webbed=false;P.inv=.6;}P.atk=null;phys(.8);return;}
 if(P.down>0){phys(.88);if(P.y<=0)P.down-=dt;if(P.down<=0)P.inv=Math.max(P.inv,.8);return;}
 if(P.hurtT>0){P.hurtT-=dt;phys(.8);return;}
 const ground=P.y<=0;
 if(P.special){const s=P.special;s.t+=dt;P.vx=0;
  if(s.kind==='roar'&&s.t>.22&&!s.done){s.done=1;sfx('roar');shake(8);fx.push({t:'lion',x:P.x+P.dir*40,y:50,dir:P.dir,life:.6,s:.8});
   for(const f of foes)if(f.st!=='dead'&&!f.flee&&(f.x-P.x)*P.dir>-10&&(f.x-P.x)*P.dir<140)hitFoe(f,45,280,200);if(boss&&(boss.x-P.x)*P.dir>-10&&(boss.x-P.x)*P.dir<150)bossHit(45,200,true);}
  if(s.kind==='shishi'&&s.t>.6&&!s.done){s.done=1;sfx('special');shake(12);flashW=.45;pprojs.push({x:P.x+P.dir*30,y:44,vx:P.dir*560,dir:P.dir,dmg:150,hit:new Set(),life:1.4});stageText('獅子王斬！',1.2);}
  if(s.t>(s.kind==='shishi'?1.1:.6))P.special=null;phys(.8);return;}
 if(I.mx)P.dir=I.mx>0?1:-1;
 if(I.sp&&P.sp>=100&&ground&&!P.atk){startSpecial();return;}
 P.guard=I.guard&&ground&&!P.atk?1:0;
 if(I.atk){if(!P.atk)startAtk(ground?(P.form==='gaoh'?GAO:HUM)[0]:(P.form==='gaoh'?GAO_AIR:HUM_AIR));else if(P.atk.t>P.atk.def.t0)P.queue=true;}
 if(P.atk){const a=P.atk,d=a.def;a.t+=dt;if(!d.air){P.vx=a.t<d.t1?P.dir*(d.hv?90:40):0;}
  if(a.t>=d.t0&&a.t<=d.t1)atkCheck(a);
  if(a.t>=d.t2){const set=P.form==='gaoh'?GAO:HUM;const idx=set.indexOf(d);if(P.queue&&idx>=0&&idx<2&&ground)startAtk(set[idx+1]);else P.atk=null;}}
 else if(P.guard){P.vx=0;}
 else{const spd=P.form==='gaoh'?150:138;P.vx=I.mx*spd;if(I.jump&&ground){P.vy=P.form==='gaoh'?580:540;sfx('jump');}}
 const wasAir=P.y>0;phys(.75);if(wasAir&&P.y<=0){sfx('land');if(P.atk&&P.atk.def.air)P.atk=null;}
 if(Math.abs(P.vx)>5&&P.y<=0)P.walk+=dt*Math.abs(P.vx)*.09;}
function atkCheck(a){const d=a.def;const targets=foes.filter(f=>f.st!=='dead'&&!f.flee);
 for(const f of targets){if(a.hit.has(f))continue;const dx=(f.x-P.x)*P.dir;const h=70*(f.scale||1);if(dx>-10&&dx<d.r+10&&P.y-5<f.y+h&&P.y+80>f.y){a.hit.add(f);hitFoe(f,d.dmg*(P.form==='gaoh'?1:1),d.kb,d.up);}}
 if(boss&&!a.hit.has(boss)){const b=boss;const dx=(b.x-P.x)*P.dir;if(dx>-14&&dx<d.r+b.w/2&&P.y-5<b.y+b.h&&P.y+85>b.y){a.hit.add(boss);if(bossHit(d.dmg,d.kb)){hitFx(b.x-P.dir*b.w*.3,P.y+44,d);}}}}
function hitFx(x,y,d){const gold=P.form==='gaoh';sparks(x,y,gold?'#ffe08a':'#fff',P.dir);if(gold)fx.push({t:'slash',x,y,dir:P.dir,life:.18,big:d.hv});sfx(gold?'slashhit':d.hv?'kick':'punch');hitstop=Math.max(hitstop,d.hv?.09:.05);if(d.hv)shake(5);P.combo++;P.comboT=1.6;G.maxCombo=Math.max(G.maxCombo,P.combo);P.sp=Math.min(100,P.sp+(gold?4:6));}
function hurtP(dmg,sx,knock,o){o=o||{};if(state!=='play'||P.dead||!G||G.phase==='win')return false;if(P.inv>0&&!o.noInv)return false;if(P.special&&P.special.t<.9)return false;
 const from=Math.sign(sx-P.x)||P.dir;
 if(P.guard&&from===P.dir&&!o.unblock){const d=dmg*.15;P.hp-=d;G.dmg+=d;if(!o.cont){sfx('guard',60);sparks(P.x+P.dir*14,P.y+46,'#8ad8ff',P.dir);P.vx=-from*90;}P.sp=Math.min(100,P.sp+(o.cont?.1:3));if(P.hp<=0)pDie();return true;}
 if(o.bind){P.bound=o.bind;P.webbed=true;P.atk=null;}if(o.poison)P.poison=o.poison;
 P.hp-=dmg;G.dmg+=dmg;P.atk=null;P.special=null;
 if(!o.cont){sfx('hurt');shake(4);flashR=.35;numFx(P.x,P.y+80,Math.round(dmg),'#ff6a5a');}
 if(knock&&!o.cont&&!o.bind){P.down=.9;P.vy=280;P.vx=-from*190;P.inv=1.5;sfx('down');}else if(!o.noInv&&!o.cont&&!o.bind){P.hurtT=.28;P.vx=-from*70;P.inv=.45;}
 P.sp=Math.min(100,P.sp+dmg*.6);if(P.hp<=0)pDie();return true;}
function pDie(){if(P.dead)return;P.hp=0;P.dead=true;P.down=99;P.vy=300;P.vx=-P.dir*150;sfx('lose');setBgm('none');setTimeout(()=>{if(P.dead&&state==='play')gameOver();},1600/SPD());}
function heroPose(t){const gold=P.form==='gaoh';P.lie=0;
 if(P.dead||P.down>0){P.lie=P.y>0?.6:1;return P0;}
 if(P.bound>0)return PS({lean:0,fu:.15,ff:.05,bu:-.15,bf:-.05,fh:.08,fs:.02,bh:-.08,bs:-.02,sw:.4});
 if(P.special){const k=P.special.t;if(P.special.kind==='shishi'){if(k<.6)return PS({fu:3.0,ff:3.1,sw:3.14,bu:2.8,bf:3.0,lean:-.05,fh:.45,bh:-.45});return mixP(PS({fu:3,ff:3.1,sw:3.14}),PS({fu:1.0,ff:.8,sw:.6,lean:.35,fh:.6,fs:.2,bh:-.5,bs:-.6}),ease((k-.6)/.15));}
  return k<.2?PS({fu:.4,ff:-.4,bu:.6,bf:2.4,lean:-.1}):PS({fu:1.57,ff:1.57,bu:.3,bf:2.6,lean:.3,fh:.6,bh:-.6});}
 if(P.hurtT>0)return PS({lean:-.4,fu:2.4,ff:2.0,bu:1.8,bf:1.4,sw:1.2});
 if(P.atk){const a=P.atk,d=a.def,k=clamp(a.t/d.t2,0,1),c=curve(k,.35,.6);
  switch(d.n){
   case 'jab':return mixP(P0,PS({fu:1.55,ff:1.55,lean:.15}),c);
   case 'straight':return mixP(P0,PS({bu:1.55,bf:1.5,fu:.4,ff:2.2,lean:.3,fh:.4,bh:-.45}),c);
   case 'kick':return mixP(P0,PS({fh:1.65,fs:1.6,bh:-.1,bs:-.1,lean:-.3,fu:2.2,ff:2.6,bu:-.4,bf:.2}),c);
   case 'airkick':return PS({fh:1.35,fs:1.5,bh:.6,bs:-.9,lean:-.2,fu:2.4,ff:2.8,bu:-.5,bf:.1});
   case 'slash1':{const w=ease(k/.28),s=ease((k-.28)/.25);if(k<.28)return mixP(PS({fu:.55,ff:1.25,sw:2.3}),PS({fu:2.8,ff:3.1,sw:3.6,lean:-.1}),w);return mixP(PS({fu:2.8,ff:3.1,sw:3.6,lean:-.1}),PS({fu:1.1,ff:.7,sw:.35,lean:.35,fh:.5,bh:-.5}),s);}
   case 'slash2':{const s=ease((k-.2)/.3);return mixP(PS({fu:.5,ff:.3,sw:.1,lean:.3,fh:.5,bh:-.5}),PS({fu:2.6,ff:2.8,sw:3.05,lean:-.1}),s);}
   case 'slash3':{if(k<.3)return mixP(PS({fu:2.6,ff:2.8,sw:3.05}),PS({fu:-.6,ff:-.4,sw:-.9,lean:-.2,bu:1.2,bf:1.6}),ease(k/.3));return mixP(PS({fu:-.6,ff:-.4,sw:-.9,lean:-.2}),PS({fu:1.6,ff:1.57,sw:1.57,lean:.45,fh:.75,fs:.2,bh:-.6,bs:-.7}),ease((k-.3)/.2));}
   case 'plunge':return PS({fu:1.2,ff:.5,sw:.2,lean:.4,fh:1.1,fs:.2,bh:.4,bs:-.8});}}
 if(P.guard)return gold?PS({fu:.35,ff:1.3,sw:3.1,bu:.5,bf:2.2,lean:.02,fh:.35,bh:-.35}):PS({fu:.5,ff:2.95,bu:.35,bf:2.9,lean:.02,fh:.35,bh:-.35});
 const base=gold?PS({fu:.55,ff:1.25,sw:2.3,bu:.7,bf:2.2,lean:.1}):P0;
 if(P.y>0)return Object.assign({},base,{fh:1.0,fs:.1,bh:-.1,bs:-.9,lean:.05});
 if(Math.abs(P.vx)>5)return walkP(base,P.walk,1);
 const br=Math.sin(t*3)*.05;return Object.assign({},base,{fu:base.fu+br,bu:base.bu+br});}

/* ================= 戦闘員 ================= */
function mkFoe(type,x){const D=FOE[type],sm=1+G.stage*.16;return {kind:'foe',type,x,y:0,vx:0,vy:0,dir:x<P.x?1:-1,hp:D.hp*sm,max:D.hp*sm,st:'idle',t:0,cd:rnd(.6,1.4),walk:rnd(0,6),hurtT:0,downT:0,scale:D.scale||1,D,dmgM:1+G.stage*.08,id:Math.random()};}
function hitFoe(f,dmg,kb,up){if(f.st==='dead')return;f.hp-=dmg;numFx(f.x,f.y+70*(f.scale||1),Math.round(dmg),'#fff');
 const armor=f.type==='heavy'&&f.st==='wind'&&!up;if(!armor){f.hurtT=.28;f.vx=P.dir*kb*(f.type==='heavy'?.5:1);if(f.st==='wind'||f.st==='atk')f.st='idle';}
 if(up&&f.type!=='heavy'){f.vy=up;f.st='down';f.downT=.6;}
 hitFx(f.x-P.dir*8,P.y+44,{hv:!!up});
 if(f.hp<=0){f.st='dead';f.t=0;f.vy=240;f.vx=P.dir*220;G.kills++;sfx('gii',120);if(f.type!=='spiderling')killPop(f);if(Math.random()<(f.type==='heavy'?.6:.14))items.push({x:f.x,y:30,vy:200,life:12});}}
function killPop(f){setTimeout(()=>{sfx('poof',100);burst(f.x,f.y+30,'#9affc8',10);fx.push({t:'smoke',x:f.x,y:f.y+30,r:10,life:.7});},350/SPD());}
function foeUpdate(f,dt){f.t+=dt;f.vy-=1300*dt;f.y+=f.vy*dt;f.x+=f.vx*dt;if(f.y<=0){f.y=0;f.vy=0;f.vx*=Math.pow(.82,dt*60);}
 if(f.st==='dead'){if(f.t>.7)f.gone=1;return;}
 if(f.st==='down'){if(f.y<=0){f.downT-=dt;if(f.downT<=0){f.st='idle';f.cd=rnd(.5,1);}}return;}
 if(f.hurtT>0){f.hurtT-=dt;return;}
 if(f.flee){f.dir=f.fleeDir;f.x+=f.dir*170*dt;f.walk+=dt*12;if(f.x<CAM.x-60||f.x>CAM.x+VW+60)f.gone=1;return;}
 if(state!=='play'||G.phase!=='grunt'&&G.phase!=='boss')return;
 const D=f.D,dx=P.x-f.x,ad=Math.abs(dx);
 if(f.st==='wind'){if(f.t>=D.wind*(f.type==='spiderling'?1:1)){f.st='atk';f.t=0;
   if(f.type==='gunner'){projs.push({x:f.x+f.dir*20,y:48,vx:f.dir*300,vy:0,g:0,r:4,dmg:D.dmg*f.dmgM,kind:'bullet',life:2});sfx('punch');}
   else if(f.type==='spiderling'){f.vy=320;f.vx=f.dir*200;}
   else{sfx('whiff');if(ad<D.reach+12&&dx*f.dir>0&&P.y<55)hurtP(D.dmg*f.dmgM,f.x,f.type==='heavy');}}return;}
 if(f.st==='atk'){if(f.type==='spiderling'&&!f.bit&&Math.abs(P.x-f.x)<20&&Math.abs(P.y-f.y)<30){f.bit=1;hurtP(D.dmg,f.x,false);}if(f.t>(f.type==='spiderling'?.6:.3)){f.st='idle';f.bit=0;f.cd=rnd(.9,1.7);}return;}
 f.dir=dx>0?1:-1;f.cd-=dt;
 const want=f.type==='gunner'?170:D.reach-4;let mv=0;
 if(ad>want+8)mv=f.dir;else if(f.type==='gunner'&&ad<want-40)mv=-f.dir;
 for(const o of foes){if(o!==f&&o.st!=='dead'&&!o.flee&&Math.abs(o.x-f.x)<20&&Math.sign(P.x-o.x)===f.dir&&Math.abs(P.x-o.x)<ad){mv=0;if(f.type!=='gunner'&&ad<120)f.x-=f.dir*20*dt;}}
 if(mv){f.x+=mv*D.spd*dt;f.walk+=dt*9;}
 const attackers=foes.filter(o=>o.st==='wind'||o.st==='atk').length;
 if(f.cd<=0&&attackers<2&&(f.type==='gunner'?ad<280:ad<=want+10)&&P.dead===false){f.st='wind';f.t=0;if(Math.random()<.4)f.shout=.6;}}
function foePose(f,t){const D=f.D;if(f.st==='dead'||f.st==='down'){f.lie=f.y>4?.6:1;return P0;}f.lie=0;
 if(f.hurtT>0)return PS({lean:-.4,fu:2.2,ff:1.8,bu:1.6,bf:1.2});
 if(f.st==='wind'){const k=f.t/D.wind;return PS({lean:-.15,fu:-.4-k*.4,ff:.4,bu:.8,bf:2.4,fh:.4,bh:-.4});}
 if(f.st==='atk')return f.type==='heavy'?PS({lean:.5,fu:2.2,ff:1.2,bu:2.0,bf:1.0,fh:.6,bh:-.5}):PS({lean:.3,fu:1.57,ff:1.57,bu:.4,bf:2.4,fh:.5,bh:-.5});
 const base=f.type==='gunner'?PS({fu:1.4,ff:1.57}):PS({fu:1.1,ff:2.0,bu:.8,bf:2.2,lean:.15});
 return Math.abs(f.vx)>10||f.walkFlag?walkP(base,f.walk,1):walkP(base,f.walk,.9);}
function drawSpiderling(g,f,t){g.save();g.translate(f.sx,f.sy);g.scale(f.dir,1);const w=Math.sin(t*20+f.id*9);g.strokeStyle='#1a0a14';g.lineWidth=2;for(let i=0;i<4;i++){const x=-6+i*4;g.beginPath();g.moveTo(x,-8);g.lineTo(x-6,-14+w*(i%2?2:-2));g.lineTo(x-9,0);g.moveTo(x,-8);g.lineTo(x+6,-14-w*(i%2?2:-2));g.lineTo(x+9,0);g.stroke();}
 g.fillStyle='#2a1424';g.beginPath();g.ellipse(-4,-9,8,6,0,0,TAU);g.fill();g.fillStyle='#3a1a30';g.beginPath();g.ellipse(5,-9,5,4,0,0,TAU);g.fill();g.fillStyle='#ff2a2a';g.beginPath();g.arc(8,-10,1,0,TAU);g.arc(6,-11,1,0,TAU);g.fill();g.fillStyle='#c81a1a';g.fillRect(-6,-12,3,2);g.restore();}

/* ================= 背景 ================= */
function drawBG(g,id,cx,t){
 if(id==='lab'){const bg=g.createLinearGradient(0,0,0,GY);bg.addColorStop(0,'#081a1c');bg.addColorStop(1,'#123236');g.fillStyle=bg;g.fillRect(0,0,VW,GY);
  for(let i=-1;i<10;i++){const x=i*150-(cx*.5)%150;g.fillStyle='#0a2224';g.fillRect(x+10,30,90,200);const lg=g.createLinearGradient(0,50,0,210);lg.addColorStop(0,'rgba(80,255,170,.35)');lg.addColorStop(1,'rgba(20,120,90,.5)');g.fillStyle=lg;g.fillRect(x+18,46,74,170);
   g.fillStyle='rgba(0,30,20,.55)';g.beginPath();g.ellipse(x+55,120,14,20,0,0,TAU);g.fill();g.beginPath();g.arc(x+55,92,9,0,TAU);g.fill();g.fillRect(x+50,138,4,40);g.fillRect(x+57,138,4,40);
   g.fillStyle='rgba(200,255,220,.5)';for(let k=0;k<4;k++){const by=210-((t*30+k*40+i*17)%160);g.beginPath();g.arc(x+30+k*14,by,2,0,TAU);g.fill();}
   g.fillStyle='#4a6a6a';g.fillRect(x+12,36,86,10);g.fillRect(x+12,214,86,14);g.fillStyle='#ff3a2a';if(Math.sin(t*4+i)>0){g.beginPath();g.arc(x+92,41,2.5,0,TAU);g.fill();}}
  g.fillStyle='#1e3a3c';for(const y of [20,240]){g.fillRect(0,y,VW,6);}
  const al=(Math.sin(t*3)+1)/2;g.fillStyle=`rgba(255,30,20,${al*.08})`;g.fillRect(0,0,VW,GY);
  floor(g,cx,'#2a3a3c','#1a2628',true);}
 else if(id==='mine'){const bg=g.createLinearGradient(0,0,0,GY);bg.addColorStop(0,'#0c0806');bg.addColorStop(1,'#2a1c12');g.fillStyle=bg;g.fillRect(0,0,VW,GY);

 P=mkPlayer();foes=[];projs=[];pprojs=[];fx=[];bolts=[];boss=null;CAM.x=0;LOCK={l:0,r:W};hitstop=0;flashW=0;flashR=0;bossCard=null;stageCard=null;}
async function playStage(i,fromBoss){initStage(i,fromBoss);hideOv();state='play';setBgm('none');
 if(fromBoss){P.x=W*.5;CAM.x=clamp(P.x-VW*.4,0,W-VW);G.kills=G.need;await bossSeq();return;}
 if(!G.retry)await story(STORY[i].pre);
 stageCard={s:STAGES[i].name,s2:STAGES[i].sub,t:0,d:2.4};setBgm('battle');state='play';}
async function midStory(){projs=[];for(const f of foes){if(f.st==='wind'||f.st==='atk'){f.st='idle';f.cd=1.2;}}const b=BGM.mode;setBgm('none');await wait(250);await story(MID[G.stage]);setBgm(b);P.inv=Math.max(P.inv,.8);}
async function bossSeq(){G.phase='pre';for(const f of foes)if(f.st!=='dead'){f.flee=true;f.fleeDir=f.x<P.x?-1:1;}
 CAM.x=clamp(P.x-VW*.4,0,W-VW);LOCK={l:CAM.x,r:CAM.x+VW};setBgm('none');stageText('WARNING',1.6);sfx('screech');await wait(1300);
 boss=mkBoss(G.stage);boss.ph2line=PH2LINE[G.stage];
 await new Promise(r=>{const iv=setInterval(()=>{if(!boss||!boss.entering){clearInterval(iv);r();}},50);});
 await wait(300);faceP(boss);P.dir=boss.x>P.x?1:-1;
 if(!G.retry)await story(STORY[G.stage].boss);
 await henshin();
 bossCard={name:boss.name,title:boss.title,t:0,d:2.4};sfx('roar');setBgm('boss');G.phase='boss';boss.cd=1.6;}
async function stageWin(){G.phase='win';P.inv=99;setBgm('none');await wait(900);sfx('win');
 await story(STORY[G.stage].win);
 const sc=Math.round(1000-G.dmg*2.5-G.time*1.2+G.maxCombo*8);const rank=sc>=850?'S':sc>=700?'A':sc>=500?'B':'C';
 const prog=loadProg();if(!window.tgAutoUsed){prog.open=Math.max(prog.open,Math.min(5,G.stage+2));const old=prog.rank[G.stage];if(!old||'SABC'.indexOf(rank)<'SABC'.indexOf(old))prog.rank[G.stage]=rank;saveProg(prog);}
 setBgm('clear');const last=G.stage===4;
 showOv(`<div class="panel"><h2>STAGE CLEAR</h2><p style="color:#e8c890;margin:0 0 8px">${STAGES[G.stage].name}　${STAGES[G.stage].sub}</p><div class="row"><span>タイム</span><span>${Math.floor(G.time/60)}分${String(Math.floor(G.time%60)).padStart(2,'0')}秒</span></div><div class="row"><span>被ダメージ</span><span>${Math.round(G.dmg)}</span></div><div class="row"><span>最大コンボ</span><span>${G.maxCombo} HIT</span></div><div class="rank">${rank}</div><p style="font-size:11px;color:#a88a5a">${window.tgAutoUsed?'（AUTO使用のため記録されません）':''}</p><button class="mbtn" id="nx">${last?'エンディングへ':'次のステージへ'}</button><button class="mbtn" id="ts">ステージセレクト</button></div>`);
 $('nx').onclick=()=>{sfx('click');if(last)ending();else playStage(G.stage+1);};$('ts').onclick=()=>{sfx('click');select();};
 if(window.tgAuto)setTimeout(()=>{if($('nx'))$('nx').click();},1800/SPD());}
function gameOver(){state='over';const inBoss=G.phase==='boss';
 showOv(`<div class="panel"><h2 style="color:#ff6a5a">GAME OVER</h2><p style="color:#e8c890;line-height:1.8">「蒼牙くん！ 立って……お願い……！」</p>${inBoss?'<button class="mbtn" id="rb">ボス戦からリトライ</button>':''}<button class="mbtn" id="rs">ステージ最初から</button><button class="mbtn" id="ts">ステージセレクト</button></div>`);
 if(inBoss)$('rb').onclick=()=>{sfx('click');playStage(G.stage,true);};$('rs').onclick=()=>{sfx('click');playStage(G.stage);};$('ts').onclick=()=>{sfx('click');select();};
 if(window.tgAuto)setTimeout(()=>{(inBoss?$('rb'):$('rs'))&&(inBoss?$('rb'):$('rs')).click();},1500/SPD());}
async function ending(){hideOv();state='play';setBgm('title');G.phase='win';await story(ENDING);
 showOv(`<div style="max-width:340px"><div class="ttl" style="font-size:44px">金獅子<br>牙王<small>-GAOH-</small></div><p style="color:#e8c890;line-height:2;margin-top:18px">THE END<br><span style="font-size:12px">THANK YOU FOR PLAYING<br>ザ・ゲーム プレゼンツ</span></p><button class="mbtn" id="tt">タイトルへ</button></div>`);$('tt').onclick=()=>{sfx('click');title();};}
function title(){state='title';G=null;boss=null;P=null;setBgm('title');
 showOv(`<div style="margin-top:4vh;width:100%;max-width:330px"><div class="ttl">金獅子<br>牙王<small>-GAOH-</small></div><div class="sub">THE GOLDEN LION</div><button class="mbtn" id="st" style="margin-top:28px">START</button><p style="font-size:11px;color:#a88a5a;margin-top:14px;line-height:1.7">左：移動（上に弾くとジャンプ）<br>攻撃連打でコンボ／ガード長押しで防御<br>獅子ゲージが満タンで必殺技</p></div>`,'rgba(6,3,2,.35)');
 $('st').onclick=()=>{sfx('click');select();};
 if(window.tgAuto)setTimeout(()=>{if(state==='title')playStage(0);},700/SPD());}
function select(){state='select';G=null;P=null;boss=null;setBgm('title');const prog=loadProg();
 const items=STAGES.map((s,i)=>{const open=i<prog.open;const bn=BOSSDEF[i].name;return `<button data-i="${i}" ${open?'':'disabled'}><b>${i+1}</b><span>${s.sub}<small>${open?'刺客：'+bn:'？？？'}</small></span><i>${prog.rank[i]||''}</i></button>`;}).join('');
 showOv(`<div style="width:100%;max-width:330px"><h2 style="color:#ffd75e;letter-spacing:.2em;margin:0 0 12px">STAGE SELECT</h2><div class="sel">${items}</div><button class="mbtn" id="bk">タイトルへ</button></div>`,'rgba(6,3,2,.6)');
 ov.querySelectorAll('.sel button').forEach(b=>b.onclick=()=>{sfx('click');playStage(+b.dataset.i);});$('bk').onclick=()=>{sfx('click');title();};}
window.addEventListener('tgauto',()=>{if(window.tgAuto){window.tgAutoUsed=true;if(state==='title'||state==='select')playStage(0);if(sLines)nextS(true);if(state==='henshin'&&H)H.skip=true;}});

/* ================= 更新 ================= */
function step(dt){if(hitstop>0){hitstop-=dt;return;}gameT+=dt;
 if(stageCard){stageCard.t+=dt;if(stageCard.t>stageCard.d)stageCard=null;}if(bossCard){bossCard.t+=dt;if(bossCard.t>bossCard.d)bossCard=null;}
 shk=Math.max(0,shk-dt*30);flashW=Math.max(0,flashW-dt*1.6);flashR=Math.max(0,flashR-dt);
 if(state==='henshin'){henshinUpdate(dt);return;}
 if(state!=='play'||!G)return;
 const frozen=G.phase==='pre'||G.phase==='win';
 if(!frozen)G.time+=dt;
 const I=frozen?{mx:0}:window.tgAuto?aiInput(dt):humanInput();
 pUpdate(dt,I);
 if(G.phase==='grunt'){CAM.x=lerp(CAM.x,clamp(P.x-VW*.4,0,W-VW),Math.min(1,dt*5));
  G.spawnT-=dt;const alive=foes.filter(f=>f.st!=='dead'&&!f.flee).length;
  if(G.spawnT<=0&&alive<STAGES[G.stage].maxOn&&G.spawned<G.need){G.spawnT=rnd(.6,1.3);let side=Math.random()<.6?1:-1;let x=side>0?CAM.x+VW+30:CAM.x-30;if(x<10||x>W-10){side=-side;x=side>0?CAM.x+VW+30:CAM.x-30;}x=clamp(x,10,W-10);foes.push(mkFoe(pick(STAGES[G.stage].types),x));G.spawned++;}
  if(!G.midDone&&G.kills>=Math.ceil(G.need/2)){G.midDone=true;if(!G.retry)midStory();}
  if(G.kills>=G.need&&G.phase==='grunt')bossSeq();}
 for(const f of foes)foeUpdate(f,dt);foes=foes.filter(f=>!f.gone);
 if(boss){bossUpdate(dt);if(boss.dying>2.6&&G.phase==='boss'){boss=null;stageWin();}}
 // 敵の弾
 for(const p of projs){if(p.delay>0){p.delay-=dt;continue;}p.life-=dt;
  if(p.home){const dx=P.x-p.x,dy=P.y+40-p.y;p.vx+=Math.sign(dx)*140*dt;p.vy+=Math.sign(dy)*90*dt;p.vx=clamp(p.vx,-260,260);p.vy=clamp(p.vy,-160,160);}
  if(p.ty!==undefined)p.y=lerp(p.y,p.ty,Math.min(1,dt*6));
  if(p.ret!==undefined){p.ret-=dt;if(p.ret<=0&&p.owner){const dx=p.owner.x-p.x;p.vx=lerp(p.vx,Math.sign(dx)*360,Math.min(1,dt*5));if(Math.abs(dx)<20&&p.ret<-.3)p.life=0;}}
  p.vy-=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.y<=0&&p.g){p.life=0;fx.push({t:'smoke',x:p.x,y:2,r:6,life:.4});}
  if(p.x<LOCK.l-60||p.x>LOCK.r+60)p.life=0;
  if(p.life>0&&Math.abs(p.x-P.x)<p.r+10&&p.y>P.y-p.r&&p.y<P.y+72+p.r){if(hurtP(p.dmg,p.x-p.vx*.05,false,{bind:p.bind,poison:p.poison})){if(p.kind!=='scythe')p.life=0;}else if(P.guard&&p.kind!=='scythe')p.life=0;}}
 projs=projs.filter(p=>p.life>0);
 // 必殺の波動
 for(const p of pprojs){p.life-=dt;p.x+=p.vx*dt;for(const f of foes){if(f.st!=='dead'&&!f.flee&&!p.hit.has(f)&&Math.abs(f.x-p.x)<40){p.hit.add(f);hitFoe(f,p.dmg,300,250);}}if(boss&&!p.hit.has(boss)&&Math.abs(boss.x-p.x)<boss.w/2+30){p.hit.add(boss);bossHit(p.dmg,100,true);sparks(boss.x,60,'#ffe08a',p.dir);shake(10);}if(p.x<LOCK.l-80||p.x>LOCK.r+80)p.life=0;}pprojs=pprojs.filter(p=>p.life>0);
 for(const it of items){it.life-=dt;it.vy-=600*dt;it.y=Math.max(0,it.y+it.vy*dt);if(it.y<=0)it.vy=0;if(Math.abs(it.x-P.x)<20&&P.y<40&&!P.dead){it.life=0;const h=P.form==='gaoh'?30:22;P.hp=Math.min(P.max,P.hp+h);sfx('heal');numFx(P.x,P.y+80,'+'+h,'#7aff8a');}}items=items.filter(i=>i.life>0);
 for(const b of bolts)b.t-=dt;bolts=bolts.filter(b=>b.t>0);
 for(const f of fx){f.life-=dt;if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.t==='dot')f.vy-=400*dt;}if(f.t==='num')f.y+=f.vy*dt;}fx=fx.filter(f=>f.life>0);if(fx.length>400)fx.splice(0,fx.length-400);}

/* ================= AUTO ================= */
const ai={t:0,jt:0};
function aiInput(dt){const I={mx:0,atk:false,jump:false,sp:false,guard:false};ai.t-=dt;ai.jt-=dt;
 if(P.bound>0){I.atk=ai.t<=0;if(ai.t<=0)ai.t=.08;return I;}
 let tg=null,best=1e9;if(boss&&G.phase==='boss'&&!boss.dying)tg=boss;else for(const f of foes){if(f.st==='dead'||f.flee)continue;const d=Math.abs(f.x-P.x);if(d<best){best=d;tg=f;}}
 if(!tg){if(G.phase==='grunt')I.mx=P.x<CAM.x+VW*.5?.6:0;return I;}
 const dx=tg.x-P.x,ad=Math.abs(dx),dir=dx>0?1:-1,gold=P.form==='gaoh';const reach=gold?58:34;
 // 飛び道具
 for(const p of projs){if(p.delay>0)continue;const pd=p.x-P.x;if(Math.abs(pd)<110&&Math.sign(-p.vx)===Math.sign(pd)){if(p.y<34&&p.kind!=='orb'&&P.y<=0&&ai.jt<=0){I.jump=true;ai.jt=.6;}else{I.mx=dir*.01;I.guard=true;return I;}}}
 if(tg===boss){const a=boss.att;
  if(a&&boss.id==='mantis'&&a.k==='counter'){I.mx=-dir*.6;return I;}
  if(a&&a.ph==='tele'){if(['tail','beam'].includes(a.k)&&ad<200){if(a.t>a.dur-.12&&P.y<=0&&ai.jt<=0){I.jump=true;ai.jt=.8;}return I;}if(a.k==='drop'||a.k==='thunder'){I.mx=-dir;return I;}if(ad<170){I.mx=dir*.01;I.guard=true;return I;}}
  if(a&&a.ph==='go'&&['tail','beam'].includes(a.k)&&P.y<=0&&ai.jt<=0&&ad<220){I.jump=true;ai.jt=.8;}
  if(a&&a.ph==='go'&&['lunge','dash','charge','swoop','drain','legs','double'].includes(a.k)&&ad<150){I.mx=dir*.01;I.guard=true;return I;}
  if(a&&a.k==='drop'&&a.s==='hang'){I.mx=dx>0?-1:1;return I;}
  if(boss.id==='bat'&&boss.y>40){if(ad>30)I.mx=dir;else{I.mx=dir*.01;if(P.y<=0&&ai.jt<=0){I.jump=true;ai.jt=.5;}}if(P.y>40&&ai.t<=0){I.atk=true;ai.t=.12;}return I;}}
 if(P.sp>=100&&ad<220){I.mx=dir*.01;I.sp=true;return I;}
 if(ad>reach)I.mx=dir;else{I.mx=dir*.01;if(ai.t<=0){I.atk=true;ai.t=.11;}}
 return I;}

/* ================= タイトル描画 ================= */
function drawTitle(g,t){const bg=g.createLinearGradient(0,0,0,VH);bg.addColorStop(0,'#1a0804');bg.addColorStop(1,'#3a1a06');g.fillStyle=bg;g.fillRect(0,0,VW,VH);
 for(let i=0;i<18;i++){const a=i/18*TAU+t*.15;g.strokeStyle='rgba(255,200,80,.07)';g.lineWidth=14;g.beginPath();g.moveTo(VW/2,VH*.48);g.lineTo(VW/2+Math.cos(a)*500,VH*.48+Math.sin(a)*500);g.stroke();}
 g.globalAlpha=.55;drawLionHead(g,VW/2,VH*.46,1.6+Math.sin(t*2)*.03,1,.8);g.globalAlpha=1;
 const ent={kind:'hero',form:'gaoh',dir:1,sx:VW*.5,sy:VH-6,scale:1.7,pose:PS({fu:2.9,ff:3.0,sw:3.14,bu:.4,bf:1.6,lean:-.05,fh:.6,fs:.2,bh:-.55,bs:-.2}),scarf:[],swordGlow:true};
 g.globalAlpha=.9;drawFighter(g,ent,t);g.globalAlpha=1;
 for(let i=0;i<20;i++){const x=(i*71+t*30)%VW,y=VH-((i*53+t*40)%VH);g.fillStyle='rgba(255,210,100,.6)';g.fillRect(x,y,2,2);}}

/* ================= 起動 ================= */
(function loop(){try{render();}catch(e){console.error(e);}requestAnimationFrame(loop);})();
let last=performance.now();setInterval(()=>{const now=performance.now();const dt=Math.min(.05,(now-last)/1000);last=now;const sp=SPD();for(let k=0;k<sp;k++)step(dt);},16);
title();

</script>

<script>
/* ---------- 共通の効果音（Web Audioで合成） ---------- */
window.tgSound = (function(){
  var AC = null, noiseBuf = null, on = true, last = {};
  try { on = localStorage.getItem('tg_sound') !== '0'; } catch (e) {}
  function ctx(){
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, dur, type, vol, slide, delay){
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, vol, freq, delay, kind){
    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = 1;
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + .03);
  }
  function arp(fs, step, type, vol, dur){ fs.forEach(function(f, i){ tone(f, dur || .22, type, vol, 0, i * step); }); }
  var LIB = {
    click:  function(){ tone(900, .05, 'square', .03); },
    pick:   function(){ tone(660, .06, 'triangle', .07); tone(990, .08, 'triangle', .06, 0, .05); },
    unpick: function(){ tone(520, .08, 'triangle', .06, .7); },
    tick:   function(){ tone(1500 + Math.random() * 300, .025, 'square', .025); },
    land:   function(){ tone(784, .09, 'square', .05); tone(1175, .18, 'square', .05, 0, .07); },
    start:  function(){ arp([392, 523, 659], .09, 'square', .05, .18); },
    shot:   function(){ tone(1200, .07, 'square', .025, .45); },
    shotFoe:function(){ tone(700, .08, 'square', .02, .5); },
    slash:  function(){ noise(.12, .12, 2600, 0, 'highpass'); tone(500, .1, 'sawtooth', .03, .5); },
    dash:   function(){ noise(.2, .1, 800, 0, 'bandpass'); tone(200, .2, 'sine', .06, 2.2); },
    charge: function(){ tone(200, .7, 'sawtooth', .05, 4); },
    beam:   function(){ noise(.5, .2, 500, 0, 'lowpass'); tone(90, .5, 'sawtooth', .08, .5); },
    hit:    function(){ noise(.09, .14, 900, 0, 'lowpass'); tone(160, .08, 'square', .04, .6); },
    big:    function(){ noise(.3, .22, 400, 0, 'lowpass'); tone(110, .3, 'sawtooth', .07, .5); },
    heal:   function(){ arp([784, 988, 1319], .06, 'sine', .06, .2); },
    miss:   function(){ noise(.15, .06, 3000, 0, 'highpass'); },
    good:   function(){ arp([659, 784, 1047], .08, 'triangle', .07, .25); },
    bad:    function(){ tone(330, .25, 'triangle', .07, .75); tone(247, .35, 'triangle', .06, .8, .18); },
    win:    function(){ arp([523, 659, 784, 1047, 1319], .1, 'square', .045, .28); },
    lose:   function(){ arp([392, 330, 262, 196], .22, 'triangle', .08, .4); },
    splash: function(){ noise(.35, .18, 700, 0, 'lowpass'); noise(.2, .08, 2400, .05, 'bandpass'); },
    bubble: function(){ tone(250 + Math.random() * 250, .07, 'sine', .04, 1.8); },
    slurp:  function(){ noise(.5, .12, 1400, 0, 'bandpass'); noise(.3, .08, 900, .55, 'bandpass'); },
    coin:   function(){ tone(988, .06, 'square', .04); tone(1319, .14, 'square', .04, 0, .06); },
    summon: function(){ tone(130, 1, 'sawtooth', .05, 3); arp([523, 784, 1047, 1568], .12, 'sine', .07, .5); },
    evolve: function(){ arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], .07, 'triangle', .06, .3); },
    fuse:   function(){ tone(110, 1.1, 'sawtooth', .06, 2.5); noise(.9, .1, 300, .2, 'lowpass'); arp([659, 880, 1319], .12, 'sine', .07, .4); }
  };
  function play(name){
    if (!on || !LIB[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < 55) return;
    last[name] = now;
    if (!ctx()) return;
    try { LIB[name](); } catch (e) {}
  }
  var btn = document.querySelector('.tg-snd');
  function sync(){ if (btn) { btn.textContent = on ? '音：ON' : '音：OFF'; btn.setAttribute('aria-pressed', String(on)); } }
  if (btn) {
    ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ btn.addEventListener(t, function(e){ e.stopPropagation(); }); });
    btn.addEventListener('click', function(e){
      e.stopPropagation(); on = !on; sync(); btn.blur();
      try { localStorage.setItem('tg_sound', on ? '1' : '0'); } catch (err) {}
      if (on) { ctx(); play('pick'); }
    });
  }
  sync();
  // ブラウザは最初の操作まで音を出せないので、最初のタップで準備する
  window.addEventListener('pointerdown', function(){ if (on) ctx(); }, { once: true, capture: true });
  return { play: play };
})();
</script>

<!-- tg-swipe-guard: スワイプでの更新・戻るを防ぐ -->
<style>html,body{overscroll-behavior:none}</style>
<script>
(function(){
  var GAME=!!document.querySelector('.tg-auto');
  var sx=0,sy=0;
  function scroller(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){var s=getComputedStyle(el).overflowY;if((s==='auto'||s==='scroll')&&el.scrollHeight>el.clientHeight)return el;}return null;}
  document.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;
    // 画面端からのスワイプ（戻る・進む）を止める
    if(sx<14||sx>innerWidth-14){e.preventDefault();}},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
})();
</script>
