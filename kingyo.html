<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぽいっと金魚すくい</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 縁日の夜、屋台の水槽をまるごと1枚のキャンバスに。操作は押す・動かす・離すだけ */
:root{
  --night:#0d1020; --ink:#f3ecdf; --beni:#e8452c; --muted:#8d93ad; --line:#262c4a;
  --disp:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
header{display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-family:var(--disp);font-weight:400;font-size:18px;letter-spacing:.08em}
header a{color:var(--muted);text-decoration:none;font-size:14px}
canvas{display:block;width:min(100%, calc((100dvh - 96px) * 1.5));max-width:100%;aspect-ratio:3/2;margin-inline:auto;border-radius:8px;background:#000;outline:1px solid var(--line);touch-action:none;cursor:none}
.hint{margin:0;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>ぽいっと金魚すくい</h1>
    <div style="display:flex;align-items:center;gap:12px"><button class="tg-auto tg-inline" type="button" aria-pressed="false" aria-label="オートプレイ">AUTO</button><a href="index.html">← ゲーム一覧</a></div>
  </header>
  <canvas id="cv" width="960" height="640" aria-label="金魚すくいのゲーム画面"></canvas>
  <p class="hint">押している間ポイが水に入り、離すとすくい上げる。スマホは指の少し上にポイが出るわ。</p>
</div>
<script>
'use strict';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 960, H = 640, TAU = Math.PI * 2;
const DISP = '"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif';
const BODY = '"Zen Kaku Gothic New","Hiragino Sans",sans-serif';
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

/* ---------- 定数 ---------- */
const POOL = { x: 34, y: 104, w: 892, h: 512, r: 46 };
const POI_R = 46;
const GAME_TIME = 90;
const POI_COUNT = 3;
const FISH_TARGET = 13;
const BOWL = { x: W - 62, y: 58 };
const BEST_KEY = 'poikingyo_best';

const TYPES = {
  aka:    { name: '和金',     size: 15, weight: 9,  score: 100,  speed: 46, body: '#e8452c', belly: '#ffae86' },
  kohaku: { name: '更紗',     size: 17, weight: 12, score: 150,  speed: 40, body: '#fbf3e8', belly: '#ffffff', patch: '#e8452c' },
  kuro:   { name: '黒出目金', size: 18, weight: 15, score: 220,  speed: 32, body: '#1f1c26', belly: '#403a4c', bigEye: true },
  kin:    { name: '金ちゃん', size: 13, weight: 8,  score: 600,  speed: 82, body: '#f2c13a', belly: '#fff1b0', shy: true },
  nushi:  { name: 'ぬし',     size: 32, weight: 42, score: 1500, speed: 24, body: '#d8391f', belly: '#ffc59e', patch: '#f8efe2' },
};
const ORDER = ['aka', 'kohaku', 'kuro', 'kin', 'nushi'];

function inPool(x, y, m = 0) {
  return x > POOL.x + m && x < POOL.x + POOL.w - m && y > POOL.y + m && y < POOL.y + POOL.h - m;
}

/* ---------- 音 ---------- */
let AC = null;
function audioOn() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, dur, type = 'sine', vol = .12, slide = 0, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
}
let noiseBuf = null;
function noise(dur, vol, freq, delay = 0) {
  if (!AC) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur + .02);
}
const sfx = {
  enter() { noise(.14, .18, 900); },
  lift()  { noise(.2, .14, 1600); tone(420, .12, 'sine', .05, 1.6); },
  plop()  { tone(300, .12, 'sine', .08, .5); noise(.1, .08, 700); },
  catch(n) { for (let i = 0; i < Math.min(n, 4) + 1; i++) tone(660 * Math.pow(1.26, i), .14, 'triangle', .1, 0, i * .07); },
  tear()  { noise(.3, .3, 3200); tone(220, .3, 'sawtooth', .06, .45); },
  tick()  { tone(1250, .05, 'square', .04); },
  gong()  { tone(392, .6, 'triangle', .12); tone(523, .6, 'triangle', .1, 0, .12); tone(659, .9, 'triangle', .1, 0, .24); },
};

/* ---------- 状態 ---------- */
let state = 'title';
let fish = [], flying = [], ripples = [], drops = [], texts = [];
let score = 0, timeLeft = GAME_TIME, pois = POI_COUNT, caught = {}, bowlCount = 0, bowlWob = 0;
let nushiSpawned = false, spawnT = 0, lastTick = 0, banner = null, resultAt = 0, endInfo = null;
let best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }

const ptr = { x: W / 2, y: H / 2 + 40, pressed: false };
const poi = { x: W / 2, y: H / 2 + 40, px: W / 2, py: H / 2 + 40, down: false, state: 'ok', dur: 100, spd: 0, tearT: 0, cracks: [], load: 0, needRelease: false };

function makeCracks() {
  const cs = [];
  for (let i = 0; i < 7; i++) {
    const a = rnd(0, TAU); let x = Math.cos(a) * POI_R, y = Math.sin(a) * POI_R, h = a + Math.PI + rnd(-.6, .6);
    const pts = [[x, y]];
    for (let j = 0; j < 4; j++) { h += rnd(-.7, .7); const l = rnd(8, 15); x += Math.cos(h) * l; y += Math.sin(h) * l; pts.push([x, y]); }
    cs.push(pts);
  }
  return cs;
}
function newPoi() { poi.dur = 100; poi.state = 'ok'; poi.cracks = makeCracks(); poi.down = false; poi.needRelease = ptr.pressed; }

function makeFish(key, x, y) {
  const T = TYPES[key], a = rnd(0, TAU);
  return { key, T, x, y, a, ta: a, v: T.speed * .6, vt: T.speed, turnT: rnd(0, 2), ph: rnd(0, TAU), flee: 0, drop: 0 };
}
function pickKey() {
  const r = Math.random();
  return r < .06 ? 'kin' : r < .2 ? 'kuro' : r < .42 ? 'kohaku' : 'aka';
}
function spawnFish(key = pickKey(), dropIn = false) {
  let x, y, tries = 0;
  do {
    x = rnd(POOL.x + 70, POOL.x + POOL.w - 70); y = rnd(POOL.y + 70, POOL.y + POOL.h - 70); tries++;
  } while (tries < 25 && Math.hypot(x - poi.x, y - poi.y) < 170);
  const f = makeFish(key, x, y);
  if (dropIn) { f.drop = .45; splash(x, y, 10); ripple(x, y, 70); sfx.plop(); }
  fish.push(f);
  return f;
}

function resetPool() {
  fish = [];
  for (let i = 0; i < FISH_TARGET; i++) spawnFish();
}

function startGame() {
  score = 0; timeLeft = GAME_TIME; pois = POI_COUNT; caught = {}; bowlCount = 0;
  nushiSpawned = false; spawnT = 0; lastTick = 0; banner = null; endInfo = null;
  flying = []; texts = []; ripples = []; drops = [];
  resetPool(); newPoi();
  state = 'play';
  showBanner('はじめ', '#ffd66b');
}

function endGame() {
  if (state !== 'play') return;
  if (poi.down && poi.state === 'ok') { poi.down = false; lift(); }
  const left = Math.max(0, pois);
  const bonus = left * 300;
  score += bonus;
  const isBest = !window.tgAuto && score > best;
  if (isBest) { best = score; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
  endInfo = { bonus, left, isBest, timeUp: timeLeft <= 0 };
  state = 'result'; resultAt = performance.now();
  sfx.gong();
}

function rankOf(s) {
  if (s >= 10000) return ['伝説のすくい屋', '屋台のおやじが店じまいを考えはじめた。'];
  if (s >= 6000) return ['金魚名人', '手首の返しが美しい。'];
  if (s >= 3000) return ['すくい上手', '縁日の常連を名乗っていい腕前。'];
  if (s >= 1000) return ['縁日の常連', 'コツはつかめてきたみたい。'];
  return ['見習い', 'ポイは斜めに入れて、そっと待つのが基本。'];
}

/* ---------- 演出 ---------- */
function ripple(x, y, max = 50) { ripples.push({ x, y, r: 4, max, life: 1 }); }
function splash(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(40, 170);
    drops.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rnd(.35, .7) });
  }
}
function floatText(x, y, s, c = '#fff', size = 22) { texts.push({ x, y, s, c, size, life: 1.3 }); }
function showBanner(s, c) { banner = { s, c, life: 1.6 }; }

/* ---------- ロジック ---------- */
function scare(f, x, y, t) {
  if (f.key === 'nushi') return;
  f.flee = t;
  f.ta = Math.atan2(f.y - y, f.x - x) + rnd(-.4, .4);
}

function catchable(f) {
  return f.drop <= 0 && Math.hypot(f.x - poi.x, f.y - poi.y) < POI_R - f.T.size * .4;
}

function enterWater() {
  poi.dur -= 3; poi.spd = 0;
  sfx.enter(); ripple(poi.x, poi.y, 80); splash(poi.x, poi.y, 6);
  for (const f of fish) {
    const d = Math.hypot(f.x - poi.x, f.y - poi.y);
    if ((d < 62 && Math.random() < .5) || (f.T.shy && d < 150)) scare(f, poi.x, poi.y, .9);
  }
}

function lift() {
  const got = fish.filter(catchable);
  sfx.lift(); ripple(poi.x, poi.y, 60); splash(poi.x, poi.y, got.length ? 14 : 6);
  if (!got.length) { poi.dur -= 1; return; }
  const w = got.reduce((s, f) => s + f.T.weight, 0);
  if (w > poi.dur) {
    got.forEach(f => scare(f, poi.x, poi.y, .8));
    floatText(poi.x, poi.y - 40, '重すぎて破れた', '#ff8f7a', 22);
    tear();
    return;
  }
  poi.dur -= w * .5;
  const n = got.length, mult = 1 + .5 * (n - 1);
  let pts = 0;
  for (const f of got) {
    pts += f.T.score;
    caught[f.key] = (caught[f.key] || 0) + 1;
    fish.splice(fish.indexOf(f), 1);
    flying.push({ T: f.T, sx: f.x, sy: f.y, a: f.a, t: 0 });
  }
  pts = Math.round(pts * mult);
  score += pts;
  floatText(poi.x, poi.y - 30, '+' + pts, '#ffe27a', 28);
  if (n > 1) floatText(poi.x, poi.y - 64, n + '匹すくい ×' + mult, '#9ff0ff', 20);
  if (got.some(f => f.key === 'nushi')) showBanner('ぬしを すくった', '#ffd66b');
  sfx.catch(n);
}

function tear() {
  poi.down = false; poi.state = 'tearing'; poi.tearT = 1;
  pois--;
  sfx.tear(); splash(poi.x, poi.y, 10);
}

function updateFish(f, dt) {
  f.ph += dt * (7 + f.v * .08);
  if (f.drop > 0) f.drop -= dt;
  if (state === 'play' && poi.down && poi.state === 'ok') {
    const d = Math.hypot(f.x - poi.x, f.y - poi.y);
    if (f.T.shy && d < 130) scare(f, poi.x, poi.y, 1);
    else if (poi.spd > 330 && d < POI_R + 50) scare(f, poi.x, poi.y, .8);
  }
  f.turnT -= dt;
  if (f.flee > 0) f.flee -= dt;
  else if (f.turnT <= 0) {
    f.turnT = rnd(.8, 2.6);
    f.ta = f.a + rnd(-1.3, 1.3);
    f.vt = f.T.speed * (Math.random() < .15 ? .1 : rnd(.4, 1.2));
    // 静かに沈めたポイには、臆病でない金魚が寄ってくる
    if (state === 'play' && poi.down && poi.spd < 60 && !f.T.shy && Math.random() < .55) {
      const d = Math.hypot(f.x - poi.x, f.y - poi.y);
      if (d < 220 && d > 20) { f.ta = Math.atan2(poi.y - f.y, poi.x - f.x) + rnd(-.3, .3); f.vt = f.T.speed * .5; f.turnT = rnd(1.2, 2.2); }
    }
  }
  const m = 55;
  let wx = 0, wy = 0;
  if (f.x < POOL.x + m) wx = 1; else if (f.x > POOL.x + POOL.w - m) wx = -1;
  if (f.y < POOL.y + m) wy = 1; else if (f.y > POOL.y + POOL.h - m) wy = -1;
  if (wx || wy) f.ta = Math.atan2(wy || Math.sin(f.a) * .5, wx || Math.cos(f.a) * .5);
  const diff = ((f.ta - f.a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  const tr = f.flee > 0 ? 6 : 2.2;
  f.a += clamp(diff, -tr * dt, tr * dt);
  const target = f.flee > 0 ? f.T.speed * 3 : f.vt;
  f.v += (target - f.v) * Math.min(1, dt * 2);
  f.x = clamp(f.x + Math.cos(f.a) * f.v * dt, POOL.x + f.T.size, POOL.x + POOL.w - f.T.size);
  f.y = clamp(f.y + Math.sin(f.a) * f.v * dt, POOL.y + f.T.size, POOL.y + POOL.h - f.T.size);
}

function updatePoi(dt) {
  const k = Math.min(1, dt * 22);
  poi.x += (ptr.x - poi.x) * k; poi.y += (ptr.y - poi.y) * k;
  const inst = Math.min(1500, Math.hypot(poi.x - poi.px, poi.y - poi.py) / Math.max(dt, 1e-3));
  poi.spd += (inst - poi.spd) * Math.min(1, dt * 10);
  poi.px = poi.x; poi.py = poi.y;

  if (poi.state === 'tearing') {
    poi.tearT -= dt;
    if (poi.tearT <= 0) { if (pois > 0) newPoi(); else endGame(); }
    return;
  }
  const want = state === 'play' && ptr.pressed && !poi.needRelease && inPool(poi.x, poi.y, 10);
  if (want && !poi.down) { poi.down = true; enterWater(); }
  else if (!want && poi.down) { poi.down = false; lift(); }

  poi.load = 0;
  if (poi.down) {
    poi.dur -= (1.5 + poi.spd * .011) * dt;
    if (poi.spd > 80 && Math.random() < dt * 10) ripple(poi.x + rnd(-20, 20), poi.y + rnd(-20, 20), 30);
    for (const f of fish) if (catchable(f)) poi.load += f.T.weight;
    if (poi.dur <= 0) { poi.dur = 0; floatText(poi.x, poi.y - 40, 'ふやけて破れた', '#ff8f7a', 22); tear(); }
  }
}

/* ---------- オートプレイ ---------- */
let autoFish = null, autoHeld = false, autoDownT = 0, autoAimT = 0;
function autoPilot(dt) {
  if (!window.tgAuto) {
    if (autoHeld) { ptr.pressed = false; poi.needRelease = false; autoHeld = false; }
    return;
  }
  autoHeld = true;
  if (state === 'title') { startGame(); poi.needRelease = false; return; }
  if (state === 'result') { if (performance.now() - resultAt > 4000) { startGame(); poi.needRelease = false; } return; }
  if (poi.state !== 'ok') { ptr.pressed = false; poi.needRelease = false; return; }
  if (poi.down) {
    autoDownT += dt;
    const inside = fish.filter(catchable);
    const snug = inside.some(f => Math.hypot(f.x - poi.x, f.y - poi.y) < POI_R * .55);
    if ((snug && poi.load <= poi.dur - 1) || autoDownT > 2.6 || poi.load > poi.dur) ptr.pressed = false;
    return;
  }
  autoDownT = 0;
  autoAimT += dt;
  if (!autoFish || !fish.includes(autoFish) || autoAimT > 3) {
    autoAimT = 0; autoFish = null;
    let bestV = 0;
    for (const f of fish) {
      if (f.drop > 0 || f.T.weight > poi.dur - 6 || (f.key === 'nushi' && poi.dur < 70)) continue;
      const v = f.T.score / (1 + Math.hypot(f.x - poi.x, f.y - poi.y) / 250) * (f.T.shy ? .5 : 1);
      if (v > bestV) { bestV = v; autoFish = f; }
    }
    // 紙が弱って狙える魚がいないときは、一番軽い魚で勝負して次のポイへ
    if (!autoFish) autoFish = fish.filter(f => f.drop <= 0).sort((a, b) => a.T.weight - b.T.weight)[0] || null;
  }
  if (!autoFish) { ptr.pressed = false; return; }
  const f = autoFish;
  const tx = clamp(f.x + Math.cos(f.a) * 38, POOL.x + 30, POOL.x + POOL.w - 30);
  const ty = clamp(f.y + Math.sin(f.a) * 38, POOL.y + 30, POOL.y + POOL.h - 30);
  const dx = tx - ptr.x, dy = ty - ptr.y, d = Math.hypot(dx, dy), step = 700 * dt;
  if (d > step) { ptr.x += dx / d * step; ptr.y += dy / d * step; }
  else { ptr.x = tx; ptr.y = ty; }
  ptr.pressed = Math.hypot(tx - poi.x, ty - poi.y) < 14;
}

function update(dt) {
  autoPilot(dt);
  for (const f of fish) updateFish(f, dt);
  updatePoi(dt);

  if (state === 'play') {
    timeLeft -= dt;
    const sec = Math.ceil(timeLeft);
    if (sec <= 10 && sec > 0 && sec !== lastTick) { lastTick = sec; sfx.tick(); }
    if (!nushiSpawned && timeLeft <= 60) {
      nushiSpawned = true;
      spawnFish('nushi', true);
      showBanner('ぬしが現れた', '#ff9b7a');
    }
    const living = fish.filter(f => f.key !== 'nushi').length;
    if (living < FISH_TARGET) {
      spawnT -= dt;
      if (spawnT <= 0) { spawnT = 1.4; spawnFish(pickKey(), true); }
    }
    if (timeLeft <= 0) { timeLeft = 0; endGame(); }
  }

  for (const fl of flying) fl.t += dt / .65;
  for (let i = flying.length - 1; i >= 0; i--) {
    if (flying[i].t >= 1) { flying.splice(i, 1); bowlCount++; bowlWob = 1; }
  }
  bowlWob = Math.max(0, bowlWob - dt * 2.5);
  for (const r of ripples) { r.r += (r.max - r.r) * dt * 3; r.life -= dt * 1.3; }
  ripples = ripples.filter(r => r.life > 0);
  for (const d of drops) { d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 420 * dt; d.life -= dt; }
  drops = drops.filter(d => d.life > 0);
  for (const t of texts) { t.y -= 34 * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
}

/* ---------- 描画 ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#141a36'); g.addColorStop(1, '#0a0c18');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 提灯の列
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, 6);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 6 + Math.sin(x / 80) * 3);
  ctx.stroke();
  for (let i = 0; i < 15; i++) {
    const x = 32 + i * 64, y = 16 + Math.sin(x / 80) * 3, flick = .75 + .25 * Math.sin(t * 3 + i * 1.7);
    const glow = ctx.createRadialGradient(x, y, 2, x, y, 30);
    glow.addColorStop(0, `rgba(255,120,70,${.35 * flick})`); glow.addColorStop(1, 'rgba(255,120,70,0)');
    ctx.fillStyle = glow; ctx.fillRect(x - 30, y - 30, 60, 60);
    ctx.fillStyle = i % 2 ? '#f4efe4' : '#e04a32';
    ctx.beginPath(); ctx.ellipse(x, y, 8, 10, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#222'; ctx.fillRect(x - 5, y - 11, 10, 2); ctx.fillRect(x - 5, y + 9, 10, 2);
  }
}

function drawHUD(t) {
  ctx.textBaseline = 'alphabetic';
  const lab = (s, x) => { ctx.fillStyle = '#8d93ad'; ctx.font = `700 13px ${BODY}`; ctx.textAlign = 'left'; ctx.fillText(s, x, 48); };
  // 時間
  lab('のこり', 40);
  const low = timeLeft <= 10 && state === 'play';
  ctx.fillStyle = low ? (Math.sin(t * 10) > 0 ? '#ff6b57' : '#ffb3a6') : '#f3ecdf';
  ctx.font = `34px ${DISP}`; ctx.fillText(Math.ceil(timeLeft).toString().padStart(2, '0'), 40, 86);
  // スコア
  lab('とくてん', 150);
  ctx.fillStyle = '#ffe27a'; ctx.font = `34px ${DISP}`; ctx.fillText(score.toString(), 150, 86);
  // ポイ残数
  lab('ポイ', 400);
  for (let i = 0; i < POI_COUNT; i++) {
    const x = 412 + i * 34, y = 72, alive = i < pois;
    ctx.globalAlpha = alive ? 1 : .25;
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(x, y, 11, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#e8548e'; ctx.lineWidth = 4; ctx.stroke();
    if (!alive) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 7, y - 7); ctx.lineTo(x + 7, y + 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  // 紙のつよさ
  lab('紙のつよさ', 548);
  const bx = 548, by = 62, bw = 240, bh = 16;
  rr(bx, by, bw, bh, 8); ctx.fillStyle = '#222842'; ctx.fill();
  const d = poi.state === 'ok' ? clamp(poi.dur, 0, 100) : 0;
  const col = d > 60 ? '#6fdc8c' : d > 30 ? '#f4c84a' : '#ff6b57';
  if (d > 0) { rr(bx, by, Math.max(bh, bw * d / 100), bh, 8); ctx.fillStyle = col; ctx.fill(); }
  if (poi.down && poi.load > 0) {
    const lx = bx + bw * Math.min(poi.load, 100) / 100;
    const over = poi.load > poi.dur;
    ctx.strokeStyle = over ? '#ff3b2f' : '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(lx, by - 5); ctx.lineTo(lx, by + bh + 5); ctx.stroke();
    ctx.font = `700 12px ${BODY}`; ctx.textAlign = 'right';
    ctx.fillStyle = over ? '#ff8f7a' : '#cfe9ff';
    ctx.fillText(over ? '重すぎる' : '持ち上がる', bx + bw, 48);
  }
  // 金魚鉢
  const wob = Math.sin(bowlWob * 14) * bowlWob * 4;
  ctx.save(); ctx.translate(BOWL.x, BOWL.y + wob);
  ctx.fillStyle = 'rgba(140,210,255,.25)'; ctx.beginPath(); ctx.arc(0, 4, 26, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(90,170,230,.45)'; ctx.beginPath(); ctx.arc(0, 4, 26, .15, Math.PI - .15); ctx.fill();
  ctx.strokeStyle = 'rgba(210,240,255,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 4, 26, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -20, 14, 4, 0, 0, TAU); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#f3ecdf'; ctx.font = `22px ${DISP}`; ctx.textAlign = 'right';
  ctx.fillText('×' + bowlCount, BOWL.x - 34, 72);
  ctx.textAlign = 'left';
}

function drawPool(t) {
  // 縁
  rr(POOL.x - 10, POOL.y - 10, POOL.w + 20, POOL.h + 20, POOL.r + 8);
  ctx.fillStyle = '#2f6fc7'; ctx.fill();
  rr(POOL.x - 10, POOL.y - 10, POOL.w + 20, POOL.h + 20, POOL.r + 8);
  ctx.strokeStyle = '#5c9ae8'; ctx.lineWidth = 3; ctx.stroke();
  // 水
  ctx.save();
  rr(POOL.x, POOL.y, POOL.w, POOL.h, POOL.r); ctx.clip();
  const g = ctx.createLinearGradient(0, POOL.y, 0, POOL.y + POOL.h);
  g.addColorStop(0, '#7fd0ec'); g.addColorStop(1, '#2b8cc4');
  ctx.fillStyle = g; ctx.fillRect(POOL.x, POOL.y, POOL.w, POOL.h);
  // 水底のゆらぎ
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 3;
  for (let i = 0; i < 15; i++) {
    const y0 = POOL.y + 10 + i * 36;
    ctx.beginPath();
    for (let x = POOL.x; x <= POOL.x + POOL.w; x += 24) {
      const y = y0 + Math.sin(x * .02 + t * 1.2 + i) * 7 + Math.sin(x * .007 - t * .6 + i * 2) * 9;
      x === POOL.x ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function fishShape(T, ph, s) {
  const sway = Math.sin(ph) * .35;
  // 尾びれ
  ctx.save(); ctx.translate(-s * .85, 0); ctx.rotate(sway);
  ctx.globalAlpha *= .85;
  ctx.fillStyle = T.body;
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-s * .9, -s * 1.0, -s * 1.35, -s * .75);
  ctx.quadraticCurveTo(-s * .75, 0, -s * 1.35, s * .75);
  ctx.quadraticCurveTo(-s * .9, s * 1.0, 0, 0);
  ctx.fill();
  ctx.restore();
  // 胸びれ
  ctx.fillStyle = T.body;
  const fin = Math.sin(ph * 1.3) * .3;
  for (const sgn of [-1, 1]) {
    ctx.save(); ctx.translate(s * .2, sgn * s * .45); ctx.rotate(sgn * (.9 + fin));
    ctx.beginPath(); ctx.ellipse(-s * .2, 0, s * .32, s * .14, 0, 0, TAU); ctx.fill(); ctx.restore();
  }
  // 胴
  const bg = ctx.createLinearGradient(0, -s * .6, 0, s * .6);
  bg.addColorStop(0, T.body); bg.addColorStop(.5, T.belly); bg.addColorStop(1, T.body);
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0, 0, s, s * .58, 0, 0, TAU); ctx.fill();
  if (T.patch) {
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, s, s * .58, 0, 0, TAU); ctx.clip();
    ctx.fillStyle = T.patch;
    ctx.beginPath(); ctx.ellipse(s * .35, -s * .1, s * .38, s * .3, .4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-s * .45, s * .15, s * .3, s * .26, -.3, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // 背のハイライト
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.ellipse(s * .1, 0, s * .55, s * .09, 0, 0, TAU); ctx.fill();
  // 目
  const ex = s * .55, ey = T.bigEye ? s * .5 : s * .3, er = T.bigEye ? s * .22 : s * .12;
  for (const sgn of [-1, 1]) {
    if (T.bigEye) { ctx.fillStyle = T.body; ctx.beginPath(); ctx.arc(ex, sgn * ey, er * 1.25, 0, TAU); ctx.fill(); }
    ctx.fillStyle = T.bigEye ? '#0b0a10' : '#1a1010';
    ctx.beginPath(); ctx.arc(ex, sgn * ey, er, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.arc(ex + er * .3, sgn * ey - er * .3, er * .35, 0, TAU); ctx.fill();
  }
}

function drawFish(f) {
  const s = f.T.size, a = f.drop > 0 ? 1 - f.drop / .45 : 1;
  ctx.save(); ctx.translate(f.x + 7, f.y + 10); ctx.rotate(f.a);
  ctx.globalAlpha = .18 * a; ctx.fillStyle = '#062a45';
  ctx.beginPath(); ctx.ellipse(-s * .2, 0, s * 1.2, s * .6, 0, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a); ctx.globalAlpha = a;
  fishShape(f.T, f.ph, s);
  ctx.restore();
  if (state === 'play' && poi.down && poi.state === 'ok' && catchable(f)) {
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(f.x, f.y, s + 5, 0, TAU); ctx.stroke();
  }
}

function drawPoi(t) {
  const { x, y } = poi;
  const ha = .8;
  if (poi.state === 'tearing') {
    const k = poi.tearT;
    ctx.save(); ctx.globalAlpha = k;
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    for (let i = 0; i < 4; i++) {
      const a = i * TAU / 4 + .4, off = (1 - k) * 40;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * off, y + Math.sin(a) * off + (1 - k) * 20);
      ctx.arc(x + Math.cos(a) * off, y + Math.sin(a) * off + (1 - k) * 20, POI_R * .6, a - .5, a + .5);
      ctx.fill();
    }
    ctx.strokeStyle = '#e8548e'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(x, y, POI_R, 0, TAU); ctx.stroke();
    ctx.restore();
    return;
  }
  if (state !== 'play') return;
  const down = poi.down;
  const hx = x + Math.cos(ha) * POI_R, hy = y + Math.sin(ha) * POI_R;
  if (!down) {
    ctx.save(); ctx.globalAlpha = .2; ctx.fillStyle = '#04223a';
    ctx.beginPath(); ctx.arc(x + 12, y + 18, POI_R + 3, 0, TAU); ctx.fill(); ctx.restore();
  }
  ctx.save();
  if (down) ctx.globalAlpha = .8;
  // 柄
  ctx.lineCap = 'round';
  ctx.strokeStyle = down ? '#c8487c' : '#e8548e'; ctx.lineWidth = 13;
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + Math.cos(ha) * 84, hy + Math.sin(ha) * 84); ctx.stroke();
  // 紙
  const wet = down ? .28 : .5 + .3 * poi.dur / 100;
  ctx.fillStyle = down ? `rgba(225,245,255,${wet})` : `rgba(255,255,255,${wet})`;
  ctx.beginPath(); ctx.arc(x, y, POI_R, 0, TAU); ctx.fill();
  // ひび
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, POI_R, 0, TAU); ctx.clip();
  ctx.strokeStyle = 'rgba(70,90,120,.55)'; ctx.lineWidth = 1.4;
  poi.cracks.forEach((c, i) => {
    if (poi.dur > 88 - i * 12) return;
    ctx.beginPath(); ctx.moveTo(x + c[0][0], y + c[0][1]);
    for (let j = 1; j < c.length; j++) ctx.lineTo(x + c[j][0], y + c[j][1]);
    ctx.stroke();
  });
  ctx.restore();
  // 枠
  ctx.strokeStyle = down ? '#c8487c' : '#e8548e'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(x, y, POI_R, 0, TAU); ctx.stroke();
  ctx.restore();
  if (down) {
    ctx.strokeStyle = `rgba(255,255,255,${.25 + .1 * Math.sin(t * 6)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, POI_R + 8, 0, TAU); ctx.stroke();
  }
}

function drawEffects() {
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${.5 * r.life})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(230,248,255,.85)';
  for (const d of drops) { ctx.beginPath(); ctx.arc(d.x, d.y, 2.6, 0, TAU); ctx.fill(); }
  for (const fl of flying) {
    const k = fl.t, e = 1 - Math.pow(1 - k, 2);
    const x = fl.sx + (BOWL.x - fl.sx) * e;
    const y = fl.sy + (BOWL.y - fl.sy) * e - Math.sin(k * Math.PI) * 120;
    ctx.save(); ctx.translate(x, y); ctx.rotate(fl.a + k * 8); ctx.scale(1 - k * .4, 1 - k * .4);
    fishShape(fl.T, k * 30, fl.T.size);
    ctx.restore();
  }
  ctx.textAlign = 'center';
  for (const tx of texts) {
    ctx.globalAlpha = Math.min(1, tx.life * 2);
    ctx.font = `${tx.size}px ${DISP}`;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(10,14,30,.8)'; ctx.strokeText(tx.s, tx.x, tx.y);
    ctx.fillStyle = tx.c; ctx.fillText(tx.s, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;
  if (banner) {
    const a = Math.min(1, banner.life * 2);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(10,14,30,.55)'; ctx.fillRect(0, H / 2 - 50, W, 90);
    ctx.font = `48px ${DISP}`; ctx.fillStyle = banner.c; ctx.fillText(banner.s, W / 2, H / 2 + 12);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

function panel(x, y, w, h) {
  rr(x, y, w, h, 18);
  ctx.fillStyle = 'rgba(12,16,34,.88)'; ctx.fill();
  ctx.strokeStyle = 'rgba(232,84,142,.6)'; ctx.lineWidth = 2; ctx.stroke();
}

function drawTitle(t) {
  panel(170, 150, 620, 420);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffb3a6'; ctx.font = `700 15px ${BODY}`; ctx.fillText('縁日の夜の', W / 2, 200);
  ctx.font = `50px ${DISP}`;
  ctx.lineWidth = 8; ctx.strokeStyle = '#e8452c'; ctx.strokeText('ぽいっと金魚すくい', W / 2, 256);
  ctx.fillStyle = '#fff6e8'; ctx.fillText('ぽいっと金魚すくい', W / 2, 256);
  ctx.font = `500 16px ${BODY}`; ctx.fillStyle = '#d8dcef';
  const lines = [
    '押している間、ポイが水に入る。離すと、すくい上げる。',
    '水の中で速く動かすほど紙がふやけて弱っていくわ。',
    '重い金魚ほど破れやすい。一度に何匹もすくえば倍率アップ。',
    'ポイは3本、制限時間は90秒。',
    '金ちゃんは高得点だけど臆病。30秒たつと「ぬし」が来る。',
  ];
  lines.forEach((s, i) => ctx.fillText(s, W / 2, 308 + i * 30));
  if (best > 0) { ctx.fillStyle = '#ffe27a'; ctx.font = `700 15px ${BODY}`; ctx.fillText('ハイスコア  ' + best, W / 2, 474); }
  ctx.globalAlpha = .6 + .4 * Math.sin(t * 4);
  ctx.fillStyle = '#fff'; ctx.font = `24px ${DISP}`; ctx.fillText('タップ / クリックで はじめる', W / 2, 530);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

function drawResult(t) {
  panel(150, 128, 660, 470);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffb3a6'; ctx.font = `700 15px ${BODY}`;
  ctx.fillText(endInfo.timeUp ? 'そこまで' : 'ポイが尽きた', W / 2, 172);
  ctx.fillStyle = '#ffe27a'; ctx.font = `56px ${DISP}`; ctx.fillText(score + ' 点', W / 2, 236);
  if (endInfo.isBest && score > 0) { ctx.fillStyle = '#9ff0ff'; ctx.font = `18px ${DISP}`; ctx.fillText('ハイスコア更新', W / 2, 266); }
  // 内訳
  const keys = ORDER.filter(k => caught[k]);
  ctx.font = `500 16px ${BODY}`;
  if (!keys.length) { ctx.fillStyle = '#d8dcef'; ctx.fillText('一匹もすくえなかった…', W / 2, 330); }
  const colW = 120, x0 = W / 2 - (keys.length - 1) * colW / 2;
  keys.forEach((k, i) => {
    const x = x0 + i * colW, T = TYPES[k];
    ctx.save(); ctx.translate(x, 318); ctx.rotate(-.3);
    const sc = Math.min(1.4, 22 / T.size);
    ctx.scale(sc, sc); fishShape(T, t * 6 + i, T.size); ctx.restore();
    ctx.fillStyle = '#d8dcef'; ctx.font = `700 14px ${BODY}`; ctx.fillText(T.name, x, 364);
    ctx.fillStyle = '#fff'; ctx.font = `20px ${DISP}`; ctx.fillText('×' + caught[k], x, 392);
  });
  ctx.fillStyle = '#a9b0cc'; ctx.font = `500 15px ${BODY}`;
  ctx.fillText(`残りポイ ${endInfo.left}本  +${endInfo.bonus}点`, W / 2, 428);
  const [rank, msg] = rankOf(score);
  ctx.fillStyle = '#fff6e8'; ctx.font = `30px ${DISP}`; ctx.fillText('称号：' + rank, W / 2, 476);
  ctx.fillStyle = '#d8dcef'; ctx.font = `500 15px ${BODY}`; ctx.fillText(msg, W / 2, 504);
  if (performance.now() - resultAt > 1200) {
    ctx.globalAlpha = .6 + .4 * Math.sin(t * 4);
    ctx.fillStyle = '#fff'; ctx.font = `22px ${DISP}`; ctx.fillText('タップで もう一回', W / 2, 562);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

function drawCursor() {
  if (state === 'play' || poi.state === 'tearing') return;
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 5, 0, TAU); ctx.fill();
}

function draw(t) {
  drawBackground(t);
  drawHUD(t);
  drawPool(t);
  ctx.save(); rr(POOL.x, POOL.y, POOL.w, POOL.h, POOL.r); ctx.clip();
  if (poi.down) drawPoi(t);
  for (const f of fish) drawFish(f);
  ctx.restore();
  if (!poi.down) drawPoi(t);
  drawEffects();
  if (state === 'title') drawTitle(t);
  if (state === 'result') drawResult(t);
  drawCursor();
}

/* ---------- 入力 ---------- */
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  ptr.x = (e.clientX - r.left) / r.width * W;
  ptr.y = (e.clientY - r.top) / r.height * H - (e.pointerType === 'mouse' ? 0 : 60);
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioOn();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  toCanvas(e);
  if (e.pointerType !== 'mouse') { poi.x = poi.px = ptr.x; poi.y = poi.py = ptr.y; }
  ptr.pressed = true;
  if (state === 'title') { startGame(); poi.needRelease = true; }
  else if (state === 'result' && performance.now() - resultAt > 1200) { startGame(); poi.needRelease = true; }
});
cv.addEventListener('pointermove', e => toCanvas(e));
const release = () => { ptr.pressed = false; poi.needRelease = false; };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
addEventListener('blur', release);
addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  audioOn();
  if (state === 'title' || (state === 'result' && performance.now() - resultAt > 1200)) { e.preventDefault(); startGame(); }
});

/* ---------- ループ ---------- */
resetPool();
poi.cracks = makeCracks();
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw(now / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

.tg-auto{position:fixed;z-index:2147483647;top:calc(8px + env(safe-area-inset-top,0px));left:calc(88px + env(safe-area-inset-left,0px));
  display:inline-block;margin:0;padding:6px 12px;border-radius:999px;background:rgba(12,14,24,.72);color:#fff;cursor:pointer;
  font:700 13px/1.2 "Hiragino Sans","Yu Gothic",sans-serif;letter-spacing:.06em;border:1px solid rgba(255,255,255,.35);box-shadow:none;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-tap-highlight-color:transparent;transform:none}
.tg-auto.tg-inline{position:static;flex:none}
.tg-auto[aria-pressed="true"]{background:#f5c518;color:#1a1400;border-color:#f5c518;animation:tg-auto-pulse 1.2s ease-in-out infinite alternate}
.tg-auto:focus-visible{outline:2px solid #fff;outline-offset:2px}
@keyframes tg-auto-pulse{to{box-shadow:0 0 12px rgba(245,197,24,.8)}}
@media (prefers-reduced-motion:reduce){.tg-auto[aria-pressed="true"]{animation:none}}
</style>
<script>
(function(){
  window.tgAuto = false;
  var b = document.querySelector('.tg-auto');
  if (!b) return;
  var stop = function(e){ e.stopPropagation(); };
  ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ b.addEventListener(t, stop); });
  b.addEventListener('click', function(e){
    e.stopPropagation();
    window.tgAuto = !window.tgAuto;
    b.setAttribute('aria-pressed', String(window.tgAuto));
    b.textContent = window.tgAuto ? 'AUTO ON' : 'AUTO';
    b.blur();
    window.dispatchEvent(new Event('tgauto'));
  });
})();
</script>
