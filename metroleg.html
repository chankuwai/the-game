<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#05080a;color:#d8e8e0;overflow:hidden;touch-action:none;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}

.btn.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.6);filter:brightness(1.3)}
#bFire{right:16px;bottom:calc(58px + env(safe-area-inset-bottom));width:86px;height:86px;font-size:16px;background:radial-gradient(circle at 35% 30%,#b04a3a,#5a1a12 70%)}
#bWeap{right:112px;bottom:calc(16px + env(safe-area-inset-bottom));width:62px;height:62px;background:radial-gradient(circle at 35% 30%,#4a6a8a,#1a2a3a 70%)}

#bBox{right:100px;bottom:calc(168px + env(safe-area-inset-bottom));width:50px;height:50px;font-size:11px;background:radial-gradient(circle at 35% 30%,#9a7a4a,#3a2a14 70%);display:none}

<script>/* tg-common: クリア記録・最近遊んだゲーム */

 try{var a=JSON.parse(localStorage.getItem('tg_recent')||'[]').filter(function(x){return x.id!==id;});a.unshift({id:id,t:Date.now()});localStorage.setItem('tg_recent',JSON.stringify(a.slice(0,10)));}catch(e){}})();

<script>
'use strict';
/* ================= 基本 ================= */
const T=24,VW=360,VH=420,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');const DPR=Math.min(window.devicePixelRatio||1,2.5);let SC=1;
const LC=document.createElement('canvas'),lctx=LC.getContext('2d');
function resize(){const aw=Math.min(innerWidth,480)-8,ah=innerHeight-46-200;SC=Math.max(.55,Math.min(aw/VW,ah/VH));cv.style.width=Math.round(VW*SC)+'px';cv.style.height=Math.round(VH*SC)+'px';cv.width=Math.round(VW*SC*DPR);cv.height=Math.round(VH*SC*DPR);LC.width=Math.ceil(VW/2*SC*DPR);LC.height=Math.ceil(VH/2*SC*DPR);}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,hyp=Math.hypot;
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d||0;};
const lerpA=(a,b,k)=>a+angDiff(a,b)*Math.min(1,k);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const SPD=()=>window.__speed||1;
const wait=ms=>new Promise(r=>setTimeout(r,ms/SPD()));
document.addEventListener('touchmove',e=>{if(!e.target.closest('.flist'))e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ================= 効果音 ================= */
let AC=null,NB=null,MG=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.9;MG.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function sndOn(){try{return localStorage.getItem('tg_sound')!=='0';}catch(e){return true;}}
function nbuf(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;}
function tone(f,dur,type,vol,f2,delay,at){const t=(at||AC.currentTime)+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol,freq,type,delay,f2,at){const t=(at||AC.currentTime)+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf();f.type=type||'lowpass';f.frequency.setValueAtTime(freq,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}
const SFX={
 hand(){noise(.12,.25,2200,'bandpass',0,600);tone(160,.08,'square',.05,.5);},
 supp(){noise(.06,.1,900,'lowpass',0,300);tone(900,.03,'square',.012,.5);},
 smg(){noise(.06,.16,2600,'bandpass',0,900);},
 rifle(){noise(.08,.22,1900,'bandpass',0,500);tone(120,.06,'square',.05,.5);},
 shot(){noise(.25,.35,1200,'lowpass',0,200);tone(90,.15,'square',.08,.5);},
 rocket(){noise(.6,.22,600,'lowpass',0,2000);tone(220,.5,'sawtooth',.05,.4);},
 boom(){noise(1.1,.5,700,'lowpass',0,60);tone(60,.8,'sine',.3,.4);},
 bigboom(){noise(2,.6,500,'lowpass',0,40);tone(45,1.6,'sine',.35,.4);noise(1.2,.3,2000,'bandpass',.1,200);},
 enemy(){noise(.1,.13,1800,'bandpass',0,500);},
 hit(){noise(.08,.15,3000,'highpass');},
 ting(){tone(2400,.06,'square',.03,.6);},
 alert(){tone(880,.09,'square',.12);tone(1320,.3,'square',.12,0,.09);},
 huh(){tone(500,.15,'triangle',.08,1.6);},
 pick(){tone(660,.08,'triangle',.07);tone(990,.12,'triangle',.06,0,.07);},
 key(){[660,880,1320].forEach((f,i)=>tone(f,.12,'triangle',.07,0,i*.07));},
 door(){noise(.4,.12,500,'lowpass',0,150);tone(140,.3,'sine',.05,.7);},
 hurt(){tone(300,.18,'square',.07,.4);},
 step(){noise(.05,.05,400,'lowpass');},
 stomp(){noise(.25,.25,200,'lowpass',0,60);tone(50,.25,'sine',.25,.6);},
 laser(){tone(1400,.5,'sawtooth',.04,.3);},
 radio(){tone(1200,.05,'square',.03);tone(1600,.05,'square',.03,0,.06);},
 codec(){[0,.14,.28,.6,.74,.88].forEach(d=>tone(1480,.08,'square',.03,0,d));},
 dead(){[392,330,262,196].forEach((f,i)=>tone(f,.4,'triangle',.08,0,i*.2));},
 win(){[392,523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.07,0,i*.14));},
 thud(){noise(.15,.25,300,'lowpass');tone(90,.12,'sine',.12,.6);},
 punch(){noise(.08,.2,800,'lowpass');tone(140,.06,'sine',.08,.5);},
 bark(){tone(420,.08,'sawtooth',.08,.6);tone(380,.1,'sawtooth',.07,.6,.13);},
 box(){noise(.12,.1,600,'lowpass');},
 throw(){noise(.15,.06,1200,'bandpass',0,400);},
 flash(){noise(.5,.3,4000,'highpass');tone(2800,.5,'sine',.05,.8);},
 swish(){noise(.18,.12,3000,'bandpass',0,800);},
 slash(){noise(.12,.2,4000,'highpass');tone(1800,.1,'sawtooth',.04,.4);},
 minigun(){noise(.05,.12,1500,'bandpass',0,600);},
 rotor(){noise(.1,.1,160,'lowpass');},
 crate(){noise(.3,.22,500,'lowpass',0,120);},
 beep(){tone(1800,.06,'square',.04);},
 lasertrip(){tone(1000,.12,'square',.08);tone(700,.2,'square',.08,0,.12);},
 charge(){tone(160,1.3,'sawtooth',.05,6);},
 rail(){noise(.9,.45,3000,'lowpass',0,100);tone(70,.9,'sawtooth',.15,.3);},
 reveal(){tone(600,.25,'sine',.05,2);},
 menu(){tone(880,.05,'triangle',.05);},
 gog(){tone(300,.25,'sine',.05,4);},
 file(){[523,659,784].forEach((f,i)=>tone(f,.18,'sine',.06,0,i*.09));},
 kunai(){noise(.1,.1,5000,'highpass');},
 heavy(){noise(.18,.3,900,'lowpass',0,150);tone(80,.12,'square',.08,.5);},
 siren(){tone(600,.45,'sawtooth',.035,1.6);tone(960,.45,'sawtooth',.035,.62,.45);},
 debris(){noise(.5,.25,350,'lowpass',0,80);},
};
const sfxLast={};
function sfx(n,gap){if(!sndOn()||!ac())return;const now=performance.now();if(gap&&sfxLast[n]&&now-sfxLast[n]<gap)return;sfxLast[n]=now;try{SFX[n]();}catch(e){}}
addEventListener('pointerdown',()=>{if(sndOn())ac();},{capture:true});

/* ================= BGM ================= */
const BGM={mode:'none',next:0,beat:0};
function setBgm(m){if(BGM.mode!==m){BGM.mode=m;BGM.beat=0;}}
function chord(t,fs,dur,vol,type){for(const f of fs)tone(f,dur,type||'triangle',vol,0,0,t);}
const BG={
 title:{bpm:66,f(b,t){if(b%16===0)chord(t,[110,164.8,220,261.6],5,.02);if(b%16===8)chord(t,[98,146.8,196,246.9],5,.02);if(b%4===0)tone(55,.9,'sine',.05,0,0,t);const m=[659,587,523,494,523,0,440,0];if(b%2===0&&m[(b>>1)%8]&&b%32>=16)tone(m[(b>>1)%8],.5,'sine',.012,0,0,t);}},
 sneak:{bpm:84,f(b,t){const B=[55,55,65.4,55,49,55,58.3,55];if(b%4===0)tone(B[(b>>2)%8],.5,'sine',.06,0,0,t);if(b%2===1)noise(.03,.012,6000,'highpass',0,0,t);if(b%32===0)chord(t,[220,261.6,329.6],4,.011);if(b%32===16)chord(t,[196,246.9,293.7],4,.011);if(b%64===40)tone(880,1.2,'sine',.008,.5,0,t);}},
 caution:{bpm:104,f(b,t){const B=[55,55,58.3,55];if(b%2===0)tone(B[(b>>1)%4],.25,'sine',.06,0,0,t);noise(.02,.014,7000,'highpass',0,0,t);if(b%8===4)tone(440,.12,'triangle',.02,0,0,t);if(b%16===0)chord(t,[220,261.6,311.1],2,.012);}},
 alert:{bpm:152,f(b,t){const B=[110,110,130.8,110,98,110,146.8,130.8];tone(B[b%8]/2,.13,'sawtooth',.045,0,0,t);if(b%4===2)noise(.1,.07,1800,'bandpass',0,0,t);if(b%2===0)noise(.02,.02,8000,'highpass',0,0,t);if(b%8===0)tone(440,.12,'square',.018,0,0,t);if(b%16===12)tone(523,.25,'square',.016,0,0,t);}},
 boss:{bpm:140,f(b,t){const B=[73.4,73.4,87.3,73.4,65.4,73.4,98,87.3];tone(B[b%8],.15,'sawtooth',.05,0,0,t);if(b%4===0)noise(.12,.1,150,'lowpass',0,0,t);if(b%4===2)noise(.1,.07,1800,'bandpass',0,0,t);if(b%16===0)chord(t,[293.7,349.2,440],1.4,.013,'square');if(b%16===8)chord(t,[261.6,329.6,392],1.4,.013,'square');}},
 escape:{bpm:170,f(b,t){const B=[82.4,82.4,98,82.4,110,98,82.4,123.5];tone(B[b%8],.1,'sawtooth',.05,0,0,t);if(b%2===0)noise(.1,.08,140,'lowpass',0,0,t);if(b%4===2)noise(.08,.07,2000,'bandpass',0,0,t);if(b%8===0)tone(659,.15,'square',.015,0,0,t);}},
 ending:{bpm:70,f(b,t){const C=[[220,277.2,329.6],[185,233,277.2],[196,246.9,293.7],[220,277.2,329.6]];if(b%16===0)chord(t,C[(b>>4)%4],5,.018);if(b%4===0)tone(C[(b>>4)%4][0]/2,1,'sine',.05,0,0,t);const m=[659,0,740,659,554,0,587,0];if(b%2===0&&m[(b>>1)%8])tone(m[(b>>1)%8],.8,'sine',.014,0,0,t);}},
};
setInterval(()=>{if(!AC||!sndOn()||!BG[BGM.mode])return;const m=BG[BGM.mode],sp=60/m.bpm/2,now=AC.currentTime;if(BGM.next<now)BGM.next=now+.05;let n=0;while(BGM.next<now+.25&&n<8){try{m.f(BGM.beat,BGM.next);}catch(e){}BGM.next+=sp;BGM.beat++;n++;}},60);

/* ================= 入力 ================= */

function lightAt(x,y){let l=0;for(const L of A.lamps){const d=hyp(L.x-x,L.y-y);if(d<L.r)l=Math.max(l,1-d/L.r);}
 for(const s of A.sls){const d=hyp(s.lx-x,s.ly-y);if(d<40)l=1;}
 if(A.def.dark>.45)for(const g of A.guards){if(!alive(g)||g.kind==='dog')continue;const dx=x-g.x,dy=y-g.y,d=hyp(dx,dy);if(d<120&&Math.abs(angDiff(g.a,Math.atan2(dy,dx)))<.4)l=Math.max(l,.8);}
 if(P&&P.muzzle>0)l=1;return l;}
function inSafe(x,y){return !!(A&&A.safe&&hyp(x-A.safe.x,y-A.safe.y)<A.safe.r);}
function playerVis(){if(inSafe(P.x,P.y))return 0;const ch=tileAt(P.x,P.y);if(ch==='V')return 0;if(P.box&&P.still>.3)return 0;
 let m=1;if(P.crouch)m*=.62;if(ch==='G')m*=P.crouch?.28:.72;if(P.box)m*=.45;if(S.camo)m*=.3;
 if(A.def.dark>.3)m*=lerp(1-A.def.dark*.5,1.08,lightAt(P.x,P.y));if(A.def.rain)m*=.93;return m;}
function canSee(o,range,fov){const dx=P.x-o.x,dy=P.y-o.y,d=hyp(dx,dy);const v=playerVis();if(v<=0)return 0;const R=range*v;if(d>R&&d>18)return 0;if(d>18&&Math.abs(angDiff(o.a,Math.atan2(dy,dx)))>fov/2)return 0;if(!los(o.x,o.y,P.x,P.y))return 0;return 1-d/Math.max(R,1)*.7;}
function sightR(){return 135*diff.sight*(phase==='caution'?1.2:1);}

 if(I.crouch){if(P.box){P.box=false;}P.crouch=!P.crouch;if(!P.crouch&&blocked(P.x,P.y,6,'p')){P.crouch=true;toast('ここでは立てない');}}

 if(I.gog&&S.gog){P.gog=!P.gog;sfx('gog');toast(P.gog?'サーマルゴーグル ON':'サーマルゴーグル OFF','#9affc0');}
 if(I.weap){const o=owned();setWeapon(o[(o.indexOf(S.cur)+1)%o.length]);}

 let mx=I.mx,my=I.my;const m=hyp(mx,my);if(m>1){mx/=m;my/=m;}
 P.moving=m>.15;
 if(P.moving){const run=m>=.62&&!P.crouch&&!P.box;const sp=P.box?46:P.crouch?40:run?100:54;const ox=P.x,oy=P.y;const ux=mx/(hyp(mx,my)||1),uy=my/(hyp(mx,my)||1);moveCirc(P,ux*sp*dt,uy*sp*dt,6.5,'p');

  if(P.aimT<=0)P.a=Math.atan2(my,mx);P.walk+=dt*sp*.12;P.still=0;
  P.stepT-=dt;if(P.stepT<=0){P.stepT=run?.34:.5;if(run){makeNoiseSoft(P.x,P.y,A.def.rain?48:76);if(tileAt(P.x,P.y)===',')fx.push({t:'ring',x:P.x,y:P.y+4,life:.5,c:'#8ab0d0'});}}}

function bossTick(b,dt){b.flash=Math.max(0,b.flash-dt);if(b.say&&(b.say.t-=dt)<=0)b.say=null;}
function bossDie(b){b.hp=0;b.dying=.01;sfx('bigboom');shk=12;hitstop=.25;flashWhite=.5;}
function bossLoop(b,dt){if(b.dying>0){b.dying+=dt;if(Math.random()<dt*12)boom(b.x+rnd(-40,40),b.y+rnd(-40,40),26,0,true,'boss');if(b.dying>(b.kind==='metro'?4:2.6)&&state==='play'){state='cine';bossDown();}return true;}return false;}
function enemyGrenade(x,y,tx,ty,t){grenades.push({x,y,vx:(tx-x)/(t||.9),vy:(ty-y)/(t||.9),t:0,k:'eg',fly:t||.9,fuse:(t||.9)+.35});}

/* ================= ブル ================= */
function mkBull(){const sp=A.bossSpawn,hp=1000*diff.bhp;return {name:'ブル',title:'ゼロライン 重装突撃兵',x:sp.x,y:sp.y,a:Math.PI/2,hp,max:hp,att:null,t:2.4,ph:1,walk:0,spin:0,r:17,
 targetable(){return !this.dying;},
 hitTest(b){if(hyp(b.x-this.x,b.y-this.y)<this.r){const back=Math.abs(angDiff(this.a,Math.atan2(b.y-this.y,b.x-this.x)))>2.1;this.hurt(b.dmg*(back?1.8:b.k==='rocket'?1:.6),b.k==='rocket',back);if(back)fx.push({t:'txt',x:this.x,y:this.y-30,s:'弾薬ドラム！',c:'#ffd75e',life:.6});return true;}return false;},
 blast(x,y,r,d){if(hyp(x-this.x,y-this.y)<r+this.r)this.hurt(d,true);},
 hurt(d,expl){if(this.dying)return;const m=(this.stun>0?1.6:1);this.hp-=d*m;this.flash=.08;bossTxt(this,d*m,expl||m>1);if(this.hp<this.max/2&&this.ph===1){this.ph=2;bossSay(this,'面白ぇ…本気で行くぜ！');sfx('alert');}if(this.hp<=0)bossDie(this);},
 update(dt){const b=this;bossTick(b,dt);if(bossLoop(b,dt))return;const dx=P.x-b.x,dy=P.y-b.y,d=hyp(dx,dy)||1,ta=Math.atan2(dy,dx);
  if(b.stun>0){b.stun-=dt;return;}
  if(!b.att){b.a=lerpA(b.a,ta,dt*2.5);let mx=0,my=0;if(d>170){mx=dx/d;my=dy/d;}else if(d<110){mx=-dx/d;my=-dy/d;}else{mx=-dy/d*.6;my=dx/d*.6;}moveCirc(b,mx*40*dt,my*40*dt,14,'b');b.walk+=dt*6;
   b.t-=dt;if(b.t<=0){const k=pick(b.ph===2?['sweep','sweep','gren','rush']:['sweep','gren','rush']);b.att={k,ph:'tele',t:0,a0:ta-.85,a1:ta+.85,n:0};if(k==='sweep'){bossSay(b,pick(['蜂の巣にしてやる！','隠れてみろ、ネズミ！','回れ回れぇ！']));sfx('charge');}if(k==='rush')sfx('stomp');}}
  else{const at=b.att;at.t+=dt;
   if(at.k==='sweep'){const dur=b.ph===2?2.8:2.1;if(at.ph==='tele'){b.a=lerpA(b.a,ta,dt*3);at.a0=b.a-.85;at.a1=b.a+.85;if(at.t>.8){at.ph='fire';at.t=0;}}
    else{const k=at.t/dur;const aa=b.ph===2?lerp(at.a0,at.a1,(1-Math.cos(k*TAU*1.5))/2):lerp(at.a0,at.a1,k);b.a=aa;b.spin+=dt*40;if(at.t>at.n*.05){at.n++;const sx=b.x+Math.cos(aa)*22,sy=b.y+Math.sin(aa)*22,a2=aa+rnd(-.05,.05);ebullets.push({x:sx,y:sy,vx:Math.cos(a2)*390,vy:Math.sin(a2)*390,dmg:5,life:1.2,heavy:1});sfx('minigun',45);if(at.n%3===0)casings.push({x:b.x,y:b.y,vx:rnd(-60,60),vy:rnd(-60,60),z:8,vz:50,life:2,r:0});}if(at.t>dur)bullEnd();}}
   else if(at.k==='gren'){if(at.t>.5&&!at.done){at.done=1;const n=b.ph===2?5:3;for(let i=0;i<n;i++){const tx=P.x+rnd(-50,50)*(i?1:0),ty=P.y+rnd(-50,50)*(i?1:0);enemyGrenade(b.x,b.y,tx,ty,.8+i*.08);}sfx('throw');bossSay(b,'こいつも喰らえ！');}if(at.t>1.3)bullEnd();}
   else if(at.k==='rush'){if(at.ph==='tele'){b.a=lerpA(b.a,ta,dt*4);if(at.t>.75){at.ph='go';at.t=0;at.dir=b.a;}}
    else{const sp=270*dt,nx=b.x+Math.cos(at.dir)*sp,ny=b.y+Math.sin(at.dir)*sp;b.walk+=dt*14;if(blocked(nx,ny,14,'b')){const tx=Math.floor((nx+Math.cos(at.dir)*12)/T),ty=Math.floor((ny+Math.sin(at.dir)*12)/T);if((A.g[ty]||[])[tx]==='C'){A.g[ty][tx]='.';delete tileCache[A.i];sfx('crate');A.decals.push({k:'debris',x:tx*T+12,y:ty*T+12});}shk=8;sfx('stomp');b.stun=1.7;bossSay(b,'ぐおっ…！',1.4);toast('ブルがよろめいた！ 今だ','#9affc0');bullEnd();}else{b.x=nx;b.y=ny;}
     if(hyp(P.x-b.x,P.y-b.y)<26){hurtP(24,b.x,b.y);const k=hyp(P.x-b.x,P.y-b.y)||1;moveCirc(P,(P.x-b.x)/k*24,(P.y-b.y)/k*24,6.5,'p');bullEnd();}if(at.t>1.2)bullEnd();}}}
  if(A.guards.filter(alive).length===0&&b.ph===2&&Math.random()<dt*.03){}},
 draw(g,t){const b=this;const at=b.att;
  if(at&&at.k==='sweep'&&at.ph==='tele'){g.fillStyle='rgba(255,40,30,.12)';g.beginPath();g.moveTo(b.x,b.y);g.arc(b.x,b.y,300,at.a0,at.a1);g.closePath();g.fill();g.strokeStyle='rgba(255,60,40,.5)';g.stroke();}
  if(at&&at.k==='rush'&&at.ph==='tele'){g.strokeStyle='rgba(255,60,40,.35)';g.lineWidth=30;g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x+Math.cos(b.a)*260,b.y+Math.sin(b.a)*260);g.stroke();g.lineWidth=1;}
  drawHuman(g,b.x+(b.stun>0?rnd(-1,1):0),b.y,b.a,{scale:1.55,body:'#4a3a2a',vest:'#2a2a24',helm:null,hair:'#1a1a1a',mohawk:1,skin:'#b08860',walk:b.walk,gun:'minigun',spin:b.spin,flash:b.flash,drum:1,dead:b.dying>0});
  if(b.stun>0)drawStars(g,b.x,b.y-26,t);}};}

/* ================= ミラージュ ================= */
function mkMirage(){const sp=A.bossSpawn,hp=480*diff.bhp;return {name:'ミラージュ',title:'光学迷彩の暗殺者',x:sp.x,y:sp.y,a:Math.PI/2,hp,max:hp,att:null,t:3,ph:1,vis:1,rev:3,tx:sp.x,ty:sp.y,mt:0,stepT:0,walk:0,decoys:[],r:12,
 targetable(){return !this.dying&&(this.vis>.5||P.gog);},
 hitTest(b){for(const dc of this.decoys){if(hyp(b.x-dc.x,b.y-dc.y)<12){dc.dead=1;smokes.push({x:dc.x,y:dc.y,r:8,vr:30,life:.6,max:.6,vx:0,vy:0});sfx('reveal');return true;}}if(hyp(b.x-this.x,b.y-this.y)<this.r){this.hurt(b.dmg,b.k==='rocket');return true;}return false;},
 blast(x,y,r,d){if(hyp(x-this.x,y-this.y)<r+this.r)this.hurt(d*.8,true);},
 stunHit(x,y,r){if(hyp(x-this.x,y-this.y)<r+20){this.rev=4;this.stun=2.6;this.att=null;bossSay(this,'くっ……目が……！');}for(const dc of this.decoys)if(hyp(x-dc.x,y-dc.y)<r)dc.dead=1;},
 hurt(d,expl){if(this.dying)return;const m=this.stun>0?1.6:1;this.hp-=d*m;this.flash=.08;this.rev=Math.max(this.rev,1.8);bossTxt(this,d*m,expl||m>1);if(Math.random()<.15)bossSay(this,'っ……！',1);if(this.hp<this.max/2&&this.ph===1){this.ph=2;bossSay(this,'いいわ……本気で消してあげる。');sfx('reveal');}if(this.hp<=0)bossDie(this);},
 update(dt){const b=this;bossTick(b,dt);b.vis=lerp(b.vis,(b.rev>0||b.dying||(b.att&&b.att.ph==='tele'))?1:0,Math.min(1,dt*6));if(bossLoop(b,dt))return;b.rev=Math.max(0,b.rev-dt);
  for(const dc of b.decoys){dc.life-=dt;dc.a+=dt*1.2;dc.x+=Math.cos(dc.a)*40*dt;dc.y+=Math.sin(dc.a)*40*dt;if(blocked(dc.x,dc.y,8,'b')){dc.a+=Math.PI;}dc.k=(dc.k||0)-dt;if(dc.k<=0){dc.k=rnd(1.4,2.4);const aa=Math.atan2(P.y-dc.y,P.x-dc.x);ebullets.push({x:dc.x,y:dc.y,vx:Math.cos(aa)*260,vy:Math.sin(aa)*260,dmg:0,life:.9,kunai:1,fake:1});}}b.decoys=b.decoys.filter(d=>!d.dead&&d.life>0);
  if(b.stun>0){b.stun-=dt;return;}
  const dx=P.x-b.x,dy=P.y-b.y,d=hyp(dx,dy)||1,ta=Math.atan2(dy,dx);
  if(!b.att){b.mt-=dt;if(b.mt<=0||hyp(b.tx-b.x,b.ty-b.y)<8){b.mt=rnd(1.5,2.6);for(let k=0;k<10;k++){const a=rnd(0,TAU),r=rnd(110,170),tx=P.x+Math.cos(a)*r,ty=P.y+Math.sin(a)*r;if(!blocked(tx,ty,10,'b')){b.tx=tx;b.ty=ty;break;}}}
   const mx=b.tx-b.x,my=b.ty-b.y,md=hyp(mx,my)||1;if(md>6){moveCirc(b,mx/md*95*dt,my/md*95*dt,9,'b');b.walk+=dt*12;b.a=lerpA(b.a,Math.atan2(my,mx),dt*8);b.stepT-=dt;if(b.stepT<=0){b.stepT=.42;fx.push({t:'ring',x:b.x,y:b.y+4,life:.55,c:'#9ad0ff'});}}else b.a=lerpA(b.a,ta,dt*6);
   b.t-=dt;if(b.t<=0){const opts=b.ph===2?['kunai','dash','dash','decoy']:['kunai','dash'];let k=pick(opts);if(k==='decoy'&&b.decoys.length)k='kunai';b.att={k,ph:'tele',t:0,tx:P.x,ty:P.y};sfx('swish');}}
  else{const at=b.att;at.t+=dt;b.a=lerpA(b.a,at.k==='dash'&&at.ph==='go'?at.dir:ta,dt*10);
   if(at.k==='kunai'){if(at.t>.5&&!at.done){at.done=1;const n=b.ph===2?5:3;for(let i=0;i<n;i++){const aa=ta+(i-(n-1)/2)*.18;ebullets.push({x:b.x,y:b.y,vx:Math.cos(aa)*300,vy:Math.sin(aa)*300,dmg:9,life:1.4,kunai:1});}sfx('kunai');}if(at.t>.9)mirEnd();}
   else if(at.k==='dash'){if(at.ph==='tele'){at.tx=lerp(at.tx,P.x,dt*2);at.ty=lerp(at.ty,P.y,dt*2);if(at.t>.6){at.ph='go';at.t=0;at.dir=Math.atan2(at.ty-b.y,at.tx-b.x);at.len=Math.min(260,hyp(at.tx-b.x,at.ty-b.y)+50);at.hit=0;sfx('slash');}}
    else{const sp=560*dt;moveCirc(b,Math.cos(at.dir)*sp,Math.sin(at.dir)*sp,9,'b');at.len-=sp;fx.push({t:'ghost',x:b.x,y:b.y,a:b.a,life:.25});if(!at.hit&&hyp(P.x-b.x,P.y-b.y)<18){at.hit=1;hurtP(22,b.x,b.y);}if(at.len<=0||at.t>.6)mirEnd();}}
   else if(at.k==='decoy'){if(at.t>.4&&!at.done){at.done=1;for(let i=0;i<3;i++){const a=i/3*TAU;b.decoys.push({x:b.x+Math.cos(a)*30,y:b.y+Math.sin(a)*30,a:a,life:7});}bossSay(b,'どれが本物かしら？');}if(at.t>.8){mirEnd();b.rev=0;}}}},
 draw(g,t){const b=this;const at=b.att;
  if(at&&at.k==='dash'&&at.ph==='tele'){g.strokeStyle='rgba(255,40,60,.6)';g.lineWidth=2;g.setLineDash([8,6]);g.beginPath();g.moveTo(b.x,b.y);g.lineTo(at.tx,at.ty);g.stroke();g.setLineDash([]);g.lineWidth=1;}
  for(const dc of b.decoys)drawMirage(g,dc.x,dc.y,dc.a,t,.45+Math.sin(t*9+dc.x)*.1,false);
  drawMirage(g,b.x,b.y,b.a,t,b.vis,P.gog,b.flash>0,b.walk,b.dying>0);if(b.stun>0)drawStars(g,b.x,b.y-18,t);}};}
function mirEnd(){boss.att=null;boss.t=boss.ph===2?1.5:2.1;}

/* ================= 攻撃ヘリ ================= */
function mkHeli(){const hp=1150*diff.bhp,cx=A.w*T/2,cy=A.h*T/2-T;return {name:'ブラックホーネット',title:'攻撃ヘリ（操縦：クロウ）',x:cx,y:cy-140,a:Math.PI/2,hp,max:hp,att:null,t:3,ph:1,cx,cy,orb:Math.PI*1.5,rot:0,r:30,vx:0,vy:0,spinOut:0,tilt:0,
 targetable(){return !this.dying;},
 hitTest(b){if(hyp(b.x-this.x,b.y-this.y)<this.r){const m=b.k==='rocket'?1.2:b.k==='rifle'?.5:.32;if(b.k==='rocket')boom(b.x,b.y,40,0,true,'boss');this.hurt(b.dmg*m,b.k==='rocket');sfx('ting',60);return true;}return false;},
 blast(x,y,r,d){},
 hurt(d,expl){if(this.dying)return;this.hp-=d;this.flash=.08;bossTxt(this,d,expl);if(this.hp<this.max/2&&this.ph===1){this.ph=2;toast('ヘリが損傷！ 攻撃が激しくなる','#ff8a6a');sfx('alert');}if(this.hp<=0){bossDie(this);this.spinOut=1;}},
 update(dt){const b=this;bossTick(b,dt);b.rot+=dt*30;sfx('rotor',110);
  if(b.dying>0){b.dying+=dt;b.a+=dt*5;b.x+=Math.cos(b.dying)*90*dt;b.y-=40*dt;if(Math.random()<dt*10)boom(b.x+rnd(-20,20),b.y+rnd(-20,20),20,0,true,'boss');smokes.push({x:b.x,y:b.y,r:6,vr:20,life:1.2,max:1.2,vx:0,vy:-10,dark:1});if(b.dying>3&&state==='play'){boom(b.x,b.y,90,0,true,'boss');sfx('bigboom');state='cine';bossDown();}return;}
  if(b.ph===2&&Math.random()<dt*8)smokes.push({x:b.x+rnd(-6,6),y:b.y+rnd(-6,6),r:5,vr:16,life:1,max:1,vx:0,vy:-6,dark:1});
  const ta=Math.atan2(P.y-b.y,P.x-b.x);
  if(!b.att){b.orb+=dt*(b.ph===2?.5:.35);const R=150+Math.sin(gameT*.7)*25;const tx=b.cx+Math.cos(b.orb)*R,ty=b.cy+Math.sin(b.orb)*R*.8;b.x=lerp(b.x,tx,dt*1.2);b.y=lerp(b.y,ty,dt*1.2);b.a=lerpA(b.a,ta,dt*2);
   b.t-=dt;if(b.t<=0){const k=pick(b.ph===2?['strafe','missile','strafe','drop','missile']:['strafe','missile','drop']);const alive2=A.guards.filter(alive).length;b.att={k:k==='drop'&&alive2>=3?'missile':k,ph:'tele',t:0};const at=b.att;
    if(at.k==='strafe'){const a=Math.atan2(P.y-b.y,P.x-b.x)+rnd(-.3,.3);at.sx=P.x-Math.cos(a)*260;at.sy=P.y-Math.sin(a)*260;at.ex=P.x+Math.cos(a)*260;at.ey=P.y+Math.sin(a)*260;at.dir=a;}
    if(at.k==='missile'){at.tg=[];const n=b.ph===2?7:4;for(let i=0;i<n;i++)at.tg.push({x:P.x+rnd(-60,60)*(i?1:0),y:P.y+rnd(-60,60)*(i?1:0)});sfx('laser');}
    if(at.k==='drop'){at.hx=clamp(P.x+rnd(-90,90),3*T,(A.w-3)*T);at.hy=clamp(P.y-rnd(60,120),3*T,(A.h-3)*T);}}}
  else{const at=b.att;at.t+=dt;
   if(at.k==='strafe'){if(at.ph==='tele'){b.x=lerp(b.x,at.sx,dt*2.5);b.y=lerp(b.y,at.sy,dt*2.5);b.a=lerpA(b.a,at.dir,dt*4);if(at.t>1.2){at.ph='go';at.t=0;b.x=at.sx;b.y=at.sy;}}
    else{const sp=(b.ph===2?320:270)*dt;b.x+=Math.cos(at.dir)*sp;b.y+=Math.sin(at.dir)*sp;b.a=at.dir;at.n=(at.n||0)+dt;if(at.n>.045){at.n=0;strikes.push({x:b.x+Math.cos(at.dir)*42+rnd(-8,8),y:b.y+Math.sin(at.dir)*42+rnd(-8,8),t:.12,dmg:9});sfx('minigun',45);}if(hyp(b.x-at.ex,b.y-at.ey)<20||at.t>2.2)heliEnd();}}
   else if(at.k==='missile'){b.a=lerpA(b.a,ta,dt*2);if(at.t>1.4){for(const p of at.tg)boom(p.x,p.y,34,26,true,'boss');heliEnd();}}
   else if(at.k==='drop'){b.x=lerp(b.x,at.hx,dt*2);b.y=lerp(b.y,at.hy,dt*2);if(at.t>1.4&&!at.done){at.done=1;for(let i=0;i<2;i++){let gx=at.hx+rnd(-30,30),gy=at.hy+rnd(-20,30);if(blocked(gx,gy,7,'g')){gx=at.hx;gy=at.hy;}if(!blocked(gx,gy,7,'g')){const g=mkGuard('sol',gx,gy,ta);g.st='alert';g.drop=1;A.guards.push(g);}}toast('敵兵が降下してきた！','#ff8a6a');}if(at.t>2.4)heliEnd();}}},

/* ================= メトロレッグ ================= */
function mkMetro(){const hp=1800*diff.bhp;const b={name:'メトロレッグ',title:'多脚核搭載戦車（搭乗：ゼロ）',x:16*T+12,y:7*T,a:Math.PI/2,hp,max:hp,att:null,t:3,ph:1,legs:[],down:0,r:40,php:{},
 targetable(){return !this.dying;},
 legHit(x,y){for(const l of this.legs){if(l.broken)continue;const hx=this.x+Math.cos(this.a+l.la)*30,hy=this.y+Math.sin(this.a+l.la)*30;const kx=(hx+l.fx)/2,ky=(hy+l.fy)/2;if(hyp(x-kx,y-ky)<13||hyp(x-l.fx,y-l.fy)<12)return l;}return null;},
 hitTest(bl){const l=this.legHit(bl.x,bl.y);if(l&&bl.k!=='rocket'){this.hurtLeg(l,bl.dmg*.5);sfx('ting',60);return true;}if(l&&bl.k==='rocket'){boom(bl.x,bl.y,62,140);return true;}if(hyp(bl.x-this.x,bl.y-this.y)<this.r){if(bl.k==='rocket')boom(bl.x,bl.y,62,140);else{this.hurt(bl.dmg,false);sfx('ting',60);}return true;}return false;},
 blast(x,y,r,d){if(this.dying)return;for(const l of this.legs){if(l.broken)continue;const hx=this.x+Math.cos(this.a+l.la)*30,hy=this.y+Math.sin(this.a+l.la)*30;if(hyp(x-(hx+l.fx)/2,y-(hy+l.fy)/2)<r+6||hyp(x-l.fx,y-l.fy)<r)this.hurtLeg(l,d*.9);}if(hyp(x-this.x,y-this.y)<r+this.r)this.hurt(d,true);},
 hurtLeg(l,d){if(l.broken||this.dying)return;l.hp-=d;l.flash=.08;fx.push({t:'txt',x:l.fx,y:l.fy-14,s:Math.round(d)+'',c:'#ffb070',life:.7});if(l.hp<=0){l.broken=true;l.hp=0;boom(l.fx,l.fy,30,0,true,'boss');toast('脚部を破壊した！','#ffd75e');shk=8;
   const R=this.legs.filter(q=>q.la>0&&q.broken).length,L=this.legs.filter(q=>q.la<0&&q.broken).length,n=this.legs.filter(q=>q.broken).length;if((R>=2||L>=2||n>=3)&&!this.down){this.down=5.5;this.att=null;sfx('bigboom');toast('メトロレッグ転倒！ コアを狙え！','#9affc0');shk=14;}}},

const ai={path:null,pt:0,lx:0,ly:0,stuck:0,jit:0,ja:0};
function aiInput(dt){const I={mx:0,my:0,fire:false,weap:false,crouch:false,ration:false,box:false,gog:false,setW:null};
 if(P.hp<40&&S.rations>0)I.ration=true;if(P.box)I.box=true;
 const wantGog=S.gog&&((boss&&boss.kind==='mirage')||A.def.dark>.55);if(S.gog&&P.gog!==wantGog)I.gog=true;
 const has=k=>S.own[k]&&S.ammo[k]>0;
 let want='hand';if(boss){if(boss.kind==='heli')want=has('rocket')?'rocket':has('rifle')?'rifle':has('smg')?'smg':'hand';else if(boss.kind==='mirage')want=has('shot')?'shot':has('smg')?'smg':'hand';else want=has('rocket')?'rocket':has('rifle')?'rifle':has('smg')?'smg':'hand';}
 else if(phase==='alert'||A.def.escape)want=has('rifle')?'rifle':has('smg')?'smg':'hand';if(!has(want))want='hand';if(S.cur!==want)I.setW=want;
 const tg=aimTarget(boss?340:200);const near=A.guards.find(g=>alive(g)&&hyp(g.x-P.x,g.y-P.y)<24);
 if(near)I.fire=true;else if(tg&&(boss||hyp(tg.x-P.x,tg.y-P.y)<190))I.fire=true;
 if(boss&&boss.kind==='mirage'&&!boss.dying&&boss.vis<.5&&!P.gog&&hyp(boss.x-P.x,boss.y-P.y)<200){I.aim=Math.atan2(boss.y-P.y,boss.x-P.x)+rnd(-.15,.15);I.fire=true;}
 if(boss){if(boss.dying){I.fire=false;return I;}return aiBoss(I,dt);}
 const curCh=tileAt(P.x,P.y);
 const gk=(A.def.goals||[]).find(k=>k==='@'?!(A.hostage&&A.hostage.saved):A.items.some(i=>i.k===k));let tx,ty;
 if(gk==='@'){tx=A.hostage.tx;ty=A.hostage.ty;}else if(gk){const it=A.items.find(i=>i.k===gk);if(it){tx=Math.floor(it.x/T);ty=Math.floor(it.y/T);}}
 if(tx===undefined&&A.exit){tx=A.exit.x;ty=A.exit.y;}
 ai.pt-=dt;if(ai.pt<=0||!ai.path){ai.pt=.5;ai.path=bfs(Math.floor(P.x/T),Math.floor(P.y/T),tx,ty,{keys:true,ai:!A.def.tut,duct:true});}
 let wantCrouch=curCh==='V';
 if(ai.path&&ai.path.length){const [nx,ny]=ai.path[0];if(A.g[ny][nx]==='V'||(ai.path[1]&&A.g[ai.path[1][1]][ai.path[1][0]]==='V'))wantCrouch=true;const px=nx*T+T/2,py=ny*T+T/2;const dx=px-P.x,dy=py-P.y,d=hyp(dx,dy);if(d<4)ai.path.shift();else{const sp=1;I.mx=dx/d*sp;I.my=dy/d*sp;}
  if(A.g[ny][nx]==='@'&&d<30){I.mx=I.my=0;}}
 if(wantCrouch!==P.crouch)I.crouch=true;
 if(hyp(P.x-ai.lx,P.y-ai.ly)<.5&&(I.mx||I.my)){ai.stuck+=dt;if(ai.stuck>1.2){ai.jit=.5;ai.ja=rnd(0,TAU);ai.stuck=0;ai.path=null;}}else ai.stuck=0;ai.lx=P.x;ai.ly=P.y;
 if(ai.jit>0){ai.jit-=dt;I.mx=Math.cos(ai.ja);I.my=Math.sin(ai.ja);}
 return I;}
function aiBoss(I,dt){const b=boss;const tx=b.x,ty=b.y;const dx=P.x-tx,dy=P.y-ty,d=hyp(dx,dy)||1;const band=b.kind==='bull'?[150,220]:b.kind==='mirage'?[80,150]:b.kind==='heli'?[110,190]:[160,230];
 let mx=0,my=0;if(d<band[0]){mx=dx/d;my=dy/d;}else if(d>band[1]){mx=-dx/d;my=-dy/d;}else{const s=Math.sin(gameT*.4)>0?1:-1;mx=-dy/d*s;my=dx/d*s;}
 const at=b.att;const rep=(x,y,r,w)=>{const ex=P.x-x,ey=P.y-y,e=hyp(ex,ey)||1;if(e<r){mx+=ex/e*w;my+=ey/e*w;}};
 if(at){if(at.tg)for(const p of at.tg)rep(p.x,p.y,52,2.5);
  const lineAvoid=(x0,y0,x1,y1,w)=>{const vx=x1-x0,vy=y1-y0,l=hyp(vx,vy)||1;const nx=-vy/l,ny=vx/l;const side=(P.x-x0)*nx+(P.y-y0)*ny;if(distSeg(P.x,P.y,x0,y0,x1,y1)<w){mx+=nx*Math.sign(side||1)*2.5;my+=ny*Math.sign(side||1)*2.5;}};
  if(at.k==='charge'||at.k==='rush')lineAvoid(b.x,b.y,b.x+Math.cos(b.a)*320,b.y+Math.sin(b.a)*320,60);
  if(at.k==='strafe')lineAvoid(at.sx,at.sy,at.ex,at.ey,40);
  if(at.k==='rail')lineAvoid(b.x,b.y,b.x+Math.cos(at.ang)*560,b.y+Math.sin(at.ang)*560,40);
  if(at.k==='dash')lineAvoid(b.x,b.y,at.tx,at.ty,40);
  if(at.k==='sweep'){mx+=-dy/d*1.5;my+=dx/d*1.5;}}
 for(const m of mines)rep(m.x,m.y,40,2);for(const s of strikes)rep(s.x,s.y,24,1.5);for(const gr of grenades)if(gr.k==='eg')rep(gr.x+gr.vx*.4,gr.y+gr.vy*.4,60,2);
 if(b.kind==='heli'||b.kind==='metro'){if(S.ammo.rocket<=0){const it=A.items.find(i=>i.k==='R');if(it){const ex=it.x-P.x,ey=it.y-P.y,e=hyp(ex,ey)||1;mx=mx*.3+ex/e;my=my*.3+ey/e;}}}
 if(b.kind==='bull'){const it=A.items.find(i=>i.k==='a');if(it&&S.ammo[S.cur]<10){const ex=it.x-P.x,ey=it.y-P.y,e=hyp(ex,ey)||1;mx=mx*.3+ex/e;my=my*.3+ey/e;}}
 const m=hyp(mx,my)||1;mx/=m;my/=m;if(blocked(P.x+mx*14,P.y+my*14,7,'p')){const t2=mx;mx=-my;my=t2;if(blocked(P.x+mx*14,P.y+my*14,7,'p')){mx=-mx;my=-my;}}
 if(hyp(P.x-ai.lx,P.y-ai.ly)<.4){ai.stuck+=dt;if(ai.stuck>.8){ai.jit=.5;ai.ja=rnd(0,TAU);ai.stuck=0;}}else ai.stuck=0;ai.lx=P.x;ai.ly=P.y;if(ai.jit>0){ai.jit-=dt;mx=Math.cos(ai.ja);my=Math.sin(ai.ja);}
 if(P.crouch)I.crouch=true;I.mx=mx;I.my=my;return I;}

<script>
/* ---------- 共通の効果音（Web Audioで合成） ---------- */
window.tgSound = (function(){
  var AC = null, noiseBuf = null, on = true, last = {};
  try { on = localStorage.getItem('tg_sound') !== '0'; } catch (e) {}
  function ctx(){
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, dur, type, vol, slide, delay){
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, vol, freq, delay, kind){
    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = 1;
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + .03);
  }
  function arp(fs, step, type, vol, dur){ fs.forEach(function(f, i){ tone(f, dur || .22, type, vol, 0, i * step); }); }
  var LIB = {
    click:  function(){ tone(900, .05, 'square', .03); },
    pick:   function(){ tone(660, .06, 'triangle', .07); tone(990, .08, 'triangle', .06, 0, .05); },
    unpick: function(){ tone(520, .08, 'triangle', .06, .7); },
    tick:   function(){ tone(1500 + Math.random() * 300, .025, 'square', .025); },
    land:   function(){ tone(784, .09, 'square', .05); tone(1175, .18, 'square', .05, 0, .07); },
    start:  function(){ arp([392, 523, 659], .09, 'square', .05, .18); },
    shot:   function(){ tone(1200, .07, 'square', .025, .45); },
    shotFoe:function(){ tone(700, .08, 'square', .02, .5); },
    slash:  function(){ noise(.12, .12, 2600, 0, 'highpass'); tone(500, .1, 'sawtooth', .03, .5); },
    dash:   function(){ noise(.2, .1, 800, 0, 'bandpass'); tone(200, .2, 'sine', .06, 2.2); },
    charge: function(){ tone(200, .7, 'sawtooth', .05, 4); },
    beam:   function(){ noise(.5, .2, 500, 0, 'lowpass'); tone(90, .5, 'sawtooth', .08, .5); },
    hit:    function(){ noise(.09, .14, 900, 0, 'lowpass'); tone(160, .08, 'square', .04, .6); },
    big:    function(){ noise(.3, .22, 400, 0, 'lowpass'); tone(110, .3, 'sawtooth', .07, .5); },
    heal:   function(){ arp([784, 988, 1319], .06, 'sine', .06, .2); },
    miss:   function(){ noise(.15, .06, 3000, 0, 'highpass'); },
    good:   function(){ arp([659, 784, 1047], .08, 'triangle', .07, .25); },
    bad:    function(){ tone(330, .25, 'triangle', .07, .75); tone(247, .35, 'triangle', .06, .8, .18); },
    win:    function(){ arp([523, 659, 784, 1047, 1319], .1, 'square', .045, .28); },
    lose:   function(){ arp([392, 330, 262, 196], .22, 'triangle', .08, .4); },
    splash: function(){ noise(.35, .18, 700, 0, 'lowpass'); noise(.2, .08, 2400, .05, 'bandpass'); },
    bubble: function(){ tone(250 + Math.random() * 250, .07, 'sine', .04, 1.8); },
    slurp:  function(){ noise(.5, .12, 1400, 0, 'bandpass'); noise(.3, .08, 900, .55, 'bandpass'); },
    coin:   function(){ tone(988, .06, 'square', .04); tone(1319, .14, 'square', .04, 0, .06); },
    summon: function(){ tone(130, 1, 'sawtooth', .05, 3); arp([523, 784, 1047, 1568], .12, 'sine', .07, .5); },
    evolve: function(){ arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], .07, 'triangle', .06, .3); },
    fuse:   function(){ tone(110, 1.1, 'sawtooth', .06, 2.5); noise(.9, .1, 300, .2, 'lowpass'); arp([659, 880, 1319], .12, 'sine', .07, .4); }
  };
  function play(name){
    if (!on || !LIB[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < 55) return;
    last[name] = now;
    if (!ctx()) return;
    try { LIB[name](); } catch (e) {}
  }
  var btn = document.querySelector('.tg-snd');
  function sync(){ if (btn) { btn.textContent = on ? '音：ON' : '音：OFF'; btn.setAttribute('aria-pressed', String(on)); } }
  if (btn) {
    ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ btn.addEventListener(t, function(e){ e.stopPropagation(); }); });
    btn.addEventListener('click', function(e){
      e.stopPropagation(); on = !on; sync(); btn.blur();
      try { localStorage.setItem('tg_sound', on ? '1' : '0'); } catch (err) {}
      if (on) { ctx(); play('pick'); }
    });
  }
  sync();
  // ブラウザは最初の操作まで音を出せないので、最初のタップで準備する
  window.addEventListener('pointerdown', function(){ if (on) ctx(); }, { once: true, capture: true });
  return { play: play };
})();
</script>

<script>
(function(){
  var GAME=!!document.querySelector('.tg-auto');
  var sx=0,sy=0;
  function scroller(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){var s=getComputedStyle(el).overflowY;if((s==='auto'||s==='scroll')&&el.scrollHeight>el.clientHeight)return el;}return null;}
  document.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;
    // 画面端からのスワイプ（戻る・進む）を止める
    if(sx<14||sx>innerWidth-14){e.preventDefault();}},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
})();
