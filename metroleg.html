<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#05080a;color:#d8e8e0;overflow:hidden;touch-action:none;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;background:radial-gradient(120% 80% at 50% 30%,#0e1a18,#05080a 70%)}

<script>

'use strict';
/* ================= 基本 ================= */
const T=24,VW=360,VH=420,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');const DPR=Math.min(window.devicePixelRatio||1,3);let SC=1;
function resize(){const aw=Math.min(innerWidth,480)-8,ah=innerHeight-46-200;SC=Math.max(.55,Math.min(aw/VW,ah/VH));cv.style.width=Math.round(VW*SC)+'px';cv.style.height=Math.round(VH*SC)+'px';cv.width=Math.round(VW*SC*DPR);cv.height=Math.round(VH*SC*DPR);}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,hyp=Math.hypot;
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};

/* ================= 効果音 ================= */
let AC=null,NB=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function sndOn(){try{return localStorage.getItem('tg_sound')!=='0';}catch(e){return true;}}
function nbuf(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;}
function tone(f,dur,type,vol,f2,delay){const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol,freq,type,delay,f2){const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf();f.type=type||'lowpass';f.frequency.setValueAtTime(freq,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur+.05);}

const hum={sx:0,sy:0,fire:false,weapQ:false,crouchQ:false,rationQ:false};

function stickSet(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=hyp(dx,dy),R=r.width/2;if(m>R){dx*=R/m;dy*=R/m;}hum.sx=dx/R;hum.sy=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`;}
function stickOff(){stickId=null;hum.sx=hum.sy=0;knob.style.transform='';}
$('pad').addEventListener('pointerdown',e=>{if(e.target.closest('.btn'))return;const r=$('pad').getBoundingClientRect();if(e.clientX-r.left<r.width*.5&&stickId===null){stickId=e.pointerId;stickSet(e);}});
addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickSet(e);});
addEventListener('pointerup',e=>{if(e.pointerId===stickId)stickOff();});

addEventListener('keyup',e=>{keys[e.key]=false;if(e.key==='j'||e.key===' ')hum.fire=false;});
function humanInput(){let sx=hum.sx,sy=hum.sy;if(keys.ArrowLeft||keys.a)sx=-1;if(keys.ArrowRight||keys.d)sx=1;if(keys.ArrowUp||keys.w)sy=-1;if(keys.ArrowDown||keys.s)sy=1;
 const I={mx:sx,my:sy,fire:hum.fire,weap:hum.weapQ,crouch:hum.crouchQ,ration:hum.rationQ};hum.weapQ=hum.crouchQ=hum.rationQ=false;return I;}

const MAPS=[
[
'################################',

const AREAS=[

const SOLID=new Set(['#','C','W','P','D','d']),OPAQUE=new Set(['#','C','P','D','d']);

/* ================= 状態 ================= */
let A=null,P=null,S=null,state='title',cam={x:0,y:0},shk=0,toasts=[],bullets=[],ebullets=[],grenades=[],fx=[],booms=[],noises=[],phase='normal',alertT=0,lastKnown=null,boss=null,gameT=0,flashRed=0;

 for(let y=0;y<A.h;y++)for(let x=0;x<A.w;x++){const c=A.g[y][x],cx=x*T+T/2,cy=y*T+T/2;

 if(A.def.boss){A.spawns=A.items.filter(it=>it.k==='a').map(it=>({x:it.x,y:it.y,t:0}));A.items=A.items.filter(it=>it.k!=='a');A.spawns.forEach(s=>A.items.push({k:'r',x:s.x,y:s.y,spawn:s}));boss=mkBoss(16*T,7*T);}else boss=null;

 P.hp=S.hp;cam.x=P.x;cam.y=P.y;}

 while(q.length){const c=q.shift();if(c===t)break;const cx=c%W,cy=(c/W)|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=ny*W+nx;if(prev[n]>=0)continue;const ch=A.g[ny][nx];

 if(k==='gren'){const d=tg?Math.min(170,hyp(tg.x-P.x,tg.y-P.y)):110;grenades.push({x:mx,y:my,vx:Math.cos(a)*d/0.7,vy:Math.sin(a)*d/0.7,t:0});sfx('pick');return;}

function boom(x,y,r,dmg,quiet){booms.push({x,y,r,t:0});shk=Math.max(shk,dmg>50?9:5);sfx('boom');for(let i=0;i<22;i++)fx.push({t:'sp',x,y,vx:rnd(-160,160),vy:rnd(-160,160),life:rnd(.3,.7),c:['#ffd070','#ff7a3a','#888'][i%3]});
 if(!dmg)return;for(const g of A.guards){if(g.st!=='dead'&&hyp(g.x-x,g.y-y)<r+8)hurtGuard(g,dmg,true);}for(const c of A.cams)if(c.hp>0&&hyp(c.x-x,c.y-y)<r)c.hp=0;
 if(boss&&hyp(boss.x-x,boss.y-y)<r+44)hurtBoss(dmg,true);if(hyp(P.x-x,P.y-y)<r)hurtP(dmg*.5,x,y);if(!quiet)makeNoise(x,y,420);}
function hurtGuard(g,d,expl){const unaware=phase!=='alert'&&g.st!=='alert'&&g.sus<.6;if(unaware)d*=2.5;g.hp-=d;fx.push({t:'sp',x:g.x,y:g.y,vx:rnd(-40,40),vy:rnd(-40,40),life:.3,c:'#a33'});
 if(g.hp<=0){g.st='dead';S.stats.kills++;sfx('hit');return;}
 if(phase!=='alert'){g.a=Math.atan2(P.y-g.y,P.x-g.x);g.sus=1;triggerAlert(g);}}
function hurtP(d,sx,sy,cont){if(P.inv>0&&!cont)return;P.hp-=d;if(!cont){P.inv=.35;sfx('hurt');shk=Math.max(shk,4);}flashRed=Math.max(flashRed,cont?.3:.5);if(P.hp<=0&&state==='play'){P.hp=0;die();}}
function triggerAlert(src){if(phase!=='alert'){S.stats.alerts++;sfx('alert');fx.push({t:'bang',x:src.x,y:src.y-20,life:1.2});}phase='alert';alertT=15;lastKnown={x:P.x,y:P.y};for(const g of A.guards)if(g.st!=='dead'){g.st='alert';g.path=null;}}

/* ================= 敵の更新 ================= */
function canSee(g,range,fov){const dx=P.x-g.x,dy=P.y-g.y,d=hyp(dx,dy);if(d>range)return 0;if(Math.abs(angDiff(g.a,Math.atan2(dy,dx)))>fov/2)return 0;if(!los(g.x,g.y,P.x,P.y))return 0;return 1-d/range*.7;}
function followPath(g,sp,dt){if(!g.path||!g.path.length)return true;const [tx,ty]=g.path[0];const px=tx*T+T/2,py=ty*T+T/2;const dx=px-g.x,dy=py-g.y,d=hyp(dx,dy);if(d<3){g.path.shift();return !g.path.length;}g.a=lerpA(g.a,Math.atan2(dy,dx),dt*8);moveCirc(g,dx/d*sp*dt,dy/d*sp*dt,7);return false;}
const lerpA=(a,b,k)=>a+angDiff(a,b)*Math.min(1,k);
function guardsUpdate(dt){let anySee=false;const rng=(P.crouch?.6:1)*(phase==='caution'?1.2:1);
 for(const g of A.guards){if(g.st==='dead')continue;g.t+=dt;g.walk=(g.walk||0);
  const see=canSee(g,(phase==='alert'?170:135)*rng,phase==='alert'?1.6:1.3);
  if(phase==='alert'){if(see){anySee=true;g.spot+=dt;lastKnown={x:P.x,y:P.y};g.a=lerpA(g.a,Math.atan2(P.y-g.y,P.x-g.x),dt*10);const d=hyp(P.x-g.x,P.y-g.y);
     if(d>120){moveCirc(g,(P.x-g.x)/d*55*dt,(P.y-g.y)/d*55*dt,7);g.walk+=dt*10;}
     g.shootT-=dt;if(g.shootT<=0&&d<230){g.shootT=.75+rnd(0,.3);const aa=Math.atan2(P.y-g.y,P.x-g.x)+rnd(-.09,.09);ebullets.push({x:g.x+Math.cos(aa)*12,y:g.y+Math.sin(aa)*12,vx:Math.cos(aa)*300,vy:Math.sin(aa)*300,dmg:7,life:1});sfx('enemy');}}
   else{g.pathT-=dt;if(lastKnown&&(g.pathT<=0||!g.path)){g.pathT=.7;g.path=bfs(Math.floor(g.x/T),Math.floor(g.y/T),Math.floor(lastKnown.x/T),Math.floor(lastKnown.y/T),false);}if(followPath(g,62,dt)){g.a+=dt*2;}else g.walk+=dt*10;}
   continue;}
  if(phase==='evasion'){if(see){g.sus+=dt*2.5;if(g.sus>=1)triggerAlert(g);}
   if(!g.path||!g.path.length){g.look-=dt;g.a+=dt*1.5;if(g.look<=0&&lastKnown){g.look=1.5;let tx=Math.floor(lastKnown.x/T)+Math.round(rnd(-4,4)),ty=Math.floor(lastKnown.y/T)+Math.round(rnd(-4,4));if(!SOLID.has((A.g[ty]||[])[tx]))g.path=bfs(Math.floor(g.x/T),Math.floor(g.y/T),tx,ty,false);}}else{followPath(g,50,dt);g.walk+=dt*9;}continue;}
  // 通常・注意
  if(see){g.sus+=dt*(.8+see*1.6)*(P.crouch?.65:1);if(g.sus>=1){triggerAlert(g);continue;}if(g.sus>.3&&g.st==='patrol'){g.st='investigate';g.tx=P.x;g.ty=P.y;g.path=null;g.look=2;sfx('huh');}}
  else g.sus=Math.max(0,g.sus-dt*.25);
  if(g.st==='patrol'){const sp=38;const ax=g.x+Math.cos(g.pd)*14,ay=g.y+Math.sin(g.pd)*14;g.a=lerpA(g.a,g.pd,dt*6);
   if(blocked(ax,ay,7)){g.st='pause';g.t=0;}else{moveCirc(g,Math.cos(g.pd)*sp*dt,Math.sin(g.pd)*sp*dt,7);g.walk+=dt*8;}}
  else if(g.st==='pause'){g.a=g.pd+Math.sin(g.t*2.4)*.9;if(g.t>1.8){g.pd+=Math.PI;g.st='patrol';}}
  else if(g.st==='investigate'){if(!g.path){g.path=bfs(Math.floor(g.x/T),Math.floor(g.y/T),Math.floor(g.tx/T),Math.floor(g.ty/T),false)||[];}
   if(followPath(g,48,dt)){g.look-=dt;g.a+=dt*1.6;if(g.look<=0){g.st='patrol';g.path=null;g.sus=Math.min(g.sus,.2);}}else g.walk+=dt*9;}}
 for(const c of A.cams){if(c.hp<=0)continue;c.t+=dt;c.a=c.base+Math.sin(c.t*.7)*.85;const see=canSee(c,150*(P.crouch?.75:1),.95);if(see){c.seeT+=dt;anySee=anySee||phase==='alert';if(c.seeT>.5&&phase!=='alert'){triggerAlert(c);}if(phase==='alert')lastKnown={x:P.x,y:P.y};}else c.seeT=Math.max(0,c.seeT-dt);}
 if(phase==='alert'){if(anySee)alertT=15;else{alertT-=dt;if(alertT<=0){phase='evasion';alertT=10;for(const g of A.guards)if(g.st!=='dead'){g.st='search';g.path=null;g.look=0;}}}}
 else if(phase==='evasion'){alertT-=dt;if(alertT<=0){phase='caution';alertT=12;for(const g of A.guards)if(g.st!=='dead'){g.st='patrol';g.sus=0;g.path=null;}}}
 else if(phase==='caution'){alertT-=dt;if(alertT<=0)phase='normal';}}

function curW(){return WORDER.filter(k=>S.own[k])[P.wi]||'hand';}
function playerUpdate(dt,I){P.cd=Math.max(0,P.cd-dt);P.inv=Math.max(0,P.inv-dt);P.aimT=Math.max(0,P.aimT-dt);P.muzzle=Math.max(0,P.muzzle-dt);
 if(I.crouch){P.crouch=!P.crouch;$('bCrouch').classList.toggle('act',P.crouch);}
 if(I.weap){const n=WORDER.filter(k=>S.own[k]).length;P.wi=(P.wi+1)%n;sfx('pick');toast(WPN[curW()].n+(curW()==='hand'&&S.supp?'（サプレッサー付き）':''));}
 if(I.ration){if(S.rations>0&&P.hp<100){S.rations--;P.hp=Math.min(100,P.hp+55);sfx('pick');toast('レーションを食べた','#9affc0');}else if(!S.rations)toast('レーションがない');}
 let mx=I.mx,my=I.my;const m=hyp(mx,my);if(m>1){mx/=m;my/=m;}
 if(m>.15){const sp=(P.crouch?42:96)*Math.min(1,m);moveCirc(P,mx*sp*dt,my*sp*dt,7);if(P.aimT<=0)P.a=Math.atan2(my,mx);P.walk+=dt*sp*.12;
  P.stepT-=dt;if(P.stepT<=0){P.stepT=.38;if(!P.crouch&&m>.8&&sp>80){makeNoiseSoft(P.x,P.y,70);}}}
 if(I.fire)fire();
 // 拾う
 for(const it of A.items){if(hyp(it.x-P.x,it.y-P.y)<16){pickup(it);it.got=true;}}A.items=A.items.filter(it=>!it.got);
 // ドア
 for(const [dx,dy] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const tx=Math.floor(P.x/T)+dx,ty=Math.floor(P.y/T)+dy;const ch=(A.g[ty]||[])[tx];if(ch==='D'||ch==='d'){const lv=ch==='D'?1:2;if(S.keys[lv]){A.g[ty][tx]='_';delete tileCache[A.i];sfx('door');toast(`カードキー Lv${lv}でドアが開いた`);}else if(!P.doorMsg){P.doorMsg=1.5;toast(`ドアがロックされている（カードキー Lv${lv}が必要）`,'#ff8a6a');}}}
 P.doorMsg=Math.max(0,(P.doorMsg||0)-dt);
 if(A.exit&&Math.floor(P.x/T)===A.exit.x&&Math.floor(P.y/T)===A.exit.y&&state==='play')nextArea();}
function makeNoiseSoft(x,y,r){for(const g of A.guards){if(g.st==='dead'||phase==='alert')continue;if(hyp(g.x-x,g.y-y)<r&&g.st==='patrol'){g.st='investigate';g.tx=x;g.ty=y;g.path=null;g.look=2;g.sus=Math.max(g.sus,.25);sfx('huh');}}noises.push({x,y,r,life:.4,soft:1});}
function pickup(it){sfx('pick');const k=it.k;
 if(k==='h'){S.rations++;}
 else if(k==='a'){S.ammo.hand+=20;if(S.own.smg)S.ammo.smg+=45;if(S.own.shot)S.ammo.shot+=8;if(S.own.rocket)S.ammo.rocket+=2;if(S.own.gren)S.ammo.gren+=1;}
 else if(k==='u'){S.supp=true;radioHint('supp');}
 else if(k==='m'){S.own.smg=true;S.ammo.smg+=90;}
 else if(k==='s'){S.own.shot=true;S.ammo.shot+=16;}
 else if(k==='r'){if(!S.own.rocket)radioHint('rocket');S.own.rocket=true;S.ammo.rocket+=it.spawn?2:4;if(it.spawn)it.spawn.t=16;}
 else if(k==='g'){S.own.gren=true;S.ammo.gren+=3;}
 else if(k==='1'||k==='2'){S.keys[+k]=true;}
 toast(ITEMS[k]+(k==='h'?'を手に入れた':k==='a'?'を補充した':'を手に入れた'),'#9affc0');}

 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;const ch=tileAt(b.x,b.y);

  if(b.life<=0&&b.k==='rocket'&&false){} }
 bullets=bullets.filter(b=>b.life>0);

 ebullets=ebullets.filter(b=>b.life>0);
 for(const gr of grenades){gr.t+=dt;if(gr.t<.7){const nx=gr.x+gr.vx*dt,ny=gr.y+gr.vy*dt;if(SOLID.has(tileAt(nx,ny))&&tileAt(nx,ny)!=='W'){gr.vx*=-.3;gr.vy*=-.3;}else{gr.x=nx;gr.y=ny;}}if(gr.t>1.3){gr.done=1;boom(gr.x,gr.y,62,95);}}
 grenades=grenades.filter(g=>!g.done);

 for(const b of booms)b.t+=dt;booms=booms.filter(b=>b.t<.5);for(const n of noises)n.life-=dt;noises=noises.filter(n=>n.life>0);

 shk=Math.max(0,shk-dt*25);flashRed=Math.max(0,flashRed-dt);

<script>
/* ---------- 共通の効果音（Web Audioで合成） ---------- */
window.tgSound = (function(){
  var AC = null, noiseBuf = null, on = true, last = {};
  try { on = localStorage.getItem('tg_sound') !== '0'; } catch (e) {}
  function ctx(){
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, dur, type, vol, slide, delay){
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, vol, freq, delay, kind){
    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = 1;
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + .03);
  }
  function arp(fs, step, type, vol, dur){ fs.forEach(function(f, i){ tone(f, dur || .22, type, vol, 0, i * step); }); }
  var LIB = {
    click:  function(){ tone(900, .05, 'square', .03); },
    pick:   function(){ tone(660, .06, 'triangle', .07); tone(990, .08, 'triangle', .06, 0, .05); },
    unpick: function(){ tone(520, .08, 'triangle', .06, .7); },
    tick:   function(){ tone(1500 + Math.random() * 300, .025, 'square', .025); },
    land:   function(){ tone(784, .09, 'square', .05); tone(1175, .18, 'square', .05, 0, .07); },
    start:  function(){ arp([392, 523, 659], .09, 'square', .05, .18); },
    shot:   function(){ tone(1200, .07, 'square', .025, .45); },
    shotFoe:function(){ tone(700, .08, 'square', .02, .5); },
    slash:  function(){ noise(.12, .12, 2600, 0, 'highpass'); tone(500, .1, 'sawtooth', .03, .5); },
    dash:   function(){ noise(.2, .1, 800, 0, 'bandpass'); tone(200, .2, 'sine', .06, 2.2); },
    charge: function(){ tone(200, .7, 'sawtooth', .05, 4); },
    beam:   function(){ noise(.5, .2, 500, 0, 'lowpass'); tone(90, .5, 'sawtooth', .08, .5); },
    hit:    function(){ noise(.09, .14, 900, 0, 'lowpass'); tone(160, .08, 'square', .04, .6); },
    big:    function(){ noise(.3, .22, 400, 0, 'lowpass'); tone(110, .3, 'sawtooth', .07, .5); },
    heal:   function(){ arp([784, 988, 1319], .06, 'sine', .06, .2); },
    miss:   function(){ noise(.15, .06, 3000, 0, 'highpass'); },
    good:   function(){ arp([659, 784, 1047], .08, 'triangle', .07, .25); },
    bad:    function(){ tone(330, .25, 'triangle', .07, .75); tone(247, .35, 'triangle', .06, .8, .18); },
    win:    function(){ arp([523, 659, 784, 1047, 1319], .1, 'square', .045, .28); },
    lose:   function(){ arp([392, 330, 262, 196], .22, 'triangle', .08, .4); },
    splash: function(){ noise(.35, .18, 700, 0, 'lowpass'); noise(.2, .08, 2400, .05, 'bandpass'); },
    bubble: function(){ tone(250 + Math.random() * 250, .07, 'sine', .04, 1.8); },
    slurp:  function(){ noise(.5, .12, 1400, 0, 'bandpass'); noise(.3, .08, 900, .55, 'bandpass'); },
    coin:   function(){ tone(988, .06, 'square', .04); tone(1319, .14, 'square', .04, 0, .06); },
    summon: function(){ tone(130, 1, 'sawtooth', .05, 3); arp([523, 784, 1047, 1568], .12, 'sine', .07, .5); },
    evolve: function(){ arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], .07, 'triangle', .06, .3); },
    fuse:   function(){ tone(110, 1.1, 'sawtooth', .06, 2.5); noise(.9, .1, 300, .2, 'lowpass'); arp([659, 880, 1319], .12, 'sine', .07, .4); }
  };
  function play(name){
    if (!on || !LIB[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < 55) return;
    last[name] = now;
    if (!ctx()) return;
    try { LIB[name](); } catch (e) {}
  }
  var btn = document.querySelector('.tg-snd');
  function sync(){ if (btn) { btn.textContent = on ? '音：ON' : '音：OFF'; btn.setAttribute('aria-pressed', String(on)); } }
  if (btn) {
    ['pointerdown','pointerup','mousedown','touchstart','keydown'].forEach(function(t){ btn.addEventListener(t, function(e){ e.stopPropagation(); }); });
    btn.addEventListener('click', function(e){
      e.stopPropagation(); on = !on; sync(); btn.blur();
      try { localStorage.setItem('tg_sound', on ? '1' : '0'); } catch (err) {}
      if (on) { ctx(); play('pick'); }
    });
  }
  sync();
  // ブラウザは最初の操作まで音を出せないので、最初のタップで準備する
  window.addEventListener('pointerdown', function(){ if (on) ctx(); }, { once: true, capture: true });
  return { play: play };
})();
</script>

<style>html,body{overscroll-behavior:none}</style>
<script>
(function(){
  var GAME=!!document.querySelector('.tg-auto');
  var sx=0,sy=0;
  function scroller(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){var s=getComputedStyle(el).overflowY;if((s==='auto'||s==='scroll')&&el.scrollHeight>el.clientHeight)return el;}return null;}
  document.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;
    // 画面端からのスワイプ（戻る・進む）を止める
    if(sx<14||sx>innerWidth-14){e.preventDefault();}},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var t=e.touches[0],dy=t.clientY-sy;
    // いちばん上で下に引っぱる（引っぱって更新）を止める
    if(dy>0){var sc=scroller(e.target);var top=sc?sc.scrollTop:(window.scrollY||document.documentElement.scrollTop);if(top<=0&&e.cancelable)e.preventDefault();}},{passive:false});
  // ゲーム中は「戻る」操作で一覧に戻らないようにする（左上の「← 一覧」からは戻れる）
  if(GAME&&history.pushState){try{history.pushState({tgGuard:1},'',location.href);addEventListener('popstate',function(){history.pushState({tgGuard:1},'',location.href);});}catch(e){}}
})();
</script>
